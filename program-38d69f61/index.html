<style>
:root{--cream:#FAF6EF;--sand:#F2ECE1;--card:#FFFFFF;--ink:#1F2A22;--soft:#3F4E43;--g:#1F3A27;--g2:#2F5D3A;--g3:#E6EFE5;--rust:#A4482C;--line:#DCD3C3;--gold:#F5B04A}
*{box-sizing:border-box}
html{font-size:19px}
body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.6;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;color:var(--g);line-height:1.2;margin:0 0 .5em}
h1{font-size:2rem}h2{font-size:1.5rem}h3{font-size:1.2rem}
a{color:var(--g2)}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
header.top{position:fixed;top:0;left:0;right:0;z-index:25;padding-top:env(safe-area-inset-top);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
header.top::before{content:"";position:absolute;left:0;right:0;top:0;height:calc(100% + 30px);background:linear-gradient(180deg,rgba(12,30,20,.42) 0%,rgba(12,30,20,.18) 55%,rgba(12,30,20,0) 100%);pointer-events:none}
header.top.away{transform:translateY(-110%)}
header.top .wrap{position:relative;display:flex;align-items:center;gap:10px;min-height:64px}
header.top .brand{display:inline-flex;align-items:center;gap:10px;flex:0 1 auto;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:5px 14px 5px 5px;color:#fff;font-size:.95rem;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);text-shadow:0 1px 6px rgba(0,0,0,.35);margin-right:auto}
header.top .brand .logo{width:34px;height:34px;border-radius:50%}
header.top .navbtn{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:99px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);text-shadow:0 1px 6px rgba(0,0,0,.35);padding:10px 18px}
.leafband{height:calc(150px + env(safe-area-inset-top))}
.lphoto{height:calc(280px + env(safe-area-inset-top));margin:0!important;border-radius:0 0 28px 28px!important;width:100%}
.cover{padding-top:env(safe-area-inset-top)}
.card,.lrow,.today-card,.garden,.vcard,details.week,.upnext{border-radius:20px}
.today-card,.garden,details.week{box-shadow:0 10px 30px rgba(31,58,39,.07)}
.logo{width:40px;height:40px;flex:none}
.brand{font-family:Fraunces,Georgia,serif;font-weight:600;color:var(--g);font-size:1.05rem;flex:1}
.navbtn{background:none;border:2px solid var(--g2);color:var(--g2);border-radius:10px;font:600 .9rem Inter,sans-serif;padding:10px 14px;min-height:48px;cursor:pointer}
.hero{background:var(--g);color:#fff;padding:36px 0 32px}
.hero h1{color:#fff;margin-bottom:.3em}
.hero p{font-size:1.1rem;margin:0 0 18px;color:#F1EEE6}
.bar{background:rgba(255,255,255,.2);border-radius:99px;height:14px;overflow:hidden;margin:6px 0 8px}
.bar i{display:block;height:100%;background:var(--gold);width:0}
.barlabel{font-size:.9rem;color:#F1EEE6;margin:0 0 18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--g2);color:#fff;border:0;border-radius:12px;font:600 1rem Inter,sans-serif;padding:14px 22px;min-height:56px;cursor:pointer;text-decoration:none;width:100%;text-align:center}
.btn:focus-visible,.navbtn:focus-visible,.opt:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn.light{background:#fff;color:var(--g)}
.btn.ghost{background:transparent;color:var(--g2);border:2px solid var(--g2)}
@media(min-width:720px){.btn{width:auto}}
.under{font-size:.85rem;color:var(--soft);margin:.5em 0 0}
.hero .under{color:#E4E0D6}
section{padding:28px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin:0 0 16px}
details.week{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 14px;overflow:hidden}
details.week summary{list-style:none;cursor:pointer;padding:18px 20px;display:flex;gap:14px;align-items:center;min-height:64px}
details.week summary::-webkit-details-marker{display:none}
.wnum{flex:none;width:48px;height:48px;border-radius:50%;background:var(--g3);color:var(--g);font:600 1.1rem Fraunces,serif;display:flex;align-items:center;justify-content:center}
.wnum.done{background:var(--g2);color:#fff}
.wtitle{flex:1}
.wtitle b{display:block;font-family:Fraunces,serif;color:var(--g);font-size:1.1rem;font-weight:600}
.wtitle span{font-size:.85rem;color:var(--soft)}
.chev{font-size:1.4rem;color:var(--g2);transition:transform .2s}
details[open] .chev{transform:rotate(90deg)}
.wbody{padding:0 20px 20px;border-top:1px solid var(--line)}
.aim{margin:14px 0 12px;color:var(--soft)}
.lrow{display:flex;align-items:center;gap:12px;width:100%;background:var(--sand);border:0;border-radius:12px;padding:14px 16px;margin:0 0 10px;min-height:56px;font:500 1rem Inter,sans-serif;color:var(--ink);text-align:left;cursor:pointer}
.lrow .tick{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--g2);display:flex;align-items:center;justify-content:center;color:#fff;font-size:.9rem}
.lrow.done .tick{background:var(--g2)}
.lrow small{display:block;color:var(--soft);font-size:.8rem;font-weight:400}
.days{margin:16px 0 0}
.days h3{font-size:1rem;margin-bottom:8px}
.day{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--sand);cursor:pointer}
.day input{width:28px;height:28px;flex:none;margin:2px 0 0;accent-color:var(--g2)}
.day span b{font-weight:600;color:var(--g)}
/* lesson */
.crumb{font-size:.85rem;color:var(--soft);margin:22px 0 6px}
.read{margin:4px 0 18px}
.open{font-family:Fraunces,Georgia,serif;font-size:1.3rem;color:var(--g);line-height:1.4;margin:0 0 20px}
.body p{margin:0 0 1em}
.body h3{margin-top:1.4em}
.body ul{padding-left:1.2em;margin:0 0 1em}
.body li{margin:0 0 .5em}
.try{background:var(--g3);border-left:6px solid var(--g2);border-radius:12px;padding:18px 20px;margin:22px 0}
.try b{display:block;font-family:Fraunces,serif;color:var(--g);font-size:1.1rem;margin-bottom:4px}
.watch{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;text-decoration:none;color:var(--ink);margin:0 0 22px}
.watch b{display:block;color:var(--g2)}
.watch small{color:var(--soft)}
.vid{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;margin:0 0 8px;background:#000}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.check h3{font-size:1.1rem}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 10px;font:500 1rem Inter,sans-serif;color:var(--ink);min-height:56px;cursor:pointer}
.opt.right{border-color:var(--g2);background:var(--g3)}
.opt.wrong{border-color:var(--rust);background:#FBEDE8}
.why{margin:6px 0 0;font-weight:500;color:var(--g)}
.nav2{display:flex;flex-direction:column;gap:12px;margin:26px 0 10px}
.disc{font-size:.85rem;color:var(--soft);border-top:1px solid var(--line);padding:18px 0 40px;margin-top:20px}
/* toolkit */
.tk h2{margin-top:6px}
.tk ul{padding-left:1.2em}
.field{margin:0 0 14px}
.field label{display:block;font-weight:600;color:var(--g);margin:0 0 6px}
.field input,.field textarea{width:100%;font:400 1rem Inter,sans-serif;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-height:52px}
.field textarea{min-height:80px}
table.log{width:100%;border-collapse:collapse;font-size:.95rem}
table.log th,table.log td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}
table.log input{width:100%;font:400 1rem Inter,sans-serif;padding:8px;border:1px solid var(--line);border-radius:8px;min-height:44px}
.saved{font-size:.85rem;color:var(--g2);min-height:1.2em}
.hide{display:none!important}

:root{--leaf:url('images/leaf.jpg')}
.cover{position:relative;min-height:88vh;min-height:88dvh;display:flex;align-items:flex-end;color:#fff;background:linear-gradient(180deg,rgba(12,36,25,.35) 0%,rgba(12,36,25,.55) 45%,rgba(12,36,25,.9) 100%),var(--leaf) center/cover,linear-gradient(135deg,#1F5239,#2F6B4F 55%,#7FA98B)}
.cover .wrap{padding-top:40px;padding-bottom:34px;width:100%}
.cover h1{color:#fff;font-size:2.3rem;margin-bottom:.35em;text-shadow:0 2px 18px rgba(0,0,0,.35)}
.cover p{font-size:1.1rem;color:#F4F1E8;margin:0 0 18px;max-width:34em}
.kicker{display:inline-block;font:600 .8rem Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);padding:6px 12px;border-radius:99px;margin:0 0 16px}
.cover .bar{background:rgba(255,255,255,.25)}
.leafband{height:110px;background:linear-gradient(180deg,rgba(20,61,43,.25),rgba(250,246,239,0) 55%,var(--cream) 100%),var(--leaf) center 35%/cover,linear-gradient(120deg,#1F5239,#2F6B4F 50%,#7FA98B)}
details.week summary{padding:0;display:block}
.wphoto{position:relative;height:150px;background:#ccc center/cover}
.wphoto::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(0,0,0,.25))}
.wphoto .wnum{position:absolute;left:16px;bottom:-24px;z-index:1;border:4px solid #fff;width:56px;height:56px;background:var(--g3)}
.wphoto .wnum.done{background:var(--g2)}
.wrow{display:flex;gap:14px;align-items:center;padding:32px 20px 18px}
.mini{height:6px;background:var(--sand);border-radius:99px;overflow:hidden;margin-top:8px}
.mini i{display:block;height:100%;background:var(--g2)}
.lphoto{background:#ccc center/cover}
.sizer{display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--soft);margin:0 0 6px}
.sizer button{min-width:48px;min-height:44px;border:2px solid var(--line);background:#fff;border-radius:10px;font:700 1rem Inter,sans-serif;color:var(--g);cursor:pointer}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(140%);background:var(--g);color:#fff;padding:16px 22px;border-radius:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .35s ease,opacity .35s;opacity:0;visibility:hidden;z-index:20;max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:19}
.card.soft{background:var(--g3);border-color:#CFE0CE}


.welcome{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;padding:40px 22px;background:linear-gradient(180deg,rgba(12,36,25,.5),rgba(12,36,25,.82)),var(--leaf) center/cover,linear-gradient(135deg,#1F5239,#2F6B4F 55%,#7FA98B)}
.welcome .in{max-width:560px}
.welcome .logo{width:84px;height:84px;margin:0 auto 18px;display:block;background:#fff;border-radius:22px;padding:10px}
.welcome h1{color:#fff;font-size:2.2rem;text-shadow:0 2px 18px rgba(0,0,0,.35)}
.welcome p{font-size:1.15rem;color:#F4F1E8;margin:0 0 16px}
.welcome .btn{margin-top:10px}
.ov li{margin:0 0 .6em}
.ovweeks{list-style:none;padding:0;margin:0 0 20px}
.ovweeks li{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin:0 0 10px}
.ovweeks img{width:72px;height:56px;object-fit:cover;border-radius:8px;flex:none}
.ovweeks b{display:block;color:var(--g);font-family:Fraunces,serif}
.ovweeks span{font-size:.85rem;color:var(--soft)}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;visibility:hidden;transition:opacity .25s;z-index:30}
.shade.on{opacity:1;visibility:visible}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(92vw,400px);background:var(--cream);z-index:31;transform:translateX(105%);transition:transform .3s ease;overflow-y:auto;padding:18px 18px 40px;box-shadow:-10px 0 30px rgba(0,0,0,.2)}
.panel.on{transform:none}
.panel .phead{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}
.panel h2{margin:0;font-size:1.3rem}
.panel h3{font-size:1rem;margin:18px 0 8px}
.plink{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 8px;min-height:52px;font:500 .95rem Inter,sans-serif;color:var(--ink);cursor:pointer;text-decoration:none}
.plink .t{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--g2);color:#fff;font-size:.75rem;display:flex;align-items:center;justify-content:center}
.plink.done .t{background:var(--g2)}


.vcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:0 0 16px}
.vt{display:block;font-family:Fraunces,serif;color:var(--g);font-size:1.15rem;margin:0 0 8px}
.vlen{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--rust);font-weight:600;margin:0 0 4px}
.vcard p{margin:0 0 .8em}
.vplay{display:flex;align-items:center;justify-content:center;gap:14px;width:100%;min-height:150px;border:0;border-radius:12px;cursor:pointer;color:#fff;font:600 1.05rem Inter,sans-serif;background:linear-gradient(180deg,rgba(12,36,25,.45),rgba(12,36,25,.75)),var(--leaf) center/cover,var(--g)}
.pbtn{width:60px;height:60px;border-radius:50%;background:#fff;color:var(--g);display:flex;align-items:center;justify-content:center;font-size:1.4rem;padding-left:4px}
.bnote{background:var(--sand);border-radius:12px;padding:14px 16px;font-size:.92rem;color:var(--soft);margin:0 0 22px}


.plan{background:linear-gradient(135deg,#2F5D3A,#1F3A27);color:#fff;border-radius:16px;padding:20px;margin:0 0 18px}
.plan h2{color:#fff;margin-bottom:.3em}
.plan p{color:#EEF3EC;margin:0 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.chip{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:6px 12px;font-size:.85rem}
.plan .btn{margin:0 0 10px}
.ver{background:#FFF7E8;border-left:6px solid var(--gold);border-radius:12px;padding:16px 18px;margin:22px 0}
.ver b{display:block;font-family:Fraunces,serif;color:var(--g);margin-bottom:4px}
.q{margin:0 0 22px}
.q p{font-weight:600;color:var(--g);margin:0 0 10px}
.opt.sel{border-color:var(--g2);background:var(--g3)}
.player{background:linear-gradient(180deg,rgba(12,36,25,.6),rgba(12,36,25,.88)),var(--leaf) center/cover,var(--g);color:#fff;border-radius:18px;padding:26px 20px;text-align:center;margin:10px 0 20px}
.player .stepn{font-size:.9rem;color:#E4E0D6;margin:0 0 10px}
.player .say{font-family:Fraunces,serif;font-size:1.45rem;line-height:1.35;min-height:6.5em;display:flex;align-items:center;justify-content:center;margin:0 0 14px}
.ring{width:110px;height:110px;margin:0 auto 16px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 1.6rem Inter,sans-serif}
.pctl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pctl .btn{width:100%}
.tests td,.tests th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
.tests{width:100%;border-collapse:collapse}
.tests input{width:100%;min-height:44px;font:400 1rem Inter,sans-serif;padding:6px 8px;border:1px solid var(--line);border-radius:8px}
.cal{width:100%;border-collapse:collapse;font-size:.72rem}
.cal td,.cal th{border:1px solid var(--line);padding:5px;vertical-align:top}
.cal th{background:var(--g3);color:var(--g)}
.cert{border:10px double var(--g2);border-radius:8px;padding:34px 20px;text-align:center;background:#fff}
.cert h1{font-size:2.2rem}
.cert .nm{font-family:Fraunces,serif;font-size:1.8rem;color:var(--rust);border-bottom:2px solid var(--line);display:inline-block;min-width:60%;padding:6px 0;margin:10px 0 18px}
.fridge{border:3px solid var(--g2);border-radius:14px;padding:20px;background:#fff}
.fridge h2{text-align:center}
.ci textarea{min-height:64px}


:root{--plum:#2A1733;--plum2:#1B0F22;--plumtext:#F4EEF7;--plumsoft:#D9CCE0;--lav:#B79BC9}
html{scroll-behavior:smooth}
html,body{overflow-x:hidden;max-width:100%}
body{overscroll-behavior-x:none;touch-action:pan-y pinch-zoom}
#confetti{max-width:100vw}
.btn,.lrow,.opt,.plink,.navbtn,.vplay{transition:transform .12s ease,box-shadow .2s ease,background-color .2s ease}
.btn:active,.lrow:active,.opt:active,.plink:active,.vplay:active{transform:scale(.98)}
@media(hover:hover){.btn:hover{box-shadow:0 6px 18px rgba(31,58,39,.22);transform:translateY(-1px)}.lrow:hover,.plink:hover{background:#ECE5D8}.opt:hover{border-color:var(--g2)}}
.lrow.done .tick,.plink.done .t{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
#plum{position:relative;color:var(--plumtext);margin-top:10px;padding:150px 0 40px;background:
 linear-gradient(180deg,rgba(20,48,31,.0) 0%,rgba(250,246,239,0) 120px),
 linear-gradient(180deg,rgba(42,23,51,.55) 0%,rgba(27,15,34,.92) 55%,var(--plum2) 100%),
 var(--leaf) center/cover,var(--plum);overflow:hidden}
#plum::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 50% at 80% 30%,rgba(183,155,201,.28),transparent 70%);pointer-events:none}
#plum .wrap{position:relative}
#plum h2{color:#fff;font-size:1.4rem}
#plum p{color:var(--plumsoft)}
#plum .quote{font-family:Fraunces,Georgia,serif;font-size:1.35rem;line-height:1.4;color:#fff;margin:0 0 22px;max-width:30em}
#plum .today{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:18px;margin:0 0 20px;backdrop-filter:blur(2px)}
#plum .today b{display:block;color:var(--lav);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;margin:0 0 6px}
#plum .today .what{color:#fff;font-size:1.1rem;margin:0 0 12px}
#plum .btn.light{background:#fff;color:var(--plum)}
#plum .fine{font-size:.82rem;color:var(--plumsoft);border-top:1px solid rgba(255,255,255,.15);padding-top:16px;margin-top:22px}
#plum a{color:#fff}
.hide-foot #plum{display:none}
.today-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin:0 0 18px;box-shadow:0 8px 24px rgba(31,58,39,.08)}
.today-card .lbl{font:600 .8rem Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--rust);margin:0 0 6px}
.today-card h2{font-size:1.35rem;margin-bottom:12px}
.dots{display:flex;gap:8px;margin:12px 0 4px}
.dots i{width:30px;height:30px;border-radius:50%;background:var(--sand);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:.8rem;color:#fff}
.dots i.on{background:var(--g2);border-color:var(--g2)}
.dots i.now{border-color:var(--gold)}

<script>
const D = {"welcome": {"title": "Before you start", "open": "You don't have to be brave today. You only have to open this page, and you've done that.", "body": "If you've bought things for your joints before (a cream, a brace, a bottle of pills from the back of a magazine) and they ended up in a drawer, you're not alone. Most people who find this Program have already tried a lot. That's why it doesn't ask you to buy anything else, and it doesn't ask you to change your whole life on Monday.\n\nIt asks for one small step a day, for eight weeks.\n\n## How it works\n- Each week has a name and one aim.\n- Each week has three short lessons. Read one, try the small task, press \"I did it.\" The next lesson opens.\n- Each day has one tiny step on your weekly list. Tick it when it's done. If you miss a day, the box just waits.\n- The Toolkit at the bottom has your pain log, your weekly planner, your flare-up plan and your questions for the doctor. Print them or fill them in here.\n\n## Three rules we keep the whole way through\n- Every move has a seated version. You never have to get on the floor.\n- A mild pull is fine. Sharp pain, or pain that keeps getting worse, means stop.\n- Only change a prescribed medicine after speaking with your doctor. This Program sits alongside your care.\n\nIf reading is tiring, press \"Read this to me\" at the top of any lesson and it will be read out loud.", "try": "Write down one thing you'd like to do more easily in eight weeks. Getting out of the car. Holding a grandchild. Opening the jar without asking. Keep it somewhere you'll see it."}, "weeks": [{"n": 1, "name": "The first hour of the day", "aim": "Make mornings a little kinder, starting before your feet touch the floor.", "days": ["Two ankle circles each way before you get up", "A glass of water before coffee", "Warm your hands under the tap for a minute", "Sit on the edge of the bed and roll your shoulders 5 times", "Write your morning stiffness number (0 to 10)", "Do the bed routine from lesson 2", "Look back at your numbers for the week"], "lessons": [{"id": "w1a", "title": "Why mornings are the hardest part", "open": "If the first steps of the day feel like walking on someone else's legs, there's a reason, and it isn't that you're falling apart.", "body": "Joints are fed by movement. The cartilage that cushions the ends of your bones has no blood supply of its own. It soaks up fluid when the joint moves and squeezes it out again, a bit like a sponge in a sink.\n\nAll night, you're still. The fluid settles, the muscles around the joint cool down, and by morning everything is stiff. That's why so many people say the same thing: it eases off by lunchtime.\n\n## What the stiffness can tell you\n- Stiffness that eases within about half an hour is common with osteoarthritis.\n- Stiffness that lasts more than an hour, in both hands or both feet, with warm or puffy joints, is worth showing a doctor soon. It can be a sign of rheumatoid arthritis, and early treatment protects the joints.\n\nHarvard Health notes that morning stiffness from osteoarthritis usually lasts a short while, and that easy movement is what helps it pass.\n\nYou can't skip the morning. You can give your joints a head start before you ask them to carry you.", "try": "Tomorrow, before you get up, circle each ankle slowly five times one way and five times the other. That's the whole task.", "watch": {"label": "What makes joints stiff in the morning", "src": "Harvard Health Publishing (article)", "url": "https://www.health.harvard.edu/pain/what-makes-my-joints-stiff-in-the-morning"}, "check": {"q": "Why are joints stiffer first thing in the morning?", "opts": ["They were still all night, so the joint fluid settled", "Sleep damages cartilage", "You did something wrong yesterday"], "a": 0, "why": "Right. Stillness lets the fluid settle. Moving gets it going again."}}, {"id": "w1b", "title": "A routine you can do before you stand up", "open": "The kindest time to move a stiff joint is while you're still lying down and warm.", "body": "This is a short routine for the bed and the edge of the bed. Go slowly. Breathe out as you move.\n\n## Lying down\n- Ankle circles: five each way, each foot.\n- Ankle pumps: point your toes, then pull them back toward you. Ten times.\n- Knee slides: slide one heel up toward you, then back down. Five each side.\n\n## Sitting on the edge of the bed\n- Shoulder rolls: five backward, five forward.\n- Hand opening: make a soft fist, then spread your fingers wide. Ten times.\n- Slow neck turns: look over one shoulder, then the other. Stop well before anything pinches.\n\nThen stand up slowly, with a hand on something steady. Many people keep a cane or a sturdy chair by the bed for this moment, and that's a good idea.\n\nThe whole routine takes about as long as the kettle. If one move hurts, skip it today and try again tomorrow.", "try": "Do the lying-down part tomorrow morning. Add the sitting part the day after.", "watch": {"label": "Easy 20-minute warm-up for the joints, seated option all the way through", "src": "Arthritis Society Canada", "url": "https://arthritis.ca/living-well/2020/20-minute-warm-up-for-the-joints"}, "check": {"q": "One move in the routine hurts sharply. What do you do?", "opts": ["Push through it", "Skip it today and try again tomorrow"], "a": 1, "why": "Yes. Sharp pain means stop. There's no prize for pushing through it."}}, {"id": "w1c", "title": "Warmth first, then movement", "open": "Most people with stiff hands already know this one. Warm water before anything else.", "body": "Warmth relaxes the muscles around a joint and makes the first movements easier. That's why a warm shower, a warm mug or a basin of warm water helps so many people in the morning.\n\n## Easy ways to bring warmth in\n- A warm shower before you get dressed.\n- Hands in a bowl of warm water for a minute or two, then the hand-opening move.\n- A heat pack or warm water bottle on a stiff knee while you drink your coffee.\n- Warm wax for hands, which hand therapists use. It's sold at pharmacies.\n\n## Keep it safe\n- Warm, never hot. Bath temperature is right.\n- Fifteen to twenty minutes of heat is plenty.\n- If you have diabetes or poor feeling in your feet, check with your doctor before using heat there.\n\nA rule that's easy to remember: warm what's stiff, cool what's swollen. A joint that's hot, red and puffy wants a wrapped cold pack, not heat.", "try": "Tomorrow, warm your hands in water for one minute, then open and close them ten times.", "watch": {"label": "Seated exercises you can do in a chair", "src": "Versus Arthritis", "url": "https://versusarthritis.org/news/2023/september/exercises-you-can-do-sitting-down"}, "check": {"q": "A knee is hot, red and puffy. What helps most?", "opts": ["A hot water bottle", "A cold pack wrapped in a cloth"], "a": 1, "why": "Right. Cool what's swollen, warm what's stiff."}}]}, {"n": 2, "name": "Moving without fear", "aim": "Learn how to tell normal soreness from a warning, so moving stops feeling risky.", "days": ["A 5-minute walk (indoors counts)", "Your morning routine", "Another 5-minute walk", "Rate your pain before and after a walk", "A 6-minute walk", "Your morning routine", "Look back: did any walk feel easier?"], "lessons": [{"id": "w2a", "title": "Sore isn't the same as harmed", "open": "If moving has hurt before, being careful makes sense. The trick is knowing what the pain is telling you.", "body": "Pain is an alarm. In a joint that's been sore a long time, the alarm can be set too sensitive, so it goes off before any harm is done.\n\nThat doesn't mean you ignore it. It means you learn to read it.\n\n## The traffic light\n- Green, 0 to 2 out of 10: fine. Keep going.\n- Yellow, 3 to 5: okay, especially when you're starting to move more.\n- Red, 6 or more: ease off. Do less today and try again tomorrow.\n\n## The two-hour rule\nA little extra soreness after moving is normal. If your pain is worse than usual for more than two hours afterward, you did a bit too much. Next time, do a little less. You didn't damage anything. You found today's limit.\n\nArthritis charities and physical therapists agree on this point: sensible movement doesn't wear joints out. It feeds the cartilage and builds the muscles that protect it.", "try": "Before your next walk, write your pain number. Write it again two hours later.", "watch": {"label": "A short talk on knee pain and why exercise helps", "src": "University of Melbourne, Centre for Health, Exercise and Sports Medicine", "url": "https://www.youtube.com/watch?v=o8ZJN56aSic"}, "check": {"q": "Your knee is a little more sore for one hour after a walk. What does that mean?", "opts": ["You damaged it", "That's normal, so keep going", "Stop walking for good"], "a": 1, "why": "Yes. Under two hours of extra soreness is your body getting used to moving."}}, {"id": "w2b", "title": "Walking, the cheapest thing that helps", "open": "You don't need a gym or a new pair of shoes to start. You need the hallway.", "body": "Walking is one of the best-studied things you can do for sore knees and hips. The Arthritis Foundation built a whole six-week program, Walk With Ease, around it.\n\n## How to start\n- Walk for five minutes, or less. Up and down the hallway counts.\n- Each week, add a minute or two.\n- Sit down whenever you need to. Resting is part of it.\n- Walk after a meal or a warm shower, when your joints are looser.\n\n## Make it easier\n- Wear the most cushioned, supportive shoes you own.\n- If you use a cane, hold it in the hand opposite the sore leg. The cane and the sore leg move together.\n- On rainy days, walk laps of a shopping center or the inside of your home.\n\n## Other kind ways to move\nWater walking or swimming (the water carries your weight), a stationary bike, a pedal exerciser under a chair, and tai chi, which has a seated version.", "try": "Take one 5-minute walk today. When you finish, tick it on your weekly list.", "watch": [{"label": "Barbara O'Neill: Exercise That Works", "src": "Barbara O'Neill (YouTube)", "yt": "AP9IuNavHIg", "len": "About an hour. Make a cup of tea and settle in.", "what": "One of Barbara's full talks, all about why the body needs to move every day, and what happens to joints and muscles when it doesn't.", "why": "If part of you still worries that moving will make things worse, an hour with someone who loves this subject can change how you feel about your daily walk. Moving every day is the one remedy she and the doctors agree on completely. Keep to your own pace from this week's lessons.", "barb": true}, {"label": "Tai chi for arthritis", "src": "Arthritis Society Canada", "url": "https://arthritis.ca/healthy-living/tai-chi-to-help-arthritis/"}], "check": {"q": "Which hand holds the cane?", "opts": ["The same side as the sore leg", "The opposite side from the sore leg"], "a": 1, "why": "Opposite side. The cane and the sore leg move forward together."}}, {"id": "w2c", "title": "Pacing: stop while you still feel good", "open": "You know the pattern. A good day, you do everything, and you pay for it for three days.", "body": "People call it boom and bust. It's the most common reason a new routine falls apart, and it isn't a lack of willpower. It's that good days feel too good to waste.\n\n## Try this instead\n- Pick a set amount for the day: a 6-minute walk, one room cleaned, 15 minutes of gardening.\n- Stop there, even if you feel you could do more.\n- Add a little next week, not today.\n\nIt feels odd at first, holding back on a good day. But steady small amounts build more than big days followed by rest days. And it means a good day doesn't cost you the rest of the week.\n\n## A simple way to set your amount\nDo what you can comfortably manage on a so-so day. Not your best day, not your worst. That's your starting amount.", "try": "Choose your starting amount for walking this week, based on a so-so day. Write it on your planner.", "watch": {"label": "Getting started with exercise safely", "src": "Versus Arthritis, Let's Move with Leon", "url": "https://www.arthritis-uk.org/information-and-support/living-with-arthritis/health-and-wellbeing/exercising-with-arthritis/lets-move-with-Leon/"}, "check": {"q": "On a really good day, what's the smart move?", "opts": ["Do everything while you can", "Do your set amount and stop"], "a": 1, "why": "Right. Stopping on a good day is how you keep having good days."}}]}, {"n": 3, "name": "Warmth and comfort", "aim": "Build a short list of home comforts that work for you, and know which ones are worth your money.", "days": ["Warm your sorest joint for 15 minutes", "Try the warm and cool water swap for hands", "Your morning routine and a walk", "Patch-test one new cream or oil", "A warm bath or shower in the evening", "Your morning routine and a walk", "Write down the one comfort you liked most"], "lessons": [{"id": "w3a", "title": "Heat, cold and water", "open": "There's something about tending a sore joint with your own hands. Put the kettle on.", "body": "Heat and cold packs are recommended in the American College of Rheumatology's arthritis guidelines. They're cheap, and you probably have them already.\n\n## Heat for stiffness\nA warm water bottle, heat pack or warm towel on the joint for 15 to 20 minutes. Lovely before a walk or the morning routine.\n\n## Cold for a hot, puffy joint\nA cold pack or bag of frozen peas, wrapped in a cloth, for about 15 minutes. Never straight on the skin.\n\n## The warm and cool water swap for hands and feet\nMany people swear by this one, and it's one of Barbara O'Neill's favorite home comforts.\n- Fill one bowl with warm water (bath temperature) and one with cool water.\n- Hands in the warm bowl for about three minutes.\n- Then in the cool bowl for about 30 seconds.\n- Do this three times, ending on cool.\n\nIt's not proven in big studies, but it's free, easy on the hands, and many people find it eases stiff hands.", "try": "Try the water swap for your hands once this week.", "watch": {"label": "Finger, hand and wrist stretches, follow along", "src": "Versus Arthritis stretching series", "url": "https://versusarthritis.org/news/2021/october/new-stretching-videos-to-help-keep-moving-and-manage-your-arthritis"}, "check": {"q": "What goes between a cold pack and your skin?", "opts": ["Nothing", "A cloth"], "a": 1, "why": "Yes. Always a cloth, to protect your skin."}}, {"id": "w3b", "title": "Compresses and poultices", "open": "These are the old kitchen comforts. Some are proven, some just feel good, and both have a place.", "body": "## Castor oil compress\n- Patch test first: dab a little oil on your inner arm and wait a day.\n- Soak a piece of cotton or flannel in castor oil.\n- Lay it on the sore joint and cover it with an old towel (the oil stains).\n- Put a warm (not hot) water bottle on top.\n- Rest for 20 to 30 minutes.\n\nIt hasn't been proven in studies. Most of the comfort probably comes from the warmth and the stillness. Use it on the skin only, and stop if your skin gets red or itchy.\n\n## Ginger poultice\nGrated fresh ginger wrapped in a cotton cloth, laid on one joint. Take it off as soon as it stings, and never leave it on overnight.\n\n## Epsom salt bath\nThe warm water is what soothes. The salt is optional.\n\nThese came to many people through Barbara O'Neill, who has spent decades teaching home comforts. She isn't a doctor, so we've checked each one against the research and told you plainly what holds up.", "try": "Pick one comfort from this lesson and give yourself 20 quiet minutes with it this week. Music on, phone down.", "watch": [{"label": "Barbara O'Neill: castor oil for sore joints", "src": "Barbara O'Neill (YouTube)", "yt": "BDq0kej3C14", "len": "A short demonstration.", "what": "Barbara shows how she makes and uses a castor oil compress on a sore knee, step by step. It's the same compress you just read about.", "why": "Seeing it done once makes it far easier to try at home. Watch this before your first compress, so you know how much oil to use and how to wrap it without making a mess.", "barb": true}, {"label": "Barbara O'Neill: the poultice class", "src": "Barbara O'Neill (YouTube)", "yt": "uVLGsqysQcs", "len": "A full class. Watch it in pieces if you like.", "what": "Her full class on making poultices at home, from what goes in the cloth to how to wrap it on a joint.", "why": "If the ginger poultice caught your interest, this is the long version, with every step shown. Keep our rule in mind while you watch: take a poultice off the moment it stings, and never leave ginger or cayenne on overnight.", "barb": true}], "check": {"q": "Before using a new oil or cream on a sore joint, you should…", "opts": ["Patch-test a small spot first", "Use lots straight away"], "a": 0, "why": "Right. A small patch first, wait a day, then go ahead if your skin is fine."}}, {"id": "w3c", "title": "Creams, rubs and what to skip", "open": "The pharmacy aisle is full of promises. This lesson is here to save you money.", "body": "## Worth trying\n- Chili-pepper cream (capsaicin): the American College of Rheumatology guidelines suggest it for knee osteoarthritis. It tingles or burns for the first week or two, then relief builds. Wash your hands after, and keep it away from your eyes.\n- Anti-inflammatory gels like diclofenac: recommended for knees and hands. Ask your pharmacist if they're safe with your other medicines.\n- Comfrey cream: one three-week study found it eased knee pain. Unbroken skin only, and never swallow it.\n\n## Probably skip\n- Glucosamine and chondroitin: the biggest studies found little or no benefit, and arthritis doctors advise against them. If you've taken them for years and feel no difference, ask your pharmacist about stopping.\n- Anything that promises to cure arthritis. Nothing cures it yet. Many things help.\n\n## One at a time\nTry one new thing, give it a few weeks, and keep it only if you can feel a difference. Trying three at once means you'll never know which one helped.", "try": "Look at what's in your cupboard. Is there something you've used for months with no difference? Write it on your list for the pharmacist.", "watch": {"label": "Knee and hip arthritis: managing pain, supplements and exercise", "src": "Torbay and South Devon NHS physiotherapy videos", "url": "https://www.torbayandsouthdevon.nhs.uk/services/physiotherapy/support-videos/managing-knee-and-hip-arthritis"}, "check": {"q": "Which of these has the best support for knee pain?", "opts": ["Glucosamine pills", "Chili-pepper (capsaicin) cream", "A cream that promises a cure"], "a": 1, "why": "Yes. Capsaicin cream is in the guidelines. Give it two to four weeks."}}]}, {"n": 4, "name": "Food that's kind to joints", "aim": "Add good things to your plate without giving up the foods you love.", "days": ["Add one color to one meal", "Swap one sugary drink for water", "Your morning routine and a walk", "Fish, beans or eggs at one meal", "A handful of nuts or berries as a snack", "Your morning routine and a walk", "Cook one meal from this week's ideas"], "lessons": [{"id": "w4a", "title": "Add, don't take away", "open": "This isn't a diet. Nobody's taking your morning toast.", "body": "The eating pattern with the best support for joints and general health is close to what's called the Mediterranean way of eating. It's mostly about adding things.\n\n## A plate that's kind to joints\n- Half the plate: vegetables and fruit, lots of colors.\n- A quarter: protein. Fish, chicken, eggs, beans, yogurt. Protein feeds the muscles that protect your joints.\n- A quarter: whole grains or potatoes.\n- A drizzle of olive oil, a few nuts, some avocado.\n- Fish once or twice a week. Salmon, sardines and tuna carry omega-3 fats.\n\n## Foods you can keep\nYou may have been told to give up tomatoes, potatoes, peppers, bread, milk, tea or coffee. Research hasn't found that these make arthritis worse. If you suspect one, leave it out for two weeks, bring it back, and see what your body says.\n\nThe one exception is gout, where some foods really do matter. That's in the next lesson.", "try": "Add one color to one meal today. Berries on cereal, spinach in eggs, carrots on the side.", "watch": [{"label": "Barbara O'Neill: Fantastic Fats", "src": "Barbara O'Neill (YouTube)", "yt": "slWOfJzWAf8", "len": "About an hour.", "what": "Barbara's full talk on the fats in our food: which ones she reaches for, which ones she avoids, and why.", "why": "Good fats are a big part of the plate in this lesson. Olive oil, nuts and oily fish have the best support for joints and the heart, and this talk goes deeper into her view. Listen with this lesson in mind, and bring any big change in how you eat to your doctor first.", "barb": true}], "check": {"q": "Do you have to give up tomatoes and potatoes for arthritis?", "opts": ["Yes, always", "No, research hasn't found they make it worse"], "a": 1, "why": "Right. Keep the foods you love unless your own body tells you otherwise."}}, {"id": "w4b", "title": "Weight, knees and gout", "open": "Two things about food matter more than all the rest: what your knees carry, and gout.", "body": "## Every pound counts on the knees\nResearch from Wake Forest University found that each pound of weight lost takes about four pounds of pressure off the knee with every step. Lose ten pounds, and that adds up to a lot of pressure saved over a day of walking.\n\nYou don't need a big number. Small changes, kept up, are what count.\n\n## If yours is gout\nFood matters more in gout than in any other kind of arthritis. These can set off a flare:\n- Alcohol, especially beer and spirits.\n- Organ meats, red meat and shellfish.\n- Sweet fizzy drinks.\nWater helps. If flares keep coming back, medicine that lowers uric acid is what stops them, so talk to your doctor.\n\n## If you take medicine for blood sugar or blood pressure\nCheck with your doctor before big changes to what you eat. Small swaps, like water instead of soda, are usually fine.", "try": "Swap one sugary drink for water today. Add a slice of lemon if it helps.", "watch": {"label": "Pilates for arthritis, a slow full class", "src": "NHS Fitness Studio", "url": "https://www.nhs.uk/live-well/exercise/pilates-and-yoga/arthritis-pilates-exercise-video"}, "check": {"q": "About how much pressure comes off the knee with each step for every pound lost?", "opts": ["About 1 pound", "About 4 pounds"], "a": 1, "why": "Yes, about four pounds per step. It adds up fast."}}, {"id": "w4c", "title": "Easy meals for sore hands", "open": "Cooking is harder when chopping hurts. So we cut the chopping.", "body": "## Shortcuts that are still good food\n- Frozen vegetables and frozen berries: just as good, nothing to wash or cut.\n- Pre-cut onions, carrots and squash.\n- Tinned beans, tinned fish, jars of chopped tomatoes.\n- A sheet pan: everything on one tray, one pan to wash.\n\n## Three meals to start with\n- Warm oats with cinnamon and frozen berries, made in the microwave in a big bowl.\n- Sheet-pan salmon with ready-cut vegetables and a drizzle of olive oil, at 400°F for about 25 minutes.\n- Lentil soup with frozen onion and carrot, a tin of tomatoes, stock and a little turmeric. It freezes well for bad days.\n\n## Tools that help\nJar openers, lightweight pans with big handles, a rocking knife, and a stool to sit on while you cook. An occupational therapist can suggest more.\n\nTurmeric and ginger are lovely in cooking. As pills, the research is small and mixed. If you take blood thinners, ask your pharmacist before taking turmeric or ginger capsules.", "try": "Cook one of the three meals this week, or buy one bag of frozen vegetables to keep in the freezer.", "watch": {"label": "Seated exercises you can do in a chair", "src": "Versus Arthritis", "url": "https://versusarthritis.org/news/2023/september/exercises-you-can-do-sitting-down"}, "check": {"q": "Are frozen vegetables a good choice?", "opts": ["Yes, and there's nothing to chop", "No, only fresh counts"], "a": 0, "why": "Right. Frozen is just as good and much easier on your hands."}}]}, {"n": 5, "name": "Getting stronger, a little at a time", "aim": "Build the muscles that take weight off your joints, beside a chair.", "days": ["5 sit-to-stands", "Your morning routine and a walk", "The chair routine, one round", "A walk", "The chair routine, one round", "Your morning routine and a walk", "Notice: is standing up easier?"], "lessons": [{"id": "w5a", "title": "Your muscles are your joints' helpers", "open": "You're never too old to get stronger. People in their nineties do it.", "body": "Strong thigh muscles act like shock absorbers for the knee. Strong hip and back muscles take load off the hips and spine. When the muscles do more, the joints carry less.\n\n## How to get stronger safely\n- Move slowly. Count three up and three down.\n- Stay in the yellow zone: pain up to 5 out of 10 is okay. More than that, ease off.\n- Start with five of each move. Work up to ten.\n- Two or three days a week, with a rest day in between. Muscles grow on the rest days.\n\nA physical therapist can check how you're doing the moves and change them for you. That matters most if you've had a joint replaced.", "try": "Do 5 sit-to-stands from your favorite sturdy chair. Use your hands on the armrests if you need them. That's strength training.", "watch": {"label": "Resistance band workouts, seated and standing", "src": "Versus Arthritis, with Leon and his mum Janet", "url": "https://versusarthritis.org/about-arthritis/exercising-with-arthritis/resistance-band-workout-sessions"}, "check": {"q": "How often should you do strength moves?", "opts": ["Every day, as many as possible", "Two or three days a week"], "a": 1, "why": "Right. The rest days in between are when muscles grow."}}, {"id": "w5b", "title": "The chair routine", "open": "All you need is a sturdy chair without wheels.", "body": "Do one round. When that feels easy, do two.\n\n- Seated march: sit tall and lift one knee, then the other, for a minute.\n- Sit to stand: stand up and sit back down slowly. Five to ten times.\n- Knee straightening: seated, straighten one leg, hold for five seconds, lower. Ten each side.\n- Heel raises: hold the chair back, rise onto your toes, lower. Ten times. Seated version: lift your heels while sitting.\n- Side leg lift: hold the chair back and lift one leg out to the side. Eight each side. Seated version: slide one foot out and back.\n- Wall push-ups: hands on a wall at shoulder height, bend your elbows, press back. Eight to ten.\n- Hand opening and thumb touches: soft fist, spread your fingers, then touch your thumb to each fingertip.\n\nBreathe out on the effort. Stop short of sharp pain.\n\nThe Hinge App in your Toolkit talks you through chair moves with a calm voice, if you'd rather follow along than read.", "try": "Do one round of the chair routine today, or open the Hinge App and follow one routine.", "watch": {"label": "Knee and hip exercises, follow along", "src": "Versus Arthritis stretching series", "url": "https://versusarthritis.org/news/2021/october/new-stretching-videos-to-help-keep-moving-and-manage-your-arthritis"}, "check": {"q": "What do you do on the effort part of a move?", "opts": ["Hold your breath", "Breathe out"], "a": 1, "why": "Yes. Breathe out as you push or lift."}}, {"id": "w5c", "title": "Balance, so you can trust your feet", "open": "Being afraid of falling makes people move less. Better balance gives that confidence back.", "body": "Balance is a skill, and it improves with practice at any age. Tai chi has good research behind it for both balance and arthritis comfort.\n\n## Three balance moves beside the kitchen counter\n- Stand with your feet close together, holding the counter, for 20 seconds.\n- Stand with one foot slightly in front of the other, holding on, for 20 seconds. Then swap.\n- Stand on one foot, holding on with both hands, for 10 seconds. Then the other foot.\n\nAs each one gets easier, hold on with fingertips instead of your whole hand.\n\n## Around the house\n- Clear loose rugs and cords from the paths you walk.\n- Put a nightlight between the bed and the bathroom.\n- Grab bars by the toilet and in the shower help a great deal.\n\nIf you've fallen in the last year, or feel unsteady often, tell your doctor. A physical therapist can help with a balance plan just for you.", "try": "Do the first balance move while the kettle boils, holding the counter.", "watch": [{"label": "Tai chi for sore joints, with Dr Paul Lam", "src": "Tai Chi for Health Institute (YouTube)", "yt": "tAOuEpa01j4", "len": "A follow-along class.", "what": "A calm follow-along class with Dr Paul Lam, a doctor who has taught tai chi to people with arthritis for many years. The moves are slow and flowing, standing or in a chair.", "why": "Tai chi gets a strong yes in the American College of Rheumatology guideline for knees and hips. It builds balance, strength and calm at the same time, without jarring your joints. It's the best next step after this lesson's counter moves."}], "check": {"q": "Where should you practice balance moves?", "opts": ["In the middle of the room", "Beside something steady, like the kitchen counter"], "a": 1, "why": "Right. Always beside something steady you can hold."}}]}, {"n": 6, "name": "Doing more with less strain", "aim": "Keep doing the things you love by changing how you do them.", "days": ["Cut one big job in half", "Try one tool from the list", "Your morning routine and a walk", "Plan tomorrow's top 3 jobs", "Sit down for one job you usually stand for", "The chair routine", "Write down the one change that helped most"], "lessons": [{"id": "w6a", "title": "Spread your energy across the day", "open": "Think of your energy like butter on toast. Spread it out instead of using it all in one corner.", "body": "## Plan\nEach evening, pick your top three jobs for tomorrow. The rest can wait.\n\n## Switch\nGo between heavy jobs and light ones. Vacuum one room, then fold laundry sitting down.\n\n## Break it up\nClean one room, then rest. Garden for 15 minutes, then sit with a drink. Cut a big job in half and put a rest in the middle.\n\n## Sit when you can\nIroning, chopping, washing up and drying your hair can all be done sitting on a stool.\n\nNone of this is giving in. It's how people with arthritis keep gardening, cooking for the family and getting out with friends for years.", "try": "Pick one job you dread this week. Cut it in half and rest in the middle.", "watch": {"label": "Two Minute Stretch: a seated starter routine", "src": "Great Western Hospitals NHS rheumatology", "url": "https://gwh.nhs.uk/wards-and-services/rheumatology/diet-and-exercise/exercise/exercise-with-the-rheumatology-department"}, "check": {"q": "You have a long cleaning job. What's the kinder way to do it?", "opts": ["All at once to get it over with", "In pieces, with rests in between"], "a": 1, "why": "Yes. Pieces and rests mean you can still move tomorrow."}}, {"id": "w6b", "title": "Little tools that make a big difference", "open": "A jar opener isn't defeat. It's just a better jar opener than your hand.", "body": "## For hands\n- Jar and bottle openers, including the rubber grip kind.\n- Fat-grip pens and cutlery, or foam tubes that slide over handles.\n- Lever taps instead of round knobs.\n- Electric can opener.\n\n## For knees and hips\n- A cane in the hand opposite the sore leg. The American College of Rheumatology guidelines strongly recommend one for knee and hip arthritis.\n- A raised toilet seat and a shower chair.\n- A long-handled shoehorn and a sock aid.\n- A reacher-grabber for things on the floor or high shelves.\n\n## For the whole body\n- Cushioned, supportive shoes.\n- A wheeled bag or cart instead of carrying.\n\nAn occupational therapist can visit or advise on what would help most in your home. Ask your doctor about a referral.", "try": "Choose one tool from this list that would help this week. Write it down or order it.", "watch": {"label": "Getting down to and up from the floor safely", "src": "Versus Arthritis, Let's Move with Leon", "url": "https://www.arthritis-uk.org/information-and-support/living-with-arthritis/health-and-wellbeing/exercising-with-arthritis/lets-move-with-Leon/"}, "check": {"q": "Do the arthritis guidelines recommend a cane for knee arthritis?", "opts": ["Yes, strongly", "No, never"], "a": 0, "why": "Right. Used in the opposite hand, it takes real load off the sore knee."}}, {"id": "w6c", "title": "Asking for help without feeling like a burden", "open": "This one is hard for a lot of people. Especially the ones who've always been the helper.", "body": "If you've spent your life looking after other people, asking for help can feel like losing something. But most family members want to help and don't know how. Giving them a clear job is a kindness to them too.\n\n## Make it easy to say yes\n- Be specific: \"Could you carry the laundry basket upstairs on Sundays?\" works better than \"I need more help.\"\n- Pick the jobs that cost you the most for the least reward: heavy shopping, high shelves, mowing.\n- Keep the jobs you love. If you love cooking, ask someone to do the chopping and keep the cooking for yourself.\n\n## For family members reading this\nThe best help is quiet and practical. Offer a specific job. Don't take over. And ask how today is, not how the arthritis is.", "try": "Ask one person for one specific bit of help this week.", "watch": {"label": "Neck and back stretches, follow along", "src": "Versus Arthritis stretching series", "url": "https://versusarthritis.org/news/2021/october/new-stretching-videos-to-help-keep-moving-and-manage-your-arthritis"}, "check": {"q": "Which request is easier for family to say yes to?", "opts": ["\"I need more help\"", "\"Could you carry the laundry up on Sundays?\""], "a": 1, "why": "Yes. A clear, small job is easy to say yes to."}}]}, {"n": 7, "name": "Better nights, calmer days", "aim": "Loosen the loop where pain spoils sleep and poor sleep turns pain up.", "days": ["Same bedtime as last night", "5 rounds of the 4-6 breath in bed", "Your morning routine and a walk", "Phone and TV off 30 minutes before bed", "A pillow between your knees tonight", "A walk in daylight", "Write down three good things from the week"], "lessons": [{"id": "w7a", "title": "Sleep turns the pain alarm down", "open": "Pain makes it hard to sleep, and poor sleep makes pain louder. Both are true, and both can be eased.", "body": "## Small changes for better nights\n- Go to bed and get up at about the same time every day, weekends too. This matters more than the exact hour.\n- Keep the room cool, dark and quiet.\n- A pillow between your knees helps hips and backs. A pillow under your knees helps if you sleep on your back.\n- A warm bath or shower an hour before bed loosens stiff joints.\n- Move in the daytime. A walk today helps sleep tonight.\n- Ease off caffeine after lunch.\n\n## If you wake in the night\nDon't lie there fighting it. After about 20 minutes, get up, sit somewhere dim and do something quiet until you feel sleepy.\n\nIf pain wakes you most nights, or you snore loudly and wake tired, tell your doctor. Both have treatments.", "try": "Pick a bedtime and keep it for the next three nights.", "watch": {"label": "More slow tai chi", "src": "Arthritis Society Canada", "url": "https://arthritis.ca/healthy-living/tai-chi-to-help-arthritis/"}, "check": {"q": "What matters most for better sleep?", "opts": ["Going to bed at the same time each day", "Sleeping in on weekends"], "a": 0, "why": "Right. A steady bedtime does more than the exact number of hours."}}, {"id": "w7b", "title": "The 4-6 breath", "open": "A long, slow breath out tells your body it's safe. A body that feels safe feels less pain.", "body": "## How to do it\n- Sit or lie down. Put one hand on your belly.\n- Breathe in through your nose while you count to four.\n- Breathe out slowly through your mouth while you count to six.\n- Do it five times.\n\nThat's it. Use it in bed, in the doctor's waiting room, before a walk, or when a flare starts.\n\n## Why it helps\nWhen you're worried or in pain, the body tenses and breathing gets short and fast. Slow breathing, with the out-breath longer than the in-breath, calms that response. Tense muscles around a sore joint make the pain worse, so letting them soften helps.\n\nSome people like to add a word or a short prayer on the out-breath. Do whatever feels like yours.", "try": "Tonight in bed, do five rounds of the 4-6 breath.", "watch": {"label": "Pilates for arthritis, a slow full class", "src": "NHS Fitness Studio", "url": "https://www.nhs.uk/live-well/exercise/pilates-and-yoga/arthritis-pilates-exercise-video"}, "check": {"q": "Which breath calms the body?", "opts": ["Short, fast breaths", "In for 4, out for 6"], "a": 1, "why": "Yes. The long, slow breath out is the part that calms."}}, {"id": "w7c", "title": "When it gets you down", "open": "Feeling fed up, worried or low is common with long-term pain. It's not weakness, and it's not your fault.", "body": "Pain that goes on for months wears on anyone. You might miss things you used to do. You might worry about getting worse, or about being a burden. Those feelings make sense.\n\n## Things that help\n- Talking to someone: a friend, a faith leader, a support group.\n- A kind of talking therapy called CBT, which arthritis guidelines suggest for people living with long-term pain. Ask your doctor about it.\n- Writing it down. Even a few lines before bed can make the day feel lighter.\n- Noticing small good things. At the end of each day, write down three, however small.\n\n## Please tell your doctor if\n- You've felt low or lost interest in things for more than two weeks.\n- You're not sleeping or eating as you normally would.\n\nThat takes courage, and it's the right thing to do. If you ever feel like you can't go on, call or text 988 in the US to reach the Suicide and Crisis Lifeline.", "try": "Tonight, write down three good things from today. They can be very small.", "watch": {"label": "Arthritis Foundation videos and support (YES library)", "src": "Arthritis Foundation", "url": "https://www.arthritis.org/living-with-arthritis/tools-resources/your-exercise-solution/"}, "check": {"q": "You've felt low for more than two weeks. What's the right step?", "opts": ["Keep it to yourself", "Tell your doctor"], "a": 1, "why": "Yes. It's common, and there's help."}}]}, {"n": 8, "name": "Bad days and the long run", "aim": "Have a plan for flares, and make the habits that helped your own.", "days": ["Fill in your flare-up plan", "Put it on the fridge", "Your morning routine and a walk", "The chair routine", "Fill in your questions for the doctor", "Your morning routine and a walk", "Read the note you wrote in week 1"], "lessons": [{"id": "w8a", "title": "Your flare-up plan", "open": "Flares happen to everyone, even people doing everything right. A flare doesn't wipe out your progress.", "body": "## On a bad day\n- Do about half of what you normally would. Don't stop completely. A little movement helps a flare pass sooner than lying still.\n- Use heat for stiffness or a wrapped cold pack for a hot, puffy joint, for about 15 minutes.\n- Do your top one job only. Ask for help with the rest.\n- Do the 4-6 breath.\n- When it settles, build back up over a few days.\n\n## About pain medicine\nYour doctor or pharmacist knows which pain relief is safe with your other medicines. Only change a prescribed medicine after speaking with your doctor.\n\n## Call your doctor today if\n- A joint is hot, red and very swollen, especially with a fever.\n- You have sudden, severe pain after a fall or injury.\n- You can't put weight on a leg.\n- You have new numbness, weakness, or trouble with bladder or bowels.\n- A flare isn't settling after a week.\nChest pain or trouble breathing: call 911.", "try": "Fill in your flare-up plan in the Toolkit, print it and put it on the fridge.", "watch": {"label": "What a flare-up is and how to manage it", "src": "Torbay and South Devon NHS physiotherapy videos", "url": "https://www.torbayandsouthdevon.nhs.uk/services/physiotherapy/support-videos/managing-knee-and-hip-arthritis"}, "check": {"q": "During a flare, what's the best plan?", "opts": ["Stay in bed all week", "Do about half as much, then build back up"], "a": 1, "why": "Right. Less, but not nothing, then ease back in."}}, {"id": "w8b", "title": "Getting more from your doctor visits", "open": "Ten minutes with a doctor goes fast. A short list makes it count.", "body": "## Before you go\n- Fill in your questions sheet in the Toolkit.\n- Bring your pain log, or a few numbers from it.\n- Bring a list of every medicine, cream and supplement you take, including the natural ones.\n\n## Questions worth asking\n- Which kind of arthritis do I have, and how sure are we?\n- What's safe for me to do, and is there anything I should avoid?\n- Could a physical therapist or occupational therapist help me?\n- Is my pain relief safe with my other medicines?\n- Is there a local program, like Walk With Ease or tai chi for arthritis, you'd recommend?\n\n## Tell your doctor about this Program\nLet them know you're doing light movement, home comforts and food changes. If you take a medicine for rheumatoid arthritis or gout, keep taking it. That medicine protects your joints, and everything here works alongside it.", "try": "Fill in your questions sheet and put it with your next appointment card.", "watch": {"label": "Find a proven arthritis program near you", "src": "CDC", "url": "https://www.cdc.gov/arthritis/programs"}, "check": {"q": "What should you bring to your doctor?", "opts": ["Nothing, they'll know", "Your questions, your pain log and your list of medicines"], "a": 1, "why": "Yes. A short list makes a short visit count."}}, {"id": "w8c", "title": "Keep going, at your own pace", "open": "Eight weeks ago you opened the first lesson. Look at what's on your list now.", "body": "You have a morning routine, a walking habit, a chair routine, home comforts you trust, a few kitchen shortcuts, a bedtime, a breath for hard moments and a flare plan on the fridge. That's a lot.\n\n## Look back\nOpen your pain log and compare week 1 with this week. Even one point lower is real. If your number is the same but you're doing more, that's progress too.\n\n## Make it last\n- Tie each habit to something you already do: \"After coffee, I walk.\"\n- Keep the habits that helped. Drop the ones that didn't.\n- Walk with a friend, or join a class. It's easier with someone.\n- Come back to any week whenever you need it. The lessons stay here.\n\n## What's next, if you'd like it\nThe Club sends a new chair routine, a simple recipe and a small weekend challenge every week, so you're never doing it alone.", "try": "Read the note you wrote before week 1. Then write one line to yourself about what's easier now.", "watch": {"label": "Knee problems pilates class", "src": "NHS Fitness Studio", "url": "https://www.nhs.uk/conditions/nhs-fitness-studio/pilates-and-yoga/knee-problems-pilates-exercise-video"}, "check": {"q": "What's the best way to keep a habit?", "opts": ["Wait until you feel like it", "Tie it to something you already do"], "a": 1, "why": "Right. \"After coffee, I walk.\" Simple hooks make habits stick."}}]}], "toolkit": {"safety": ["Every move has a seated version. You never have to get on the floor.", "Move slowly. A mild pull is fine. Sharp or worsening pain means stop.", "The two-hour rule: if pain is worse than usual for more than two hours after moving, do a little less next time.", "Warm what's stiff. Cool what's swollen. About 15 to 20 minutes of either is enough.", "Only change a prescribed medicine after speaking with your doctor.", "Hot, red, very swollen joint, a fall, or new numbness or weakness: call your doctor today. Chest pain or trouble breathing: call 911."], "questions": ["Which kind of arthritis do I have, and how sure are we?", "What's safe for me to do, and is there anything I should avoid?", "Could a physical therapist or occupational therapist help me?", "Is my pain relief safe with my other medicines and supplements?", "Is there a local program, like Walk With Ease or tai chi for arthritis, you'd recommend?"], "flare": ["What usually sets off my flares:", "What helps me most on a bad day:", "My one job for a bad day:", "Who I can ask for help, and their number:", "My doctor's number:", "When I'll call the doctor:"]}, "disclaimer": "For general wellness, not medical advice. Check with your doctor before starting a new remedy or exercise.", "barb": "Barbara is a natural-health teacher, not a doctor. Her talks share her own views, and we haven't checked every claim in them. Enjoy them as ideas, keep your doctor in the loop, and only change a prescribed medicine after speaking with your doctor.", "sc": [{"id": "stiff", "q": "On most mornings, how long does the stiffness last?", "opts": ["Less than 15 minutes", "15 to 60 minutes", "More than an hour"]}, {"id": "chair", "q": "Can you stand up from a dining chair without using your hands?", "opts": ["Yes, easily", "Yes, but it's hard", "Not without my hands"]}, {"id": "stand", "q": "How long can you stand or walk before you need to sit?", "opts": ["More than 20 minutes", "5 to 20 minutes", "Less than 5 minutes"]}, {"id": "focus", "q": "Which part of you bothers you most?", "opts": ["Hands and wrists", "Knees", "Hips", "Back and neck"]}, {"id": "surgery", "q": "Have you had a joint replaced or other joint surgery in the last 12 months?", "opts": ["No", "Yes"]}], "tracks": {"gentle": {"name": "Easy start", "line": "You'll start with the smallest version of each move, mostly seated, and build slowly. That's the right place to begin, and plenty of people stay here."}, "regular": {"name": "Steady", "line": "You'll do the moves as written, with a seated option whenever you need it, and add a little each week."}, "stronger": {"name": "Stronger", "line": "You're ready for a bit more. You'll do extra rounds and longer walks, still slow and still safe."}}, "ver": {"w1b": {"gentle": "Do the lying-down moves only, three of each. Add the sitting moves next week.", "regular": "Do the full routine as written.", "stronger": "Do the full routine, then 5 slow sit-to-stands before breakfast."}, "w2b": {"gentle": "Start with 2 or 3 minutes indoors, holding on to furniture if you like. Add one minute a week.", "regular": "Start with 5 minutes and add a minute or two each week.", "stronger": "Start with 10 minutes, outdoors if you can, and add 2 to 3 minutes a week."}, "w5b": {"gentle": "Do every move seated, 5 of each. Skip the wall push-ups until week 6.", "regular": "One round as written. Add a second round when it feels easy.", "stronger": "Two rounds, 10 of each, with a short rest between rounds."}, "w5c": {"gentle": "Do the first move only, holding the counter with both hands.", "regular": "Do all three moves, holding on with one hand.", "stronger": "Do all three moves with fingertips only, then try the tai chi class."}, "w2c": {"gentle": "Set your amount from a bad-ish day, not a so-so one.", "regular": "Set your amount from a so-so day, as the lesson says.", "stronger": "Set your amount from a so-so day, and add a little every week, not every day."}}, "focus": {"Hands and wrists": {"title": "Extra care for hands and wrists", "body": "Hands do hundreds of small jobs a day, so they never really get to rest. A few minutes of care in the morning makes buttons, keys and jar lids easier.\n\n## Morning hand routine\n- Warm your hands in water for a minute or two.\n- Make a soft fist, then spread your fingers wide. Ten times.\n- Touch your thumb to each fingertip in turn. Twice.\n- Lay your hand flat on the table and lift each finger, one at a time.\n- Slowly bend your wrist up and down, then side to side. Five each way.\n\n## Through the day\n- Use both hands to lift a full kettle or pan.\n- Choose fat-grip pens and cutlery, and lever taps.\n- Rest your hands for a minute between jobs that grip, like gardening or knitting.\n\nA hand therapist (an occupational therapist who works with hands) can make splints for night-time and suggest tools. Ask your doctor about a referral.", "try": "Do the morning hand routine after your first warm drink tomorrow."}, "Knees": {"title": "Extra care for knees", "body": "Strong thigh muscles are the best friend a sore knee has. They take the load before it reaches the joint.\n\n## Knee routine, beside a chair\n- Seated knee straightening: straighten one leg, hold for five seconds, lower. Ten each side.\n- Thigh squeeze: sit with your leg straight out on a stool, press the back of your knee down, hold for five seconds. Ten each side.\n- Sit to stand: five to ten, using your hands if you need them.\n- Heel slides: lying on your bed, slide your heel toward you and back. Ten each side.\n\n## Through the day\n- On stairs, go up with the good leg first and down with the sore leg first. \"Up with the good, down with the bad.\"\n- Avoid kneeling on hard floors. Use a garden kneeler.\n- Sit in chairs that aren't too low, so standing up is easier.", "try": "Do the seated knee straightening while you watch TV tonight."}, "Hips": {"title": "Extra care for hips", "body": "Hips like to move in every direction, and stiffness creeps in when they only go forward and back all day.\n\n## Hip routine, beside a chair\n- Side leg lift: hold the chair back and lift one leg out to the side. Eight each side.\n- Back leg lift: hold the chair, keep your back straight, and slowly lift one leg behind you. Eight each side.\n- Seated knee lift: sit tall and lift one knee toward your chest. Eight each side.\n- Bridge (on the bed): lie on your back, knees bent, and lift your bottom a little off the bed. Five times.\n\n## Through the day\n- A pillow between your knees at night eases hip ache.\n- Sit in a higher chair, or add a firm cushion, so your knees are lower than your hips.\n- Use a cane in the hand opposite the sore hip on longer walks.\n\nIf you've had a hip replaced, ask your physical therapist which moves are right for you before you start.", "try": "Try the pillow between your knees tonight, and the side leg lift tomorrow."}, "Back and neck": {"title": "Extra care for back and neck", "body": "A stiff back and neck often come from staying in one position too long, especially sitting.\n\n## Back and neck routine, seated\n- Shoulder rolls: five backward, five forward.\n- Chin tuck: sit tall and draw your chin back, as if making a double chin. Hold for three seconds. Five times.\n- Seated twist: hand on the opposite knee, turn slowly, hold for a slow breath. Three each side.\n- Side bend: slide one hand down the side of the chair. Three each side.\n- Cat and cow, seated: round your back, then arch it a little. Five times.\n\n## Through the day\n- Change position every half hour. Stand, walk to the kitchen, sit again.\n- Hold your phone at eye level instead of looking down.\n- Carry bags in both hands, or use a wheeled bag.\n\nBack pain with numbness, weakness in a leg, or trouble with bladder or bowels needs a doctor the same day.", "try": "Set a reminder to stand up every half hour tomorrow afternoon."}}, "routines": [{"id": "bed", "name": "The before-you-get-up routine", "where": "In bed, then on the edge of the bed", "steps": [["Lie on your back and get comfortable. We'll go slowly.", 8], ["Ankle circles. Circle your right ankle slowly, five times each way.", 25], ["Now your left ankle. Five times each way.", 25], ["Ankle pumps. Point your toes, then pull them back toward you. Keep going, slowly.", 25], ["Knee slides. Slide your right heel up toward you, then back down. Five times.", 25], ["Now the left heel. Five slow slides.", 25], ["Roll onto your side and sit up on the edge of the bed. Take your time.", 15], ["Shoulder rolls. Roll both shoulders backward five times, then forward five times.", 25], ["Hand opening. Make a soft fist, then spread your fingers wide. Ten times.", 25], ["Slow neck turns. Look over one shoulder, then the other. Stop before anything pinches.", 20], ["Well done. Stand up slowly, with a hand on something steady.", 8]]}, {"id": "chair", "name": "The chair routine", "where": "Beside a sturdy chair without wheels", "steps": [["Sit tall on a sturdy chair. Feet flat on the floor.", 8], ["Seated march. Lift one knee, then the other. Keep a slow, steady rhythm.", 45], ["Sit to stand. Stand up and sit back down slowly. Use your hands if you need them. Go at your own pace.", 40], ["Knee straightening, right leg. Straighten it, hold for five seconds, and lower. Keep going.", 40], ["Now the left leg. Straighten, hold for five, lower.", 40], ["Heel raises. Hold the chair back and rise onto your toes, then lower. Or lift your heels while sitting.", 30], ["Side leg lift. Hold the chair back and lift your right leg out to the side. Eight times.", 30], ["Now the left leg. Eight times.", 30], ["Hand opening and thumb touches. Soft fist, spread your fingers, then thumb to each fingertip.", 30], ["Finish with the 4-6 breath. In for four. Out for six. Three times.", 30], ["That's one round. Well done. Have a glass of water.", 8]]}, {"id": "balance", "name": "Balance at the counter", "where": "Standing at the kitchen counter, holding on", "steps": [["Stand at the kitchen counter and hold on with both hands.", 8], ["Feet close together. Stand tall and breathe. Hold this.", 20], ["Now one foot slightly in front of the other. Keep holding on.", 20], ["Swap feet. The other foot in front.", 20], ["Stand on your right foot, holding on with both hands. Just a few seconds is fine.", 12], ["Now your left foot.", 12], ["Both feet down. That's it for today. Nice and steady.", 8]]}, {"id": "wind", "name": "The evening wind-down", "where": "In a comfortable chair or on the edge of the bed", "steps": [["Sit comfortably. Let your shoulders drop.", 8], ["Shoulder lifts. Lift your shoulders toward your ears, hold, and let them fall. Five times.", 30], ["Easy side bend. Slide one hand down the side of the chair and lean a little. Then the other side.", 30], ["Hand stretch. Spread your fingers wide on your lap, then relax them.", 25], ["The 4-6 breath. Breathe in through your nose for four.", 5], ["And out slowly for six.", 7], ["In for four.", 5], ["Out for six.", 7], ["In for four.", 5], ["Out for six. Good. Time for bed.", 8]]}], "tests": [{"id": "sts", "label": "Sit-to-stands in 30 seconds", "help": "Sit in a sturdy chair, arms crossed if you can (hands are fine if you need them). Count how many times you stand up fully in 30 seconds.", "unit": "times"}, {"id": "stiff", "label": "How long morning stiffness lasted", "help": "Tomorrow morning, notice roughly how long until you feel loosened up.", "unit": "minutes"}, {"id": "pain", "label": "Pain on an average day", "help": "0 means no pain, 10 means the worst you can imagine.", "unit": "out of 10"}, {"id": "walk", "label": "How long you can walk comfortably", "help": "Roughly, before you need to sit down.", "unit": "minutes"}], "ciq": ["What got a little easier this week?", "What was hard?", "One small thing for next week:"], "family": "If someone you love lives with stiff, sore joints, you've probably felt it too: wanting to help and not knowing how, or helping and getting it wrong.\n\n## What helps\n- Ask how today is, not how the arthritis is.\n- Offer one specific job: \"I'll carry the laundry up on Sundays.\" That's easier to accept than \"Let me know if you need anything.\"\n- Walk with them. Ten minutes together is more fun than ten minutes alone, and it counts.\n- Notice the small wins out loud. \"You got up from that chair easily.\"\n- Learn their flare-up plan, so you know what to do on a bad day without asking.\n\n## What doesn't help\n- Taking over jobs they still enjoy doing, even if they're slower at them.\n- Pushing supplements or miracle cures you saw online.\n- Comparing them with someone else's arthritis.\n- Telling them to rest all the time. Moving a little is what helps.\n\n## When to step in\nCall their doctor, or help them call, if a joint is hot, red and very swollen, especially with a fever; after a fall; or if they can't put weight on a leg. Chest pain or trouble breathing: call 911.\n\n## For you\nCaring for someone is tiring. Take your own breaks, and let other family members share the jobs."};

const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function md(t){
  return t.split(/\n\n+/).map(b=>{
    if(b.startsWith('## ')){const [h,...r]=b.split('\n');return '<h3>'+esc(h.slice(3))+'</h3>'+(r.length?md(r.join('\n')):'');}
    const lines=b.split('\n');
    if(lines.every(l=>l.startsWith('- ')))return '<ul>'+lines.map(l=>'<li>'+esc(l.slice(2))+'</li>').join('')+'</ul>';
    if(lines[0].startsWith('- ')===false && lines.slice(1).length && lines.slice(1).every(l=>l.startsWith('- ')))return '<p>'+esc(lines[0])+'</p><ul>'+lines.slice(1).map(l=>'<li>'+esc(l.slice(2))+'</li>').join('')+'</ul>';
    return '<p>'+esc(b).replace(/\n/g,'<br>')+'</p>';
  }).join('');
}

function player(rid){

function tone(seq){if(!S.fx.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t0=AC.currentTime;seq.forEach(([f,at,dur,vol])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t0+at);g.gain.linearRampToValueAtTime(vol||.08,t0+at+.015);g.gain.exponentialRampToValueAtTime(.0001,t0+at+dur);o.connect(g);g.connect(AC.destination);o.start(t0+at);o.stop(t0+at+dur+.05);});}catch(e){}}
function buzz(p){if(!S.fx.buzz)return;try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
const FX={tap(){buzz(8);tone([[880,0,.05,.025]]);},
  good(){buzz([15,30,15]);tone([[660,0,.12],[880,.08,.16]]);},
  win(){buzz([20,40,20,40,60]);tone([[523,0,.18],[659,.1,.18],[784,.2,.2],[1047,.32,.35,.1]]);},
  soft(){buzz(25);tone([[330,0,.15,.05]]);}};
function burst(x,y,n){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const c=document.getElementById('confetti'),g=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cols=['#6B3F86','#B79BC9','#F5B04A','#2F5D3A','#8DB58F'];
  const P=Array.from({length:n||36},()=>{const a=Math.random()*Math.PI*2,v=3+Math.random()*6;return {x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,r:3+Math.random()*4,c:cols[Math.random()*5|0],life:1}});
  (function t(){g.clearRect(0,0,c.width,c.height);let alive=false;P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.vx*=.97;p.life-=.022;if(p.life>0){alive=true;g.globalAlpha=Math.max(0,p.life);g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill();}});g.globalAlpha=1;if(alive)requestAnimationFrame(t);else g.clearRect(0,0,c.width,c.height);})();}
function burstAt(el,n){const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,n);}
function plus(el,txt){const r=el.getBoundingClientRect(),d=document.createElement('div');d.className='xp';d.textContent=txt;d.style.left=(r.left+r.width/2)+'px';d.style.top=(r.top-6)+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),1000);}
document.addEventListener('pointerdown',e=>{const b=e.target.closest('.btn,.opt,.lrow,.plink,.navbtn,.vplay,.day input');if(b)FX.tap();},{passive:true});
/* ---------- garden: one leaf per step ---------- */
function leafCount(){return doneCount()+Object.values(S.days).filter(Boolean).length}
function leafMax(){return total()+D.weeks.length*7}
function stageOf(n,max){const f=n/max;return f<.12?1:f<.35?2:f<.6?3:f<.88?4:5}
function garden(){
  const n=leafCount(),max=leafMax(),seen=S.seenLeaves||0,st=stageOf(n,max),prev=stageOf(seen,max);
  const imgs=[1,2,3,4,5].map(k=>`<img src="tree/s${k}.jpg" alt="" class="tstage ${k===st?'on':''} ${k===prev&&prev!==st?'was':''}" loading="${k===st?'eager':'lazy'}">`).join('');
  const sprouts=Math.max(0,Math.min(6,n-seen));let sp='';for(let i=0;i<sprouts;i++){const x=34+Math.random()*32,y=18+Math.random()*30;sp+=`<span class="sprout" style="left:${x}%;top:${y}%;animation-delay:${.6+i*.25}s"></span>`;}
  setTimeout(()=>{S.seenLeaves=n;save();},60);
  const msg=n===0?'Every step you take grows a leaf. Let\'s grow the first one.':(n>=max?'Your tree is full. Look at what you grew.':`${max-n} leaves to go. Your tree changes as you reach each new stage.`);
  const pct=Math.round(n/max*100);
  return `<div class="garden"><p class="lbl">Your tree</p><h2>${n} of ${max} leaves</h2><div class="tree" role="img" aria-label="Your tree, stage ${st} of 5, with ${n} of ${max} leaves">${imgs}${sp}</div>
  <div class="tbar" aria-hidden="true"><i style="width:${pct}%"></i>${[12,35,60,88].map(t=>`<b style="left:${t}%" class="${pct>=t?'hit':''}"></b>`).join('')}</div>
  <p class="under" style="margin:6px 0 0">${msg}</p></div>`;
}

    const lf=document.createElement('div');lf.className='leaffly';lf.style.left=x+'px';lf.style.top=y+'px';lf.innerHTML='<svg viewBox="-12 -24 24 26"><defs><linearGradient id="lfg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8FC173"/><stop offset="1" stop-color="#2F6B3A"/></linearGradient></defs><path d="M0 0 C9 -6 10 -16 0 -23 C-10 -16 -9 -6 0 0Z" fill="url(#lfg)"/><path d="M0 -1 L0 -21" stroke="rgba(255,255,255,.55)" stroke-width="1" fill="none"/></svg>';document.body.appendChild(lf);setTimeout(()=>lf.remove(),1400);
  },480);}
