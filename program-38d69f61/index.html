    const rows=Math.max(S.log.length+3,7);
    for(let i=0;i<rows;i++){const r=S.log[i]||{};h+=`<tr><td><input type="date" data-r="${i}" data-k="d" value="${r.d||''}" aria-label="Date"></td><td><input type="number" min="0" max="10" inputmode="numeric" data-r="${i}" data-k="n" value="${r.n??''}" aria-label="Pain number"></td><td><input type="text" data-r="${i}" data-k="t" value="${esc(r.t||'')}" aria-label="Note"></td></tr>`}
    h+=`</tbody></table><p class="saved" id="sv"></p></div>`;
  }
  if(which==='plan'){
    const days=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
    h+=`<h1>My weekly planner</h1><p>Write what you'll do each day: a walk, the chair routine, a warm compress, a rest day. Keep it small. A so-so day is your guide, not your best day.</p><div class="card">`;
    days.forEach(dy=>{h+=`<div class="field"><label for="p-${dy}">${dy}</label><input id="p-${dy}" data-p="${dy}" value="${esc(S.plan[dy]||'')}"></div>`});
    h+=`<p class="saved" id="sv"></p></div>`;
  }
  if(which==='flare'){
    h+=`<h1>My flare-up plan</h1><p>Fill this in on a good day. On a bad day, you won't have to think. Print it and put it on the fridge.</p><div class="card">`;
    T.flare.forEach((f,i)=>{h+=`<div class="field"><label for="f${i}">${esc(f)}</label><textarea id="f${i}" data-f="${i}">${esc(S.flare[i]||'')}</textarea></div>`});
    h+=`<p>On a bad day: do about half as much, use heat or a wrapped cold pack, do the 4-6 breath, and build back up over a few days. Call your doctor if it isn't settling after a week, or today for a hot, very swollen joint, a fall, or new numbness or weakness.</p><p class="saved" id="sv"></p></div>`;
  }
  if(which==='doctor'){
    h+=`<h1>Questions for my doctor</h1><p>Tick the ones you want to ask, and add your own. Bring your pain log and a list of every medicine, cream and supplement you take.</p><div class="card">`;
    T.questions.forEach((q,i)=>{h+=`<label class="day"><input type="checkbox" data-q="${i}" ${S.q[i]?'checked':''}><span>${esc(q)}</span></label>`});
    h+=`<div class="field" style="margin-top:14px"><label for="myq">My own questions</label><textarea id="myq">${esc(S.myq||'')}</textarea></div><p class="saved" id="sv"></p></div>`;
  }
  if(which==='badges'){S.badges=S.badges||{};const got=BADGES.filter(b=>S.badges[b[0]]).length;h+=`<h1>My badges</h1><p>${got} of ${BADGES.length} earned. Every one comes from something real you did for your joints.</p><div class="badges">${BADGES.map(b=>`<div class="badge ${S.badges[b[0]]?'':'locked'}"><div class="ic">${S.badges[b[0]]?b[1]:'?'}</div><b>${esc(b[2])}</b><small>${esc(b[3])}</small></div>`).join('')}</div>`;}
  if(which==='routines'){
    h+=`<h1>Do it with me</h1><p>Press a routine and follow along. A calm voice reads each step and a countdown shows how long to keep going. Pause any time, and skip anything that hurts.</p>`;
    D.routines.forEach(r=>{h+=`<button class="lrow" data-rt="${r.id}" type="button"><span class="tick" aria-hidden="true">▶</span><span>${esc(r.name)}<small>${esc(r.where)} · ${r.steps.length} steps</small></span></button>`});
  }
  if(which==='checks'){
    const cols=[['start','Start'],['w4','Week 4'],['w8','Week 8']];
    h+=`<h1>My progress checks</h1><p>Do these three times: now, at the end of week 4 and at the end of week 8. They take about three minutes. Don't push to get a better number. Just notice where you are.</p><div class="card"><table class="tests"><thead><tr><th>Check</th>${cols.map(c=>'<th>'+c[1]+'</th>').join('')}</tr></thead><tbody>`;
    D.tests.forEach(t=>{h+=`<tr><td><b>${esc(t.label)}</b><br><small style="color:var(--soft)">${esc(t.help)}</small></td>${cols.map(c=>`<td><input type="number" min="0" inputmode="numeric" data-tc="${c[0]}" data-tt="${t.id}" value="${((S.tests||{})[c[0]]||{})[t.id]??''}" aria-label="${esc(t.label)}, ${c[1]}" placeholder="${esc(t.unit)}"></td>`).join('')}</tr>`});
    h+=`</tbody></table><p class="saved" id="sv"></p></div><p>Every move in the sit-to-stand check can be done with your hands on the armrests. Stop if anything feels sharp.</p>`;
  }
  if(which==='report'){
    const t=S.tests||{},nm=S.name||'';const avg=a=>a.length?(a.reduce((x,y)=>x+y,0)/a.length).toFixed(1):'–';
    const nums=(S.log||[]).filter(r=>r&&r.n!==''&&r.n!==undefined).map(r=>+r.n);const first=nums.slice(0,7),last=nums.length>7?nums.slice(-7):[];
    h+=`<h1>My report for the doctor</h1><div class="field noprint"><label for="nm">My name</label><input id="nm" value="${esc(nm)}"></div><div class="card">
    <h2>${esc(nm||'My')} progress, The Hinge Care Program</h2><p>Level: ${S.track?esc(D.tracks[S.track].name):'not set'} · Focus: ${esc(S.focus||'not set')} · Lessons done: ${doneCount()} of ${total()}</p>
    <table class="tests"><thead><tr><th>Check</th><th>Start</th><th>Week 4</th><th>Week 8</th></tr></thead><tbody>${D.tests.map(x=>`<tr><td>${esc(x.label)} (${esc(x.unit)})</td><td>${(t.start||{})[x.id]??'–'}</td><td>${(t.w4||{})[x.id]??'–'}</td><td>${(t.w8||{})[x.id]??'–'}</td></tr>`).join('')}</tbody></table>
    <p style="margin-top:14px"><b>Pain log:</b> average ${avg(first)} in the first week of entries${last.length?`, ${avg(last)} in the most recent week`:''}.</p>
    <h3>Weekly notes</h3>${Object.keys(S.ci||{}).length?Object.entries(S.ci).map(([n,c])=>`<p><b>Week ${n}:</b> ${esc(c[0]||'')} ${c[1]?' · Hard: '+esc(c[1]):''}</p>`).join(''):'<p>No check-ins yet.</p>'}
    <h3>Questions I want to ask</h3><ul>${D.toolkit.questions.filter((q,i)=>S.q[i]).map(q=>'<li>'+esc(q)+'</li>').join('')}${S.myq?'<li>'+esc(S.myq)+'</li>':''}</ul>
    <p class="under">Made with The Hinge Care Program. General wellness information, not a medical record.</p></div>`;
  }
  if(which==='calendar'){
    h+=`<h1>My 8-week wall calendar</h1><p>Print this and put it somewhere you'll see it every morning. Tick each day's small step.</p><div class="card"><table class="cal"><thead><tr><th>Week</th>${[1,2,3,4,5,6,7].map(d=>'<th>Day '+d+'</th>').join('')}</tr></thead><tbody>${D.weeks.map(w=>`<tr><th>${w.n}<br>${esc(w.name)}</th>${w.days.map(d=>'<td>☐ '+esc(d)+'</td>').join('')}</tr>`).join('')}</tbody></table></div>`;
  }
  if(which==='fridge'){
    h+=`<h1>Fridge card</h1><div class="fridge"><h2>My joint-care rules</h2><ul>${D.toolkit.safety.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul><p><b>On a bad day:</b> half as much, heat or a wrapped cold pack, the 4-6 breath, then build back up.</p></div>`;
  }
  if(which==='family'){h+=`<h1>For family members</h1><div class="body">${md(D.family)}</div>`;}
  if(which==='cert'){
    const all=ALL.every(a=>S.done[a.id]);
    h+=`<h1>My certificate</h1>`+(all?`<div class="cert"><p>This certifies that</p><div class="nm">${esc(S.name||'Your name')}</div><h1>finished The Hinge Care Program</h1><p>Eight weeks of small steps for kinder mornings.</p><p class="under">${new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})} · Hinge Care</p></div><div class="field noprint" style="margin-top:14px"><label for="nm">Name on the certificate</label><input id="nm" value="${esc(S.name||'')}"></div>`:`<div class="card soft"><p style="margin:0">Your certificate appears here when you finish all ${total()} lessons. You've done ${doneCount()} so far. Keep going, one small step at a time.</p></div>`);
  }
  h+=`<div class="nav2"><button class="btn ghost" type="button" onclick="window.print()">Print this page</button><button class="btn" id="back" type="button">Back to my weeks</button></div><p class="disc">${esc(D.disclaimer)}</p></div>`;
  app.innerHTML=h;window.scrollTo(0,0);
  const sv=()=>{save();const e=document.getElementById('sv');if(e){e.textContent='Saved on this device.';}};
  app.querySelectorAll('[data-r]').forEach(i=>i.oninput=()=>{const r=+i.dataset.r;S.log[r]=S.log[r]||{};S.log[r][i.dataset.k]=i.value;sv();});
  app.querySelectorAll('[data-p]').forEach(i=>i.oninput=()=>{S.plan[i.dataset.p]=i.value;sv();});
  app.querySelectorAll('[data-f]').forEach(i=>i.oninput=()=>{S.flare[i.dataset.f]=i.value;sv();});
  app.querySelectorAll('[data-q]').forEach(i=>i.onchange=()=>{S.q[i.dataset.q]=i.checked;sv();});
  const mq=document.getElementById('myq');if(mq)mq.oninput=()=>{S.myq=mq.value;sv();};
  app.querySelectorAll('[data-tc]').forEach(i=>i.oninput=()=>{S.tests=S.tests||{};S.tests[i.dataset.tc]=S.tests[i.dataset.tc]||{};S.tests[i.dataset.tc][i.dataset.tt]=i.value;sv();});
  app.querySelectorAll('[data-rt]').forEach(b=>b.onclick=()=>player(b.dataset.rt));
  const nmi=document.getElementById('nm');if(nmi)nmi.onchange=()=>{S.name=nmi.value;save();toolkit(which);};
  bindSizer();document.getElementById('back').onclick=home;
}
document.getElementById('menuBtn').onclick=openMenu;
document.getElementById('menuClose').onclick=closeMenu;
document.getElementById('shade').onclick=closeMenu;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu();});
document.querySelector('header.top .brand').style.cursor='pointer';document.querySelector('header.top .brand').onclick=home;

/* crossfade between screens */
(function(){
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;let busy=0;
function ghost(){if(RM||!app.firstElementChild)return;const g=app.cloneNode(true);g.removeAttribute('id');g.className='vghost';g.setAttribute('aria-hidden','true');
 g.querySelectorAll('[id]').forEach(e=>e.removeAttribute('id'));g.querySelectorAll('iframe,video,audio,canvas').forEach(e=>e.remove());
 g.style.top=(-window.scrollY)+'px';const w=!!g.querySelector('.welcome');if(w)g.classList.add('rollup');document.body.appendChild(g);setTimeout(()=>g.remove(),w?900:450);}
function wrap(f){return function(){if(busy)return f.apply(this,arguments);busy=1;try{ghost();const r=f.apply(this,arguments);app.classList.remove('enter');void app.offsetWidth;app.classList.add('enter');return r;}finally{busy=0}}}
welcome=wrap(welcome);overview=wrap(overview);home=wrap(home);lesson=wrap(lesson);toolkit=wrap(toolkit);planPage=wrap(planPage);player=wrap(player);startCheck=wrap(startCheck);
swap=function(fn){fn()};
document.querySelector('header.top .brand').onclick=()=>home();
})();
welcome();
</script>

<script>
(function(){
  const DESK=matchMedia('(min-width:1100px)');
  let CUR=null;
  const _open=openMenu,_close=closeMenu,_lesson=lesson;
  function sideTop(){
    const d=doneCount(),t=total(),pct=Math.round(d/t*100),nx=nextId();
    const lab=nx?(nx==='welcome'?'Start here':'Carry on: '+find(nx).l.title):'Look back over your eight weeks';
    return `<div class="sidetop"><p class="sp">${d} of ${t} lessons done · ${pct}%</p><div class="bar2"><i style="width:${pct}%"></i></div><button class="btn" id="sideGo" type="button">${esc(lab)}</button></div>`;
  }
  function renderSide(){
    if(!DESK.matches||document.body.dataset.view==='welcome')return;
    const ae=document.activeElement;
    if(CUR){const f=find(CUR);if(f&&f.w){S.mopen=S.mopen||{};S.mopen['w'+f.w.n]=true;}}
    _open();
    document.getElementById('shade').classList.remove('on');
    const pl=document.getElementById('plist');
    pl.insertAdjacentHTML('afterbegin',sideTop());
    const h2=document.querySelector('.phead h2');if(h2)h2.textContent='The Hinge Care Program';
    const g=document.getElementById('sideGo');if(g)g.onclick=()=>{const nx=nextId();nx?swap(()=>lesson(nx)):home();};
    pl.querySelectorAll('.plink').forEach(b=>b.classList.toggle('cur',!!CUR&&b.dataset.l===CUR&&document.body.dataset.view==='lesson'));
    const cur=pl.querySelector('.plink.cur');if(cur)cur.scrollIntoView({block:'nearest'});
    if(ae&&ae!==document.body&&!document.getElementById('panel').contains(ae))ae.focus({preventScroll:true});else if(document.activeElement&&document.getElementById('panel').contains(document.activeElement))document.activeElement.blur();
  }
  openMenu=function(){ if(DESK.matches&&document.body.dataset.view!=='welcome'){renderSide();return;} _open(); };
  closeMenu=function(){ if(DESK.matches&&document.body.dataset.view!=='welcome')return; _close(); };
  lesson=function(id){
    CUR=id;_lesson(id);
    const idx=ALL.findIndex(a=>a.id===id),w=document.querySelector('#app>div.wrap');if(!w)return;
    const n=idx+1,t=ALL.length,prev=ALL[idx-1],next=ALL[idx+1];
    const cr=w.querySelector('.crumb');
    if(cr)cr.insertAdjacentHTML('afterend',`<div class="lprog" aria-label="Lesson ${n} of ${t}"><span>${n} of ${t} in the Program</span><span class="bar2"><i style="width:${Math.round(n/t*100)}%"></i></span></div>`);
    S.notes=S.notes||{};
    const nav=w.querySelector('.nav2:last-of-type');
    const ttl=a=>{if(!a)return '';const f=find(a.id);return f&&f.l?f.l.title:''};
    const notes=`<div class="notes noprint"><h3>Your notes</h3><p>What did you notice today? Only you can see this. It stays on this device.</p><textarea id="lnote" aria-label="Your notes for this lesson" placeholder="For example: knees felt looser after the warm shower.">${esc(S.notes[id]||'')}</textarea><small id="lnsaved" aria-live="polite"></small></div>`;
    const pn=`<div class="pnav noprint"><button type="button" id="pvB" ${prev?'':'disabled'}><small>‹ Previous lesson</small><b>${esc(ttl(prev))}</b></button><button type="button" class="nx" id="nxB" ${next?'':'disabled'}><small>Next lesson ›</small><b>${esc(ttl(next))}</b></button></div><p class="kbd">Tip: use the ← and → keys to move between lessons.</p>`;
    const navs=w.querySelectorAll('.nav2');const last=navs[navs.length-1];
    if(last){last.insertAdjacentHTML('beforebegin',notes);last.insertAdjacentHTML('afterend',pn);}
    const ta=document.getElementById('lnote');let tm;
    if(ta)ta.oninput=()=>{clearTimeout(tm);tm=setTimeout(()=>{S.notes[id]=ta.value;save();const sv=document.getElementById('lnsaved');if(sv)sv.textContent='Saved';},400);};
    const pv=document.getElementById('pvB'),nb=document.getElementById('nxB');
    if(pv&&prev)pv.onclick=()=>swap(()=>lesson(prev.id));
    if(nb&&next)nb.onclick=()=>swap(()=>lesson(next.id));
    renderSide();
  };
  addEventListener('keydown',e=>{
    if(!DESK.matches||document.body.dataset.view!=='lesson'||!CUR)return;
    if(/INPUT|TEXTAREA|SELECT/.test((e.target.tagName||''))||e.metaKey||e.ctrlKey||e.altKey)return;
    const idx=ALL.findIndex(a=>a.id===CUR);
    if(e.key==='ArrowRight'&&ALL[idx+1]){e.preventDefault();swap(()=>lesson(ALL[idx+1].id));}
    if(e.key==='ArrowLeft'&&ALL[idx-1]){e.preventDefault();swap(()=>lesson(ALL[idx-1].id));}
  });
  new MutationObserver(()=>{if(document.body.dataset.view!=='lesson')CUR=null;renderSide();}).observe(document.getElementById('app'),{childList:true});
  DESK.addEventListener('change',()=>{if(DESK.matches)renderSide();else _close();});
  renderSide();
})();
</script>

<script>
(function(){
  const T={w1c:['The Warm-First Rule','Warm a joint before you ask it to move.'],
    w2a:['The Two-Hour Test','Write your pain number before an activity and again two hours later.'],
    w3b:['The Quiet Twenty','Twenty calm minutes with one comfort, nothing else.'],
    w4a:['The One-Color Rule','Add one color to one meal. Take nothing away.'],
    w5c:['The Kettle Balance','Practice balance while the kettle boils, one hand on the counter.'],
    w6a:['Half, Rest, Half','Cut a hard job in two and rest in the middle.'],
    w7b:['The 4-6 Breath','Breathe in for 4, out for 6, five times.'],
    w8a:['The Fridge Plan','Your flare-up plan, printed and on the fridge before you need it.']};
  window.HINGE_EIGHT=T;
  const _l=lesson;
  lesson=function(id){_l(id);const t=T[id];if(!t)return;const h=document.querySelector('#app>div.wrap h1');if(h)h.insertAdjacentHTML('beforebegin',`<span class="tech" title="${esc(t[1])}">Hinge Eight · <b>${esc(t[0])}</b></span>`);};
  const _o=overview;
  overview=function(){_o();const w=document.querySelector('#app .ov');if(!w)return;const hs=[...w.querySelectorAll('h2')];const at=hs[1]||hs[0];
    const items=Object.entries(T).map(([id,[n,d]])=>{const f=find(id);return `<li><b>${esc(n)}</b>: ${esc(d)} <small style="color:var(--soft)">(Week ${f&&f.w?f.w.n:''})</small></li>`}).join('');
    const box=`<div class="eight"><h2 style="margin-top:0">The Hinge Eight</h2><p>One small move from each week, with a name so it's easy to remember. Keep the ones that help you and let the rest go.</p><ol>${items}</ol></div>`;
    if(at)at.insertAdjacentHTML('beforebegin',box);else w.insertAdjacentHTML('beforeend',box);};
})();
</script>
