<style>
:root{--navy:#143D2B;--blue:#2F6B4F;--sea:#2F6B4F;--gold:#FFC56B;--ink:#143D2B;--text:#2E3B33;--soft:#5F6F64;--line:#D9DDC9;--bg:#F6F3E8;--card:#FFFFFF}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:400 19px/1.65 Inter,system-ui,-apple-system,Segoe UI,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:Lora,Georgia,serif;color:var(--ink);line-height:1.2;margin:0 0 12px}
h1{font-size:clamp(30px,5vw,42px)}h2{font-size:clamp(24px,3.6vw,30px)}h3{font-size:22px;margin-top:26px}
p{margin:0 0 14px}a{color:var(--blue)}ul,ol{padding-left:24px;margin:0 0 14px}li{margin-bottom:8px}
.bar{background:var(--navy);color:#fff}
.bar-in{max-width:860px;margin:0 auto;padding:10px 18px;min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none;font:800 20px/1.1 Inter,system-ui,sans-serif}
.brand small{display:block;font:500 14px/1.3 Inter,system-ui,sans-serif;color:#D5E3D6;margin-top:3px}
.menu-btn{font:700 18px/1 Inter,system-ui,sans-serif;color:var(--navy);background:var(--gold);border:0;border-radius:999px;padding:14px 22px;cursor:pointer}
.tabs{background:var(--navy);border-top:1px solid rgba(255,255,255,.14)}
.tabs-in{max-width:860px;margin:0 auto;padding:0 10px;display:flex;gap:2px;overflow-x:auto}
.tabs a{flex:1 0 auto;text-align:center;color:#E1EBDF;text-decoration:none;font:700 17px/1 Inter,system-ui,sans-serif;padding:16px 14px;border-bottom:4px solid transparent;white-space:nowrap}
.tabs a.on{color:var(--gold);border-bottom-color:var(--gold)}
main{max-width:760px;margin:0 auto;padding:26px 18px 90px}
.eyebrow{display:block;font:800 14px/1.3 Inter,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin-bottom:10px}
.lead{font-size:21px;color:var(--text)}
.sheet{background:var(--card);border-radius:22px;padding:clamp(22px,4vw,36px);margin-bottom:18px;box-shadow:0 14px 34px -26px rgba(20,61,43,.5)}
.sheet>section+section{margin-top:30px;padding-top:28px;border-top:1px solid var(--line)}
.heart{font:italic 500 21px/1.6 Lora,Georgia,serif;color:var(--ink)}
.big{background:var(--navy);color:#fff;border-radius:18px;padding:24px}
.big .eyebrow{color:var(--gold)}.big p{font:600 23px/1.4 Lora,Georgia,serif;margin:0;color:#fff}
.try{background:#FFF1D6;border-left:6px solid var(--gold);border-radius:14px;padding:22px}
.try .eyebrow{color:#8A5A0A}.try p{margin:0;font-size:20px;color:var(--ink)}
.acro{display:grid;gap:10px;margin-top:14px}
.acro div{display:flex;gap:14px;align-items:flex-start}
.acro>div>b{flex:none;width:42px;height:42px;border-radius:12px;background:var(--blue);color:#fff;font:700 22px/42px Lora,Georgia,serif;text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:800 20px/1.2 Inter,system-ui,sans-serif;color:var(--navy);background:linear-gradient(180deg,#FFD88F,#FFC56B);border:0;border-radius:16px;padding:18px 26px;min-height:60px;text-decoration:none;cursor:pointer;box-shadow:0 4px 0 #D69A2E}
.btn.alt{background:#fff;color:var(--blue);box-shadow:inset 0 0 0 2px var(--blue)}
.btn.wide{width:100%}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:16px}
.note{font-size:16px;color:var(--soft)}
.meter{height:14px;border-radius:999px;background:#D9DDC9;overflow:hidden;margin:14px 0 8px}
.meter b{display:block;height:100%;background:linear-gradient(90deg,#2F6B4F,#4E9A72);border-radius:999px;transition:width .5s}
.part{margin-top:30px}
.part h2{margin-bottom:4px}.part>p{color:var(--soft);margin-bottom:12px}
.step{display:flex;align-items:center;gap:14px;background:#fff;border-radius:16px;padding:16px 18px;margin-bottom:10px;text-decoration:none;color:var(--ink);box-shadow:0 10px 24px -22px rgba(20,61,43,.6)}
.step .num{flex:none;width:44px;height:44px;border-radius:50%;background:#E3EADB;color:var(--blue);font:800 18px/44px Inter,system-ui,sans-serif;text-align:center}
.step b{display:block;font:700 20px/1.25 Lora,Georgia,serif}
.step small{display:block;font-size:16px;color:var(--soft);margin-top:2px}
.step .go{margin-left:auto;flex:none;font:800 15px/1 Inter,system-ui,sans-serif;color:var(--blue)}
.step.done .num{background:#1F8A5B;color:#fff}
.step.next{box-shadow:0 0 0 3px var(--gold),0 10px 24px -18px rgba(20,61,43,.6)}
.step.next .num{background:var(--gold);color:var(--navy)}
.step.lock{background:transparent;box-shadow:none;border:2px dashed #C9D2BD;color:var(--soft)}
.step.lock .num{background:#E3E6D6;color:#7C8A7E}.step.lock b{color:#5F6F64}.step.lock .go{color:#7C8A7E}
.video{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#0C2419;margin:12px 0}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.play{position:absolute;inset:0;width:100%;border:0;cursor:pointer;color:#fff;font:800 20px/1.2 Inter,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at 50% 40%,#2F6B4F,#143D2B)}
.play i{width:84px;height:84px;border-radius:50%;background:var(--gold);position:relative;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.play i::after{content:"";position:absolute;left:33px;top:24px;border-left:28px solid var(--navy);border-top:18px solid transparent;border-bottom:18px solid transparent}
.quiz button{display:block;width:100%;text-align:left;font:600 19px/1.4 Inter,system-ui,sans-serif;color:var(--ink);background:#EEF1E4;border:2px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:10px;cursor:pointer}
.quiz button.right{background:#E3F5EC;border-color:#1F8A5B}.quiz button.wrong{background:#FDECEC;border-color:#D46A6A}
.fb{font-weight:700;color:var(--ink);min-height:1.6em}
.tablewrap{overflow-x:auto;margin:10px 0}table{border-collapse:collapse;width:100%;font-size:17px}th,td{border:1px solid var(--line);padding:12px;text-align:left;vertical-align:top}th{background:#EEF1E4;color:var(--ink)}
.checks label{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}.checks input{width:24px;height:24px;flex:none;margin-top:3px;accent-color:var(--blue)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.stat{background:#EEF1E4;border-radius:14px;padding:16px;font-size:17px}.stat b{display:block;font:700 26px/1.2 Lora,Georgia,serif;color:var(--blue);margin-bottom:4px}
.chart text{font:600 14px Inter,system-ui,sans-serif;fill:#143D2B}
input[type=range]{width:100%;height:36px;accent-color:var(--blue)}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:14px}.bars i{flex:1;background:var(--blue);border-radius:6px 6px 0 0;min-width:8px}
.starcount{font:700 30px/1 Lora,Georgia,serif;color:#B5791A}
.badges{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.badge{width:74px;text-align:center;text-decoration:none;color:var(--soft);font-size:13px;opacity:.55}
.badge b{display:block;width:54px;height:54px;margin:0 auto 4px;border-radius:50%;background:#E3E6D6;color:#7C8A7E;font:700 22px/54px Lora,Georgia,serif}
.badge.lit{opacity:1;color:var(--ink)}.badge.lit b{background:var(--gold);color:var(--navy)}
.safety{font-size:17px;color:var(--soft)}
.shade{position:fixed;inset:0;background:rgba(12,36,25,.6);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(92vw,420px);z-index:41;background:var(--navy);color:#fff;overflow-y:auto;padding:22px 22px 40px;transform:translateX(102%);visibility:hidden;transition:transform .3s}
.menu-open .shade{opacity:1;pointer-events:auto}.menu-open .panel{transform:none;visibility:visible}
.panel h2{color:#fff;font-size:26px;margin:0}.panel h3{color:var(--gold);font:800 14px/1.3 Inter,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;margin:24px 0 6px}
.panel a{display:flex;gap:12px;align-items:center;color:#fff;text-decoration:none;font:600 19px/1.3 Inter,system-ui,sans-serif;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.14)}
.panel a span{flex:none;width:28px;text-align:center;color:var(--gold)}
.panel a.lock{color:#A9BFAE}.panel a.on{color:var(--gold)}
.panel .close{float:right;font:700 17px/1 Inter,system-ui,sans-serif;color:#fff;background:rgba(255,255,255,.14);border:0;border-radius:999px;padding:12px 18px;cursor:pointer}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,180%);background:var(--navy);color:#fff;border-radius:18px;padding:16px 22px;display:flex;gap:14px;align-items:center;max-width:min(92vw,520px);box-shadow:0 14px 40px rgba(0,0,0,.4);transition:transform .4s;z-index:61}
#toast.show{transform:translate(-50%,0)}#toast b{color:var(--gold);font-size:20px;white-space:nowrap}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
@media (max-width:560px){body{font-size:18px}.brand small{display:none}.step .go{display:none}.btn{width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

main{zoom:var(--z,1)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.tools span{font:700 15px/1 Inter,system-ui,sans-serif;color:var(--soft);margin-right:2px}
.tools button{font:700 16px/1 Inter,system-ui,sans-serif;color:var(--blue);background:#fff;border:2px solid var(--line);border-radius:999px;padding:11px 16px;min-height:44px;cursor:pointer}
.photo{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:16px;margin:16px 0 4px}
.why{background:#EEF1E4;border-radius:14px;padding:16px 18px;font-size:17px;margin-top:18px}
.kind{background:linear-gradient(135deg,#1F5239,#143D2B);color:#fff;border-radius:22px;padding:24px;margin-bottom:18px}
.kind .eyebrow{color:var(--gold)}.kind p{font:italic 500 21px/1.5 Lora,Georgia,serif;margin:0;color:#fff}
.field{font:inherit;padding:14px;border:2px solid var(--line);border-radius:12px;width:100%;margin:6px 0 12px;color:var(--ink)}
.breath{display:flex;flex-direction:column;align-items:center;gap:18px;padding:10px 0}
.breath i{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#9CCBAF,#2F6B4F);transform:scale(.6);transition:transform 4s ease-in-out;box-shadow:0 0 0 14px rgba(47,107,79,.12)}
.breath i.in{transform:scale(1)}.breath i.out{transform:scale(.6);transition-duration:6s}
.breath b{font:700 26px/1.2 Lora,Georgia,serif;color:var(--ink);min-height:32px}
.clock{font:700 64px/1 Lora,Georgia,serif;color:var(--ink);text-align:center;margin:8px 0 14px;font-variant-numeric:tabular-nums}
.cert{border:6px double #B5791A;border-radius:18px;padding:34px 22px;text-align:center;background:#FFFDF7}
.cert h2{font-size:34px}.cert .who{font:italic 600 34px/1.2 Lora,Georgia,serif;color:var(--blue);margin:14px 0;min-height:42px}
@media print{.bar,.tabs,.tools,.panel,.shade,.video,.btn,.quiz,#toast,#confetti,.noprint{display:none!important}body{background:#fff}main{zoom:1;padding:0}.sheet{box-shadow:none;padding:0}}

/* ===== v3: green, calm, fewer boxes ===== */
body{background:#F6F3E8}
.tabs{display:none}
.bar{position:relative;z-index:5}
.is-cover .bar{display:none}
.leafband{height:150px;background:linear-gradient(180deg,rgba(20,61,43,.35),rgba(246,243,232,0) 55%,#F6F3E8 100%),var(--leaf) center 35%/cover,linear-gradient(120deg,#1F5239,#2F6B4F 50%,#7FA98B)}
.is-cover .leafband{display:none}
main{margin-top:-18px;position:relative;padding-top:0}
.is-cover main{max-width:none;margin:0;padding:0}
.cover{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:40px 22px;text-align:center;color:#fff;background:linear-gradient(180deg,rgba(12,36,25,.55),rgba(12,36,25,.78)),var(--leaf) center/cover,linear-gradient(140deg,#143D2B,#2F6B4F 60%,#7FA98B)}
.cover-in{max-width:560px}
.cover h1{color:#fff;font-size:clamp(34px,6vw,50px);margin:6px 0 18px}
.cover p{font-size:21px;color:#EEF4EC;margin-bottom:30px}
.cover .script{font:400 clamp(40px,7vw,56px)/1.2 'Pinyon Script','Great Vibes','Brush Script MT',cursive;color:#FFD48A;margin:14px 0 0}
.page{background:none}
.page>h2{margin-top:34px}
.sheet{background:none;box-shadow:none;padding:0;border-radius:0;margin-bottom:0}
.sheet>section+section{margin-top:30px;padding-top:28px;border-top:1px solid var(--line)}
.sheet>section.big,.sheet>section.try{border-top:0}
.big{background:none;color:inherit;border-radius:0;padding:4px 0 4px 22px;border-left:5px solid var(--gold)}
.big .eyebrow{color:var(--blue)}.big p{color:var(--ink);font-size:25px}
.try{background:#FFF1D6;border-left:0;border-radius:18px;padding:24px}
.kindline{font:italic 500 22px/1.5 Lora,Georgia,serif;color:var(--ink);border-left:5px solid var(--gold);padding-left:18px;margin:18px 0 22px}
.fold{border-top:1px solid var(--line)}
.fold:last-of-type{border-bottom:1px solid var(--line)}
.fold summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:14px;padding:22px 44px 22px 0;position:relative}
.fold summary::-webkit-details-marker{display:none}
.fold summary::after{content:"";position:absolute;right:8px;top:50%;width:13px;height:13px;border-right:3px solid var(--blue);border-bottom:3px solid var(--blue);transform:translateY(-70%) rotate(45deg);transition:transform .2s}
.fold[open] summary::after{transform:translateY(-30%) rotate(-135deg)}
.fold summary b{display:block;font:700 24px/1.25 Lora,Georgia,serif;color:var(--ink)}
.fold summary small{display:block;font-size:17px;color:var(--soft);margin-top:3px}
.fold summary em{margin-left:auto;flex:none;font:700 15px/1 Inter,system-ui,sans-serif;font-style:normal;color:var(--blue);background:#E3EADB;border-radius:999px;padding:8px 12px}
.fold-in{padding:0 0 18px}
.step{background:none;box-shadow:none;border-radius:0;padding:14px 0;margin:0;border-top:1px dashed var(--line)}
.step.next{box-shadow:none}.step.next b{color:var(--blue)}
.step.lock{background:none;border:0;border-top:1px dashed var(--line)}
.foot{margin-top:30px;font-weight:700}
.tools{margin:0 0 18px}
.sizer{display:flex;gap:10px;padding:8px 0 14px}
.sizer button{font:800 20px/1 Inter,system-ui,sans-serif;color:#fff;background:rgba(255,255,255,.14);border:0;border-radius:12px;padding:14px 22px;cursor:pointer}
.why,.stat{background:#EEF1E4}
:root{--leaf:url('https://d8j0ntlcm91z4.cloudfront.net/user_3LEItPPXyE9nIyHVmOAD1tXaTYL/hf_20261113_003550_310dd78a-06fc-4782-894c-1e428ed4de66.png')}
</style>

const W=[
{id:'week-0',n:'★',nav:'Welcome',title:'Welcome. We’re so glad you found us.',
 hug:`Living with sore joints is hard. Some days it can feel like your body is not on your side, and like nobody quite understands. We do. You are not broken, and you are not alone: about 1 in 5 adults lives with arthritis. From here on, we walk beside you, one small step at a time.`,
 big:`You do not have to fix everything. You only have to do one small thing today.`,
 acro:['START','How to use this course',[['S','<b>Small steps.</b> Each lesson has one big idea and one tiny action.'],['T','<b>Ten minutes.</b> That is all a lesson asks of you.'],['A','<b>Ask your doctor.</b> Tell them you are starting. Bring the question sheet from the Toolkit.'],['R','<b>Rate your day.</b> Use the feelings slider on the My progress page.'],['T','<b>Tick it off.</b> Press “I did it” to open your next lesson.']]],
 body:`<h3>A promise from us</h3><p>We will never rush you, scold you, or ask you to push through bad pain. If a day goes badly, the course will still be here tomorrow, and so will we.</p><h3>Is this course right for me?</h3><p>Yes, if you have osteoarthritis or everyday joint pain in your knees, hips, hands or back, and you want to feel and move better.</p><p>If you have rheumatoid arthritis, psoriatic arthritis, gout or lupus, you can still use these habits. You also need medicine from your doctor to protect your joints. Please keep taking it.</p>`,
 doit:`Write down one thing you miss doing. Gardening? Playing on the floor with a grandchild? Walking to the mailbox without stopping? That is your <b>“why.”</b> Keep it where you can see it.`,
 q:['What does this course ask you to do each day?',['Fix everything at once','One small thing','Push through bad pain'],1,'One small thing, done often, beats one big thing done once.']},
{id:'encourage',n:'♥',nav:'A word of encouragement',title:'Before we begin: you can do this',
 hug:`Maybe you have tried things before and they did not last. Maybe you are tired of hoping. That is okay. You do not need to feel brave today. You only need to be here, and you already are.`,
 big:`You are not starting from zero. You are starting from everything you have already lived through.`,
 acro:['KIND','Four promises to make to yourself',[['K','<b>Keep it small.</b> A tiny step you finish beats a big plan you dread.'],['I','<b>It is okay to rest.</b> Rest is part of the plan. It is not failing.'],['N','<b>No comparing.</b> Not with others, and not with who you were at 30.'],['D','<b>Do it your way.</b> Slow counts. Sitting down counts. Starting again counts.']]],
 body:`<h3>What to expect</h3><p>Some days will feel good. Some will not. Both are normal, and both are part of getting better. We will never ask you to push through bad pain.</p><h3>How the course is laid out</h3><ul><li><b>Start here</b> is three short visits. No work yet.</li><li><b>Part 1</b> gives you two easy wins.</li><li><b>Part 2</b> builds a little more each week.</li><li><b>Part 3</b> takes on the bigger things, like sleep and hard days.</li></ul><p>Each lesson opens the next one, so you always know what to do.</p>`,
 doit:`Say this out loud, or write it down: “I am allowed to go slowly.”`,
 q:['What counts as a win in this course?',['Only big changes','Any small step you finish','Never having a bad day'],1,'Yes. Small steps you finish are what change things.']},
{id:'mindset',n:'✦',nav:'Your mindset',title:'Your mindset: how you think about pain matters',
 hug:`When something hurts for a long time, it is easy to start bracing for it. To think, “this is just my life now.” Those thoughts make sense. They also make hard days heavier than they need to be.`,
 big:`You cannot always choose how your joints feel. You can choose what you say to yourself about it, and that changes more than you might think.`,
 acro:['HOPE','Four thoughts to practice',[['H','<b>Hurt is a message, not a verdict.</b> It tells you about today. It does not decide tomorrow.'],['O','<b>One day at a time.</b> You only have to handle this one.'],['P','<b>Progress over perfect.</b> A little better is still better.'],['E','<b>Expect ups and downs.</b> A dip is not the end of the road.']]],
 body:`<h3>Swap the thought</h3><div class="tablewrap"><table><tr><th>When you catch yourself thinking</th><th>Try this</th></tr><tr><td>“I can’t do anything anymore.”</td><td>“I can still do some things. I will start with one.”</td></tr><tr><td>“It’s only going to get worse.”</td><td>“Many people feel better with the right habits. I am learning them.”</td></tr><tr><td>“I had a bad day. I’ve ruined it.”</td><td>“One bad day does not undo my good ones.”</td></tr></table></div><h3>Why this comes first</h3><p>Pain is felt in the body and shaped in the brain. Worry and fear can turn the volume up. Calm and confidence can turn it down. That is why we start here, before a single exercise.</p>`,
 doit:`Pick one swap from the table above. The next time the old thought shows up, try the new one.`,
 q:['A bad day in the middle of a good week means…',['You are back at the start','It is a dip, and dips pass','You should give up'],1,'Right. Ups and downs are part of the road.']},
{id:'know',n:'K',nav:'Know your arthritis',title:'Know your arthritis',
 hug:`Not all arthritis is the same. Finding out which kind is yours is one of the most caring things you can do for your joints, because each kind needs something a little different.`,
 big:`If you don’t have a diagnosis yet, that isn’t a failing. It is simply the first step, and taking it is an act of care for yourself.`,
 body:`<h3>The three most common kinds</h3><div class="tablewrap"><table><tr><th>Kind</th><th>What is happening</th><th>How it tends to feel</th></tr>
 <tr><td><b>Osteoarthritis</b></td><td>Slow wear and repair of the cushion in the joint. Most often knees, hips, hands and spine.</td><td>Stiffness that eases within about half an hour of getting up. Pain that builds with use.</td></tr>
 <tr><td><b>Rheumatoid arthritis</b></td><td>The body’s defence system attacks the joint lining, often in both hands or both feet.</td><td>Morning stiffness lasting more than an hour. Warm, swollen joints on both sides. Deep tiredness.</td></tr>
 <tr><td><b>Gout</b></td><td>Tiny crystals form in a joint, often the big toe.</td><td>One joint turns hot, red and very tender, often overnight, then settles over days.</td></tr></table></div>
 <h3>What keeps each one in check</h3><ul><li><b>Osteoarthritis:</b> movement, a lighter load, pain relief, and sometimes a new joint.</li><li><b>Rheumatoid arthritis:</b> prescription medicine, started early. This is what protects your joints from lasting damage.</li><li><b>Gout:</b> medicine that lowers uric acid, plus changes to food and alcohol.</li></ul>
 <p>If yours is rheumatoid arthritis, please hold on to this: your medicine protects your joints. Let everything in this course comfort you alongside it.</p>`,
 doit:`Write down which kind you have. If you are not sure, write this on your list for the doctor: “Which type of arthritis do I have, and how sure are we?”`,
 q:['Morning stiffness that lasts more than an hour, in both hands, sounds most like…',['Osteoarthritis','Rheumatoid arthritis','A pulled muscle'],1,'Yes. That pattern is worth showing a doctor soon, because early treatment protects joints.']},
{id:'story',n:'♥',nav:'Barbara’s story and her nine habits',title:'Where these remedies come from',
 hug:`Many of the comforts in this course, like ginger poultices, castor oil compresses and hot and cold water, were made popular by the natural-health speaker Barbara O’Neill. Her story is worth knowing, and so is the honest truth about what holds up.`,
 big:`You are not being asked to choose between natural care and medical care. The best results come from both.`,
 body:`<h3>The daughter in the story</h3><p>Barbara was in her early twenties when she watched her mother lose the use of her hands, and then her legs, to rheumatoid arthritis. Her mother died at 51. Near the end, a family friend cared for her with juices, plant foods, water, sunshine and massage, and for about six weeks her pain eased.</p><p>Anyone who has watched someone they love hurt will recognise that daughter. She turned her helplessness into a lifetime of handing people something to do with their own two hands. That is why this course exists too: so you are never left with nothing to do.</p><p>To be fair to you: her mother was treated half a century ago, before today’s medicines existed. Modern medicines for rheumatoid arthritis slow or stop the joint damage itself. And no one brings arthritis on themselves with their feelings.</p>
 <h3>Her nine habits, checked</h3><div class="tablewrap"><table><tr><th>Habit</th><th>What to know</th></tr>
 <tr><td><b>Sunshine</b></td><td>Lifts mood and tops up vitamin D. Not shown to ease arthritis. Enjoy it, and protect fair skin.</td></tr>
 <tr><td><b>Water</b></td><td>A good habit, and truly useful in gout.</td></tr>
 <tr><td><b>Sleep</b></td><td>Regular sleep turns pain down. The routine matters more than the hour.</td></tr>
 <tr><td><b>Trust</b></td><td>A calm, hopeful mind eases pain. If faith is part of your life, lean on it.</td></tr>
 <tr><td><b>Abstain</b></td><td>Stopping smoking and limiting alcohol are real wins. Tea and coffee are fine for most people.</td></tr>
 <tr><td><b>Fresh air</b></td><td>Slow nose breathing is calming. It does not send extra oxygen to joints.</td></tr>
 <tr><td><b>Nutrition</b></td><td>The plants do the good. The “acid” theory behind it is not needed.</td></tr>
 <tr><td><b>Moderation</b></td><td>Sensible portions help your weight, and your knees feel it.</td></tr>
 <tr><td><b>Exercise</b></td><td>The strongest remedy of all, and the one she and the doctors agree on completely.</td></tr></table></div>
 <h3>Three ideas to take to your doctor first</h3><ul><li><b>“Drugs only mask symptoms.”</b> For rheumatoid arthritis, modern medicines protect joints from permanent damage. Only lower a medicine with your doctor.</li><li><b>“Autoimmune disease isn’t real.”</b> It is. It shows in blood tests and scans.</li><li><b>“Castor oil breaks up bone spurs and lumps.”</b> There is no evidence for this. Any new lump deserves a doctor.</li></ul>
 <p class="note">Barbara has no recognised medical qualifications, and in 2019 the health regulator in New South Wales, Australia, permanently prohibited her from providing health services. We share her comforts because many people love them, and we check each one so you can use them safely.</p>`,
 doit:`Pick one of the nine habits that feels easy today. A glass of water? Ten minutes of daylight? Do just that one.`,
 q:['Which of her nine habits do doctors agree with most strongly?',['Sunshine','Exercise','Fresh air'],1,'Yes. Moving every day is the strongest remedy there is.']},
{id:'warmth',n:'W',nav:'Warmth, poultices and packs',title:'Warmth, poultices and packs',
 hug:`There is something deeply comforting about tending a sore joint with your own hands. This is the cosiest lesson in the course. Put the kettle on.`,
 big:`Warm what is stiff. Cool what is swollen. And never more than 20 minutes at a time.`,
 acro:['SOOTHE','How to make a castor oil compress, the way Barbara teaches it',[['S','<b>Start with a skin test.</b> Dab a little oil on your inner arm. Wait a day. No rash? Go ahead.'],['O','<b>Oil on a cloth.</b> Soak a piece of cotton or flannel in castor oil.'],['O','<b>On the sore joint.</b> Lay the cloth over your knee, hand or hip. Cover it with an old towel. The oil stains.'],['T','<b>Top with warmth.</b> A warm (not hot) water bottle or heat pack on top.'],['H','<b>Hold for 20–30 minutes.</b> Rest. Breathe slow. This is your time.'],['E','<b>Ease off if it stings.</b> Red, itchy or sore skin means stop and wash it off.']]],
 body:`<h3>What each comfort can do</h3><div class="tablewrap"><table><tr><th>Comfort</th><th>What we know</th></tr>
 <tr><td><b>Chili-pepper cream (capsaicin)</b></td><td>This one truly works for many people. A pharmacy cream on the sore joint three or four times a day. It stings for a week or two, then relief builds. Wash your hands after.</td></tr>
 <tr><td><b>Heat and cold packs</b></td><td>Simple, and they work. 15 to 20 minutes of warmth for stiffness. A wrapped cold pack for a hot, puffy joint.</td></tr>
 <tr><td><b>Hot and cold water</b></td><td>Barbara’s first choice for hands and feet. Warm bowl for 3 minutes, cold bowl for 30 seconds, three times. Warm means bath temperature, never hot.</td></tr>
 <tr><td><b>Ginger poultice</b></td><td>Grated fresh ginger in a cotton cloth, on one joint for up to an hour. It soothes through warmth. Take it off as soon as it stings.</td></tr>
 <tr><td><b>Castor oil compress</b></td><td>Not proven in studies, but the warmth and stillness can feel lovely. Outside of the body only.</td></tr>
 <tr><td><b>Epsom salt bath</b></td><td>The warm water is what soothes. The salt is optional.</td></tr>
 <tr><td><b>Warm wax for hands</b></td><td>Used by hand therapists. Makes the first movements of the day easier.</td></tr>
 <tr><td><b>Comfrey cream</b></td><td>One three-week study found it eased knee pain. Unbroken skin only. Never swallow it.</td></tr></table></div>
 <h3>Keeping your skin safe</h3><ul><li>Test anything new on a small patch first.</li><li>Keep a cloth between a cold pack and your skin.</li><li>Do not leave a ginger or cayenne poultice on overnight.</li><li>If you have diabetes or poor circulation, ask your doctor before using heat or cold on your feet.</li></ul>`,
 doit:`Give yourself ten quiet minutes with something warm on your sorest joint. Put on music you love. That is time spent looking after yourself, and it counts.`,
 q:['A joint is hot and puffy. What helps most?',['A hot water bottle','A wrapped cold pack for 15 minutes','Nothing at all'],1,'Yes. Cool what is swollen, warm what is stiff.']},
{id:'herbs',n:'H',nav:'Herbs, spices and supplements',title:'Herbs, spices and supplements',
 hug:`The supplement aisle makes a great many promises, and it is easy to spend a lot of money on hope. This lesson is here to save you money and worry.`,
 big:`Try one thing at a time, give it eight to twelve weeks, and keep it only if you can feel a difference.`,
 body:`<div class="tablewrap"><table><tr><th>What</th><th>The honest answer</th></tr>
 <tr><td><b>Turmeric</b></td><td>Early studies for knee arthritis are hopeful. Lovely in cooking or warm milk. Stay with the dose on the label. Very high doses bring more stomach upset and more risk.</td></tr>
 <tr><td><b>Ginger</b></td><td>In food, tea or a capsule, it has eased pain a little in studies. Go easy if it gives you heartburn.</td></tr>
 <tr><td><b>Fish oil</b></td><td>Eases pain a little in rheumatoid arthritis. Not shown to help osteoarthritis. Oily fish twice a week is the simplest way.</td></tr>
 <tr><td><b>Glucosamine and chondroitin</b></td><td>The biggest studies found little or no benefit. If you have bought them for years and feel no difference, you are free to stop.</td></tr>
 <tr><td><b>Vitamin D</b></td><td>Worth correcting if a blood test shows you are low. Extra has not been shown to ease pain.</td></tr>
 <tr><td><b>Thunder god vine</b></td><td>Please avoid. It can cause serious side effects.</td></tr></table></div>
 <h3>Please check first if…</h3><ul><li>You take blood thinners or diabetes medicine. Ask your pharmacist about turmeric and ginger capsules.</li><li>You are pregnant. Turmeric in food is fine. Capsules may not be.</li><li>You notice dark urine, yellow skin or unusual tiredness while taking turmeric capsules. Stop and see a doctor.</li></ul>
 <p>One thing to hold on to if you have rheumatoid arthritis: herbs can comfort you, but they have not been shown to protect joints from damage. Your medicine does that part.</p>`,
 doit:`Look at the supplements in your cupboard. Is there one you have taken for months without feeling any difference? Put it on your list to ask your pharmacist about.`,
 q:['How long should you try one supplement before deciding?',['Two days','Eight to twelve weeks','Forever'],1,'Right. One at a time, a couple of months, and keep it only if you feel it.']},
{id:'routine',n:'D',nav:'Your day and your first four weeks',title:'A safe daily routine, and your first four weeks',
 hug:`You have learned a lot. This lesson gathers it into one simple day, and then hands it to you one small layer at a time, so it never feels like too much.`,
 big:`Some days you will tick every box and some days none. Both are fine. What changes things is coming back to it, not doing it perfectly.`,
 body:`<h3>A kind day for your joints</h3><ul><li><b>Morning:</b> take any prescribed medicine. Warm stiff joints with a shower or heat pack, then stretch for ten minutes. A glass of water.</li><li><b>During the day:</b> thirty minutes of walking, swimming or cycling, split up if that is easier. Vegetables or fruit with every meal. Change position every half hour.</li><li><b>Evening:</b> a cold pack on any hot, swollen joint. A warm bath or compress if you find it soothing. Two minutes of slow breathing, then a regular bedtime.</li><li><b>Twice a week:</b> your strength moves.</li></ul>
 <h3>Your first four weeks</h3><div class="tablewrap"><table><tr><th>Week</th><th>What to do</th><th>A kind reminder</th></tr>
 <tr><td><b>1 · Begin</b></td><td>Walk 10 minutes a day. Write down your pain number each evening.</td><td>Small is the point.</td></tr>
 <tr><td><b>2 · Feed your joints</b></td><td>Add vegetables or fruit to every meal. Swap one sugary drink a day for water.</td><td>One better meal a day is enough to begin.</td></tr>
 <tr><td><b>3 · Build strength</b></td><td>Do your strength moves twice. Stretch your walk to 20 minutes.</td><td>A little soreness that fades in a day is normal.</td></tr>
 <tr><td><b>4 · Make it yours</b></td><td>Reach 30 minutes of movement most days. Keep what helped, drop what didn’t.</td><td>Look back at week 1. Notice how far you’ve come.</td></tr></table></div>
 <p>If a week feels like too much, repeat the one before. There is no falling behind here.</p>
 <h3>Celebrate each week</h3><p>Pick a small reward in advance: a phone call with a friend, a new book, an hour in the garden, a long bath.</p>`,
 doit:`Choose the day you will start week 1, and tell one person, so someone is cheering for you.`,
 q:['A week of the plan feels like too much. What should you do?',['Give up','Repeat the week before','Push on anyway'],1,'Yes. There is no falling behind here.']},
{id:'faq',n:'?',nav:'Questions people often ask',title:'Questions people often ask',
 hug:`If you have ever lain awake wondering about one of these, you are in good company. Almost everyone asks them.`,
 big:`The best day to begin is the one you are in.`,
 body:`<h3>How soon will I feel a difference?</h3><p>Capsaicin cream usually needs two to four weeks. Movement often eases stiffness within a few weeks, with more benefit over two to three months. Be patient with yourself.</p>
 <h3>Can I do this instead of my medicine?</h3><p>Only after speaking with your doctor. Everything here is meant to work with your treatment. Your doctor can lower a dose safely as you improve.</p>
 <h3>Will exercise wear out my joints?</h3><p>No. Sensible movement feeds the joint and strengthens the muscles that protect it. Stillness is what joints fear.</p>
 <h3>Is cracking or creaking a bad sign?</h3><p>Usually not. Joints that click without pain or swelling are simply noisy.</p>
 <h3>Does the weather really affect arthritis?</h3><p>Many people feel worse in cold, damp weather, and you are not imagining it. Keep warm, keep moving, and know that it passes when the weather does.</p>
 <h3>Some talks say people heal completely. Can I?</h3><p>Symptoms can ease a great deal, and rheumatoid arthritis and gout can go quiet for years with the right treatment. The joint changes of osteoarthritis do not reverse, but pain and stiffness often improve so much that life opens up again. Aim for that, and let anything more be a bonus.</p>
 <h3>Am I too old to start?</h3><p>You are not. People in their seventies, eighties and nineties gain strength and ease from movement.</p>
 <h3>I’ve tried everything and I’m tired. Is it worth it?</h3><p>Your tiredness makes sense. You don’t need to try everything again. Pick the single smallest step and begin there. That is enough for today.</p>`,
 doit:`Is there a question you still have? Write it on your list for the doctor. You are allowed to ask, and good doctors welcome it.`,
 q:['Will sensible exercise wear your joints out faster?',['Yes','No. It feeds and protects them','Only on rainy days'],1,'Right. Movement is how a joint gets fed.']},
{id:'week-1',n:'R',nav:'Reassure',title:'Reassure: what is happening inside your joints',
 hug:`Pain is scary when you do not know what it means. This week we take the fear away. When you understand pain, it loses some of its power.`,
 big:`Hurt does not always mean harm. A sore joint is still a strong joint, and gentle movement is how it gets fed.`,
 acro:['SAFE','Four truths about joint pain',[['S','<b>Sore is not the same as damaged.</b> Pain is an alarm. Sometimes the alarm is set too loud.'],['A','<b>Activity feeds the joint.</b> Cartilage has no blood supply. Movement squeezes fluid in and out, like a sponge.'],['F','<b>Flare-ups pass.</b> A bad day is a bad day. It is not the new normal.'],['E','<b>Everyone has their own pace.</b> Your path is yours. No comparing.']]],
 body:`<h3>The three levers you hold</h3><p>Everything that helps does one of three things. It lightens the load on the joint, it calms inflammation, or it settles a sensitive nervous system. Movement, sleep and food do all three at once, which is why you will meet them again and again.</p><h3>What is arthritis, really?</h3><p>A joint is where two bones meet. The ends are covered in a smooth cushion called cartilage. In osteoarthritis, the whole joint changes over time: the cushion, the bone, and the muscles around it. Doctors used to call it “wear and tear.” Today they know the joint is always repairing itself, and the right kind of movement helps that repair.</p><h3>The traffic light for pain</h3><ul><li><b>Green (0–2 out of 10):</b> safe. Keep going.</li><li><b>Yellow (3–5):</b> okay. This is normal when you start moving more.</li><li><b>Red (6 or more):</b> ease off. Do less today and try again tomorrow.</li></ul>`,
 doit:`Use the feelings slider on the My progress page today. That number is your starting line. Later on, we will look back at it together.`,
 q:['How does cartilage get its food?',['From blood vessels','From movement squeezing fluid in and out','From resting all day'],1,'Right. Motion is lotion. Gentle movement feeds the joint.']},
{id:'week-2',n:'E',nav:'Ease in',title:'Ease in: gentle movement',
 hug:`If moving has hurt before, it makes sense to be careful. We will start so small it feels almost too easy. That is on purpose.`,
 big:`Walking is medicine for joints. Start with what you can do today, even if it is two minutes.`,
 acro:['WARM','Your walking plan',[['W','<b>Walk a little.</b> Start with 5 minutes, or less. Indoors counts.'],['A','<b>Add a minute.</b> Each week, add 1–2 minutes per walk.'],['R','<b>Rest when you need to.</b> Sitting down for a moment is smart.'],['M','<b>Mark it down.</b> Tick your walks in the Toolkit planner.']]],
 body:`<h3>The 2-hour rule</h3><p>A little extra soreness after moving is normal. If your pain is worse than usual for more than 2 hours afterward, you did a bit too much. Next time, do a little less. You did not hurt yourself.</p><h3>Good choices for sore joints</h3><ul><li>Walking on flat ground</li><li>Water walking or swimming (the water carries your weight)</li><li>A bike or pedal exerciser</li><li>Tai chi (slow, flowing moves you can even do in a chair)</li></ul><p>Walk With Ease, a 6-week walking program from the Arthritis Foundation, is built on the same idea: walk, stretch, learn, and stay motivated.</p>`,
 vids:[['Try a free tai chi lesson with Dr Paul Lam (YouTube)','https://www.youtube.com/watch?v=tAOuEpa01j4'],['Seated exercises you can do in a chair (Versus Arthritis)','https://versusarthritis.org/news/2023/september/exercises-you-can-do-sitting-down']],
 doit:`Take one 5-minute walk today. Around the house is fine. When you finish, say out loud: “I just fed my joints.”`,
 q:['Your knee is a bit more sore for one hour after a walk. What does that mean?',['You damaged it','That is normal. Keep going.','You should stop walking for good'],1,'Yes. Under 2 hours of extra soreness is your body getting used to moving.']},
{id:'week-3',n:'L',nav:'Load wisely',title:'Load wisely: build strong helpers',
 hug:`Muscles are your joints’ helpers. When they get stronger, your joints carry less of the load. You are never too old to get stronger. People in their 90s do.`,
 big:`Strong muscles act like shock absorbers. Two or three short sessions a week is enough.`,
 acro:['LIFT','How to get stronger safely',[['L','<b>Low and slow.</b> Move slowly. Count 3 up and 3 down.'],['I','<b>In the yellow zone.</b> Pain up to 5 out of 10 is okay. More than that, ease off.'],['F','<b>Few first.</b> Start with 5 of each move. Work up to 10.'],['T','<b>Two or three days a week.</b> Rest a day in between.']]],
 body:`<h3>Ten kind movements beside a chair</h3><p>You only need a sturdy chair. Move slowly, breathe, and stop short of sharp pain.</p><ol><li><b>Seated march.</b> Sit tall and lift one knee, then the other, for one minute.</li><li><b>Sit to stand.</b> Stand up from a chair and sit back down slowly. Do 5 to 10. Use your hands at first if you need them.</li><li><b>Heel raises.</b> Hold the chair back and rise onto your toes, then lower. Do 10.</li><li><b>Knee straightening.</b> Seated, straighten one leg, hold for five seconds, lower. Do 10 each side. Strong thighs protect knees.</li><li><b>Side leg lift.</b> Hold the chair back and lift one leg out to the side. Do 8 each side.</li><li><b>Wall push-ups.</b> Hands on a wall, bend your elbows and press back. Do 8 to 10.</li><li><b>Shoulder circles.</b> Roll both shoulders slowly backward 10 times, then forward 10 times.</li><li><b>Hand opening.</b> Make a soft fist, then spread your fingers wide. Do 10. Lovely after warming your hands in water.</li><li><b>Thumb touches.</b> Touch your thumb to each fingertip in turn. Twice on each hand.</li><li><b>Ankle circles.</b> Lift one foot and circle the ankle 10 times each way. Then the other.</li></ol><p>Begin with one round. When that feels easy, do two. A physical therapist can check your form and adjust these moves for you, which matters most if you have had a joint replaced.</p>`,
 vids:[['Follow-along strength sessions with Leon and his mum (Versus Arthritis)','https://versusarthritis.org/about-arthritis/exercising-with-arthritis/resistance-band-workout-sessions']],
 doit:`Do 5 sit-to-stands from your favorite chair. That is it. You just did strength training.`,
 q:['How often should you do strength moves?',['Every hour','2 or 3 days a week','Once a month'],1,'Right. Muscles grow on the rest days in between.']},
{id:'week-4',n:'E',nav:'Eat',title:'Eat: food that loves you back',
 hug:`This is not a diet, and no food is “bad.” We are adding good things to your plate. Nobody is taking joy away from you.`,
 big:`For knees and hips, every pound you lose takes about four pounds of pressure off your knees with each step.`,
 acro:['PLATE','Build a joint-friendly plate',[['P','<b>Plants on half.</b> Vegetables, fruit, beans. Lots of colors.'],['L','<b>Lean protein.</b> Chicken, eggs, beans, yogurt. Protein feeds your muscles.'],['A','<b>A fish night or two.</b> Salmon, sardines, tuna. They carry omega-3 fats.'],['T','<b>Tasty good fats.</b> Olive oil, nuts, avocado.'],['E','<b>Ease off sugary drinks.</b> Swap one soda for water with lemon.']]],
 body:`<h3>Foods you can keep</h3><p>You may have been told to give up tomatoes, potatoes, peppers, bread, milk, tea or coffee. Research has not found that these worsen arthritis, so you are free to keep the foods you love. If you suspect one, leave it out for two weeks, bring it back, and let your body answer. One exception: in gout, some people find tomatoes set off a flare.</p><h3>If yours is gout</h3><p>Food matters more in gout than in any other arthritis. Go easy on alcohol (beer and spirits most of all), organ meats, red meat, shellfish and sweet fizzy drinks. If flares keep coming back, medicine that lowers uric acid is what stops them.</p><h3>Kitchen comforts: what the science says</h3><div class="tablewrap"><table><tr><th>Remedy</th><th>What we know</th></tr><tr><td>Heat and cold packs</td><td>Recommended in the U.S. arthritis guidelines. Safe and cheap.</td></tr><tr><td>Chili-pepper cream (capsaicin)</td><td>Guidelines suggest it for knees. It tingles at first. Wash your hands after.</td></tr><tr><td>Turmeric and ginger in food</td><td>Lovely in cooking. Research on pills is still small and mixed. Ask your pharmacist first if you take blood thinners.</td></tr><tr><td>Glucosamine pills</td><td>Arthritis doctors advise against them. Studies did not show they work.</td></tr><tr><td>“Miracle cures”</td><td>If something promises to cure arthritis, please keep your money. Nothing cures it yet. Many things help.</td></tr></table></div>`,
 doit:`Add one color to one meal today. A handful of berries, some spinach in your eggs, or carrots on the side.`,
 q:['If you lose 1 pound, about how much pressure comes off your knee with each step?',['1 pound','4 pounds','None'],1,'Yes, about 4 pounds. Lose 10 pounds and each knee carries about 48,000 pounds less for every mile you walk.']},
{id:'week-5',n:'A',nav:'Adapt',title:'Adapt: work smarter, not harder',
 hug:`Using a tool or taking a break is not giving up. It is how you keep doing the things you love.`,
 big:`Spread your energy across the day like butter on toast. Do not use it all in one corner.`,
 acro:['PACE','Save your energy',[['P','<b>Plan.</b> Pick your top 3 tasks for the day. The rest can wait.'],['A','<b>Alternate.</b> Switch between heavy jobs and light jobs.'],['C','<b>Chunk it.</b> Clean one room, then rest. Garden 15 minutes, then sit.'],['E','<b>Ease the joint.</b> Use tools that do the hard part for you.']]],
 body:`<h3>Little helpers that make a big difference</h3><ul><li><b>A cane</b> in the hand <em>opposite</em> your sore hip or knee. Guidelines strongly recommend it.</li><li><b>Jar openers and fat-grip pens</b> for sore hands.</li><li><b>Cushioned, supportive shoes.</b></li><li><b>A warm shower in the morning</b> to melt stiffness.</li><li><b>A cold pack for 15 minutes</b> on a hot, puffy joint. Wrap it in a cloth.</li></ul><h3>Boom and bust</h3><p>On a good day, it is tempting to do everything. Then you pay for it for three days. Try stopping while you still feel good. Tomorrow you will thank yourself.</p>`,
 doit:`Pick one job you dread. Cut it in half and put a 10-minute rest in the middle.`,
 q:['Which hand should hold the cane?',['The same side as the sore leg','The opposite side from the sore leg','Either, it does not matter'],1,'Opposite side. The cane and the sore leg move forward together.']},
{id:'week-6',n:'S',nav:'Sleep & soothe',title:'Sleep and soothe: calm the alarm',
 hug:`Pain makes it hard to sleep, and poor sleep makes pain louder. That loop is exhausting. This week we gently loosen it.`,
 big:`A calm body feels less pain. Sleep and slow breathing turn the pain alarm down.`,
 acro:['CALM','Better nights, softer days',[['C','<b>Cool, dark room.</b> A pillow between your knees can help hips and backs.'],['A','<b>A set bedtime.</b> Same time each night, even weekends.'],['L','<b>Let go with your breath.</b> In for 4, out for 6. Do it five times.'],['M','<b>Move in the daytime.</b> A walk today is better sleep tonight.']]],
 body:`<h3>The 4–6 breath</h3><ol><li>Sit or lie down. Put a hand on your belly.</li><li>Breathe in through your nose while you count to 4.</li><li>Breathe out slowly while you count to 6.</li><li>Repeat five times.</li></ol><h3>Setting down what is heavy</h3><p>Feelings do not cause arthritis, and you did not bring yours on yourself. What is true is that long-held anger and worry keep the body tense and pain turned up. Talking it through, forgiving where you can, praying if you pray, or simply writing it down can lighten what you carry.</p><h3>You matter too</h3><p>Feeling sad, worried or fed up is common with long-term pain. Talking helps. Guidelines suggest a kind of talking therapy called CBT for people with arthritis. If your mood stays low for two weeks, please tell your doctor. That takes courage, and it is the right thing to do.</p>`,
 vids:[['More gentle tai chi from the Arthritis Society Canada','https://arthritis.ca/healthy-living/tai-chi-to-help-arthritis/']],
 doit:`Tonight, do five rounds of the 4–6 breath in bed.`,
 q:['Which breath calms the body?',['Short fast breaths','In for 4, out for 6','Holding your breath'],1,'Right. A long, slow breath out tells your body it is safe.']},
{id:'week-7',n:'E',nav:'Endure',title:'Endure: your flare-up plan',
 hug:`Flare-ups happen to everyone, even people doing everything right. A flare does not erase your progress.`,
 big:`A flare is a storm, and storms pass. Having a plan makes them shorter and less scary.`,
 acro:['RESET','What to do on a bad day',[['R','<b>Rest a little.</b> Cut your activity in half. Do not stop completely.'],['E','<b>Ease with heat or cold.</b> 15 minutes at a time.'],['S','<b>Simplify the day.</b> Top 1 task only. Ask for help.'],['E','<b>Ease back in.</b> When it settles, build back up over a few days.'],['T','<b>Tell your doctor</b> if it is not better in a week, or sooner if you see a red flag.']]],
 body:`<h3>Red flags: call your doctor today</h3><ul><li>A joint that is hot, red and very swollen, especially with a fever</li><li>Sudden, severe pain after a fall or injury</li><li>You cannot put weight on your leg</li><li>New numbness, weakness, or loss of bladder or bowel control</li><li>Chest pain or trouble breathing while moving (call emergency services)</li></ul><h3>About pain medicine</h3><p>Creams and gels like diclofenac are recommended for knees and hands. Pills can help too. Your doctor or pharmacist knows which are safe with your other medicines. Never stop a prescribed medicine without asking them.</p>`,
 doit:`Fill in your flare plan in the Toolkit. Put it on the fridge.`,
 q:['During a flare, what is the best plan?',['Stay in bed all week','Do about half as much and ease back in','Push harder'],1,'Yes. Gentle movement, less of it, then build back.']},
{id:'week-8',n:'★',nav:'Keep going',title:'Keep going: your life, your pace',
 hug:`Look how far you have come. Not long ago you took one small step. Now you have a whole set of tools. We are proud of you.`,
 big:`You are now the expert on your own joints. Keep the habits that helped and let the rest go.`,
 acro:['GROW','Make it last',[['G','<b>Goal.</b> Pick one thing for the next month. Go back to your “why.”'],['R','<b>Routine.</b> Tie it to something you already do. “After coffee, I walk.”'],['O','<b>Others.</b> Walk with a friend. Join a class. It is easier together.'],['W','<b>Win.</b> Notice every small win. Tell someone.']]],
 body:`<h3>Look back</h3><p>Go to My progress and check your feelings chart. Even one point lower is real progress. If your number is the same but you are doing more, that is progress too.</p><h3>Where to go next</h3><ul><li>Ask your doctor about a local program like GLA:D, Walk With Ease, or Tai Chi for Arthritis.</li><li>See a physical therapist for a plan made just for you.</li><li>Come back to any week whenever you need it.</li></ul>`,
 vids:[['Find a proven arthritis program near you (CDC list)','https://www.cdc.gov/arthritis/programs']],
 doit:`Write a short note to yourself from eight weeks ago. What would you tell that person?`,
 q:['What is the best way to keep a habit?',['Wait until you feel like it','Tie it to something you already do','Do it only on good days'],1,'Right. “After coffee, I walk.” Simple hooks make habits stick.']}
];
const BARB={id:'barbara',n:'♥',nav:'Barbara’s corner',title:'Barbara O’Neill’s comfort remedies',
 hug:`Many of you found us because you love Barbara O’Neill’s gentle, back-to-nature way of caring for the body. This lesson gathers her best-known comfort ideas for sore joints, with a kind and honest note on what research says about each one.`,
 big:`Warmth, touch and a quiet moment to care for yourself can feel wonderful. Use these as comforts alongside your moving, eating and sleeping habits.`,
 acro:['SOOTHE','How to make a castor oil compress, the way Barbara teaches it',[['S','<b>Start with a skin test.</b> Dab a little oil on your inner arm. Wait a day. No rash? Go ahead.'],['O','<b>Oil on a cloth.</b> Soak a piece of cotton or flannel in castor oil.'],['O','<b>On the sore joint.</b> Lay the cloth over your knee, hand or hip. Cover it with an old towel. The oil stains.'],['T','<b>Top with gentle warmth.</b> A warm (not hot) water bottle or heat pack on top.'],['H','<b>Hold for 20–30 minutes.</b> Rest. Breathe slow. This is your time.'],['E','<b>Ease off if it stings.</b> Red, itchy or sore skin means stop and wash it off.']]],
 body:`<h3>Barbara’s ideas, side by side with the science</h3><div class="tablewrap"><table><tr><th>What Barbara teaches</th><th>What we know so far</th></tr>
 <tr><td><b>Castor oil compress</b> on sore joints</td><td>No good studies show it treats arthritis. The warmth and rest can feel soothing, and heat is in the official guidelines. Safe for most people on unbroken skin.</td></tr>
 <tr><td><b>Cayenne pepper</b> to bring blood to the area</td><td>The active part, capsaicin, is suggested in U.S. guidelines as a cream for knees. Homemade cayenne mixes can burn skin. A store-bought capsaicin cream is the safer way.</td></tr>
 <tr><td><b>Ginger and turmeric</b>, in food or as a warm poultice</td><td>Small studies are mixed. Lovely in food. Ask a pharmacist before taking pills, especially with blood thinners.</td></tr>
 <tr><td><b>Potato, onion and other poultices</b></td><td>No research for arthritis. A warm poultice is a gentle comfort and unlikely to harm unbroken skin.</td></tr>
 <tr><td><b>“More blood flow speeds healing”</b></td><td>This matches the science in one big way: movement brings blood to muscles and feeds your joints. Walking is the strongest blood-flow remedy there is.</td></tr></table></div>
 <h3>An honest word, because we care about you</h3><p>Barbara is a natural-health teacher. She is not a doctor, and in 2019 Australia’s health regulator barred her from giving health services there. Some videos that carry her name promise to “heal” or “reverse” arthritis fast. No remedy has been shown to do that. Please enjoy these as comforts, keep your doctor in the loop, and never stop a prescribed medicine for them.</p>`,
 doit:`Give yourself 20 quiet minutes with a warm compress on your sorest joint. Put on music you love. You have earned it.`,
 q:['What should you do before putting a new oil on your skin?',['Use a lot right away','Test a little on your inner arm and wait a day','Heat it until very hot'],1,'Yes. A small skin test keeps you safe.']};

function lesson(w){const main=PATH.includes(w.id),i=PATH.indexOf(w.id),d=done()[w.id],part=main?PARTS.find(p=>p[2].includes(w.id))[0]:'Bonus',nx=PATH[i+1],vids=LESSON_VIDS[w.id]||[];
  if(main&&!open_(w.id)){const prev=PATH.slice(0,i).find(id=>!done()[id]);
    return `<div class="sheet"><section><span class="eyebrow">Almost there</span><h1>We’re saving this one for you</h1><p class="lead">We take things one at a time so nothing ever feels like too much. Once you finish <b>${L(prev).nav}</b>, this lesson will open for you. No hurry at all.</p><a class="btn" href="#${prev}">Go to ${L(prev).nav} →</a></section></div>`}
  return `<div class="sheet">
  <section><span class="eyebrow">${part}${main?` · Lesson ${i+1} of ${PATH.length}`:''}</span><h1>${w.title}</h1>${PHOTO[w.id]?`<img class="photo" src="../../images/${PHOTO[w.id][0]}" alt="${PHOTO[w.id][1]}" loading="lazy">`:''}<p class="heart">${w.hug}</p></section>
  <section class="big"><span class="eyebrow">The one thing to hold on to</span><p>${w.big}</p></section>
  <section><span class="eyebrow">A word to remember it by</span><h2>${w.acro[0].split('').join(' · ')}</h2><p>${w.acro[1]}</p><div class="acro">${w.acro[2].map(a=>`<div><b>${a[0]}</b><span>${a[1]}</span></div>`).join('')}</div></section>
  <section>${w.body}${WHY[w.id]?`<p class="why"><b>Why we trust this:</b> ${WHY[w.id]} <a href="#science">See the science</a></p>`:''}</section>
  ${vids.length?`<section><span class="eyebrow">Watch with us</span>${vids.map(player).join('')}${w.id==='barbara'?BARB_NOTE:''}</section>`:''}
  <section class="try"><span class="eyebrow">Your one small thing today</span><p>${w.doit}</p></section>
  <section class="quiz" data-a="${w.q[2]}"><span class="eyebrow">A quick, friendly check</span><h3 style="margin-top:0">${w.q[0]}</h3>${w.q[1].map((o,k)=>`<button data-k="${k}">${o}</button>`).join('')}<p class="fb" id="fb" role="status"></p></section>
  <section><button class="btn wide" id="didit">${d?'✓ Done. We’re proud of you.':'I did it'}</button>
    <div class="row" id="after" ${d?'':'hidden'}>${main?(nx?`<a class="btn alt wide" href="#${nx}">Next: ${L(nx).nav} →</a>`:`<a class="btn alt wide" href="#bonuses">Visit your bonuses →</a>`):`<a class="btn alt wide" href="#bonuses">Back to your bonuses →</a>`}</div>
    ${main&&nx&&!d?`<p class="note" style="margin-top:12px">When you’re ready, press “I did it” and we’ll open your next lesson for you: ${L(nx).nav}.</p>`:''}</section></div>`}

  ${BONUS.map((b,i)=>`<a class="step" href="#${b.id}"><span class="num">${i+1}</span><span><b>Bonus ${i+1} · ${b.t}</b><small>${b.s}</small></span><span class="go">Open →</span></a>`).join('')}`}

function progress(){const log=store.get('log',[]);
  return `<div class="sheet"><section><span class="eyebrow">My progress</span><h1>How are your joints feeling today?</h1>
    <p>Slide to your number. 0 means no pain. 10 means the worst pain. There is no wrong answer, and whatever your number is, thank you for telling us.</p>
    <input type="range" id="pain" min="0" max="10" value="${log.length?log[log.length-1].v:4}" aria-label="Pain today from 0 to 10">
    <div class="row"><b id="painV" style="font-size:24px;color:var(--ink)"></b><button class="btn" id="savePain">Save today’s number</button></div>
    <div class="bars" id="bars" aria-hidden="true"></div><p class="note" id="barsNote"></p><p class="note">Your numbers stay on this device only.</p></section>
  <section><span class="eyebrow">Your why</span>${store.get('why','')?`<p class="heart">“${store.get('why','').replace(/</g,'&lt;')}”</p><p class="note">This is what you are doing it for. <a href="#progress" id="whyEdit">Change it</a></p>`:`<p>What is one thing you miss doing? Write it here, and we will keep it safe for you.</p><input class="field" id="whyIn" maxlength="140" placeholder="I want to be able to…" aria-label="Your why"><button class="btn alt" id="whySave">Keep this for me</button>`}</section>
  <section><h2>Your stars</h2><p>Finish a lesson to earn 3 stars. Watch a video to earn 1 more.</p>
    <div class="row"><span class="starcount">★ ${stars()}</span><span class="note">${stars()?'Every star is a kind thing you did for your body.':'Your first star is waiting in the Welcome lesson.'}</span></div>
    <div class="badges">${PATH.map(id=>`<a href="#${id}" class="badge ${done()[id]?'lit':''}"><b>${L(id).n}</b>${L(id).nav}</a>`).join('')}</div><div class="row"><a class="btn alt" href="#certificate">My certificate</a></div></section></div>`}

function menu(route){const d=done();let n=0;
  $('#panelList').innerHTML=`<a href="#home" class="${route==='home'?'on':''}"><span>⌂</span>My path</a>
  ${PARTS.map(p=>`<h3>${p[0]}</h3>${p[2].map(id=>{n++;const o=open_(id);return `<a href="#${id}" class="${id===route?'on':''} ${o?'':'lock'}"><span>${d[id]?'✓':n}</span>${L(id).nav}</a>`}).join('')}`).join('')}
  <h3>Bonuses</h3>${BONUS.map((b,i)=>`<a href="#${b.id}" class="${b.id===route?'on':''}"><span>${i+1}</span>${b.t}</a>`).join('')}
  <h3>Helpers</h3><a href="#hardday" class="${route==='hardday'?'on':''}"><span>♥</span>Having a hard day?</a><a href="#daily" class="${route==='daily'?'on':''}"><span>⏱</span>My daily 10 minutes</a><a href="#toolkit" class="${route==='toolkit'?'on':''}"><span>✎</span>Toolkit</a><a href="#progress" class="${route==='progress'?'on':''}"><span>★</span>My progress</a><a href="../index.html"><span>←</span>Back to the website</a>`;
  const tab=PATH.includes(route)||route==='home'?'home':['toolkit','hardday','daily'].includes(route)?'toolkit':['progress','certificate'].includes(route)?'progress':'bonuses';
  document.querySelectorAll('.tabs a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+tab));}

function toolkit(){
  const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],p=store.get('plan',{}),f=store.get('flare',{});
  const fl=[['My early warning signs','e.g. knee feels hot, I slept badly'],['What soothes me','e.g. heat pack, warm shower, 4–6 breath'],['The one task I will keep','e.g. short walk to the mailbox'],['Who I can ask for help','a name and phone number'],['I will call my doctor if','e.g. no better after 7 days']];

function science(){
  return `<div class="sheet"><section><span class="eyebrow">The science, in plain words</span><h1>Why we trust these steps</h1><p class="lead">Everything in this course comes from published research and official arthritis guidelines. Here are the numbers.</p></section>
  <section><h2>Exercise and learning lower pain</h2><p>GLA:D is a program from Denmark that pairs joint education with exercise classes. More than 60,000 people with knee or hip arthritis had joined by 2021. This chart shows average pain right after the course in the 2020 report.</p>
    <svg class="chart" viewBox="0 0 520 200" role="img" aria-label="Average pain before and after GLA:D. Knee: 4.8 to 3.4. Hip: 4.8 to 3.7."><g>
    <text x="0" y="38">Knee, before</text><rect x="120" y="22" width="${4.8*70}" height="24" rx="6" fill="#BFD3C1"/><text x="${128+4.8*70}" y="39">4.8</text>
    <text x="0" y="74">Knee, after</text><rect x="120" y="58" width="${3.4*70}" height="24" rx="6" fill="#2F6B4F"/><text x="${128+3.4*70}" y="75">3.4  (28% less)</text>
    <text x="0" y="128">Hip, before</text><rect x="120" y="112" width="${4.8*70}" height="24" rx="6" fill="#BFD3C1"/><text x="${128+4.8*70}" y="129">4.8</text>
    <text x="0" y="164">Hip, after</text><rect x="120" y="148" width="${3.7*70}" height="24" rx="6" fill="#2F6B4F"/><text x="${128+3.7*70}" y="165">3.7  (23% less)</text>
    <text x="120" y="194" style="font-weight:400;fill:#5F6F64">Pain on a 0–10 scale</text></g></svg>
    <p class="note">Source: <a href="https://www.mq.edu.au/__data/assets/pdf_file/0003/1270416/annual-report-2020-eng-glad-denmark.pdf" target="_blank" rel="noopener">GLA:D Denmark Annual Report 2020</a>. These are averages. Your result may be different.</p></section>
  <section><h2>More findings</h2><div class="grid2">
    <div class="stat"><b>1 lb = 4 lb</b>Each pound lost took about four pounds of load off the knee per step.<br><small><a href="https://news.wfu.edu/?p=65959" target="_blank" rel="noopener">Wake Forest University, Messier 2005</a></small></div>
    <div class="stat"><b>30% less pain</b>Older adults who combined diet and exercise for 18 months had 30% less knee pain and 24% better function.<br><small><a href="https://reliasmedia.com/articles/83546-taking-off-weight-takes-pressure-off-knees-feet" target="_blank" rel="noopener">ADAPT trial summary</a></small></div>
    <div class="stat"><b>38% better</b>GLA:D Australia’s 2023 report found quality of life up 38% for knees and 24% for hips.<br><small><a href="https://timesnewsgroup.com.au/themooraboolnews/seniors/glad-good-life-with-arthritis-denmark" target="_blank" rel="noopener">News summary of the report</a></small></div>
    <div class="stat"><b>30 months</b>The UK’s ESCAPE-pain program showed benefits lasting up to 30 months after it ended.<br><small><a href="https://versusarthritis.org/media/2082/evidence-review-panel-physical-activity-report-april-2016.pdf" target="_blank" rel="noopener">Arthritis Research UK review</a></small></div></div></section>
  <section><h2>What the official guideline strongly recommends</h2><p>The American College of Rheumatology and the Arthritis Foundation reviewed the research together. Their strongest “yes” goes to:</p>
    <ul><li>Exercise</li><li>Weight loss for knee or hip arthritis, if you carry extra weight</li><li>Self-management programs (like this course)</li><li>Tai chi</li><li>A cane when needed</li></ul>
    <p class="note">Source: <a href="https://www.arthritis.org/diseases/more-about/guidelines-for-osteoarthritis-treatments" target="_blank" rel="noopener">Arthritis Foundation guideline summary</a>.</p></section>
  <section class="safety"><h3>Our promise to be honest</h3><p>No course, food or remedy can cure arthritis. What the research shows is that the right habits help many people hurt less and do more. That is what we teach.</p></section></div>`;

function celebrate(msg,pts){
  const t=$('#toast');t.innerHTML=`<b>${pts}</b><span>${msg}</span>`;t.classList.add('show');
  clearTimeout(celebrate.t);celebrate.t=setTimeout(()=>t.classList.remove('show'),4200);
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const c=$('#confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=['#FFC56B','#2F6B4F','#ffffff','#BFD3C1','#4E9A72'],P=Array.from({length:110},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.4,r:5+Math.random()*7,vy:2+Math.random()*4,vx:-1.5+Math.random()*3,a:Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)]}));
  let n=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.vy;p.x+=p.vx;p.a+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);x.restore();});
    if(++n<150)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height);})();
}
function drawBars(){

}
