  document.querySelectorAll('.fl').forEach(c=>c.oninput=()=>{const f=store.get('flare',{});f[c.dataset.k]=c.value;store.set('flare',f);});
}
const LOGO='<svg role="img" aria-label="Gentle Joint Care" width="84" height="84" viewBox="0 0 64 64" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="overflow: visible"><defs><clipPath id="gjc-clip"><circle cx="32" cy="32" r="28.6"/></clipPath></defs><circle cx="32" cy="32" r="30" fill="#1F5239" stroke-width="2.2"/><g clip-path="url(#gjc-clip)"><circle cx="41.5" cy="10.5" r="3.6"/><path d="M24.6 22.5c-1.6-7.5 2-13.6 8-13.8 5.8-.2 9.2 5 7.6 13.4"/><path d="M26 19c1.5-3.4 4.6-5.2 8.4-5 2.2.1 3.9 1.4 4.8 3.4"/><path d="M28.5 11.5c1.6 1 3.6 1.4 5.6 1.2M36.4 10.6c.8 1 1.9 1.8 3 2.2" stroke-width="1.2"/><path d="M25.6 19.5c-.4 5.6 2.2 9.8 6.6 9.8 4.2 0 6.8-4 6.6-9.4"/><path d="M28.4 21.4c.7.6 1.6.6 2.3 0M33.6 21.4c.7.6 1.6.6 2.3 0M30 25c1.3 1 3 1 4.3 0" stroke-width="1.2"/><path d="M29.4 28.8v3.200c-6 .8-13 3.2-15.4 8.6-1.6 3.6-2 9-2 17M35 28.800v3.200c6 .8 13 3.2 15.4 8.6 1.6 3.6 2 9 2 17"/><path d="M29.4 32c.8 1.4 1.7 2 2.8 2s2-.6 2.8-2" stroke-width="1.2"/><path d="M16.5 56c1.5-4.5 5-8 9.5-10.200M47.5 56c-1.5-4.5-5-8-9.5-10.2"/><path d="M25.6 45.400c.6-2.4 2.6-3.8 5-3.600l5.6.5c1.7.2 2.8 1.3 2.7 2.7-.1 1.3-1.2 2.2-2.8 2.200h-3.6"/><path d="M38.4 46.400c.4 2.4-1.2 4.5-3.7 4.900l-5.3.8c-2 .3-3.6-.8-3.9-2.5-.3-1.5.6-2.9 2.2-3.4"/><path d="M31.5 43.900h4.400M32 45.800h3.600M29.8 49.200l4.2-.6" stroke-width="1.1"/></g></svg>';
/* ================= v3: one calm path ================= */
const BG='https://d8j0ntlcm91z4.cloudfront.net/user_3LEItPPXyE9nIyHVmOAD1tXaTYL/hf_20261113_003550_310dd78a-06fc-4782-894c-1e428ed4de66.png';
const EXPLORE=[['Seated exercises you can do in a chair','Versus Arthritis','https://versusarthritis.org/news/2023/september/exercises-you-can-do-sitting-down'],['Follow-along strength sessions','Versus Arthritis','https://versusarthritis.org/about-arthritis/exercising-with-arthritis/resistance-band-workout-sessions'],['Tai chi to help arthritis','Arthritis Society Canada','https://arthritis.ca/healthy-living/tai-chi-to-help-arthritis/'],['Find a proven arthritis program near you','CDC','https://www.cdc.gov/arthritis/programs'],['The official guideline, in plain words','Arthritis Foundation','https://www.arthritis.org/diseases/more-about/guidelines-for-osteoarthritis-treatments']];
function tools(full){return full&&canSpeak?`<div class="tools noprint"><button id="readme">🔊 Read this to me</button></div>`:''}
function foot(){return `<p class="foot noprint"><a href="#home">← Back to my path</a></p>`}
function row(href,mark,title,sub,cls){return `<a class="step ${cls||''}" href="${href}"><span class="num">${mark}</span><span><b>${title}</b>${sub?`<small>${sub}</small>`:''}</span></a>`}
function stepRow(id,n){const w=L(id),d=done()[id],o=open_(id),nx=nextUp()===id;
  return row('#'+id,d?'✓':n,w.nav,d?'Done. We’re proud of you.':o?(nx?'Your next step, whenever you’re ready':''):'Saved for you. It opens after the step before.',d?'done':o?(nx?'next':''):'lock')}
function fold(title,sub,inner,open,tally){return `<details class="fold" ${open?'open':''}><summary><span><b>${title}</b><small>${sub}</small></span>${tally?`<em>${tally}</em>`:''}</summary><div class="fold-in">${inner}</div></details>`}
function welcome(){return `<div class="cover"><div class="cover-in">${LOGO}<p class="script">Gentle Joint Care</p><h1>Welcome. We’re so glad you’re here.</h1><p>Take a breath. You have found a calm place, made for people whose joints have been deciding too much of their day. There is nothing to get wrong here, and there is no rush.</p><a class="btn" href="#overview" id="comeIn">Come in</a></div></div>`}
function overview(){return `<article class="page"><span class="eyebrow">Course overview</span><h1>Here is what we will do together</h1>
  <p class="heart">It is exhausting to hurt, and even more exhausting to not know who to believe. This course will be honest with you from the first page, because you deserve that.</p>
  <p>It will not cure your arthritis. Nothing can promise that. What it can do is real, though, and it matters: less stiffness in the morning, more confidence about what is safe to try, and a plan that is entirely yours.</p>
  <h2>How it is laid out</h2>
  <p><b>Start here.</b> Three short visits, just to settle in. No work yet.</p>
  <p><b>Part 1 · Small first steps.</b> Understand what is happening in your joints, and take your first easy walks.</p>
  <p><b>Part 2 · Soothe.</b> Food, warmth, poultices and spices. Including Barbara O’Neill’s best-loved comforts, each one checked so you can use them safely.</p>
  <p><b>Part 3 · Build.</b> Strength, kinder days, better nights, and a routine that fits your life.</p>
  <p><b>Part 4 · Keep going.</b> A plan for hard days, and answers for the moments you doubt yourself.</p>
  <h2>What else is waiting for you</h2>
  <p><b>Your bonuses</b> are videos you watch right here. <b>Your toolkit</b> holds your helpers: a planner, a timer for your daily ten minutes, a page for hard days, and easy recipes. Every lesson can be read aloud to you.</p>
  <h2>How to take it</h2>
  <p>One lesson at a time, in order. Each one opens the next. Ten minutes is plenty. If a day goes badly, the course will still be here tomorrow, and so will we.</p>
  <p class="safety">Because we care about you: this course teaches healthy habits that work alongside your doctor, never instead of them. It cannot diagnose or cure any condition. Please check with your doctor before starting new exercise, and keep taking your prescribed medicines.</p>
  <a class="btn wide" href="#home">Show me my path →</a></article>`}
function home(){const c=count(),nx=nextUp(),all=c===PATH.length;let n=0;
  const part=PARTS.map(p=>{const dn=p[2].filter(id=>done()[id]).length,rows=p[2].map(id=>stepRow(id,++n)).join('');return fold(p[0],p[1],rows,p[2].includes(nx),dn+' of '+p[2].length)}).join('');
  return `<article class="page"><span class="eyebrow">My path</span><h1>${c?(all?'You did it. We’re so proud of you.':'Welcome back. It’s good to see you.'):'This is your path.'}</h1>
  <p class="kindline">${NOTES[Math.floor(Date.now()/864e5)%NOTES.length]}</p>
  <div class="meter"><b style="width:${c/PATH.length*100}%"></b></div><p class="note">${c?c+' of '+PATH.length+' steps taken. Every one counts.':'Tap a heading below and it will open for you.'}</p>
  ${part}
  ${fold('Your bonuses','Videos to watch right here, whenever you like',BONUS.map((b,i)=>row('#'+b.id,'▶','Bonus '+(i+1)+' · '+b.t,b.s)).join(''))}
  ${fold('Your toolkit','Helpers, all in one place',row('#hardday','♥','Having a hard day?','A calm breath and a plan')+row('#daily','⏱','My daily 10 minutes','A timer for your walk, strength and breath')+row('#toolkit','✎','My planner and plans','Weekly planner, flare plan, questions for my doctor')+row('#kitchen','🍲','My joint-friendly kitchen','A shopping list and eight easy recipes')+row('#progress','★','My progress','Your feelings chart, your why, and your stars')+row('#certificate','🎖','My certificate','Waiting for you at the end'))}
  ${fold('More to explore','Trusted places to visit when you are ready',row('#science','%','The science, in plain words','Why we trust these steps')+EXPLORE.map(e=>`<a class="step" href="${e[2]}" target="_blank" rel="noopener"><span class="num">↗</span><span><b>${e[0]}</b><small>${e[1]} · opens a new page</small></span></a>`).join(''))}
  ${all?'':`<a class="btn wide" style="margin-top:28px" href="#${nx}">${c?'Carry on with: '+L(nx).nav:'Take my first step'} →</a>`}
  <p class="foot noprint"><a href="#overview">Read the course overview again</a></p></article>`}
function lesson(w){const i=PATH.indexOf(w.id),d=done()[w.id],part=PARTS.find(p=>p[2].includes(w.id))[0],nx=PATH[i+1],vids=LESSON_VIDS[w.id]||[];
  if(!open_(w.id)){const prev=PATH.slice(0,i).find(id=>!done()[id]);
    return `<article class="page"><span class="eyebrow">Almost there</span><h1>We’re saving this one for you</h1><p class="lead">We take things one at a time so nothing ever feels like too much. Once you finish <b>${L(prev).nav}</b>, this lesson will open for you. No hurry at all.</p><a class="btn" href="#${prev}">Go to ${L(prev).nav} →</a>${foot()}</article>`}
  return `<article class="page sheet">
  <section><span class="eyebrow">${part} · Lesson ${i+1} of ${PATH.length}</span><h1>${w.title}</h1>${PHOTO[w.id]?`<img class="photo" src="../../images/${PHOTO[w.id][0]}" alt="${PHOTO[w.id][1]}" loading="lazy">`:''}<p class="heart">${w.hug}</p></section>
  <section class="big"><span class="eyebrow">The one thing to hold on to</span><p>${w.big}</p></section>
  ${w.acro?`<section><span class="eyebrow">A word to remember it by</span><h2>${w.acro[0].split('').join(' · ')}</h2><p>${w.acro[1]}</p><div class="acro">${w.acro[2].map(a=>`<div><b>${a[0]}</b><span>${a[1]}</span></div>`).join('')}</div></section>`:''}
  <section>${w.body}${WHY[w.id]?`<p class="why"><b>Why we trust this:</b> ${WHY[w.id]} <a href="#science">See the science</a></p>`:''}</section>
  ${vids.length?`<section><span class="eyebrow">Watch with us</span>${vids.map(player).join('')}${w.id==='warmth'?BARB_NOTE:''}</section>`:''}
  <section class="try"><span class="eyebrow">Your one small thing today</span><p>${w.doit}</p></section>
  <section class="quiz" data-a="${w.q[2]}"><span class="eyebrow">A quick, friendly check</span><h3 style="margin-top:0">${w.q[0]}</h3>${w.q[1].map((o,k)=>`<button data-k="${k}">${o}</button>`).join('')}<p class="fb" id="fb" role="status"></p></section>
  <section><button class="btn wide" id="didit">${d?'✓ Done. We’re proud of you.':'I did it'}</button>
    <div class="row" id="after" ${d?'':'hidden'}>${nx?`<a class="btn alt wide" href="#${nx}">Next: ${L(nx).nav} →</a>`:`<a class="btn alt wide" href="#certificate">See my certificate →</a>`}</div>
    ${nx&&!d?`<p class="note" style="margin-top:12px">When you’re ready, press “I did it” and we’ll open your next lesson for you: ${L(nx).nav}.</p>`:''}${foot()}</section></article>`}
function bonuses(){return home()}
function bonus(b){const i=BONUS.indexOf(b),nx=BONUS[i+1];
  return `<article class="page"><span class="eyebrow">Bonus ${i+1} of ${BONUS.length}</span>${player(b.yt)}${VID[b.yt][0].includes('Barbara')?BARB_NOTE:''}
  ${nx?`<a class="btn alt wide" style="margin-top:22px" href="#${nx.id}">Next bonus: ${nx.t} →</a>`:''}${foot()}</article>`}
function kitchen(){return `<article class="page sheet"><section><span class="eyebrow">Your toolkit</span><h1>My joint-friendly kitchen</h1><p class="heart">Good food won’t cure arthritis, but it steadies your weight, lifts your energy and makes every other step easier. These recipes ask very little of sore hands.</p></section>
  <section><h2>A shopping list to start with</h2><ul><li><b>Vegetables:</b> leafy greens, broccoli, carrots, tomatoes, peppers, onions</li><li><b>Fruit:</b> berries, cherries, oranges, apples</li><li><b>Protein:</b> salmon or sardines, lentils, chickpeas, eggs</li><li><b>Whole grains:</b> oats, brown rice, wholegrain bread</li><li><b>Good fats:</b> olive oil, walnuts, almonds</li><li><b>Flavour:</b> turmeric, fresh ginger, garlic, black pepper, lemon</li></ul></section>
  <section><h2>Eight easy recipes</h2>
  <p><b>Warm turmeric milk.</b> Heat a cup of milk or plant milk with half a teaspoon of turmeric, a pinch of black pepper and a little honey. A calming way to end the day.</p>
  <p><b>Fresh ginger tea.</b> Steep four or five slices of ginger in hot water for 10 minutes. Add lemon.</p>
  <p><b>Overnight oats.</b> Stir half a cup of oats into a cup of milk or yoghurt. Leave overnight. Top with berries and walnuts. No morning chopping needed.</p>
  <p><b>Cherry and berry smoothie.</b> Blend a cup of frozen cherries and berries with a banana and a cup of milk or yoghurt. Thirty seconds, no knife.</p>
  <p><b>Sardines on toast.</b> Mash tinned sardines with lemon and black pepper and pile onto wholegrain toast with sliced tomato.</p>
  <p><b>One-tray salmon.</b> Lay salmon and chopped vegetables on a tray, drizzle with olive oil and lemon, and bake at 200°C (400°F) for 15 to 20 minutes.</p>
  <p><b>Red lentil soup.</b> Simmer a cup of red lentils with a chopped onion, a carrot, a teaspoon of turmeric and four cups of stock for 25 minutes. It freezes well for hard days.</p>
  <p><b>Olive oil vegetable bowl.</b> Roast any vegetables you have, spoon over brown rice and chickpeas, and finish with olive oil and lemon.</p></section>
  <section><h2>Kind to your hands</h2><p>Buy pre-chopped or frozen vegetables without guilt. Use a jar opener and a wide-handled knife. Cook double and freeze half, so a meal is waiting when your joints need a rest.</p>${foot()}</section></article>`}
function menu(route){const d=done();let n=0;
  $('#panelList').innerHTML=`<a href="#home"><span>⌂</span>My path</a><a href="#overview"><span>☰</span>Course overview</a>
  ${PARTS.map(p=>`<h3>${p[0]}</h3>${p[2].map(id=>{n++;return `<a href="#${id}" class="${id===route?'on':''} ${open_(id)?'':'lock'}"><span>${d[id]?'✓':n}</span>${L(id).nav}</a>`}).join('')}`).join('')}
  <h3>Bonuses</h3>${BONUS.map((b,i)=>`<a href="#${b.id}" class="${b.id===route?'on':''}"><span>▶</span>${b.t}</a>`).join('')}
  <h3>Toolkit</h3><a href="#hardday"><span>♥</span>Having a hard day?</a><a href="#daily"><span>⏱</span>My daily 10 minutes</a><a href="#toolkit"><span>✎</span>My planner and plans</a><a href="#kitchen"><span>🍲</span>My kitchen</a><a href="#progress"><span>★</span>My progress</a>
  <h3>Text size</h3><div class="sizer"><button id="tsm" aria-label="Smaller text">A−</button><button id="tsp" aria-label="Bigger text">A+</button></div>
  <a href="#welcome"><span>🌿</span>Welcome page</a><a href="../index.html"><span>←</span>Back to the website</a>`}
function render(){
  let r=(location.hash||'').slice(1);if(!r)r=store.get('seen',0)?'home':'welcome';
  const w=PATH.includes(r)?L(r):null,b=BONUS.find(x=>x.id===r);
  const pages={welcome,overview,toolkit,science,progress,hardday,daily,certificate,kitchen};
  $('#view').innerHTML=w?lesson(w):b?bonus(b):pages[r]?pages[r]():home();
  document.body.classList.toggle('is-cover',r==='welcome');
  if(!w&&!b&&pages[r]&&!['welcome','overview','kitchen'].includes(r))$('#view').insertAdjacentHTML('beforeend',foot());
  $('#view').insertAdjacentHTML('afterbegin',tools(!!w||['hardday','science','kitchen','overview'].includes(r)));
  menu(r);wireValue(w);
  const ci=$('#comeIn');if(ci)ci.onclick=()=>store.set('seen',1);
  document.body.classList.remove('menu-open');window.scrollTo(0,0);
  document.querySelectorAll('.play').forEach(p=>p.onclick=()=>{const id=p.dataset.id;
    $('#v-'+id).innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0&modestbranding=1&playsinline=1" title="${VID[id][0]}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;});
  document.querySelectorAll('.watch').forEach(x=>x.onclick=()=>{const s=store.get('watched',{});if(s[x.dataset.id])return;
    s[x.dataset.id]=true;store.set('watched',s);x.textContent='★ Watched';celebrate('Lovely. Time spent learning is time spent caring for yourself.','+1 star');});
  const pain=$('#pain');
  if(pain){const show=()=>$('#painV').textContent=pain.value+' out of 10';show();pain.oninput=show;drawBars();
    $('#savePain').onclick=()=>{const log=store.get('log',[]),d=new Date().toISOString().slice(0,10),i=log.findIndex(x=>x.d===d);
      if(i>=0)log[i].v=+pain.value;else log.push({d,v:+pain.value});store.set('log',log);drawBars();$('#savePain').textContent='Saved. Thank you for checking in.';};}
  const dd=$('#didit');
  if(dd)dd.onclick=()=>{const d=done(),first=!d[w.id];d[w.id]=true;store.set('done',d);dd.textContent='✓ Done. We’re proud of you.';$('#after').hidden=false;menu(r);wireSize();
    if(first)celebrate(PATH.every(x=>d[x])?'You finished the whole course. We are so proud of you!':PRAISE[Math.floor(Math.random()*PRAISE.length)],'+3 stars');};
  document.querySelectorAll('.quiz button').forEach(x=>x.onclick=()=>{
    const ok=x.dataset.k===x.parentElement.dataset.a;x.className=ok?'right':'wrong';
    $('#fb').textContent=ok?w.q[3]:'So close. Have another go. Nobody is keeping score.';});
  document.querySelectorAll('.pl').forEach(c=>c.onchange=()=>{const p=store.get('plan',{});p[c.dataset.k]=c.checked;store.set('plan',p);});
  document.querySelectorAll('.fl').forEach(c=>c.oninput=()=>{const f=store.get('flare',{});f[c.dataset.k]=c.value;store.set('flare',f);});
  wireSize();
}
function wireSize(){const sz=d=>{store.set('size',Math.max(0,Math.min(3,store.get('size',1)+d)));applySize()};const a=$('#tsm'),b=$('#tsp');if(a&&b){a.onclick=()=>sz(-1);b.onclick=()=>sz(1)}}

$('#menuBtn').onclick=()=>document.body.classList.add('menu-open');
$('#menuClose').onclick=$('#shade').onclick=()=>document.body.classList.remove('menu-open');
addEventListener('keydown',e=>{if(e.key==='Escape')document.body.classList.remove('menu-open')});
applySize();addEventListener('hashchange',render);render();
</script>
