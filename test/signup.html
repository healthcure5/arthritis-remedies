<style>
:root{--navy:#0A1F44;--blue:#1A4FB0;--blue-deep:#0E3486;--yellow:#FFC56B;--mist:#F4F8FC;--line:#D7E2EE;--soft:#3C5270;--grey:#4F6580}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--mist);color:var(--navy);font:400 18px/1.6 Inter,system-ui,sans-serif}
h1,h2{font-family:Lora,Georgia,serif;font-weight:700;line-height:1.18;margin:0;text-wrap:balance}
h1{font-size:clamp(38px,6vw,56px)}
h2{font-size:clamp(28px,4vw,38px)}
p{margin:0;color:var(--soft)}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--yellow);outline-offset:3px;border-radius:8px}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
.bar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;padding-bottom:12px}
.brand{font-family:Lora,Georgia,serif;font-weight:700;font-size:22px;color:var(--navy);text-decoration:none}
.btn{display:block;text-align:center;background:var(--blue);color:#fff;text-decoration:none;font:700 20px/1.2 Inter,system-ui,sans-serif;padding:18px 20px;border-radius:14px;border:0;width:100%;cursor:pointer;box-shadow:0 4px 0 var(--blue-deep)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--blue-deep)}
.btn.small{display:inline-block;width:auto;font-size:16px;padding:12px 16px;border-radius:12px;box-shadow:none}
.eyebrow{font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
section{padding:44px 0}
section .wrap{display:flex;flex-direction:column;gap:18px}
.white{background:#fff}
.navy{background:var(--navy)}.navy h2{color:#fff}.navy p{color:var(--line)}.navy .eyebrow{color:var(--yellow)}
.mark{background:var(--yellow);padding:0 8px;border-radius:8px}
.tile{background:var(--mist);border-radius:16px;padding:16px 18px}
.tile b,.step b{display:block;font-size:19px;color:var(--navy)}
.step{display:flex;gap:14px;align-items:flex-start}
.num{flex:none;width:44px;height:44px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;font-weight:700;font-size:20px}
.hero-img{width:100%;height:clamp(250px,42vw,400px);object-fit:cover;object-position:50% 20%;display:block}
details{border:1.5px solid var(--line);border-radius:14px;padding:16px 18px}
summary{font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:12px;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:26px;color:var(--blue);line-height:1}
details[open] summary::after{content:"–"}
details p{margin-top:10px}
.note{font-size:16px;color:var(--grey);text-align:center}
.testbar{background:var(--yellow);font-weight:600;font-size:16px;text-align:center;padding:10px 16px}
.testbar a{color:var(--navy);font-weight:800}
footer{padding:28px 0 40px;font-size:16px;color:var(--grey)}
form.card{background:#fff;border-radius:22px;padding:22px 20px;display:flex;flex-direction:column;gap:18px;box-shadow:0 12px 28px -14px rgba(16,40,74,.35)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600}
.field input{font:inherit;padding:15px 16px;border:1.5px solid #AEC6DF;border-radius:14px;background:var(--mist);color:var(--navy);min-height:56px;width:100%}
.tick{display:flex;gap:12px;align-items:flex-start;font-size:17px}
.tick input{width:24px;height:24px;margin:2px 0 0;accent-color:var(--blue);flex:none}
.alert{background:#FFF1D6;border:1.5px solid #C98A1E;color:#5A3B00;border-radius:12px;padding:12px 16px;font-size:17px;font-weight:500}
#human-box{display:flex;align-items:center;gap:14px;background:#F9FBFD;border:1.5px solid #C5D5E6;border-radius:8px;padding:14px 16px;min-height:76px;cursor:pointer;transition:border-color .3s,background .3s}
#human-box.ok{background:#F1FAF4;border-color:#1E8A4C}
#human{position:absolute;opacity:0;width:1px;height:1px}
#human-mark{flex:none;width:30px;height:30px;border:2px solid #7C93AD;border-radius:5px;background:#fff;display:grid;place-items:center}
#human:focus-visible+#human-mark{outline:3px solid var(--blue);outline-offset:2px}
#human-box.busy #human-mark{border-color:#C5D5E6 #C5D5E6 #C5D5E6 var(--blue);border-radius:50%;animation:hspin .7s linear infinite}
#human-box.ok #human-mark{border-color:#1E8A4C;background:#1E8A4C}
#human-box.ok #human-mark::after{content:"";width:8px;height:15px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-2px)}
#human-text{flex:1;font-weight:600;font-size:17px}
#human-seal{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;line-height:1.2;color:var(--grey);text-align:center;border-left:1px solid var(--line);padding-left:12px}
#human-seal b{color:var(--navy)}
@keyframes hspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style>
</head>
<body>

<main><section style="padding-top:28px"><div class="wrap" style="max-width:560px;gap:20px">

<input type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true" style="display:none">
<div class="field"><label for="first">First name</label><input id="first" name="First name" type="text" autocomplete="given-name" placeholder="Jane"></div>
<div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" placeholder="jane@example.com"></div>

<label for="human" id="human-box"><input id="human" type="checkbox"><span id="human-mark" aria-hidden="true"></span><span id="human-text" aria-live="polite">I'm not a robot</span><span id="human-seal" aria-hidden="true"><svg width="26" height="28" viewBox="0 0 26 28"><path d="M13 1l11 4v8c0 7-4.6 12-11 14C6.6 25 2 20 2 13V5z" fill="#1A4FB0"/><path d="M8 13.5l3.5 3.5L18.5 10" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><b>Joint Release</b>Security check</span></label>

<script>
(function(){
var f=document.getElementById('signup'),err=document.getElementById('err'),h=document.getElementById('human'),box=document.getElementById('human-box'),txt=document.getElementById('human-text'),t0=Date.now();
h.addEventListener('change',function(ev){
  h.dataset.ok='';box.classList.remove('ok','busy');
  if(!h.checked){txt.textContent="I'm not a robot";return;}
  box.classList.add('busy');txt.textContent='Checking…';
  var honey=f.querySelector('[name="_honey"]');
  setTimeout(function(){box.classList.remove('busy');
    if(ev.isTrusted===false||honey.value!==''){h.checked=false;txt.textContent='We could not verify you. Please try again.';return;}
    h.dataset.ok='1';box.classList.add('ok');txt.textContent='Verified. Thank you!';err.hidden=true;
  },Math.max(900,2500-(Date.now()-t0)));
});
f.addEventListener('submit',function(e){
  e.preventDefault();
  var first=document.getElementById('first').value.trim(),email=document.getElementById('email').value.trim(),msg='';
  if(!first||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))msg='Please add your first name and a valid email address so we know where to send your guide.';
  else if(!document.getElementById('tips').checked)msg='Please tick the box to get your free guide and tips by email.';
  else if(h.dataset.ok!=='1')msg="Please tick “I'm not a robot” so we know it's really you.";
  if(msg){err.textContent=msg;err.hidden=false;return;}
  err.hidden=true;
  try{sessionStorage.setItem('ar-email',email);}catch(x){}
  HTMLFormElement.prototype.submit.call(f);
});
})();
</script>
