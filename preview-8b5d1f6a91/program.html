<!doctype html><html lang="en"><head><meta charset="utf-8"><title>The Hinge Care Program</title><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer">
<link rel="icon" href="data:,">
<style>
:root{--deep:#14402f;--green:#2b6a50;--gold:#ffc76a;--cream:#f6f3e8;--ink:#20302a;--line:#d9d4c3}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:18px/1.55 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
header{background:var(--deep);color:#fff;padding:18px max(16px,env(safe-area-inset-left))}header b{font:700 22px/1.2 Georgia,serif}header small{display:block;opacity:.8;font-size:14px}
main{max-width:760px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-left)) 60px}
h1{font:700 32px/1.2 Georgia,serif;color:var(--deep);margin:0 0 8px}p{margin:0 0 16px}
form{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}input{flex:1 1 220px;font:inherit;padding:14px 16px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink)}
button,.btn{font:700 18px/1 inherit;font-family:inherit;background:var(--gold);color:var(--deep);border:0;border-radius:14px;padding:16px 22px;cursor:pointer;text-decoration:none;display:inline-block}
.err{color:#a3322a;font-weight:600}.grid{display:grid;gap:14px;margin-top:20px}
.card{display:block;background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;text-decoration:none;color:var(--ink)}
.card b{display:block;font:700 21px/1.3 Georgia,serif;color:var(--deep);margin-bottom:4px}.card span{font-size:16px;opacity:.85}
.card.big{border:2px solid var(--green)}.tag{display:inline-block;font:700 12px/1 inherit;letter-spacing:.08em;text-transform:uppercase;color:var(--green);margin-bottom:8px}
.note{font-size:15px;opacity:.8;margin-top:28px}.link{background:none;color:var(--green);padding:0;text-decoration:underline;font-weight:600;font-size:15px}
.center{min-height:70vh;display:flex;align-items:center;justify-content:center;text-align:center;flex-direction:column;padding:20px}
</style></head><body>
<div class="center" id="msg"><h1>Opening The Hinge Care Program…</h1><p>This can take a few seconds.</p></div>
<script src="lock.js"></script>
<script>
(async()=>{const p=pvGet();const m=document.getElementById('msg');
 if(!p){location.replace('index.html');return}
 try{const buf=await pvOpen('program.bin',p);document.open();document.write(new TextDecoder().decode(buf));document.close();}
 catch(e){m.innerHTML='<h1>That didn\'t open</h1><p>Go back and type the password again.</p><a class="btn" href="index.html">Back to the test page</a>';pvForget()}})();
</script></body></html>
