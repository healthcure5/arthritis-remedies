.top b{font:700 20px Lora,Georgia,serif}
.top small{display:block;font:500 13px Inter,sans-serif;color:#C7D8EA;margin-top:1px}
.top .back{margin-left:auto;background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:12px;padding:10px 16px;font-weight:600;min-height:48px}
main{max-width:760px;margin:0 auto;padding:22px max(18px,env(safe-area-inset-right)) 22px max(18px,env(safe-area-inset-left))}
.card{background:var(--card);border-radius:24px;padding:22px;box-shadow:0 2px 4px rgba(16,40,74,.06),0 20px 36px -22px rgba(16,40,74,.35);margin-bottom:18px}
.card.warm{background:var(--warm)}
.card.soft{background:var(--soft);box-shadow:none}
.card h3{font-size:21px;margin-bottom:8px}
.hero{background:radial-gradient(circle at 15% 0,#2C62B8,#0A1F44 70%);color:#fff;border-radius:28px;padding:28px 24px;margin-bottom:18px}
.hero h1{color:#fff;font-size:29px}
.hero p{color:#D7E2EE;margin:10px 0 20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(180deg,#FFD48A,#FFB84D);color:var(--navy);border:0;border-radius:16px;font-weight:800;font-size:20px;padding:16px 28px;min-height:60px;text-decoration:none;box-shadow:0 14px 26px -14px rgba(255,184,77,.9)}
.btn.sec{background:#fff;color:var(--navy);box-shadow:inset 0 0 0 2px #AEC6DF}
.btn.full{width:100%}
.btn.small{font-size:17px;min-height:52px;padding:12px 20px}
.linkbtn{background:none;border:0;color:var(--blue);font-weight:700;text-decoration:underline;padding:12px 4px;min-height:48px}
.hero .linkbtn{color:#fff}
.btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow{font:700 13px Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
.hero .eyebrow{color:var(--gold)}
h2{font-size:24px;margin:26px 0 12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:640px){.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{background:#fff;border:0;border-radius:20px;padding:16px;text-align:left;box-shadow:0 2px 4px rgba(16,40,74,.06),0 14px 24px -18px rgba(16,40,74,.4);display:flex;flex-direction:column;gap:6px;color:var(--ink);text-decoration:none;min-width:0}
.tile b{font:700 18px Lora,Georgia,serif;color:var(--navy);line-height:1.25}
.tile span{font-size:15px;color:var(--muted)}
.ico{width:56px;height:56px;border-radius:18px;background:linear-gradient(160deg,#E4EEFB,#C9DBF3);display:flex;align-items:center;justify-content:center;font-size:30px;flex:none}
.row{display:flex;align-items:center;gap:14px}
.list .item{display:flex;align-items:center;gap:14px;background:#fff;border-radius:20px;padding:14px;margin-bottom:10px;box-shadow:0 2px 4px rgba(16,40,74,.06);border:0;width:100%;text-align:left;text-decoration:none;color:var(--ink)}
.item>div:nth-child(2){flex:1;min-width:0}
.item b{display:block;font:700 18px Lora,Georgia,serif;color:var(--navy)}
.s{font-size:15px;color:var(--muted)}
.chip{display:inline-block;background:var(--soft);color:var(--blue);border-radius:999px;padding:4px 12px;font:700 13px Inter,sans-serif}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.chips button{border:0;background:#fff;color:var(--navy);border-radius:999px;padding:10px 16px;font-weight:600;box-shadow:inset 0 0 0 2px #C9DBF3;min-height:48px}
.chips button.on{background:var(--navy);color:#fff;box-shadow:none}
.swap{border:0;background:var(--soft);color:var(--navy);border-radius:12px;padding:8px 14px;font-weight:700;font-size:15px;min-height:48px;flex:none}
.steps{padding-left:22px;margin:12px 0}
.steps li{margin-bottom:10px}
.tip{background:var(--warm);border-left:5px solid var(--gold);border-radius:12px;padding:12px 16px;margin:14px 0}
.week{display:flex;gap:8px;justify-content:space-between;margin-top:14px}
.week div{flex:1;text-align:center;font:600 13px Inter,sans-serif;color:var(--muted);min-width:0}
.week i{display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:1;max-width:44px;margin:0 auto 4px;border-radius:50%;background:var(--soft);font-style:normal;font-size:16px;color:var(--muted)}
.week i.on{background:var(--ok);color:#fff}
.week i.today{box-shadow:0 0 0 3px var(--gold)}
.dots{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 8px}
.dots i{width:44px;height:44px;border-radius:50%;background:var(--soft);box-shadow:inset 0 0 0 2px #C9DBF3;display:flex;align-items:center;justify-content:center;font-style:normal;color:#fff;font-weight:800;font-size:20px}
.dots i.on{background:var(--ok);box-shadow:none}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:6px}
.stats div{background:#fff;border-radius:18px;padding:14px 8px;text-align:center;box-shadow:0 2px 4px rgba(16,40,74,.06)}
.stats b{display:block;font:700 28px Lora,Georgia,serif;color:var(--navy);font-variant-numeric:tabular-nums}
.stats span{font-size:13px;color:var(--muted)}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;box-shadow:0 -6px 24px rgba(10,31,68,.14);display:flex;padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));z-index:6}
.nav a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font:700 13px Inter,sans-serif;padding:8px 4px;border-radius:14px;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.nav a span{font-size:24px;line-height:1}
.nav a.on{color:var(--navy);background:var(--soft)}
.note{font-size:15px;color:var(--muted);margin:22px 0 0}
.mood{display:flex;gap:8px;justify-content:space-between;margin:14px 0 10px}
.mood button{flex:1;min-width:0;border:0;background:#fff;border-radius:16px;padding:12px 2px;font-size:30px;box-shadow:inset 0 0 0 2px #C9DBF3;min-height:72px}
.mood button small{display:block;font:600 13px Inter,sans-serif;color:var(--muted);margin-top:2px}
.mood button.on{background:var(--soft);box-shadow:inset 0 0 0 3px var(--blue)}
.opt{display:block;width:100%;text-align:left;background:#fff;border:0;border-radius:18px;padding:16px 18px;margin-bottom:10px;font-weight:700;font-size:18px;color:var(--navy);min-height:64px;box-shadow:inset 0 0 0 2px #C9DBF3}
.opt small{display:block;font-weight:500;font-size:15px;color:var(--muted);margin-top:2px}

.l1{background:#E3F4EA;color:#14532D}.l2{background:#FFF3D6;color:#7A4B00}.l3{background:#FDE7DF;color:#8A2C14}

{id:'finger-spread',n:'Finger spreads',a:'hands',p:'Seated',sides:1,h:20,steps:['Rest your hand on your lap or a table.','Slowly spread your fingers as wide as feels comfortable.','Hold, then slowly bring them back together.'],tip:'Keep it slow. Stop short of any sharp pain.'},
{id:'fist-open',n:'Soft fist and open',a:'hands',p:'Seated',sides:1,h:25,steps:['Gently curl your fingers into a loose fist.','Slowly open and stretch your fingers out long.','Repeat smoothly, like a slow wave.'],tip:'A loose fist is enough. Do not squeeze hard.'},
{id:'thumb-stretch',n:'Thumb across the palm',a:'hands',p:'Seated',sides:2,h:20,steps:['Hold one hand out with your palm up.','Use your other hand to guide the thumb gently across your palm.','Hold where you feel a light stretch.'],tip:'Light pressure only.'},

{id:'prayer-stretch',n:'Prayer stretch',a:'hands',p:'Seated',sides:1,h:20,steps:['Press your palms together in front of your chest.','Slowly lower your hands until you feel a light wrist stretch.','Breathe slowly and hold.'],tip:'Keep your shoulders relaxed and down.'},
{id:'chin-tuck',n:'Gentle chin tuck',a:'neck',p:'Seated',sides:1,h:15,steps:['Sit tall with your eyes looking ahead.','Gently draw your chin straight back, as if making a soft double chin.','Hold, then release slowly.'],tip:'This is a small movement.'},

{id:'neck-turn',n:'Easy neck turn',a:'neck',p:'Seated',sides:2,h:15,steps:['Sit tall, chin level.','Slowly turn your head to look over one shoulder.','Hold, then return to center.'],tip:'Turn only as far as is comfortable.'},
{id:'shoulder-rolls',n:'Shoulder rolls',a:'shoulders',p:'Seated or standing',sides:1,h:30,steps:['Let your arms hang loose.','Slowly roll your shoulders up, back and down.','After a few rolls, reverse the direction.'],tip:'Big, slow circles. Breathe easily.'},
{id:'blade-squeeze',n:'Shoulder blade squeeze',a:'shoulders',p:'Seated',sides:1,h:15,steps:['Sit tall with your arms by your sides.','Gently squeeze your shoulder blades together and down.','Hold for a moment, then relax.'],tip:'Do not shrug up toward your ears.'},

{id:'seated-twist',n:'Seated gentle twist',a:'back',p:'Seated',sides:2,h:20,steps:['Sit tall near the front of your chair.','Place one hand on the opposite knee.','Slowly turn your upper body and look over your shoulder.'],tip:'Turn from your middle, not your neck.'},
{id:'chest-opener',n:'Chest opener',a:'back',p:'Seated or standing',sides:1,h:20,steps:['Sit tall and gently clasp your hands behind your back, or hold the chair sides.','Slowly lift your chest and ease your shoulders back.','Breathe and hold.'],tip:'If clasping is hard, rest your hands on your hips.'},
{id:'seated-hamstring',n:'Seated leg stretch',a:'hips',p:'Seated',sides:2,h:25,steps:['Sit near the edge of your chair.','Straighten one leg with your heel on the floor and toes up.','Lean forward from the hips, back long, until you feel a light stretch.'],tip:'Keep the knee softly bent if it feels tight.'},
{id:'figure-four',n:'Seated figure four',a:'hips',p:'Seated',sides:2,h:25,steps:['Sit tall with both feet on the floor.','Rest one ankle across the opposite knee.','Lean forward slightly until you feel a light stretch at the hip.'],tip:'Skip this one if it hurts your knee or hip, or if you have had a hip replacement and your surgeon has not cleared it.'},
{id:'march',n:'Seated marching',a:'hips',p:'Seated',sides:1,h:30,steps:['Sit tall and hold the chair sides if you like.','Slowly lift one knee, then lower it.','Alternate legs in an easy rhythm.'],tip:'Keep it gentle and steady.'},
{id:'knee-extend',n:'Knee straightening',a:'feet',p:'Seated',sides:2,h:20,steps:['Sit tall with your feet flat.','Slowly straighten one knee and lift your foot.','Hold, then lower with control.'],tip:'Stop short of locking the knee hard.'},
{id:'ankle-circles',n:'Ankle circles',a:'feet',p:'Seated',sides:2,h:20,steps:['Lift one foot slightly off the floor.','Slowly draw circles with your toes.','Switch direction halfway through.'],tip:'Small circles are fine.'},
{id:'ankle-pumps',n:'Ankle pumps',a:'feet',p:'Seated',sides:1,h:25,steps:['Sit with your heels on the floor.','Lift your toes toward you, then press them down.','Repeat in a slow, steady rhythm.'],tip:'A good one to do any time you have been sitting.'},
{id:'calf-wall',n:'Calf stretch at the wall',a:'feet',p:'Standing, holding a wall',stand:1,alt:'ankle-pumps',sides:2,h:25,steps:['Stand facing a wall or sturdy counter with your hands on it.','Step one foot back, heel on the floor.','Bend the front knee gently until you feel a light calf stretch.'],tip:'Hold on for balance. Keep it light.'},
{id:'sit-stand',n:'Sit to stand',a:'strength',p:'From a sturdy chair',stand:1,alt:'knee-extend',sides:1,h:30,steps:['Sit near the front of a sturdy chair that will not slide, feet flat and hip-width apart.','Lean forward a little and press through your feet to stand up slowly. Use the armrests if you need to.','Pause, then sit back down slowly and with control.','Repeat at an easy pace, resting whenever you like.'],tip:'Using your hands is completely fine. Stop if your knees or hips hurt sharply.'},
{id:'heel-raise',n:'Heel raises at the counter',a:'strength',p:'Standing, holding a counter',stand:1,alt:'seated-heel',sides:1,h:25,steps:['Stand facing a kitchen counter or the back of a sturdy chair and hold on with both hands.','Slowly rise up onto your toes.','Pause, then lower your heels slowly.','Repeat at an easy pace.'],tip:'Keep holding on the whole time.'},
{id:'seated-heel',n:'Seated heel raises',a:'strength',p:'Seated',sides:1,h:25,steps:['Sit tall with your feet flat on the floor.','Lift both heels, keeping your toes on the floor.','Lower slowly and repeat.'],tip:'Press gently through the balls of your feet.'},
{id:'wall-push',n:'Wall push-ups',a:'strength',p:'Standing, at a wall',stand:1,alt:'palm-press',sides:1,h:25,steps:['Stand an arm\'s length from a wall with your feet hip-width apart.','Place your palms flat on the wall at shoulder height.','Slowly bend your elbows to bring your chest toward the wall.','Push gently back to the start. Repeat at an easy pace.'],tip:'Stand closer to the wall to make it easier.'},
{id:'palm-press',n:'Seated palm press',a:'strength',p:'Seated',sides:1,h:20,steps:['Sit tall and press your palms together in front of your chest.','Press gently for a slow count of five, then relax.','Repeat until the timer ends.'],tip:'Keep breathing. Do not hold your breath.'},
{id:'belly-breath',n:'Slow belly breathing',a:'calm',p:'Seated or lying down',calm:1,sides:1,h:60,steps:['Get comfortable and rest one hand on your belly.','Breathe in slowly through your nose and feel your belly rise.','Breathe out slowly, as if through a straw.'],tip:'There is no right way. Just slow down a little.'},
{id:'long-out',n:'Longer breath out',a:'calm',p:'Seated or lying down',calm:1,sides:1,h:60,steps:['Breathe in gently for a count of four.','Breathe out slowly for a count of six.','Let your shoulders drop each time you breathe out.'],tip:'If counting feels like work, just make the breath out a little longer.'},
{id:'soften',n:'Soften and let go',a:'calm',p:'Seated or lying down',calm:1,sides:1,h:60,steps:['Close your eyes if you like.','Notice your jaw, your shoulders and your hands.','Each time you breathe out, let one of them soften a little.'],tip:'Rest is part of looking after your joints.'}
];

{id:'morning',n:'Morning wake-up',e:'🌅',d:'Ease into the day, from head to toe.',ids:['neck-tilt','shoulder-rolls','seated-cat-cow','seated-twist','march','ankle-circles']},
{id:'chair',n:'Chair reset',e:'🪑',d:'A break for any time you have been sitting.',ids:['chin-tuck','blade-squeeze','cross-arm','chest-opener','seated-hamstring','ankle-pumps']},

const LEARN=[
{t:'Why gentle movement helps',b:'Joints are made to move. Regular, gentle movement keeps the muscles around them working and can make everyday tasks feel a little easier. Little and often tends to suit stiff joints better than a lot all at once.'},
{t:'A little soreness can be normal',b:'When you start moving more, you may feel some mild soreness. That is common, and it usually settles as your body gets used to it. Sharp, severe or worsening pain is different. That is a sign to stop and ease off.'},
{t:'The two-hour check',b:'Notice how your joints feel about two hours after you stretch. If they feel worse than before you started, do a little less next time: shorter holds, fewer moves, or the Easy day routine. You do not need to stop moving altogether.'},
{t:'How much should a stretch feel?',b:'Aim for a gentle pull, never pain. Think of a scale from 0 (nothing) to 10 (the worst pain you can imagine). From 0 to 3 is fine. At 4 or 5, go gentler or shorter. Above 5, or if pain is sharp or getting worse as you move, stop that stretch.'},
{t:'Flare days happen',b:'Flares are not your fault, and one bad day does not undo your progress. On those days, smaller movements, seated stretches, warmth and rest breaks can help you get through. The Easy day routine and the Breathing break are there for exactly this.'},
{t:'Warm up first',b:'Stiff joints often loosen after a few minutes of easy movement. A warm shower, or a warm (not hot) pack for a few minutes before you stretch, may also help you feel looser.'},
{t:'Missing a day is fine',b:'This app counts your week, not unbroken days. Missing a day, or a few, is part of real life. Whenever you come back, start gently and pick up where you are.'},
{t:'Breathe while you hold',b:'It is easy to hold your breath while you stretch. Try breathing slowly in through your nose and out through your mouth. A relaxed breath helps your muscles relax too.'},
{t:'Strength matters too',b:'Stretching helps you move, and gentle strength work helps your muscles support your joints. Simple moves like standing up from a chair or heel raises at a counter count. You will find them in the Gentle strength routine.'},
{t:'Pacing your day',b:'Spread bigger jobs across the day and the week. Break a large task into smaller pieces, with rests in between. Stopping before you are worn out often lets you do more overall.'},
{t:'Sleep and stiff joints',b:'Poor sleep can make pain feel louder, and pain can make sleep harder. A regular bedtime, a calm wind-down and the Evening wind-down routine may help you settle.'},
{t:'Walking counts',b:'Short, easy walks are good for your whole body. Start with what feels comfortable, even a few minutes, and build slowly. Supportive shoes and level paths make it easier.'},
{t:'Be kind to your hands',b:'Tools with bigger handles, jar openers and lifting with two hands can take strain off sore fingers and wrists. Small changes to how you do everyday jobs add up.'},
{t:'Notice what helps',b:'Your Progress page shows the days you moved and how your joints felt. Over a few weeks, you may start to notice patterns, like which routines or times of day suit you best.'},
{t:'Mood and pain are linked',b:'Living with pain can wear you down, and feeling low can make pain harder to cope with. Gentle activity, time outdoors and talking with people you trust can all help. If low mood lasts, please talk to your doctor.'},
{t:'Talking with your doctor',b:'The Progress page has a one-page summary of your sessions and how your joints have felt. You can print it or show it on your phone at your next appointment.'},
{t:'Medicines and movement',b:'Keep taking anything you have been prescribed. Only change or reduce a medicine after speaking with your doctor. Stretching works alongside your care, not instead of it.'},
{t:'Cold weather and stiffness',b:'Many people feel stiffer when it is cold or damp. Warm layers, gloves and a few extra minutes of warm-up can make those days easier.'},
{t:'Celebrate small wins',b:'Opening a jar more easily or getting up from a chair with less effort is real progress. Take a moment to notice it. Small steps really do add up.'},
{t:'Steady on your feet',b:'For any standing move, hold a sturdy counter or chair back. Clear the floor around you, wear non-slip shoes and make sure the room is well lit. You can switch on "Seated only" in Settings at any time.'},

function norm(d){
 d.sessions=Array.isArray(d.sessions)?d.sessions:[];d.checkins=Array.isArray(d.checkins)?d.checkins:[];
 d.favs=d.favs||[];d.hidden=d.hidden||[];d.swaps=d.swaps||{};d.focus=d.focus||[];d.acts=d.acts||[];
 d.hold=+d.hold||0;d.voice=d.voice===undefined?true:!!d.voice;d.level=d.level===undefined?1:+d.level;
 d.goal=+d.goal||3;d.seated=!!d.seated;d.activity=d.activity||'';d.text=+d.text||1;d.hc=!!d.hc;d.slow=!!d.slow;

function pd(s){const p=s.split('-');return new Date(+p[0],p[1]-1,+p[2])}
function daysBetween(a,b){return Math.round((pd(b)-pd(a))/864e5)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function daysSet(){const o={};st.sessions.forEach(s=>o[s.date]=1);return o}
function weekStart(d){d=new Date(d.getFullYear(),d.getMonth(),d.getDate());d.setDate(d.getDate()-((d.getDay()+6)%7));return d}
function weekCount(ws){const o=daysSet();let n=0;const d=new Date(ws);for(let i=0;i<7;i++){if(o[ymd(d)])n++;d.setDate(d.getDate()+1)}return n}
function weekStreak(){let ws=weekStart(new Date()),n=0;if(weekCount(ws)>=st.goal)n++;ws.setDate(ws.getDate()-7);while(weekCount(ws)>=st.goal&&n<520){n++;ws.setDate(ws.getDate()-7)}return n}
function monthDays(){const p=ymd().slice(0,7);return Object.keys(daysSet()).filter(k=>k.slice(0,7)===p).length}
function todayMood(){const t=st.checkins.filter(c=>c.date===ymd()).slice(-1)[0];return t?t.m:0}
function lastSession(){return st.sessions[st.sessions.length-1]}
function hold(s,r){if(s.calm)return s.h;const base=st.hold||s.h,lv=r&&r.easy?0:st.level;return Math.max(10,Math.round(base*LEVELS[lv][0]/5)*5)}
function resolve(r){
 const used=[],out=[],sw=st.swaps[r.id]||{};
 r.ids.forEach((id0,i)=>{let id=sw[i]||id0,s=SB[id];if(!s)return;
  if((st.seated||r.easy)&&s.stand&&s.alt)id=s.alt;
  const bad=x=>!x||st.hidden.includes(x)||used.includes(x)||((st.seated||r.easy)&&SB[x].stand);
  if(bad(id)){const a=S.find(x=>x.a===SB[id].a&&!bad(x.id));if(!a)return;id=a.id}
  used.push(id);out.push(id)});
 return out}
function routineSecs(r){return resolve(r).reduce((t,i)=>t+hold(SB[i],r)*SB[i].sides,0)}
function mins(sec){return Math.max(1,Math.round(sec/60))}
function equipment(r){const ids=resolve(r);if(ids.every(i=>SB[i].calm))return'A comfortable seat';return ids.some(i=>SB[i].stand)?'A sturdy chair, and a wall or counter to hold on to':'A sturdy chair'}
function dueFollowUp(){const s=lastSession();if(!s||s.asked||s.date>=ymd())return null;return daysBetween(s.date,ymd())<=3?s:null}
function persistentSore(){
 const c=st.checkins.slice(-3);
 if(c.length===3&&c.every(x=>x.m===1)&&daysBetween(c[0].date,c[2].date)<=2&&daysBetween(c[2].date,ymd())<=2)return true;
 const w=st.sessions.filter(s=>s.asked).slice(-2);return w.length===2&&w.every(s=>s.worse)&&daysBetween(w[1].date,ymd())<=7}
function greet(){const h=new Date().getHours();return h<12?'Good morning':h<18?'Good afternoon':'Good evening'}
function plan(){
 const m=todayMood(),h=new Date().getHours();
 if(st.lighten===ymd())return{r:'easy',why:'Your last session left your joints sore for a while, so today is a lighter one.'};
 if(m===1)return{r:'easy',why:'Thanks for telling us. Let\'s keep it very gentle today. Rest is fine too.'};
 if(m===2)return{r:'morning',why:'Let\'s warm up slowly, from head to toe.'};
 let r=h<12?'morning':h<18?'chair':'evening';
 if(st.focus.length&&h>=11&&h<18){const f=st.focus[new Date().getDate()%st.focus.length];r=AREA_ROUTINE[f]||r}
 return{r,why:'About '+mins(routineSecs(RB[r]))+' minutes, at your own pace.'}}
let voices=[];function pickVoice(){try{voices=speechSynthesis.getVoices()}catch(e){}}
if('speechSynthesis' in window){pickVoice();try{speechSynthesis.onvoiceschanged=pickVoice}catch(e){}}
function say(t){if(!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=st.slow?.8:.9;const v=voices.find(v=>/en(-|_)/i.test(v.lang)&&/natural|samantha|karen|daniel|google/i.test(v.name));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
function speak(t){if(st.voice)say(t)}
function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=600;g.gain.value=.06;o.connect(g);g.connect(c.destination);o.start();setTimeout(()=>{o.stop();c.close()},180)}catch(e){}}
function applyPrefs(){document.body.classList.remove('t1','t2','t3');document.body.classList.add('t'+st.text);document.body.classList.toggle('hc',st.hc)}
function dl(name,type,text){const b=new Blob([text],{type}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},500)}

 +`<button class="btn full" id="next">Next</button>${skip}`}
 if(step===2){h=pr+`<h1 style="font-size:27px;margin-bottom:16px">How do you feel about standing for five minutes?</h1>`

 +ACTS.map(a=>`<button class="opt ${st.activity===a?'on':''}" data-v="${esc(a)}">${esc(a)}</button>`).join('')+skip}
 if(step===4){h=pr+`<h1 style="font-size:27px;margin-bottom:6px">How many days a week would you like to stretch?</h1><p class="s" style="margin-bottom:16px">Any session counts, even one minute. Most experts suggest at least three days a week.</p>`
 +[2,3,4,5].map(n=>`<button class="opt ${st.goal===n?'on':''}" data-v="${n}">${n} days a week${n===3?'<small>Suggested</small>':''}</button>`).join('')}
 if(step===5){h=`<div style="text-align:center;padding-top:20px"><div class="tick" aria-hidden="true"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
 <h1 style="font-size:30px;margin:10px 0">You're all set</h1><p>Your goal is <b>${st.goal} days a week</b>. Each day, tell us how your joints feel and we'll suggest a routine to match.</p>

 app.innerHTML=h;window.scrollTo(0,0);
 const nx=()=>go('#/start/'+(step+1));
 const ok=document.getElementById('ok');if(ok)ok.onclick=()=>{if(step===0){st.safety=true;save();nx()}else{st.onboarded=true;save();go('#/home')}};
 const sk=document.getElementById('skip');if(sk)sk.onclick=nx;
 const n=document.getElementById('next');if(n)n.onclick=nx;
 if(step===1)on('.opt','click',b=>{const k=b.dataset.k,i=st.focus.indexOf(k);if(i>-1)st.focus.splice(i,1);else{if(st.focus.length>=3)st.focus.shift();st.focus.push(k)}save();onboard(1)});
 if(step===2)on('.opt','click',b=>{st.seated=b.dataset.v==='sit';save();nx()});
 if(step===3)on('.opt','click',b=>{st.activity=b.dataset.v;save();nx()});
 if(step===4)on('.opt','click',b=>{st.goal=+b.dataset.v;save();nx()});
}

function home(){
 shell('home');const p=plan(),r=RB[p.r],m=todayMood(),ls=lastSession(),wc=weekCount(weekStart(new Date())),ws=weekStreak();
 const away=ls&&daysBetween(ls.date,ymd())>3,doneToday=daysSet()[ymd()];
 let h='';

 h+=`<div class="card"><h3>This week</h3><div class="dots" aria-label="${Math.min(wc,st.goal)} of ${st.goal} days this week">${Array.from({length:Math.max(st.goal,wc)},(_,i)=>`<i class="${i<wc?'on':''}">${i<wc?'✓':''}</i>`).join('')}</div><p><b>${Math.min(wc,st.goal)} of ${st.goal} days</b> this week. ${wc>=st.goal?'You\'ve reached your goal. Anything more is a bonus.':'Every minute counts.'}</p>${ws>1?`<p class="s" style="margin-top:6px">You've met your goal ${ws} weeks in a row.</p>`:''}</div>`;
 h+=`<div class="card warm"><h3>Having a flare or a sore day?</h3><p>Rest is part of looking after your joints. If you'd like to move, try one of these very gentle options.</p><div class="btns" style="margin-top:12px"><a class="btn small sec" href="#/r/easy">🌤️ Easy day</a><a class="btn small sec" href="#/r/breathe">🌬️ Breathing break</a></div><p style="margin-top:10px"><a href="#/flare">What helps on flare days</a></p></div>`;
 if(st.focus.length)h+=`<h2>Picked for your joints</h2><div class="grid three">`+[...new Set(st.focus.map(f=>AREA_ROUTINE[f]))].map(id=>tileR(RB[id])).join('')+`</div>`;
 h+=`<h2>All routines</h2><div class="grid three">${R.filter(x=>x.id!==r.id).map(tileR).join('')}</div>`;

 app.innerHTML=h;

/* ================= safety ================= */
function safetyHTML(){return`<div class="flags"><p>Most aches settle with rest and gentle movement. These signs need attention.</p>
<h3>Call 911 (or your local emergency number) for:</h3><ul><li>Chest pain or pressure</li><li>Severe shortness of breath</li><li>Fainting</li><li>Sudden weakness or numbness of the face, arm or leg, or slurred speech</li></ul>
<h3>Stop and contact a doctor the same day if you have:</h3><ul><li>A joint that is suddenly hot, red and swollen, especially with a fever or feeling unwell</li><li>Not being able to put weight on a leg, or a joint that looks out of shape after a fall or twist</li><li>New numbness or tingling in both legs, numbness around the groin or buttocks, or new bladder or bowel problems</li><li>A painful, swollen, warm calf</li><li>A joint that keeps giving way or locking</li></ul>
<h3>See your doctor soon if you have:</h3><ul><li>Pain that wakes you at night or keeps getting worse over weeks</li><li>Unexplained weight loss or fever</li><li>Several swollen joints with morning stiffness that lasts more than about half an hour</li><li>Pain that is still worse a day or two after gentle stretching</li></ul>
<h3>While you stretch</h3><div class="light"><div class="l1">0 to 3 out of 10: a gentle pull or mild discomfort. Fine to continue.</div><div class="l2">4 to 5 out of 10: go gentler or shorter.</div><div class="l3">Above 5, sharp, or getting worse as you move: stop that stretch.</div></div>
<p>If your joints hurt more two hours after stretching than before, do less next time. You do not need to stop moving altogether.</p></div>`}
function safety(){shell('',true);app.innerHTML=`<h1 style="font-size:30px;margin-bottom:12px">When to stop and get help</h1><div class="card">${safetyHTML()}</div><p class="note">This list is general information. If you are ever unsure, contact your doctor.</p>`}

/* ================= progress ================= */
function progress(){
 shell('progress');const total=st.sessions.reduce((a,s)=>a+(s.sec||0),0),wc=weekCount(weekStart(new Date()));
 let d=new Date();d.setDate(d.getDate()-27);const o=daysSet(),names=['S','M','T','W','T','F','S'];
 let cal='<div class="week" style="margin-bottom:6px">'+names.map(n=>'<div>'+n+'</div>').join('')+'</div>';const cells=[];for(let i=0;i<d.getDay();i++)cells.push('<div></div>');
 for(let j=0;j<28;j++){const k=ymd(d);cells.push(`<div><i class="${o[k]?'on':''}${j===27?' today':''}">${o[k]?'✓':d.getDate()}</i></div>`);d.setDate(d.getDate()+1)}
 let rows='';for(let q=0;q<cells.length;q+=7){const c=cells.slice(q,q+7);while(c.length<7)c.push('<div></div>');rows+='<div class="week">'+c.join('')+'</div>'}
 const ck=st.checkins.slice(-7).map(c=>`<div><i style="background:none;font-size:26px">${MOODS[c.m-1][0]}</i>${pd(c.date).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</div>`).join('');
 const good=a=>a.length?a.filter(c=>c.m>=4).length/a.length:0,t=ymd();
 const recent2=st.checkins.filter(c=>daysBetween(c.date,t)<14),prev2=st.checkins.filter(c=>{const x=daysBetween(c.date,t);return x>=14&&x<28});
 let trend='';if(recent2.length>=3&&prev2.length>=3){const a=good(recent2),b=good(prev2);trend=a>b+.1?'Your joints felt "Good" or "Great" more often in the last two weeks.':a<b-.1?'Your joints have felt sore more often lately. Go gently, and try the Easy day routine on harder days.':'How your joints feel has been fairly steady over the last month.'}
 const lastAct=st.acts[st.acts.length-1],firstAct=st.acts[0],actDue=st.activity&&(!lastAct||daysBetween(lastAct.date,t)>=14);
 const recent=st.sessions.slice(-5).reverse().map(s=>`<div class="item"><div class="ico">✅</div><div><b>${esc(s.name)}</b><span class="s">${pd(s.date).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})} · ${mins(s.sec)} min${s.feel?' · felt '+({easy:'too easy',right:'just right',hard:'too hard'})[s.feel]:''}</span></div></div>`).join('');
 let h=`<h1 style="font-size:30px;margin-bottom:14px">Your progress</h1><div class="stats"><div><b>${monthDays()}</b><span>days you moved this month</span></div><div><b>${weekStreak()}</b><span>weeks goal met in a row</span></div><div><b>${mins(total)}</b><span>total minutes</span></div></div>
 <h2>This week</h2><div class="card"><div class="dots">${Array.from({length:Math.max(st.goal,wc)},(_,i)=>`<i class="${i<wc?'on':''}">${i<wc?'✓':''}</i>`).join('')}</div><p><b>${Math.min(wc,st.goal)} of ${st.goal} days.</b> <a href="#/settings">Change your goal</a></p></div>`;
 if(st.activity){h+=`<h2>${esc(st.activity)}</h2><div class="card">`;
  if(actDue)h+=`<p>How easy is this for you right now?</p><div class="nums" role="group" aria-label="0 means very hard, 10 means very easy">${Array.from({length:11},(_,i)=>`<button data-v="${i}">${i}</button>`).join('')}</div><div class="scale"><span>0 = very hard</span><span>10 = very easy</span></div>`;
  else h+=`<p style="font-size:20px"><b>${lastAct.v} out of 10</b> <span class="s">(10 = very easy)</span></p>${st.acts.length>1?`<p class="s">When you started: ${firstAct.v} out of 10. ${lastAct.v>firstAct.v?'That\'s real progress.':''}</p>`:''}<p class="s" style="margin-top:6px">We'll ask again in about two weeks.</p>`;
  h+=`</div>`}
 h+=`<h2>Last 4 weeks</h2><div class="card">${cal}${rows}</div>
 <h2>How your joints felt</h2><div class="card">${ck?`<div class="week">${ck}</div>${trend?`<p style="margin-top:12px">${trend}</p>`:''}`:'Tap a face on the Today page to start tracking how you feel.'}</div>
 <h2>Recent sessions</h2><div class="list">${recent||'<div class="card">Your finished routines will show up here.</div>'}</div>
 <div class="btns" style="margin-top:8px"><a class="btn sec small" href="#/summary">Summary for your doctor</a><a class="btn sec small" href="#/settings">Settings</a></div>
 <p class="note">Your progress is saved on this device only. We don't collect it. You can save a backup in Settings.</p>`;
 app.innerHTML=h;
 on('.nums button','click',b=>{st.acts.push({date:ymd(),v:+b.dataset.v});save();progress()});
}
function summary(){
 shell('progress',true);const t=ymd(),ss=st.sessions.filter(s=>daysBetween(s.date,t)<28),cc=st.checkins.filter(c=>daysBetween(c.date,t)<28);
 const counts=MOODS.map((m,i)=>cc.filter(c=>c.m===i+1).length);
 app.innerHTML=`<div class="noprint btns" style="margin-bottom:14px"><button class="btn small" id="pr">Print this page</button></div>
 <div class="card"><h1 style="font-size:26px">Gentle Stretch summary</h1><p class="s">Last 4 weeks, up to ${pd(t).toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'})}</p>
 <h3 style="margin-top:18px">Activity</h3><p>${(n=>n+(n===1?' day':' days'))(new Set(ss.map(s=>s.date)).size)} with a stretching session, ${mins(ss.reduce((a,s)=>a+(s.sec||0),0))} minutes in total. Weekly goal: ${st.goal} days.</p>
 <h3 style="margin-top:16px">How joints felt (daily check-ins)</h3><p>${cc.length?MOODS.map((m,i)=>m[1]+': '+counts[i]).join(' · '):'No check-ins recorded.'}</p>
 <h3 style="margin-top:16px">Sessions that felt too hard, or left joints worse for over two hours</h3><p>${ss.filter(s=>s.feel==='hard').length} felt too hard · ${ss.filter(s=>s.worse).length} left joints worse · ${ss.filter(s=>s.hurt).length} included a "This hurts" stop</p>
 ${st.activity&&st.acts.length?`<h3 style="margin-top:16px">${esc(st.activity)} (0 = very hard, 10 = very easy)</h3><p>${st.acts.slice(-4).map(a=>pd(a.date).toLocaleDateString(undefined,{month:'short',day:'numeric'})+': '+a.v).join(' · ')}</p>`:''}
 ${st.focus.length?`<h3 style="margin-top:16px">Joints of most concern</h3><p>${st.focus.map(f=>AREAS[f].n).join(', ')}</p>`:''}
 <p class="s" style="margin-top:18px">Recorded by the person using the Gentle Stretch app. Self-reported, for discussion with a health professional.</p></div>`;
 document.getElementById('pr').onclick=()=>window.print();
}

 <div class="card set"><h3>Text size</h3><div class="chips">${[[1,'Large'],[2,'Larger'],[3,'Largest']].map(x=>`<button data-t="${x[0]}" class="${st.text===x[0]?'on':''}">${x[1]}</button>`).join('')}</div>

 ${st.hidden.length?`<div class="card set"><h3>Stretches you asked us not to suggest</h3>${st.hidden.map(i=>`<div class="row" style="justify-content:space-between;padding:6px 0"><span>${SB[i]?SB[i].n:i}</span><button class="swap" data-un="${i}">Show again</button></div>`).join('')}</div>`:''}
 <div class="card set"><h3>Your data</h3><p class="s" style="margin-bottom:10px">Everything stays on this device. Clearing your browser can erase it, so save a backup now and then.</p>
 <div class="btns"><button class="btn small sec" id="bk">Save a backup file</button><label class="btn small sec" for="rs" style="cursor:pointer">Restore from a backup</label><input type="file" id="rs" accept=".json,application/json" hidden></div>
 <div id="clr" style="margin-top:14px"><button class="linkbtn" id="clr1" style="color:var(--alert)">Clear all my data</button></div></div>
 <div class="card set"><h3>Safety</h3><a href="#/safety">When to stop and get help</a><p class="note" style="margin-top:10px">Gentle Stretch offers general wellness information. It does not diagnose or treat any condition and is not a substitute for advice from your doctor or physical therapist.</p></div>`;
 on('[data-t]','click',b=>{st.text=+b.dataset.t;save();applyPrefs();settings()});
 document.getElementById('hc').onchange=e=>{st.hc=e.target.checked;save();applyPrefs()};
 document.getElementById('voice').onchange=e=>{st.voice=e.target.checked;save()};
 document.getElementById('slow').onchange=e=>{st.slow=e.target.checked;save()};
 document.getElementById('seat').onchange=e=>{st.seated=e.target.checked;save()};
 on('[data-g]','click',b=>{st.goal=+b.dataset.g;save();settings()});
 on('#rd button','click',b=>{const d=b.dataset.d,i=st.rem.days.indexOf(d);i>-1?st.rem.days.splice(i,1):st.rem.days.push(d);save();b.classList.toggle('on')});
 document.getElementById('rt').onchange=e=>{st.rem.time=e.target.value||'09:00';save()};
 document.getElementById('ics').onclick=()=>{if(!st.rem.days.length)return settings('Pick at least one day first.');makeICS();settings('Your calendar file is ready. Open it to add the reminder to your calendar.')};
 on('[data-un]','click',b=>{st.hidden=st.hidden.filter(x=>x!==b.dataset.un);save();settings()});
 document.getElementById('bk').onclick=()=>{dl('gentle-stretch-backup-'+ymd()+'.json','application/json',JSON.stringify(st,null,1));settings('Backup saved. Keep the file somewhere safe.')};
 document.getElementById('rs').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d||!Array.isArray(d.sessions))throw 0;st=norm(d);save();applyPrefs();settings('Your backup has been restored.')}catch(x){settings('That file could not be read. Please choose a Gentle Stretch backup file.')}};rd.readAsText(f)};
 document.getElementById('clr1').onclick=()=>{document.getElementById('clr').innerHTML=`<p><b>Clear everything?</b> This removes your sessions, check-ins and settings from this device and cannot be undone.</p><div class="btns" style="margin-top:10px"><button class="btn small sec" id="clrno">Keep my data</button><button class="btn small" id="clryes" style="background:#FDE7DF;color:var(--alert);box-shadow:none">Yes, clear it</button></div>`;
  document.getElementById('clrno').onclick=()=>settings();document.getElementById('clryes').onclick=()=>{try{localStorage.removeItem(KEY)}catch(e){}st=norm({});applyPrefs();go('#/start/0')}};

function makeICS(){
 const [hh,mm]=st.rem.time.split(':').map(Number),order=['SU','MO','TU','WE','TH','FR','SA'];let d=new Date();d.setHours(hh,mm,0,0);
 for(let i=0;i<8;i++){if(st.rem.days.includes(order[d.getDay()])&&d>new Date())break;d.setDate(d.getDate()+1);d.setHours(hh,mm,0,0)}
 const f=x=>ymd(x).replace(/-/g,'')+'T'+String(x.getHours()).padStart(2,'0')+String(x.getMinutes()).padStart(2,'0')+'00';const e=new Date(d.getTime()+10*6e4);
 const now=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');const url=location.href.split('#')[0];
 const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Gentle Stretch//EN','BEGIN:VEVENT','UID:gs-'+Date.now()+'@gentlestretch','DTSTAMP:'+now,'DTSTART:'+f(d),'DTEND:'+f(e),'RRULE:FREQ=WEEKLY;BYDAY='+st.rem.days.join(','),'SUMMARY:A gentle stretch','DESCRIPTION:A gentle stretch is ready when you are. '+url,'URL:'+url,'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:A gentle stretch is ready when you are','TRIGGER:PT0M','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');

/* ================= player ================= */
let P=null,tick=null;
function prepFirst(){return st.slow?12:8}
function prepGap(){return st.slow?9:6}
function startPlay(r){
 const seg=[];resolve(r).forEach(i=>{const s=SB[i];for(let k=0;k<s.sides;k++)seg.push({s,side:s.sides>1?(k?'Other side':'First side'):'',sec:hold(s,r)})});
 if(!seg.length)return;
 P={r,seg,i:0,phase:'prep',left:prepFirst(),paused:false,total:seg.reduce((a,x)=>a+x.sec,0),spent:0,hurt:0,panel:''};
 document.getElementById('player').hidden=false;document.body.style.overflow='hidden';
 drawPlay();speak('Get comfortable. First, '+seg[0].s.n+'. '+seg[0].s.steps.join(' '));
 clearInterval(tick);tick=setInterval(step,1000);
}
function toHold(){P.phase='hold';P.left=P.seg[P.i].sec;beep();speak(P.seg[P.i].s.calm?'Begin.':'Hold gently, and breathe.')}
function toNext(){
 if(P.i>=P.seg.length-1){finish(false);return}
 P.i++;P.phase='prep';P.left=prepGap();const n=P.seg[P.i],prev=P.seg[P.i-1];
 if(prev.s===n.s&&n.side)speak('Switch to the other side.');else speak('Next, '+n.s.n+'. '+n.s.steps.join(' '));
}
function step(){
 if(!P||P.paused||P.panel)return;
 P.left--;if(P.phase==='hold')P.spent++;
 if(P.left<=0){if(P.phase==='prep')toHold();else{toNext();if(!P)return}}
 drawPlay();
}
function drawPlay(){
 const el=document.getElementById('player'),sg=P.seg[P.i],pct=Math.min(100,P.spent/P.total*100),prep=P.phase==='prep';
 const dur=prep?(P.i===0?prepFirst():prepGap()):sg.sec,frac=Math.max(0,P.left/dur),C=2*Math.PI*52;
 el.className='play';
 let panel='';
 if(P.panel==='hurt')panel=`<div class="panel" role="dialog" aria-modal="true" aria-labelledby="ph"><div class="sheet"><h3 id="ph">Let's ease off</h3><p style="margin-bottom:14px">Sharp or worsening pain is a sign to stop. What would you like to do?</p>
 <button class="opt" data-o="gentle">Try a gentler version<small>${sg.s.alt?'Switch to '+SB[sg.s.alt].n:'Shorter hold, and only move half as far'}</small></button>
 <button class="opt" data-o="skip">Skip this stretch</button><button class="opt" data-o="stop">Stop for today<small>What you've done still counts</small></button>
 <button class="linkbtn" data-o="back">It's okay now, keep going</button></div></div>`;
 if(P.panel==='safety')panel=`<div class="panel" role="dialog" aria-modal="true"><div class="sheet"><h3>When to stop</h3>${safetyHTML()}<button class="btn full" data-o="back" style="margin-top:12px">Back to my routine</button></div></div>`;
 el.innerHTML=`<div class="meta"><span>${esc(P.r.n)}</span><div class="btns" style="flex:none;gap:6px"><button class="x" id="when">When to stop</button><button class="x" id="quit">End</button></div></div><div class="bar"><i style="width:${pct}%"></i></div>
 <div class="side">${prep?(P.i===0?'Get comfortable':'Next up'):'Stretch '+(P.i+1)+' of '+P.seg.length}${sg.side?' · '+sg.side:''}</div><h2>${esc(sg.s.n)}</h2>
 <div class="ring"><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="9"/><circle cx="60" cy="60" r="52" fill="none" stroke="${prep?'#9CC0F0':'#FFC56B'}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-frac)).toFixed(1)}"/></svg><div class="t" aria-live="off"><b>${P.left}</b><span>${prep?'get into position':(sg.s.calm?'breathe slowly':'hold gently')}</span></div></div>
 <p class="how">${esc(sg.s.steps.join(' '))}</p><p class="how" style="font-size:16px;color:var(--gold)">${esc(sg.s.tip)}</p>
 <div class="ctl"><button id="prev" aria-label="Previous stretch">⏮ Back</button><button class="go" id="pp">${P.paused?'▶ Resume':'⏸ Pause'}</button><button id="next" aria-label="Skip this stretch">Skip ⏭</button></div>
 <button class="hurt" id="hurt">This hurts</button>${panel}`;
 document.getElementById('quit').onclick=()=>{if(P.spent>=30)finish(true);else closePlay()};
 document.getElementById('when').onclick=()=>{P.panel='safety';drawPlay()};
 document.getElementById('pp').onclick=()=>{P.paused=!P.paused;if(P.paused)try{speechSynthesis.cancel()}catch(e){}drawPlay()};
 document.getElementById('next').onclick=()=>{toNext();if(P)drawPlay()};
 document.getElementById('prev').onclick=()=>{if(P.i>0)P.i--;P.phase='prep';P.left=prepGap();speak(P.seg[P.i].s.n);drawPlay()};
 document.getElementById('hurt').onclick=()=>{P.panel='hurt';P.hurt++;try{speechSynthesis.cancel()}catch(e){}drawPlay();const f=el.querySelector('.sheet button');if(f)f.focus()};
 el.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{const o=b.dataset.o;P.panel='';
  if(o==='gentle'){const s=P.seg[P.i].s;if(s.alt&&SB[s.alt]){const a=SB[s.alt],rest=P.seg.slice(P.i).filter(x=>x.s!==s),add=[];for(let k=0;k<a.sides;k++)add.push({s:a,side:a.sides>1?(k?'Other side':'First side'):'',sec:Math.max(10,Math.round(hold(a,P.r)*.7))});P.seg=P.seg.slice(0,P.i).concat(add,rest);P.total=P.seg.reduce((t,x)=>t+x.sec,0);P.phase='prep';P.left=prepGap();speak('Let\'s try '+a.n+' instead. '+a.steps.join(' '))}
   else{P.seg.forEach(x=>{if(x.s===s)x.sec=Math.max(10,Math.round(x.sec/2))});if(P.phase==='hold')P.left=Math.min(P.left,P.seg[P.i].sec);speak('Shorter hold. Only move half as far.')}}
  if(o==='skip'){toNext();if(!P)return}
  if(o==='stop'){finish(true);return}
  drawPlay()});
}
function closePlay(){clearInterval(tick);P=null;try{speechSynthesis.cancel()}catch(e){}const el=document.getElementById('player');el.hidden=true;el.innerHTML='';document.body.style.overflow='';render()}
let FIN=null;
function finish(early){
 clearInterval(tick);const r=P.r,sec=Math.max(early?P.spent:P.total,30),hurt=P.hurt;P=null;
 const sess={date:ymd(),name:r.n,rid:r.id,sec};if(hurt)sess.hurt=hurt;if(early)sess.partial=true;
 st.sessions.push(sess);if(hurt){const t=new Date();t.setDate(t.getDate()+1);st.lighten=ymd(t)}save();
 const card=LEARN[st.seen%LEARN.length];st.seen++;save();
 FIN={sess,card,feel:'',offer:'',early,hurt};speak(early?'You can stop here. What you did still counts.':'Well done. You moved today.');drawFinish();
}
function drawFinish(){
 const el=document.getElementById('player'),F=FIN,wc=weekCount(weekStart(new Date()));el.className='play';
 let resp='';
 if(F.feel==='hard')resp=st.level>0&&F.offer!=='done'?`<div class="sheetin"><h3>Thanks for telling us</h3><p>Would you like shorter holds next time?</p><div class="btns" style="margin-top:10px"><button class="btn small" data-off="down">Yes, shorter holds</button><button class="btn small sec" data-off="no">Keep it as it is</button></div></div>`:`<div class="sheetin"><h3>Thanks for telling us</h3><p>Next time, try the Easy day routine, or switch on "Seated only" in Settings. If something hurt, it's fine to skip it.</p></div>`;
 if(F.feel==='easy'){const prev=st.sessions.filter(s=>s!==F.sess&&s.feel).slice(-1)[0];resp=prev&&prev.feel==='easy'&&st.level<3&&F.offer!=='done'?`<div class="sheetin"><h3>Nicely done</h3><p>That's felt easy twice now. Want to hold each stretch a little longer next time?</p><div class="btns" style="margin-top:10px"><button class="btn small" data-off="up">Yes, a little longer</button><button class="btn small sec" data-off="no">Keep it as it is</button></div></div>`:`<div class="sheetin"><h3>Nicely done</h3><p>If it still feels easy next time, we'll offer you slightly longer holds.</p></div>`}
 if(F.feel==='right')resp=`<div class="sheetin"><h3>Just right is perfect</h3><p>We'll keep your routines at this pace.</p></div>`;
 if(F.offer==='done')resp=`<div class="sheetin"><h3>Done</h3><p>Your pace is now "${LEVELS[st.level][1]}". You can change it on any routine page.</p></div>`;
 el.innerHTML=`<div class="done"><div class="tick" aria-hidden="true"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
 <h2 style="margin:6px 0">${F.early?'You can stop here':'Well done. You moved today.'}</h2>
 <p class="how">${F.early?'What you did still counts. ':''}That's ${Math.min(wc,st.goal)} of ${st.goal} days this week.${F.hurt?' You told us something hurt, so tomorrow\'s suggestion will be lighter.':''}</p>
 <p class="how" style="margin-top:18px"><b>How did that feel?</b></p>
 <div class="feel" style="margin-top:10px">${[['easy','Too easy'],['right','Just right'],['hard','Too hard']].map(x=>`<button class="opt ${F.feel===x[0]?'on':''}" data-f="${x[0]}">${x[1]}</button>`).join('')}</div>
 ${resp}
 <div class="sheetin"><div class="eyebrow">Did you know?</div><h3 style="margin-top:4px">${F.card.t}</h3><p>${F.card.b}</p><button class="read" id="rdc">🔊 Read this to me</button></div>
 <button class="btn full" id="fin" style="margin-top:16px">Done</button></div>`;
 el.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{F.feel=b.dataset.f;F.sess.feel=F.feel;F.offer='';save();drawFinish()});
 el.querySelectorAll('[data-off]').forEach(b=>b.onclick=()=>{const o=b.dataset.off;if(o==='down'){st.level=Math.max(0,st.level-1);st.hold=0}if(o==='up'){st.level=Math.min(3,st.level+1);st.hold=0}F.offer=o==='no'?'kept':'done';save();if(o==='no'){F.offer='done';}drawFinish()});
 document.getElementById('rdc').onclick=()=>say(F.card.t+'. '+F.card.b);
 document.getElementById('fin').onclick=()=>{FIN=null;closeAfter()};
}
function closeAfter(){clearInterval(tick);P=null;try{speechSynthesis.cancel()}catch(e){}const el=document.getElementById('player');el.hidden=true;el.innerHTML='';document.body.style.overflow='';go('#/home')}
/* ================= router ================= */
function go(h){if(location.hash===h)render();else location.hash=h}
function render(){
 const h=location.hash.replace(/^#\/?/,'').split('/');window.scrollTo(0,0);
 if(!st.safety&&h[0]!=='safety'&&h[0]!=='start')return go('#/start/0');
 if(!st.onboarded&&st.safety&&!h[0])return go('#/start/1');
 switch(h[0]){
  case'start':return onboard(h[1]);
  case'library':return library(h[1]);
  case's':return stretch(h[1]);
  case'r':return routine(h[1]);
  case'routines':return routines();
  case'learn':return learn();
  case'progress':return progress();
  case'summary':return summary();
  case'settings':return settings();
  case'safety':return safety();
  case'flare':return flare();
  case'play':{const r=RB[h[1]];if(r){history.replaceState(null,'','#/r/'+r.id);routine(r.id);startPlay(r)}else home();return}
  default:return home();
 }
}
window.addEventListener('hashchange',()=>{if(!P)render()});
applyPrefs();render();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
</body>
</html>
