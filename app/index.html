<style>
/* Layout: one calm column; Today is a numbered session (check in, move, learn); light, flat, high-contrast for older eyes */
:root{
 --bg:#F1F6F5;--surface:#FFFFFF;--line:#CFDBD9;--ink:#141E30;--muted:#47574F;
 --green:#0B6B74;--green-dk:#06525A;--green-soft:#DBEDEE;--sun:#F4B740;--sun-soft:#FCF0D2;
 --alert:#9B2C12;--alert-soft:#FCE8E1;
 --body:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;--head:Literata,Georgia,"Times New Roman",serif;
 --r:18px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:19px/1.55 var(--body);padding-bottom:calc(100px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--head);font-weight:700;line-height:1.2;margin:0;text-wrap:balance;color:var(--ink)}
h1{font-size:30px}h2{font-size:24px}h3{font-size:21px}
p{margin:0}
a{color:var(--green-dk);text-underline-offset:3px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px;border-radius:8px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px max(18px,env(safe-area-inset-right)) 12px max(18px,env(safe-area-inset-left));display:flex;align-items:center;gap:12px;min-height:68px}
.top .logo{width:40px;height:40px;flex:none;border-radius:11px}
.top .name{font:700 20px var(--head)}
.top .by{display:block;font-size:13px;color:var(--muted);font-family:var(--body);font-weight:400}
.top .back{margin-right:4px;border:0;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);border-radius:12px;min-height:48px;padding:0 16px;font-weight:700}
.top .back[hidden]{display:none}
main{max-width:720px;margin:0 auto;padding:20px max(18px,env(safe-area-inset-right)) 24px max(18px,env(safe-area-inset-left))}
.stack{display:flex;flex-direction:column;gap:16px}
.box{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:20px}
.box.tint{background:var(--green-soft);border-color:transparent}
.box.warm{background:var(--sun-soft);border-color:transparent}
.box.alert{background:var(--alert-soft);border-color:transparent}
.label{font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green)}
.muted{color:var(--muted)}
.small{font-size:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:14px;min-height:60px;padding:0 26px;font-weight:700;font-size:20px;text-decoration:none;background:var(--green);color:#fff}
.btn:hover{background:var(--green-dk)}
.btn.sun{background:var(--sun);color:var(--ink)}
.btn.sun:hover{background:#E9A925}
.btn.line{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn.line:hover{box-shadow:inset 0 0 0 2px var(--green)}
.btn.sm{min-height:52px;font-size:18px;padding:0 18px}
.btn.wide{width:100%}
.btns{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.textbtn{border:0;background:none;color:var(--green-dk);font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:48px;padding:0 4px;display:inline-flex;align-items:center}
.session{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.session>li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;position:relative;padding-bottom:22px}
.session>li:not(:last-child):before{content:"";position:absolute;left:21px;top:46px;bottom:4px;width:2px;background:var(--line)}
.num{width:44px;height:44px;border-radius:50%;background:var(--surface);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font:700 19px var(--head);color:var(--muted)}
.num.done{background:var(--green);border-color:var(--green);color:#fff}
.session h3{margin:6px 0 10px}
.faces{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.faces button{border:0;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);border-radius:14px;min-height:78px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.faces svg{width:34px;height:34px}
.faces span{font-size:14px;font-weight:700;color:var(--muted)}
.faces button.on{background:var(--green-soft);box-shadow:inset 0 0 0 3px var(--green)}
.faces button.on span{color:var(--ink)}
.move{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;align-items:center}
.pict{width:64px;height:64px;border-radius:16px;background:var(--green-soft);display:flex;align-items:center;justify-content:center;flex:none}
.pict svg{width:48px;height:48px}
.pict.big{width:120px;height:120px;border-radius:28px}
.pict.big svg{width:96px;height:96px}
.week{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.dots{display:flex;gap:8px}
.dots i{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center}
.dots i.on{background:var(--green);border-color:var(--green)}
.dots i.on:after{content:"";width:10px;height:6px;border:solid #fff;border-width:0 0 3px 3px;transform:rotate(-45deg) translate(1px,-1px)}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:12px;text-decoration:none;color:var(--ink)}
.row b{display:block;font:700 19px var(--head)}
.row .muted{font-size:16px}
a.row:hover{border-color:var(--green)}
.tag{display:inline-block;border-radius:999px;background:var(--green-soft);color:var(--green-dk);font-size:14px;font-weight:700;padding:3px 12px;margin:2px 4px 2px 0}
.tag.stand{background:var(--sun-soft);color:#6B4A00}
.seg{display:flex;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:10px;min-height:48px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--green);color:#fff}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills button{border:0;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);border-radius:999px;min-height:48px;padding:0 16px;font-weight:700}
.pills button.on{background:var(--ink);color:#fff;box-shadow:none}
.choice{display:block;width:100%;text-align:left;border:0;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);border-radius:16px;padding:16px 18px;min-height:64px;font-weight:700;font-size:19px}
.choice small{display:block;font-weight:400;font-size:16px;color:var(--muted);margin-top:2px}
.choice.on{background:var(--green-soft);box-shadow:inset 0 0 0 3px var(--green)}
.check{display:flex;gap:14px;align-items:flex-start;padding:10px 0;cursor:pointer;min-height:56px}
.check input{width:28px;height:28px;flex:none;margin-top:2px;accent-color:var(--green)}
.steps{margin:10px 0 0;padding-left:24px}
.steps li{margin-bottom:8px}
.note{font-size:16px;color:var(--muted)}
.nums{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:12px}
.nums button{border:0;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);border-radius:12px;min-height:56px;font-weight:700;font-size:20px}
.scale{display:flex;justify-content:space-between;font-size:15px;color:var(--muted);margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stats div{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 8px;text-align:center}
.stats b{display:block;font:700 30px var(--head);font-variant-numeric:tabular-nums}
.stats span{font-size:15px;color:var(--muted);line-height:1.3;display:block}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center}
.cal span{font-size:14px;color:var(--muted);font-weight:700}
.cal i{display:flex;align-items:center;justify-content:center;aspect-ratio:1;max-width:42px;width:100%;margin:0 auto;border-radius:50%;font-style:normal;font-size:15px;color:var(--muted);background:var(--bg)}
.cal i.on{background:var(--green);color:#fff;font-weight:700}
.cal i.today{box-shadow:0 0 0 2px var(--sun)}
details.read{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r)}
details.read summary{list-style:none;cursor:pointer;padding:16px 18px;font:700 19px var(--head);display:flex;justify-content:space-between;gap:12px;align-items:center;min-height:60px}
details.read summary::-webkit-details-marker{display:none}
details.read summary:after{content:"+";font:700 26px var(--body);color:var(--green)}
details.read[open] summary:after{content:"\2013"}
details.read .in{padding:0 18px 18px}
.say{border:0;background:var(--green-soft);color:var(--green-dk);border-radius:12px;min-height:48px;padding:0 16px;font-weight:700;font-size:17px;margin-top:12px;display:inline-flex;align-items:center;gap:8px}
.say svg{width:20px;height:20px}
.flags h3{font-size:19px;margin:18px 0 6px}
.flags ul{margin:0;padding-left:22px}
.flags li{margin-bottom:6px}
.zones{display:grid;gap:8px;margin-top:8px}
.zones div{border-radius:12px;padding:12px 14px;font-weight:700;font-size:17px}
.z1{background:#E0F1E6;color:#11462F}.z2{background:var(--sun-soft);color:#5F4100}.z3{background:var(--alert-soft);color:var(--alert)}
.msg{background:var(--green-soft);color:var(--green-dk);border-radius:12px;padding:12px 16px;font-weight:700}
.prog{display:flex;gap:6px;margin-bottom:20px}
.prog i{flex:1;height:6px;border-radius:6px;background:var(--line)}
.prog i.on{background:var(--green)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1.5px solid var(--line);display:flex;padding:6px max(8px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
.nav[hidden]{display:none}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:62px;border-radius:12px;text-decoration:none;color:var(--muted);font-weight:700;font-size:15px}
.nav svg{width:26px;height:26px}
.nav a.on{color:var(--green-dk);background:var(--green-soft)}
.play{position:fixed;inset:0;z-index:20;background:var(--surface);display:flex;flex-direction:column;overflow:auto;padding:calc(12px + env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
.play[hidden]{display:none}
.pbar{display:flex;align-items:center;gap:8px}
.pbar .t{flex:1;min-width:0;text-align:center;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbar button{border:0;background:var(--bg);border-radius:12px;min-height:48px;padding:0 14px;font-weight:700;flex:none}
.segs{display:flex;gap:4px;margin:10px 0 14px}
.segs i{flex:1;height:6px;border-radius:6px;background:var(--line)}
.segs i.on{background:var(--green)}
.segs i.now{background:var(--sun)}
.stage{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;max-width:560px;margin:0 auto;width:100%}
.stage .phase{font-size:16px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green)}
.stage h2{font-size:28px}
.timer{display:flex;align-items:center;gap:16px;justify-content:center;margin:6px 0}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 48px var(--head);font-variant-numeric:tabular-nums}
.stage .how{font-size:20px;max-width:520px}
.stage .tip{font-size:17px;color:var(--muted)}
.ctl{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px;margin-top:auto;padding-top:16px;max-width:560px;width:100%;align-self:center}
.ctl button{border:0;border-radius:14px;min-height:64px;font-weight:700;font-size:18px;background:var(--bg)}
.ctl .go{background:var(--sun);color:var(--ink);font-size:20px}
.hurt{display:block;width:100%;max-width:560px;margin:10px auto 0;border:2px solid var(--alert);background:var(--surface);color:var(--alert);border-radius:14px;min-height:60px;font-weight:700;font-size:19px}
.sheetwrap{position:fixed;inset:0;background:rgba(20,30,48,.55);display:flex;align-items:flex-end;justify-content:center;z-index:30;padding:12px}
.sheet{background:var(--surface);border-radius:22px;padding:22px;width:100%;max-width:560px;max-height:92%;overflow:auto}
.sheet .choice{margin-bottom:10px;background:var(--bg)}
.endtick{width:80px;height:80px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;margin:8px auto}
body.t2 main,body.t2 .stage,body.t2 .sheet{zoom:1.15}
body.t3 main,body.t3 .stage,body.t3 .sheet{zoom:1.3}
body.hc{--line:#5A6478;--muted:#141E30}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.top,.nav,.noprint{display:none!important}body{padding:0;background:#fff}main{max-width:none}.box{border-color:#999}}

/* tap targets and text sizes (app-creation pass) */
#app a:not(.btn):not(.choice):not(.card):not(.row){display:inline-block;padding:11px 0;min-height:44px;box-sizing:border-box}
#app input[type=checkbox],#app input[type=radio]{width:32px;height:32px;margin:6px 8px 6px 0;vertical-align:middle}
#app label{min-height:44px}
.top .by{font-size:14px}
#app .moods span,#app .mood span,#app .feel span,#app .faces span{font-size:16px}

/* photos of the moves */
.pict{position:relative;overflow:hidden}
.pict.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.pict.big.ph{width:160px;height:160px}
/* tablets */
@media (min-width:700px){
 main{max-width:780px;padding-top:28px}
 h1{font-size:34px}
 .pict.big.ph{width:220px;height:220px}
 .stage{max-width:640px}.ctl,.hurt{max-width:640px}
 .sheetwrap{align-items:center}
}
/* laptops, desktops and tablets on their side: menu moves to the left, lists go two across */
@media (min-width:1000px){
 body{padding-left:240px;padding-bottom:32px}
 .top{margin-left:-240px;padding-left:24px;z-index:8}
 .nav{top:69px;right:auto;bottom:0;width:240px;flex-direction:column;justify-content:flex-start;gap:6px;border-top:0;border-right:1.5px solid var(--line);padding:18px 14px}
 .nav a{flex:none;flex-direction:row;justify-content:flex-start;gap:14px;padding:0 16px;font-size:18px;min-height:58px}
 main{max-width:1000px;padding-left:32px;padding-right:32px}
 .list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
 body:has(.nav[hidden]){padding-left:0}
 body:has(.nav[hidden]) .top{margin-left:0}
 body:has(.nav[hidden]) main{max-width:720px}
 .play{padding-left:max(40px,env(safe-area-inset-left));padding-right:max(40px,env(safe-area-inset-right))}
}
@media print{body{padding-left:0}}
/* Home hero */
.hero{background:linear-gradient(135deg,var(--green) 0%,var(--green-dk) 100%);color:#fff;border-radius:22px;padding:22px 22px 20px;position:relative;overflow:hidden}
.hero>div{position:relative;z-index:1}
.hero h1{color:#fff;margin:3px 0 2px}
.hero .muted{color:#CDEBEC}
.hero:after{content:"";position:absolute;right:-34px;top:-34px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.09)}
.hero:before{content:"";position:absolute;right:26px;bottom:-40px;width:92px;height:92px;border-radius:50%;background:rgba(255,255,255,.06)}
/* Add to Home Screen banner */
.a2hs{position:fixed;left:0;right:0;bottom:calc(74px + env(safe-area-inset-bottom));z-index:9;margin:0 auto;width:calc(100% - 28px);max-width:540px;display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;border-radius:16px;padding:12px 12px 12px 14px;box-shadow:0 16px 42px -14px rgba(20,30,48,.65)}
.a2hs[hidden]{display:none}
.a2hs>img{width:42px;height:42px;border-radius:11px;flex:none}
.a2hs .x{flex:1;min-width:0;font-size:14.5px;line-height:1.35;color:#E7ECF5}
.a2hs .x b{font:700 16px var(--head);display:block;color:#fff;margin-bottom:1px}
.a2hs button{border:0;border-radius:11px;min-height:46px;padding:0 16px;font-weight:700;font-size:17px;background:var(--sun);color:var(--ink);flex:none;cursor:pointer}
.a2hs .dismiss{background:transparent;color:#AEB8CC;min-height:40px;padding:0 4px;font-size:24px;line-height:1}
@media (min-width:1000px){.a2hs{left:240px;right:0;bottom:24px}}
</style>
