much people take.","why":"It matches this lesson, from a joint doctor."},{"label":"Barbara O'Neill: Fantastic Fats","src":"Barbara O'Neill (YouTube)","yt":"slWOfJzWAf8","len":"About 60 minutes. Make a cup of tea and settle in.","what":"Barbara's full talk on the fats in our food: which ones she reaches for, which ones she avoids, and why.","why":"The plant oils in this lesson come straight from her way of eating."}],"n":10},"s3":{"id":"s3","title":"Glucosamine, chondroitin, MSM and bromelain","open":"These are the best-selling joint pills. The truth about them may surprise you, and save you money.","body":"## Glucosamine and chondroitin\nThese are sold to rebuild cartilage.\n- In a 2-year study of 222 people with hip osteoarthritis, 1,500 mg of glucosamine a day did no better than a fake pill.\n- A review of 20 chondroitin studies found no real help for hips or knees.\n- Osteoarthritis guidelines don't suggest glucosamine.\n- They are safe for most people. If you feel they help, you're free to keep going. If you've bought them for years and felt nothing, you're free to stop.\n- Amounts from the reference book: chondroitin 500 to 1,000 mg a day. Glucosamine sulfate as the label says.\n- Safety: glucosamine is often made from shellfish. Check the label if you're allergic. Ask first about chondroitin if you take blood thinners.\n\n## MSM\nA sulfur compound, often mixed with glucosamine. A few small studies found knee pain eased a little.\n- Amount: 500 to 1,000 mg, 3 times a day.\n- It can upset the stomach.\n- Give it 2 months. Keep it only if you feel a difference.\n\n## Bromelain\nAn enzyme from pineapple stems. In one small study of adults with mild knee pain, 400 mg a day eased pain more than 200 mg. There was no fake-pill group, so it is a hopeful sign, not proof.\n- Amount: as the label says, 3 times a day between meals.\n- Skip it if you take blood thinners or are allergic to pineapple.\n- Fresh pineapple is a nice way to get a little.\n\n## For example\nIf you spend $30 a month on glucosamine and feel no change after 2 months, that is $360 a year you could keep. Try stopping for a month and see if anything changes.","try":"Check your cupboard. If you take one of these, write down how long and whether you feel it working.","watch":[{"label":"Does glucosamine and chondroitin actually work?","src":"Orthopaedic and spine doctor","yt":"SaDOhfVWdDU","len":"About 3 minutes.","what":"A bone and joint doctor gives a short, honest answer on these pills.","why":"The quick answer."},{"label":"What science actually says about glucosamine","src":"Jeffrey Peng MD","yt":"ERfMAqLLd_4","len":"About 10 minutes.","what":"A doctor walks through the big studies on glucosamine and chondroitin.","why":"The longer look at the research."}],"n":10},"s4":{"id":"s4","title":"Vitamins: D, C, E, A and the B vitamins","open":"Vitamins matter. But more isn't better, and some can harm in big amounts.","body":"These are the amounts the reference book suggests, with safety notes from the US National Institutes of Health. Ask your doctor before you start any of them.\n\n## Vitamin D\n- Amount: 800 IU a day. Safe at this amount. The upper limit is 4,000 IU.\n- Good for bones. Worth fixing if a blood test shows you're low.\n- Extra hasn't been shown to ease arthritis pain.\n\n## Vitamin C\n- Up to 2,000 mg a day, split up. That is the adult upper limit. More can upset the stomach.\n- For gout, vitamin C pills are not suggested.\n\n## Vitamin E\n- 200 IU a day. Ask first if you take blood thinners.\n\n## Vitamin A\n- 10,000 IU a day at most, from all sources. That's the adult upper limit.\n- In older adults, high amounts have been linked to weaker bones. Many doctors suggest staying well below it.\n\n## Beta-carotene\n- 15,000 IU a day.\n- Smokers and former smokers should not take it as a pill. Studies linked it to more lung cancer in smokers.\n\n## Vitamin B12\n- 1,000 mcg a day. Generally safe.\n- If you eat no animal foods, ask your doctor about B12.\n\n## Folic acid\n- 400 mcg a day.\n- If you take methotrexate, your doctor sets this dose.\n\n## Niacin (vitamin B3)\n- 35 mg a day, no more. It can make your skin flush red.\n- Avoid with liver disease, gout or high blood pressure.\n\n## For example\nBob had a blood test. His vitamin D was low. His doctor suggested 800 IU a day. He did not add vitamin A, because his multivitamin already had plenty.","try":"Read the label on any vitamin you take. Check it against the amounts in this lesson.","watch":[{"label":"Dietary supplements: what you need to know","src":"US National Institutes of Health, Office of Dietary Supplements","yt":"S4bbzyfxstw","len":"About two minutes.","what":"NIH experts explain where to find honest, science-based facts about supplements.","why":"Short and plain. It shows you where to check any bottle before you buy it."},{"label":"Dietary supplements: what you need to know (full talk, about an hour)","src":"US National Institutes of Health videocast","url":"https://videocast.nih.gov/watch=41643"}],"n":10},"s5":{"id":"s5","title":"Minerals: calcium, magnesium, zinc and more","open":"Minerals are tiny helpers from the earth. Here is how much, and when to stop.","body":"Again, these are the reference book's amounts with NIH safety notes. Talk them over with your doctor.\n\n## Calcium\n- Up to 2,000 mg a day, counting what you get from food. That's the upper limit after 50.\n\n## Magnesium\n- Up to 350 mg a day from pills. That's the upper limit from supplements. More can cause loose stools.\n\n## Zinc\n- Up to 40 mg a day. That's the upper limit. Taking it a long time can lower copper.\n\n## Copper\n- 3 mg a day. Well below the 10 mg upper limit.\n\n## Boron\n- 3 mg with each meal. Well below the 20 mg upper limit.\n- Also in prunes, raisins, apples, pears, avocados and nuts.\n\n## Selenium\n- 200 mcg a day. Don't go above 400 mcg from all sources.\n\n## Kelp\n- As the label says. Very high in iodine. Ask first if you have a thyroid condition.\n\n## Iron\nThe reference book says not to take iron pills, or multivitamins with iron, because iron may add to pain and swelling. It suggests iron from food: blackstrap molasses, broccoli, Brussels sprouts, cauliflower, fish, lima beans and peas.\n\nBut many people with rheumatoid arthritis are low in iron, and that can cause tiredness. Get a blood test before you take or stop iron, and follow what it shows.\n\n## For example\nA handful of almonds, a bowl of greens and a few prunes give you calcium, magnesium and boron from food, with no pills at all.","try":"Add one mineral-rich food today: greens, almonds, beans or prunes.","watch":[{"label":"Dietary supplements: what you need to know","src":"US National Institutes of Health, Office of Dietary Supplements","yt":"S4bbzyfxstw","len":"About two minutes.","what":"NIH experts explain where to find honest, science-based facts about supplements.","why":"Short and plain. It shows you where to check any bottle before you buy it."}],"n":10},"s6":{"id":"s6","title":"Garlic, DLPA, shark cartilage, DMSO and other things people try","open":"This is the last stop on the supplement shelf. Some of these are worth a look. Some are a waste of money.","body":"## Garlic pills\n- 2 capsules, 3 times a day with meals.\n- Ask first if you take blood thinners.\n- Garlic in your cooking is a great habit too.\n\n## DL-phenylalanine (DLPA)\n- 500 mg a day, every other week.\n- Not if you're pregnant, or have panic attacks, diabetes, high blood pressure or PKU.\n\n## Shark cartilage\nNot shown to help. The reference book suggests 1 gram for every 15 pounds of body weight a day. For a 150-pound person, that's 10 grams. That's a lot of capsules. There are no good studies showing it helps. It can upset the stomach and is high in calcium.\n\n## DMSO\nMay help a little, on the skin. It is a liquid made from wood, rubbed on sore joints. A review of small studies found it may ease osteoarthritis pain a little.\n- Use only pure DMSO from a pharmacy or health store. Never the hardware store kind.\n- It carries whatever is on your skin into your body, so wash first.\n- It leaves a garlic-like taste and smell.\n\n## Bee venom\nOnly with a trained professional. Bee venom is given by shot or live stings in some parts of the world. Small studies suggest it may ease pain. It can cause a dangerous allergic reaction. Never try it at home, and never if you're allergic to bee stings.\n\n## Hair analysis\nNot reliable. When the same hair was sent to different labs, the results didn't match. A blood test from your doctor is the way to check for lead.\n\n## You made it to the end of the shelf\nYou now know more about supplements than most people in the store. The best plan is still the simple one: a plant-rich plate, daily movement, and one supplement at a time if you choose.\n\n## For example\nInstead of buying shark cartilage for $40, spend the money on a warm wax bath for your hands, or a good pair of walking shoes.","try":"Pick the one supplement from these lessons you are most curious about. Write it down to ask your pharmacist.","watch":[{"label":"Dietary supplements: what you need to know","src":"US National Institutes of Health, Office of Dietary Supplements","yt":"S4bbzyfxstw","len":"About two minutes.","what":"NIH experts explain where to find honest, science-based facts about supplements.","why":"Short and plain. It shows you where to check any bottle before you buy it."},{"label":"Dietary supplements: what you need to know (full talk, about an hour)","src":"US National Institutes of Health videocast","url":"https://videocast.nih.gov/watch=41643"}],"n":10},"pj1":{"id":"pj1","title":"Being kind to your joints all day","open":"Relief isn't only in remedies. It's also in how you carry a bag and open a jar.","body":"Occupational therapists teach these habits. They save your joints a lot of strain.\n\n## Share the load\n- Use your biggest, strongest joints. Push a door with your shoulder or forearm.\n- Carry bags on your forearm, or use a backpack.\n- Use two hands instead of one.\n- Slide heavy things along the counter instead of lifting.\n- Hold things with a loose grip. Thick handles help.\n\n## Pace yourself\n- Break big jobs into pieces. Rest before pain tells you to.\n- Change position every 20 to 30 minutes.\n- Spread hard jobs across the week.\n\n## Tools are smart\n- A jar opener, a kettle tipper and lever taps.\n- Cushioned shoes. In one study, even medium heels raised the strain on the inner knee by about a quarter. Flat or low heels are kinder.\n- A cane in the hand opposite the sore leg.\n- Thumb splints and knee braces help some people. A therapist can fit one.\n\n## For example\nInstead of carrying a full laundry basket, push it along the floor or use a cart. Instead of twisting a jar lid, use a rubber grip opener.","try":"Change one way you carry, lift or grip something today.","watch":[{"label":"Joint protection principles","src":"Melbourne Hand Rehab","yt":"MOBZADWSrUE","len":"About two minutes.","what":"Hand therapists show simple ways to protect sore hand joints.","why":"The quick version of this lesson."},{"label":"Arthritis hacks and joint protection","src":"Arthritis Foundation","yt":"AScGaxvVVeY","len":"About 60 minutes. Make a cup of tea and settle in.","what":"The Arthritis Foundation shares everyday tricks and tools that take strain off sore joints.","why":"Hours of daily strain saved, from America's biggest arthritis charity."}],"n":11},"w6a":{"id":"w6a","title":"Spread your energy across the day","open":"Think of your energy like butter on toast. Spread it out instead of using it all in one corner.","body":"## Plan\nEach morning, pick your top 3 jobs for today. The rest can wait.\n\n## Switch\nGo between heavy jobs and light ones. Vacuum one room, then fold laundry sitting down.\n\n## Break it up\nClean one room, then rest. Garden for 15 minutes, then sit with a drink. Cut a big job in half and rest in the middle.\n\n## Sit when you can\nIroning, chopping, washing up and drying your hair can all be done on a stool.\n\n## Stretch between jobs\nThe Great Western Hospitals rheumatology team in England made a Two Minute Stretch you do sitting down. Two minutes between jobs keeps you from stiffening up.\n\nNone of this is giving in. It's how people with arthritis keep gardening, cooking for family and getting out with friends for years.\n\n## For example\nSaturday's jobs: shopping, laundry, call your sister. Do the shopping. Rest 20 minutes. Fold laundry sitting down. Call your sister from your comfy chair.","try":"Pick one job you dread this week. Cut it in half and rest in the middle.","watch":[{"label":"Yoga for arthritis: focused relaxation","src":"Johns Hopkins Arthritis Center","yt":"k8F3yHgqAZ4","len":"About 8 minutes.","what":"A slow, guided relaxation you can do lying down, even at bedtime.","why":"It helps your body let go before sleep."}],"n":10},"w6b":{"id":"w6b","title":"Little tools that make a big difference","open":"A jar opener isn't defeat. It's just a better jar opener than your hand.","body":"## For hands\n- Jar and bottle openers, including the rubber grip kind.\n- Fat-grip pens and forks, or foam tubes that slide over handles.\n- Lever taps instead of round knobs.\n- An electric can opener.\n\n## For knees and hips\n- A cane, in the hand on the other side from the sore leg. The American College of Rheumatology guidelines strongly suggest one for knee and hip arthritis.\n- A raised toilet seat and a shower chair.\n- A long-handled shoehorn and a sock aid.\n- A reacher-grabber for things on the floor or high shelves.\n\n## For the whole body\n- Cushioned, supportive shoes.\n- A wheeled bag or cart instead of carrying.\n\n## Getting up from the floor\nVersus Arthritis shows how to get down to the floor and back up safely. The usual steps: roll onto your side, push up to your hands and knees, crawl to a sturdy chair, put one foot flat, and push up with your hands on the chair. Practice it once on a good day, with someone nearby.\n\nAn occupational therapist can advise on what would help most in your home. Ask your doctor about a referral.\n\n## For example\nA $10 jar opener and a $5 set of foam grips can make breakfast easier every single day.","try":"Choose one tool from this list that would help this week. Write it down or order it.","n":11},"w6c":{"id":"w6c","title":"Asking for help without feeling like a burden","open":"This one is hard for a lot of people. Mostly the ones who've always been the helper.","body":"If you've spent your life looking after other people, asking for help can feel like losing something. But most family members want to help and don't know how. Giving them a clear job is a kindness to them too.\n\n## Make it easy to say yes\n- Be clear: \"Could you carry the laundry basket upstairs on Sundays?\" works better than \"I need more help.\"\n- Pick the jobs that cost you the most for the least joy: heavy shopping, high shelves, mowing.\n- Keep the jobs you love. If you love cooking, ask someone to do the chopping and keep the cooking for yourself.\n\n## For family members reading this\nThe best help is quiet and practical. Offer a clear job. Don't take over. And ask how today is, not how the arthritis is.\n\n## For example\nInstead of saying, \"I'm fine,\" try, \"Would you mind taking the trash out on Tuesdays? That would really help my back.\"","try":"Ask one person for one specific bit of help this week.","n":9},"w7a":{"id":"w7a","title":"Sleep turns the pain alarm down","open":"Pain makes it hard to sleep. Poor sleep makes pain louder. Both are true, and both can be eased.","body":"## Small changes for better nights\n- Go to bed and get up at about the same time every day, weekends too. This matters more than the exact hour.\n- Keep the room cool, dark and quiet.\n- A pillow between your knees helps hips and backs. A pillow under your knees helps if you sleep on your back.\n- A warm bath or shower an hour before bed loosens stiff joints.\n- Move in the daytime. A walk today helps sleep tonight.\n- Stop caffeine after lunch.\n\n## If you wake in the night\nDon't lie there fighting it. After about 20 minutes, get up. Sit somewhere dim and do something quiet until you feel sleepy.\n\n## Slow tai chi\nThe Arthritis Society of Canada suggests tai chi for arthritis. Its slow moves calm the body, which can help sleep.\n\nIf pain wakes you most nights, or you snore loudly and wake tired, tell your doctor. Both can be treated.\n\n## For example\nPick 10:30 for bed and 7:00 to get up. Keep it for 3 nights, even on Saturday. See how you feel.","try":"Pick a bedtime and keep it for the next three nights.","watch":[{"label":"Yoga for arthritis: focused relaxation","src":"Johns Hopkins Arthritis Center","yt":"k8F3yHgqAZ4","len":"About 8 minutes.","what":"A slow, guided relaxation you can do lying down, even at bedtime.","why":"It helps your body let go before sleep."},{"label":"Tai chi for sore joints, with Dr Paul Lam","src":"Tai Chi for Health Institute (YouTube)","yt":"tAOuEpa01j4","len":"About 50 minutes. Make a cup of tea and settle in.","what":"A calm follow-along class with Dr Paul Lam, a doctor who has taught tai chi to people with arthritis for many years.","why":"Tai chi helps balance and comfort, and it's a lovely habit to keep."}],"n":14},"w7b":{"id":"w7b","title":"The 4-6 breath","open":"A long, slow breath out tells your body it's safe. A body that feels safe feels less pain.","body":"## How to do it\n- Sit or lie down. Put one hand on your belly.\n- Breathe in through your nose while you count to 4.\n- Breathe out slowly through your mouth while you count to 6.\n- Do it 5 times.\n\nThat's it. Use it in bed, in the doctor's waiting room, before a walk, or when a flare starts.\n\n## Why it helps\nWhen you're worried or hurting, your body gets tense. Breathing gets short and fast. A slow breath out, longer than the breath in, calms that down. Tight muscles around a sore joint make pain worse. Letting them soften helps.\n\nSome people like to add a word or a short prayer on the breath out. Do whatever feels like yours.\n\n## For example\nYou're in the waiting room and your knee is aching. Breathe in, 1, 2, 3, 4. Out, 1, 2, 3, 4, 5, 6. Five times. Your shoulders drop.","try":"Tonight in bed, do five rounds of the 4-6 breath.","watch":[{"label":"Yoga for arthritis: deep breathing","src":"Johns Hopkins Arthritis Center","yt":"zunYIreTguU","len":"About 3 minutes.","what":"A slow breathing practice made for people with sore joints.","why":"It is a calm way to turn pain down while you wait for a remedy to work."}],"n":12},"w7c":{"id":"w7c","title":"When it gets you down","open":"Feeling fed up, worried or low is common with long-term pain. It's not weakness, and it's not your fault.","body":"Pain that goes on for months wears on anyone. You might miss things you used to do. You might worry about getting worse, or about being a burden. Those feelings make sense.\n\n## Things that help\n- Talking to someone: a friend, a faith leader or a support group.\n- A kind of talking help called CBT. Arthritis guidelines suggest it for long-term pain. Ask your doctor.\n- Writing it down. A few lines before bed can make the day feel lighter.\n- Noticing small good things. At the end of each day, write down three.\n\n## Support groups\nThe Arthritis Foundation has free online videos and support groups, so you can meet people who understand.\n\n## Please tell your doctor if\n- You've felt low, or stopped enjoying things, for more than two weeks.\n- You're not sleeping or eating like you normally do.\n\nThat takes courage, and it's the right thing to do. If you ever feel like you can't go on, call or text 988 in the US to reach the Suicide and Crisis Lifeline.\n\n## For example\nThree good things today: the sun came out, my granddaughter called, the soup was good. That's enough.","try":"Tonight, write down three good things from today. They can be very small.","watch":[{"label":"Yoga for arthritis: focused relaxation","src":"Johns Hopkins Arthritis Center","yt":"k8F3yHgqAZ4","len":"About 8 minutes.","what":"A slow, guided relaxation you can do lying down, even at bedtime.","why":"It helps your body let go before sleep."}],"n":12},"w8a":{"id":"w8a","title":"Your flare-up plan","open":"Flares happen to everyone, even people doing everything right. A flare doesn't wipe out your progress.","body":"## On a bad day\n- Do about half of what you normally would. Don't stop completely. A little movement helps a flare pass sooner than lying still.\n- Heat for stiffness, or a wrapped cold pack for a hot, puffy joint, for about 15 minutes.\n- Do your top one job only. Ask for help with the rest.\n- Do the 4-6 breath.\n- When it settles, build back up over a few days.\n\n## About pain medicine\nYour doctor or pharmacist knows which pain relief is safe with your other medicines. Only change a prescribed medicine after speaking with your doctor.\n\n## Call your doctor today if\n- A joint is hot, red and very swollen, mostly with a fever.\n- You have sudden, bad pain after a fall.\n- You can't put weight on a leg.\n- You have new numbness, weakness, or bladder or bowel trouble.\n- A flare isn't settling after a week.\nChest pain or trouble breathing: call 911.\n\n## For example\nYour fridge plan might say: 1. Cold pack. 2. Half my jobs. 3. 4-6 breath. 4. Call Sue for help with shopping. 5. Call the doctor if it lasts a week.","try":"Fill in your flare-up plan in the Toolkit, print it and put it on the fridge.","watch":[{"label":"Finding relief for osteoarthritis pain","src":"Mayo Clinic (Mayo Clinic Minute)","yt":"tva_EQrmOhw","len":"About one minute.","what":"A Mayo Clinic joint doctor, Dr. Eric Matteson, gives the short version: move, keep a healthy weight, and use heat or cold on sore joints.","why":"It backs up the first-aid list in this lesson in one minute flat."},{"label":"Yoga for arthritis: focused relaxation","src":"Johns Hopkins Arthritis Center","yt":"k8F3yHgqAZ4","len":"About 8 minutes.","what":"A slow, guided relaxation you can do lying down, even at bedtime.","why":"A calm follow-along for a bad day, when moving a lot isn't the plan."}],"n":13},"w8b":{"id":"w8b","title":"Getting more from your doctor visits","open":"Ten minutes with a doctor goes fast. A short list makes it count.","body":"## Before you go\n- Fill in your questions sheet in the Toolkit.\n- Bring your pain log, or a few numbers from it.\n- Bring a list of every medicine, cream and supplement you take, including the natural ones.\n\n## Questions worth asking\n- Which kind of arthritis do I have, and how sure are we?\n- What's safe for me to do? Is there anything I should avoid?\n- Could a physical therapist or occupational therapist help me?\n- Is my pain relief safe with my other medicines?\n- Is there a local program, like Walk With Ease or tai chi for arthritis, you'd suggest? The CDC keeps a list of proven arthritis programs around the country.\n\n## Tell your doctor about this Program\nLet them know you're doing light movement, home comforts and food changes. If you take medicine for rheumatoid arthritis or gout, keep taking it. That medicine protects your joints, and everything here works alongside it.\n\n## For example\nWrite your top question first. If the visit runs short, you'll still get the most important answer.","try":"Fill in your questions sheet and put it with your next appointment card.","watch":[{"label":"Rheumatoid arthritis: gaining control, diagnosis","src":"Johns Hopkins Arthritis Center","yt":"kJqLzm7S1HU","len":"About 7 minutes.","what":"How doctors work out what kind of arthritis you have, and the tests they use.","why":"It helps you know what to ask at your visit."}],"n":17},"st1":{"id":"st1","title":"People who got their mornings back","open":"You've learned what to do. Now meet a few real people who did it.","body":"These people come from patient forums, charity pages and news stories. Results vary. Most kept taking the medicine their doctor gave them. Read them for hope and ideas.\n\n## Mel\nOsteoarthritis reached her knees and hands at 43. She couldn't open doors or tie her laces. She joined a gym, took Pilates once a week and ate less junk food. Now she says she'd rather exercise than take painkillers. The arthritis is still there. It just stopped running her day.\n\n## A man who posts as mickeyb2\nHis back was so bad he slept sitting up in a chair for four months. With a physical therapist he exercised five days a week. It took over a year. Then he hadn't needed a pain pill in six months, and he slept in his own bed again.\n\n## Paula\nShe was told she had rheumatoid arthritis in 2008. When her doctor added a newer medicine, things turned within 12 weeks. She has stayed in remission since. \"Remission is possible,\" she says.\n\n## Kriss Marion\nShe left the city for a small farm. Her rheumatoid arthritis, found at 23, went quiet. Farm work means carrying, reaching, walking and resting, outside, every day. Doctors call her story unusual and don't suggest stopping medicine to copy it. But you can copy the habits: carry something, reach, walk, rest, get outside.\n\n## Penny Phillips\nA teacher with rheumatoid arthritis at 28. After years of strong drugs and operations, she prayed with two friends on New Year's Day 1986, and her pain lifted over the next days. Thirty years later she lives with no pain and no limits. If faith is part of your life, lean on it.\n\n## For example\nPick the person most like you. What is one thing they did that you could do this week?","try":"Pick the story most like yours. Write down one thing from it you'll try.","watch":[{"label":"How to stay active with osteoarthritis","src":"Mayo Clinic","yt":"E42zVB-OCug","len":"About two minutes.","what":"A Mayo Clinic expert explains why moving helps sore joints and how to start.","why":"A short push to get moving today."},{"label":"Arthritis explained: osteoarthritis, rheumatoid, gout","src":"Mayo Clinic","yt":"Njc6jtvzUDU","len":"About 30 minutes.","what":"Mayo Clinic experts explain the main kinds of arthritis and what helps each one.","why":"The long-form pick for the full picture."}],"n":15},"w8c":{"id":"w8c","title":"Keep going, at your own pace","open":"Eight weeks ago you opened the first lesson. Look at what's on your list now.","body":"You have a morning routine, a walking habit, a chair routine, home comforts you trust, a few kitchen shortcuts, a bedtime, a breath for hard moments and a flare plan on the fridge. That's a lot.\n\n## Look back\nOpen your pain log. Compare week 1 with this week. Even one point lower is real. If your number is the same but you're doing more, that's progress too.\n\n## Make it last\n- Tie each habit to something you already do: \"After coffee, I walk.\"\n- Keep the habits that helped. Drop the ones that didn't.\n- Walk with a friend, or join a class. It's easier with someone.\n- Come back to any lesson whenever you need it. The lessons stay here.\n\n## Still to come\nAfter this lesson come the deep-dive lessons: food, herbs and every supplement from The Joint Reset. Take them at your own pace. Then you'll reach your graduation.\n\n## For example\n\"After my coffee, I do my chair routine. After lunch, I walk. After brushing my teeth, I do the 4-6 breath.\" Three hooks, three habits.","try":"Read the note you wrote before week 1. Then write one line to yourself about what's easier now.","watch":[{"label":"Tai chi for sore joints, with Dr Paul Lam","src":"Tai Chi for Health Institute (YouTube)","yt":"tAOuEpa01j4","len":"About 50 minutes. Make a cup of tea and settle in.","what":"A calm follow-along class with Dr Paul Lam, a doctor who has taught tai chi to people with arthritis for many years.","why":"Tai chi helps balance and comfort, and it's a lovely habit to keep."}],"n":17},"ra1":{"id":"ra1","title":"Rheumatoid arthritis: when your body fights itself","open":"Rheumatoid arthritis is not your fault. Your body's guard system got its wires crossed.","body":"Your immune system is like a guard dog. It is meant to bark at germs. In rheumatoid arthritis, it barks at your own joints by mistake.\n\nIt attacks the thin lining inside the joint. The lining gets puffy and hot. Over time, this can harm the bone and cushion.\n\n## How it tends to feel\n- Stiff for more than an hour in the morning.\n- Warm, puffy joints on both sides, like both wrists.\n- Very tired, even after sleep.\n\n## You are not alone\nAbout 1.3 to 1.5 million Americans have it. Women get it 2 to 3 times more often than men.\n\n## The most important thing\nMedicine is what protects your joints from damage. The early months matter most. Starting early, and letting your doctor adjust the medicine until the joints go quiet, is why so many people now reach remission. A Finnish study found about 69 out of 100 people with rheumatoid arthritis were in remission in one recent year.\n\nThe remedies in this Program can comfort you alongside your medicine. They don't replace it.\n\n## Two more facts\n- People with rheumatoid arthritis often have lower folate, protein and zinc. A full plate and a blood test now and then help.\n- Many are low in iron, which adds to tiredness. Ask for a blood test before you take or stop iron.\n\n## For example\nLinda's knuckles were puffy every morning for weeks. She went to a doctor early. She started medicine and kept up her walks and warm soaks. Her joints settled.","try":"Write down how long you are stiff tomorrow morning, in minutes. Take that number to your next visit.","watch":[{"label":"Rheumatoid arthritis: disease overview","src":"Johns Hopkins Arthritis Center","yt":"7PRe46JE3sE","len":"About 7 minutes. Part of a five-part series.","what":"Johns Hopkins rheumatologists explain what rheumatoid arthritis is and how it acts in the body.","why":"Johns Hopkins is one of the best-known arthritis centers in America. This is the long-form pick for this lesson."},{"label":"What is rheumatoid arthritis?","src":"Mayo Clinic (Mayo Clinic Minute)","yt":"fNlu2rW9PkY","len":"About one minute.","what":"Dr. Eric Matteson explains how rheumatoid arthritis is different from wear-and-tear arthritis, and why starting treatment early matters.","why":"A quick picture of the immune system mix-up you just read about."}],"n":1},"ra2":{"id":"ra2","title":"Rheumatoid arthritis: calming the fire with food","open":"Food can't replace your medicine. But a plant-rich plate may help your joints feel calmer.","body":"Inflammation (say it: in-fluh-MAY-shun) is the heat, puffiness and pain in a joint. Some foods may help cool it down.\n\n## The Mediterranean plate\nThe American College of Rheumatology suggests this way of eating for rheumatoid arthritis. Lots of vegetables, fruit, beans, nuts and whole grains. Olive oil. Fish twice a week.\n\n## Plant-based eating\nIn 1991, a study in the Lancet followed people with rheumatoid arthritis who ate mostly plants. Their puffy joints and morning stiffness eased. A year later, the help was still there.\n\nIn 2022, Dr. Neal Barnard's team tried a low-fat vegan diet with 44 adults for 16 weeks. The average number of puffy joints fell from 7 to about 3. It was small, and his group supports plant eating, so call it promising.\n\n## Fish oil\nA review of 22 studies found fish oil eased pain a little in rheumatoid arthritis. In one study, 39 out of 100 people taking cod liver oil could cut their pain pills by more than a third. Only 10 out of 100 could on a fake capsule. Ask your doctor before capsules.\n\n## Plant oils\nEvening primrose oil and borage oil eased sore joints a little in studies. Ask first if you take blood thinners.\n\n## For example\nBreakfast: oats with ground flaxseed and berries. Lunch: lentil soup. Supper: salmon, greens and a potato with olive oil.","try":"Add one plant food to one meal today. Beans, greens or berries all count.","watch":[{"label":"Rheumatoid arthritis: lifestyle options","src":"Johns Hopkins Arthritis Center","yt":"A3N5bJw-soM","len":"About 7 minutes.","what":"What you can do day to day, alongside your medicine, to feel better.","why":"It matches the food, rest and movement ideas in this lesson."},{"label":"Fighting arthritis with food","src":"Mayo Clinic (Mayo Clinic Minute)","yt":"oF32NlxH-R0","len":"About one minute.","what":"Dr. John Davis of Mayo Clinic names the foods to eat less of and the foods to add, like fruit, vegetables, olive oil, nuts, whole grains and fish.","why":"It is the same plate this lesson describes, from a big-name clinic."}],"n":1},"ra3":{"id":"ra3","title":"Rheumatoid arthritis: flares, rest and your doctor","open":"A flare is a bad spell. You can't always stop one, but you can be ready for it.","body":"A flare is when your joints get more sore, hot and puffy for a few days or weeks. Most people with rheumatoid arthritis have them sometimes.\n\n## During a flare\n- Rest the sore joints more, but keep moving a little. Move each joint gently through its range once or twice a day.\n- Use cold packs on hot, puffy joints.\n- Do half of your normal jobs. Rest in the middle.\n- Use the 4-6 breath from week 7.\n- Call your doctor if a flare lasts or is worse than usual.\n\n## Between flares\n- Keep up walks and chair exercises.\n- Sleep at the same time each night.\n- Calming practices help. Studies found mindfulness eased pain and stiffness as an add-on to normal care.\n\n## Working with your doctor\n- Bring your pain log.\n- Say how long morning stiffness lasts.\n- Ask: \"Are my joints quiet yet? If not, can we adjust the plan?\"\n- Only change a prescribed medicine after speaking with your doctor.\n\n## A word about herbs\nHerbs can comfort you. They haven't been shown to protect joints from damage. Some, like cat's claw, may act on the immune system, so ask your rheumatologist first.\n\n## For example\nTom felt a flare starting on Monday. He followed his fridge plan: cold packs, half his jobs, the breath. He called his doctor on Wednesday. His doctor changed one thing. By the next week, the flare had settled.","try":"Write down one thing you will do on day 1 of your next flare. Add it to your flare-up plan in the Toolkit.","watch":[{"label":"Treatment options for rheumatoid arthritis","src":"Johns Hopkins Arthritis Center","yt":"YSOhxIJCV-o","len":"About 6 minutes.","what":"Johns Hopkins doctors walk through today's treatment choices for rheumatoid arthritis.","why":"It helps you talk to your doctor about the plan."},{"label":"Rheumatoid arthritis: treatment","src":"Johns Hopkins Arthritis Center","yt":"2kDbztlKXKM","len":"About 8 minutes.","what":"How doctors treat rheumatoid arthritis today, and why the medicine is started early.","why":"It helps you walk into your next visit knowing the words."}],"n":1},"g1":{"id":"g1","title":"Gout: the crystal story","open":"Gout is caused by tiny crystals. Once you understand them, gout makes sense.","body":"Your body makes something called uric acid (say it: YUR-ick). It comes from breaking down purines, which are found in your body and in some foods.\n\nMost of the time, uric acid leaves in your pee. If there is too much, it can form tiny sharp crystals, like needles. They settle in a joint. Your body attacks them, and the joint gets hot, red and very sore.\n\n## Who gets gout\nAbout 9 million Americans have gout. Most are men.\n\n## How an attack feels\n- One joint, often the big toe.\n- Hot, red and very tender, often overnight.\n- Even a bedsheet can hurt.\n- It settles over a few days.\n\n## The good news\nGout can go quiet for years. If the uric acid in your blood stays below 6, the crystals slowly melt. Over months or years, attacks can stop.\n\n## What raises the risk\n- Extra weight.\n- Beer and spirits.\n- Sweet drinks made with high-fructose corn syrup.\n- Lots of red meat, organ meat and shellfish.\n- Not drinking enough water.\n\n## For example\nFrank had beer and a big steak at a party. That night his big toe turned red and hot. That is a classic gout attack. His doctor checked his uric acid and made a plan.\n\n## Get help today if\nA joint is hot and red and you also have a fever. It could be an infection.","try":"Drink one extra glass of water today, a few sips at a time.","watch":[{"label":"What is gout? An introduction","src":"Johns Hopkins Arthritis Center","yt":"12oykWTeaXg","len":"About 4 minutes. Part of a six-part series.","what":"A Johns Hopkins doctor explains uric acid, crystals and why gout attacks come on so fast.","why":"The long-form pick: it walks through the whole crystal story."},{"label":"Acute gout treatment: relief for a sudden attack","src":"Johns Hopkins Arthritis Center","yt":"sQKK6VWmF7o","len":"About 5 minutes.","what":"What doctors do to calm a gout attack once it starts.","why":"So you know what to ask for when an attack hits."}],"n":1},"g2":{"id":"g2","title":"Gout: what to eat and drink","open":"Food matters more in gout than in any other kind of arthritis.","body":"The American College of Rheumatology gives a short list. Here it is, made simple.\n\n## Eat and drink less of\n- Beer and spirits. These raise the risk the most.\n- Red meat, organ meat like liver, and shellfish.\n- Sweet drinks with high-fructose corn syrup, like many sodas.\n\n## Eat and drink more of\n- Water. About 8 glasses a day helps keep attacks away.\n- Low-fat milk and yogurt. They are linked with fewer attacks.\n- Cherries. In a study of more than 600 people, those who ate cherries over 2 days had about a third fewer attacks in the days after. A serving was 10 to 12 cherries. Frozen ones count.\n- Beans, lentils, vegetables and whole grains.\n\n## Good to know\n- Vitamin C pills are not suggested for gout.\n- Some people find tomatoes set off an attack. Try leaving them out for 2 weeks, then bring them back and see.\n- Losing extra weight lowers the risk of attacks.\n- Niacin pills can make gout worse. Avoid them.\n\n## For example\nInstead of a soda with lunch, have water and a bowl of cherries. Instead of steak three nights, have lentils or fish on two of them.","try":"Have a small bowl of cherries or a glass of low-fat milk today.","watch":[{"label":"The gout diet and the right foods","src":"Johns Hopkins Arthritis Center","yt":"Tq1aRuggMFU","len":"About 7 minutes.","what":"Which foods and drinks raise uric acid, and which ones help.","why":"It lines up with the food list in this lesson."},{"label":"Living with gout: lifestyle tips","src":"Johns Hopkins Arthritis Center","yt":"LZBCBt8n0L0","len":"About 5 minutes.","what":"Everyday habits that make gout attacks less likely.","why":"A good second watch after the diet video."}],"n":1},"g3":{"id":"g3","title":"Gout: stopping the next attack","open":"The best gout plan works between attacks, not just during them.","body":"There are two parts to gout care. Calming an attack. And stopping the next one.\n\n## During an attack\n- Rest the joint and raise it up.\n- A cold pack wrapped in a cloth, 15 minutes at a time.\n- Keep sipping water.\n- Call your doctor. There is medicine that calms an attack fast. Starting it early works best.\n\n## Stopping the next one\nIf attacks keep coming back, medicine that lowers uric acid is what stops them for good. Your doctor checks your blood and adjusts the dose until uric acid is below 6. Then the crystals slowly melt.\n\nMany people stop this medicine when they feel fine. That lets the crystals come back. Only change it after speaking with your doctor.\n\n## Daily habits that help\n- Water through the day.\n- Less beer and spirits.\n- Fewer sweet drinks.\n- A lighter load if you carry extra weight.\n- Cherries in your fruit bowl.\n\n## For example\nPaul had 3 attacks in a year. His doctor started a daily uric acid medicine. Paul also swapped soda for water. A year later, he had not had another attack.","try":"Write down when your last attack was and what you ate or drank the day before. Take it to your doctor.","watch":[{"label":"Chronic gout treatment: the second phase","src":"Johns Hopkins Arthritis Center","yt":"H1XGuaCveWA","len":"About 6 minutes.","what":"How medicine that lowers uric acid stops attacks coming back.","why":"This is the part most people never hear about."},{"label":"Long-term impact of gout","src":"Johns Hopkins Arthritis Center","yt":"mMSKFT5hsNY","len":"About 4 minutes.","what":"What happens when gout is left untreated for years, and why steady care matters.","why":"It shows why the between-attacks plan is worth it."}],"n":1},"psa1":{"id":"psa1","title":"Psoriatic arthritis: when skin and joints are linked","open":"Psoriatic arthritis is arthritis that comes with the skin problem psoriasis. Knowing the signs helps you get the right care early.","body":"Psoriasis (say it: suh-RYE-uh-sis) makes dry, red, scaly patches on the skin. About 1 in 3 people with psoriasis also get sore, puffy joints. That is psoriatic arthritis (say it: sore-ee-AT-ick).\n\nLike rheumatoid arthritis, it comes from the immune system getting mixed up. It is not caused by anything you did.\n\n## Signs to look for\n- A whole finger or toe that swells up like a little sausage.\n- Small dents or pits in your nails, or nails lifting up.\n- Pain at the back of the heel or under the foot.\n- Stiff, sore lower back, worst in the morning.\n- Sore joints on one side only, or on both sides.\n\n## Good news\nToday there are many medicines that calm both the skin and the joints. Many people reach a point where the disease is very quiet.\n\n## For example\nDon has had scaly patches on his elbows for years. Lately his middle finger is puffy all the way down, and his heel hurts in the morning. That is worth showing a doctor soon.","try":"Look at your nails and fingers today. Write down anything you notice: pits, puffy fingers or sore heels.","watch":[{"label":"Psoriatic arthritis: signs and symptoms","src":"Johns Hopkins Arthritis Center","yt":"F8Rks19iY6k","len":"About 5 minutes.","what":"Johns Hopkins doctors show the signs of psoriatic arthritis in the skin, nails and joints.","why":"It helps you spot what to tell your doctor."},{"label":"Psoriatic arthritis: overview","src":"Johns Hopkins Arthritis Center","yt":"1YtWOsw44xY","len":"About 4 minutes.","what":"What psoriatic arthritis is and how it acts in the body.","why":"A clear start from a top arthritis center."}],"n":1},"psa2":{"id":"psa2","title":"Psoriatic arthritis: your daily plan to calm it","open":"Medicine does the big job. These daily habits make it work better and help you feel better.","body":"## Keep moving\nWalking, water exercise and chair moves keep joints loose and muscles strong. Move gently on bad days.\n\n## Carry less weight\nExtra weight makes psoriatic arthritis harder to calm. Studies have found that people who lost weight often did better on their medicine. Even a little loss helps.\n\n## Eat the joint-friendly plate\nVegetables, fruit, beans, whole grains, olive oil and fish twice a week. This plate also helps your heart, and psoriatic arthritis raises heart risk.\n\n## Care for your skin\n- Use a thick, plain moisturizer every day.\n- Short, warm showers, not hot.\n- Some sun can help skin, but never burn.\n\n## Other habits that matter\n- Stop smoking. It makes the disease worse and medicines work less well.\n- Keep alcohol low, mostly if you take methotrexate.\n- Warm what is stiff, cool what is swollen.\n\n## For example\nA good day: warm shower, moisturizer, a 10-minute walk, a salad with salmon for lunch, and a cold pack on a puffy finger in the evening.","try":"Pick one habit from this list and do it every day this week.","watch":[{"label":"Psoriatic arthritis: lifestyle options","src":"Johns Hopkins Arthritis Center","yt":"J69TLJi5QVA","len":"About two minutes.","what":"Daily habits that help with psoriatic arthritis.","why":"It backs up the plan in this lesson."},{"label":"Fighting arthritis with food","src":"Mayo Clinic (Mayo Clinic Minute)","yt":"oF32NlxH-R0","len":"About one minute.","what":"Foods to eat less of and foods to add for arthritis.","why":"The same plate this lesson describes."}],"n":1},"psa3":{"id":"psa3","title":"Psoriatic arthritis: getting it under control","open":"Psoriatic arthritis can be brought under control. The key is the right doctor and the right medicine, started early.","body":"## See a rheumatologist\nA rheumatologist (say it: roo-muh-TOL-uh-jist) is a doctor for joints and the immune system. Ask your regular doctor for a referral if you have psoriasis and sore, puffy joints.\n\n## The medicines\n- Pills like methotrexate calm the immune system.\n- Newer medicines called biologics target the exact part of the immune system causing trouble. Many help both skin and joints.\n- Your doctor checks you at each visit and changes the plan until your joints are quiet. Doctors call this treat to target.\n\nOnly change a prescribed medicine after speaking with your doctor.\n\n## Why early matters\nLeft alone, psoriatic arthritis can harm joints for good. Started early, treatment protects them. Many people reach a state where they have little or no swelling and pain.\n\n## Questions to ask\n- \"Is this psoriatic arthritis?\"\n- \"Which medicine helps both my skin and my joints?\"\n- \"What is our goal, and how will we know we've reached it?\"\n\n## For example\nRita's fingers and heels hurt for a year before she saw a rheumatologist. She started a biologic. Six months later her skin had cleared a lot, and her fingers were no longer puffy.","try":"Write your three questions for the rheumatologist in the Toolkit.","watch":[{"label":"Psoriatic arthritis: treatment","src":"Johns Hopkins Arthritis Center","yt":"h3KzEaoAId8","len":"About 5 minutes.","what":"Johns Hopkins doctors explain the medicines for psoriatic arthritis and how they are chosen.","why":"It helps you understand the choices your doctor may offer."},{"label":"Psoriatic arthritis: lifestyle options","src":"Johns Hopkins Arthritis Center","yt":"J69TLJi5QVA","len":"About two minutes.","what":"Daily habits that work alongside medicine.","why":"A short reminder of your part of the plan."}],"n":1},"as1":{"id":"as1","title":"Back arthritis (ankylosing spondylitis): what it is","open":"Most back pain gets better with rest. This kind gets better when you move. That one clue matters a lot.","body":"Ankylosing spondylitis (say it: ANK-ih-low-sing spon-dih-LIE-tiss) is arthritis of the spine. The immune system causes swelling where the spine meets the pelvis and in the small joints of the back. Doctors often shorten it to AS.\n\n## Signs to look for\n- Lower back pain that started slowly, often before age 45.\n- Stiff for more than 30 minutes in the morning.\n- Feels better after moving, worse after resting.\n- Wakes you in the second half of the night.\n- Pain in the buttocks, heels or chest.\n\n## Watch your eyes\nA red, painful eye that hates bright light can come with AS. It is called uveitis (say it: you-vee-EYE-tiss). See an eye doctor the same day.\n\n## Good news\nMovement and the right medicine work well. Many people with AS live full, active lives.\n\n## For example\nMike, 38, has had back pain for 2 years. It is worst when he wakes and better after his morning walk. That pattern is worth telling a doctor about.","try":"Notice your back tomorrow morning. Does it feel better or worse after 10 minutes of moving? Write it down.","watch":[{"label":"Ankylosing spondylitis: disease overview","src":"Johns Hopkins Arthritis Center","yt":"eFriEKJUHA8","len":"About 3 minutes. Part of a five-part series.","what":"Johns Hopkins doctors explain what AS is and who gets it.","why":"A clear start from a top arthritis center."},{"label":"Ankylosing spondylitis: signs and symptoms","src":"Johns Hopkins Arthritis Center","yt":"eQ4DB4mnAEY","len":"About 3 minutes.","what":"The signs of AS, from the back to the eyes.","why":"It helps you spot what to tell your doctor."}],"n":1},"as2":{"id":"as2","title":"Back arthritis: your daily moving plan","open":"With AS, moving every day is not extra. It is part of the treatment.","body":"## Every day\n- Stretch your back gently each morning, after a warm shower.\n- Stand tall. Check your posture a few times a day: ears over shoulders, shoulders over hips.\n- Take deep breaths. Fill your chest all the way. This keeps your ribs moving.\n\n## Good kinds of exercise\n- Swimming and water exercise. Water holds you up while you move.\n- Walking.\n- Tai chi and gentle yoga.\n- Lying flat on your back or on your tummy for a few minutes a day helps keep the spine straight.\n\n## Sleep\n- A firm mattress.\n- A thin pillow, so your neck stays straight.\n\n## Other habits\n- Stop smoking. It makes AS worse and harms breathing.\n- Warmth for stiffness.\n\n## For example\nMorning plan: warm shower, 5 minutes of stretches, 5 deep breaths at the window, and a walk after breakfast.","try":"Do 5 deep breaths and one back stretch after your shower today.","watch":[{"label":"Ankylosing spondylitis: lifestyle options","src":"Johns Hopkins Arthritis Center","yt":"H_M_CBeiPqE","len":"About two minutes.","what":"Daily habits and exercise for AS.","why":"It backs up the moving plan in this lesson."},{"label":"Yoga for arthritis: an introduction","src":"Johns Hopkins Arthritis Center","yt":"6LHsfixgaaA","len":"About 4 minutes.","what":"How yoga can be made safe and easy for people with arthritis.","why":"Slow stretching is one of the best habits for AS."}],"n":1},"as3":{"id":"as3","title":"Back arthritis: getting it under control","open":"Medicine and movement together can calm AS a great deal.","body":"## See a rheumatologist\nA rheumatologist is the doctor for AS. Tests may include an X-ray or MRI of the lower back and a blood test.\n\n## The medicines\n- Anti-inflammatory pills are often the first step. Your doctor checks they are safe for your stomach, heart and kidneys.\n- If they are not enough, biologic medicines can calm AS strongly. Many people feel much better on them.\n- Only change a prescribed medicine after speaking with your doctor.\n\n## Your part\n- Daily stretching and exercise, every day, even when you feel fine.\n- A physical therapist can teach you a home plan.\n\n## Call your doctor\n- A red, painful eye: see an eye doctor the same day.\n- New numbness or weakness in your legs.\n\n## For example\nMike started an anti-inflammatory and a daily swim. His back felt better in weeks. When it came back, his doctor added a biologic. Now he goes on long walks with his kids.","try":"If you think you have AS, add \"Could this be ankylosing spondylitis?\" to your questions for the doctor.","watch":[{"label":"Ankylosing spondylitis: treatment","src":"Johns Hopkins Arthritis Center","yt":"iUWPuNQ17D0","len":"About 5 minutes.","what":"Johns Hopkins doctors explain the medicines for AS.","why":"It helps you understand the choices your doctor may offer."},{"label":"Ankylosing spondylitis: lifestyle options","src":"Johns Hopkins Arthritis Center","yt":"H_M_CBeiPqE","len":"About two minutes.","what":"Daily habits that work alongside medicine.","why":"A short reminder of your part."}],"n":1},"lu1":{"id":"lu1","title":"Lupus: what it is and how it feels","open":"Lupus can affect more than joints. Knowing the signs helps you and your doctor stay ahead of it.","body":"Lupus is when the immune system attacks the body's own parts. It can touch the joints, skin, kidneys, blood and more. About 9 out of 10 people with lupus are women.\n\n## Common signs\n- Sore, puffy joints, often in the hands and wrists.\n- Deep tiredness.\n- A rash, sometimes across the cheeks and nose in a butterfly shape.\n- Skin that reacts badly to the sun.\n- Fevers that come and go.\n- Mouth sores, hair thinning, or fingers that turn white or blue in the cold.\n\n## Flares\nLupus comes and goes. A bad spell is called a flare. Sun, stress, infections and too little rest can set one off.\n\n## Good news\nWith care, most people with lupus live full lives. Treatment keeps it quiet and protects your organs.\n\n## For example\nAngela, 52, had sore wrists, a rash after a beach day, and felt worn out for weeks. Her doctor ran blood tests and found lupus. Now she knows her triggers.","try":"Write down any signs from the list that you have noticed. Take the list to your doctor.","watch":[{"label":"Lupus: disease overview","src":"Johns Hopkins Arthritis Center","yt":"4PapRcayjxs","len":"About two minutes.","what":"Johns Hopkins doctors explain what lupus is.","why":"A clear start in two minutes."},{"label":"Lupus: signs and symptoms","src":"Johns Hopkins Arthritis Center","yt":"zJQGaXBuyuc","len":"About 6 minutes.","what":"The many signs of lupus, from joints to skin to kidneys.","why":"It helps you know what to watch for."}],"n":1},"lu2":{"id":"lu2","title":"Lupus: your daily plan","open":"Small daily habits can mean fewer flares.","body":"## Protect your skin from the sun\n- Sunscreen SPF 30 or higher, every day, even when cloudy.\n- A wide hat and long sleeves.\n- Stay in the shade in the middle of the day.\n\n## Pace your energy\n- Rest before you're worn out.\n- Do half, rest, do half.\n- Sleep at the same time each night.\n\n## Move gently\nWalking, water exercise and stretching help joints, mood and tiredness. Start small.\n\n## Eat for your heart\nLupus raises heart risk. Eat the joint-friendly plate: vegetables, fruit, beans, whole grains, olive oil and fish.\n\n## Things to avoid\n- Alfalfa sprouts and alfalfa pills. They have set off lupus-like flares.\n- Smoking.\n- Herbs that \"boost\" the immune system, like echinacea, unless your doctor says yes.\n\n## For example\nAngela keeps sunscreen by the door, gardens in the early morning, and takes a 20-minute rest after lunch.","try":"Put sunscreen and a hat by your front door today.","watch":[{"label":"Lupus: lifestyle options","src":"Johns Hopkins Arthritis Center","yt":"bG7dNRgVF64","len":"About 4 minutes.","what":"Daily habits that help with lupus, from sun care to rest.","why":"It backs up the plan in this lesson."},{"label":"Lupus: disease overview","src":"Johns Hopkins Arthritis Center","yt":"4PapRcayjxs","len":"About two minutes.","what":"A short refresher on what lupus is.","why":"Good to share with family."}],"n":1},"lu3":{"id":"lu3","title":"Lupus: keeping it quiet with your doctor","open":"Lupus care is a team effort. Regular checks catch problems early.","body":"## The main medicine\nMost people with lupus take hydroxychloroquine (say it: hy-drox-ee-KLOR-oh-kwin). It calms lupus and lowers flares. Because it can rarely affect the eyes, you get eye checks.\n\nOther medicines may be added if lupus is more active. Only change a prescribed medicine after speaking with your doctor.\n\n## Regular tests\n- Blood tests.\n- Urine tests, to check the kidneys.\n- Blood pressure checks.\n\n## Call your doctor if\n- You have a new rash, fever or swelling in your legs.\n- Your urine looks foamy or dark.\n- You have chest pain when you breathe.\n\n## Good news\nWith steady care, many people keep lupus quiet for long stretches.\n\n## For example\nAngela takes her medicine every day, gets her eyes checked once a year, and brings a list to each visit. She hasn't had a big flare in two years.","try":"Add your next blood test and eye check dates to your calendar.","watch":[{"label":"Lupus treatment","src":"Johns Hopkins Arthritis Center","yt":"AkQD-dhqmZo","len":"About 3 minutes.","what":"Johns Hopkins doctors explain how lupus is treated.","why":"It helps you understand your medicines."},{"label":"Diagnosing lupus","src":"Johns Hopkins Arthritis Center","yt":"oTMz-kLBj-Y","len":"About 4 minutes.","what":"How doctors find out if it's lupus, and the tests they use.","why":"Useful if you are still waiting for answers."}],"n":1},"pm1":{"id":"pm1","title":"Polymyalgia rheumatica: stiff shoulders and hips after 50","open":"If your shoulders and hips are so stiff it's hard to get out of bed, this could be the cause. It responds well to treatment.","body":"Polymyalgia rheumatica (say it: polly-my-AL-juh roo-MAT-ick-uh) is often called PMR. It almost always starts after age 50.\n\n## Signs\n- Aching and stiffness in both shoulders, the neck, and often both hips and thighs.\n- Very stiff in the morning, often for an hour or more.\n- Hard to lift your arms to comb your hair, or get out of a chair.\n- It can start fast, over days or a few weeks.\n- Tired, low fever, or losing weight.\n\n## Emergency signs\nPMR can come with a problem called giant cell arteritis. Get help the same day if you have:\n- A new headache, mostly at the temples.\n- Jaw pain when you chew.\n- Any change in your eyesight.\nThis can harm vision, so it can't wait.\n\n## For example\nHelen, 71, woke up one week unable to lift her arms to put on a sweater. Her hips ached too. Her doctor did blood tests and said PMR.","try":"Read the emergency signs aloud. Make sure you know them.","watch":[{"label":"Living well with polymyalgia rheumatica","src":"Mayo Clinic","yt":"uJl42Zq_pxg","len":"About two minutes.","what":"A short Mayo Clinic video on PMR and living well with it.","why":"A quick, clear start."},{"label":"Understanding and managing polymyalgia rheumatica","src":"Musculoskeletal Health Australia","yt":"mQ4jw7NPoFA","len":"About 45 minutes. Make a cup of tea and settle in.","what":"A rheumatologist, Dr Daniel Boulos, explains PMR, its treatment and what to expect.","why":"The full story from a joint specialist."}],"n":1},"pm2":{"id":"pm2","title":"Polymyalgia rheumatica: getting it cleared up","open":"PMR usually gets much better within days of starting treatment. Then it's a slow, steady road with your doctor.","body":"## The medicine\nA low dose of a steroid called prednisone usually eases PMR fast, often within a few days. That fast change is one way doctors know it's PMR.\n\nThe dose is lowered slowly, often over 1 to 2 years. Lowering it too fast can bring the stiffness back. Only change your dose after speaking with your doctor.\n\n## Protect your body while on steroids\n- Bones: ask about calcium, vitamin D and a bone scan.\n- Walk and do strength moves to keep bones and muscles strong.\n- Blood sugar and blood pressure checks.\n- Eat the joint-friendly plate to help your weight.\n\n## Keep moving\nThe chair routine and short walks help keep shoulders and hips loose.\n\n## Good news\nFor most people, PMR goes away over time and the medicine can be stopped.\n\n## For example\nHelen started prednisone and could lift her arms in 3 days. Her doctor lowered the dose bit by bit over 18 months. Now she is off it and gardening again.","try":"Ask your doctor: \"How will we lower my dose, and how do we protect my bones?\"","watch":[{"label":"Polymyalgia rheumatica: a rheumatologist explains","src":"Connected Rheumatology","yt":"QsHIle6u0BY","len":"About 16 minutes.","what":"A rheumatologist explains PMR treatment and the slow lowering of steroids.","why":"It helps you know what the next year or two looks like."},{"label":"Living well with polymyalgia rheumatica","src":"Mayo Clinic","yt":"uJl42Zq_pxg","len":"About two minutes.","what":"A short Mayo Clinic video on living well with PMR.","why":"Easy to share with family."}],"n":1},"cp1":{"id":"cp1","title":"Pseudogout (CPPD): crystals that aren't gout","open":"Pseudogout looks like gout, but the crystals are different. It's common in older adults.","body":"Pseudogout (say it: SOO-doe-gowt) is also called CPPD. Crystals made of calcium form in the cushion of a joint. When they shed into the joint, it flares up.\n\n## Signs\n- A sudden hot, puffy, very sore joint.\n- Most often the knee, then the wrist.\n- It can last days to weeks.\n- It is more common as we get older.\n\n## How it's different from gout\n- Gout crystals come from uric acid. Pseudogout crystals come from calcium.\n- Gout often hits the big toe. Pseudogout often hits the knee.\n- Diet doesn't change pseudogout the way it changes gout.\n- A doctor can tell them apart by looking at joint fluid under a microscope.\n\n## Things that can be linked\nA doctor may check your calcium, magnesium, thyroid and iron levels. These can be linked to CPPD.\n\n## For example\nWalter, 78, woke up with a hot, puffy knee. He thought it was gout. His doctor drew fluid and found calcium crystals. It was pseudogout.","try":"If you've had a hot, puffy knee, write down when it happened and how long it lasted.","watch":[{"label":"How to treat pseudogout and CPPD","src":"Chicago Arthritis","yt":"fucg215mMb8","len":"Under a minute.","what":"A rheumatology clinic sums up how pseudogout is treated.","why":"The quick version."},{"label":"Arthritis explained: osteoarthritis, rheumatoid, gout","src":"Mayo Clinic","yt":"Njc6jtvzUDU","len":"About 30 minutes.","what":"Mayo Clinic experts explain the main kinds of arthritis, including crystal arthritis.","why":"The long-form pick for the bigger picture."}],"n":1},"cp2":{"id":"cp2","title":"Pseudogout: calming an attack and the next one","open":"An attack can be calmed quickly. Between attacks, keeping strong and checking linked problems helps.","body":"## During an attack\n- Rest the joint and raise it up.\n- A cold pack wrapped in a cloth, 15 minutes at a time.\n- See your doctor. They may draw fluid out of the joint, which often eases pain fast, and give a steroid shot.\n- Anti-inflammatory pills or a medicine called colchicine can help. Ask what's safe for you.\n\n## Between attacks\n- Keep the muscles around the knee strong with the chair routine.\n- Walk most days.\n- Keep a healthy weight to ease the load on your knees.\n- Ask your doctor about a low daily dose of colchicine if attacks keep coming.\n- Get linked problems checked and treated: thyroid, calcium, magnesium and iron.\n\nThere is no medicine yet that dissolves these crystals, but attacks can be made fewer and milder.\n\n## For example\nWalter's doctor drained his knee and gave him a shot. He felt better in two days. Now he does the chair routine and walks every morning, and his attacks are rare.","try":"Add \"Can we check my thyroid, calcium, magnesium and iron?\" to your doctor questions.","watch":[{"label":"How to treat pseudogout and CPPD","src":"Chicago Arthritis","yt":"fucg215mMb8","len":"Under a minute.","what":"A quick summary of pseudogout treatment.","why":"A short refresher."},{"label":"Arthritis explained: osteoarthritis, rheumatoid, gout","src":"Mayo Clinic","yt":"Njc6jtvzUDU","len":"About 30 minutes.","what":"A longer look at the kinds of arthritis and their care.","why":"Good to watch before your next visit."}],"n":1},"fb1":{"id":"fb1","title":"Fibromyalgia: pain with the volume turned up","open":"Fibromyalgia is real pain. It doesn't damage your joints, and there are good ways to turn it down.","body":"Fibromyalgia (say it: fye-bro-my-AL-juh) causes aches all over the body. The nerves and brain turn the pain volume up too high. Small things can hurt a lot.\n\n## Common signs\n- Aches and pain in many places, on both sides of the body.\n- Deep tiredness.\n- Poor sleep, even after a full night.\n- Trouble thinking clearly, called fibro fog.\n- Headaches or a sore tummy.\n\nIt is more common in women. It can come with other kinds of arthritis too.\n\n## What it is not\nIt does not harm joints or muscles. It is not in your head. Scans and blood tests are usually normal, which can be frustrating.\n\n## Good news\nThe right plan helps many people feel a lot better. Exercise, sleep and calming the nervous system are the keys.\n\n## For example\nCarol hurt all over, slept badly and felt foggy. Her tests were normal. Her doctor said fibromyalgia. Knowing the name was the first step to a plan.","try":"Rate your pain, sleep and tiredness today from 0 to 10. Write the three numbers down.","watch":[{"label":"What is fibromyalgia?","src":"Mayo Clinic","yt":"-hHNxfYaUUI","len":"About 4 minutes.","what":"A Mayo Clinic doctor explains fibromyalgia and how it affects pain, sleep and energy.","why":"A clear, kind explanation from a top clinic."},{"label":"Fibromyalgia: Mayo Clinic Radio","src":"Mayo Clinic","yt":"MK4YoTAlr7s","len":"About 19 minutes.","what":"A longer talk with a Mayo Clinic expert on what fibromyalgia is and what helps.","why":"The long-form pick, if you want the full story."}],"n":1},"fb2":{"id":"fb2","title":"Fibromyalgia: the plan that helps most","open":"The best-proven treatment for fibromyalgia isn't a pill. It's moving, a little more each week.","body":"## 1. Move, starting very small\nExercise has the strongest proof of anything for fibromyalgia. The trick is starting tiny.\n- Week 1: 5 minutes of walking or water exercise a day.\n- Add 1 or 2 minutes each week.\n- Tai chi did very well in studies of people with fibromyalgia.\n\n## 2. Fix your sleep\n- Same bedtime and wake time every day.\n- No screens for an hour before bed.\n- A warm bath before bed.\n\n## 3. Pace yourself\nDon't do everything on a good day. Pick a set amount and stop there.\n\n## 4. Calm the nervous system\n- The 4-6 breath.\n- A talking therapy called CBT helps many people.\n- Warm baths and heat packs.\n\n## For example\nCarol started with a 5-minute walk after lunch. Six weeks later she walks 15 minutes and does tai chi twice a week. Her pain is lower and her sleep is better.","try":"Take a 5-minute walk today. Write your pain number before and after.","watch":[{"label":"Simple tips to help manage your fibromyalgia","src":"Mayo Clinic Press","yt":"bi_vA0v9Wmc","len":"About two minutes.","what":"Quick, practical tips for living with fibromyalgia.","why":"Short and easy to act on."},{"label":"Fibromyalgia treatment research","src":"Mayo Clinic","yt":"mNa9IBz6EDk","len":"About 11 minutes.","what":"Mayo Clinic experts talk about what research shows helps fibromyalgia most.","why":"It backs up why exercise and sleep come first."}],"n":1},"fb3":{"id":"fb3","title":"Fibromyalgia: help from your doctor","open":"Your doctor can rule out other problems and add help where it fits.","body":"## Rule out other causes\nAsk your doctor to check things that can feel like fibromyalgia:\n- Thyroid problems.\n- Low vitamin D.\n- Other kinds of arthritis, like rheumatoid arthritis or lupus.\n\n## Medicines that help some people\nSome medicines turn the pain volume down a little or help sleep. Your doctor can tell you if one fits you. Strong opioid pain pills are not suggested for fibromyalgia. Only change a prescribed medicine after speaking with your doctor.\n\n## Other helpers\n- A physical therapist can build an exercise plan at your pace.\n- CBT, a talking therapy, helps many people cope and sleep.\n- A support group so you don't feel alone.\n\n## Good news\nMany people with fibromyalgia improve a lot, mostly when they keep moving and sleep well.\n\n## For example\nCarol's doctor found her vitamin D was low and fixed it. He sent her to a physical therapist and a CBT class. A year later she says she has her life back.","try":"Write \"Can we check my thyroid and vitamin D?\" on your questions for the doctor.","watch":[{"label":"Fibromyalgia: Mayo Clinic Radio","src":"Mayo Clinic","yt":"MK4YoTAlr7s","len":"About 19 minutes.","what":"A longer talk with a Mayo Clinic expert on treatment options.","why":"Useful before your next doctor visit."},{"label":"What is fibromyalgia?","src":"Mayo Clinic","yt":"-hHNxfYaUUI","len":"About 4 minutes.","what":"A short refresher you can share with family.","why":"It helps others understand what you live with."}],"n":1},"bt1":{"id":"bt1","title":"Bursitis and tendinitis: the sore spot next to a joint","open":"Not every sore joint is arthritis. Sometimes it's a sore cushion or cord right next to it, and that can clear up.","body":"## Bursitis (say it: bur-SIGH-tiss)\nA bursa is a small cushion filled with fluid. It sits between bone and muscle so they glide. When it gets swollen and sore, that's bursitis.\n\n## Tendinitis (say it: ten-dih-NIGH-tiss)\nA tendon is a strong cord that joins muscle to bone. When it gets sore and swollen, that's tendinitis.\n\n## Where it happens\n- Shoulder: hurts to reach up or sleep on that side.\n- Elbow: tennis elbow, sore on the outside.\n- Hip: sore on the outside of the hip, mostly lying on it.\n- Knee: puffy front of the knee from kneeling.\n- Heel: the Achilles tendon at the back.\n- Thumb side of the wrist.\n\n## Why it happens\nUsually too much of one movement. Gardening, painting, kneeling, or a new sport.\n\n## Good news\nMost bursitis and tendinitis clears up in a few weeks with the right care.\n\n## For example\nBetty painted her fence all weekend. On Monday her shoulder hurt to reach the top shelf. That sounds like tendinitis or bursitis from overuse.","try":"Think back: what did you do a lot of before the pain started? Write it down.","watch":[{"label":"Shoulder pain: common causes and tips","src":"Mayo Clinic Health System","yt":"yIBy7SoXEto","len":"About one minute.","what":"A Mayo doctor on common causes of shoulder pain, including tendinitis.","why":"A quick picture of the problem."},{"label":"Calcific tendonitis","src":"Mayo Clinic","yt":"9uMoPYt-rP0","len":"About two minutes.","what":"A Mayo Clinic sports medicine doctor explains a common kind of shoulder tendinitis.","why":"It shows how tendon pain is checked and treated."}],"n":1},"bt2":{"id":"bt2","title":"Bursitis and tendinitis: how to clear it up","open":"Here is a step-by-step plan to help the sore spot heal.","body":"## Step 1: Rest the movement that hurts\nNot total rest. Just stop the move that sets it off for a while. Keep the rest of you moving.\n\n## Step 2: Cool it\nA cold pack wrapped in a cloth, 15 minutes, a few times a day for the first few days.\n\n## Step 3: Ease the pain\nAsk your pharmacist which pain relief is safe with your other medicines.\n\n## Step 4: Gentle movement\nWhen the sharp pain eases, start gentle stretches. Then easy strength moves. This helps it heal strong.\n\n## Step 5: Change how you do the task\n- Take breaks every 20 minutes.\n- Use a knee pad for kneeling.\n- Use a step stool so you don't reach so high.\n- Switch hands.\n\n## For example\nBetty stopped painting for two weeks. She used a cold pack each evening. After a week, she started small shoulder circles. In four weeks, the shoulder felt normal. Now she paints in short sessions with breaks.","try":"Pick the one movement that sets your pain off, and take a break from it for a week.","watch":[{"label":"Mayo Clinic Minute: thumb pain (de Quervain's)","src":"Mayo Clinic","yt":"o0KSfDuy3i0","len":"About one minute.","what":"A Mayo doctor explains a common tendon problem on the thumb side of the wrist, and what helps.","why":"A quick example of tendinitis care."},{"label":"Calcific tendonitis","src":"Mayo Clinic","yt":"9uMoPYt-rP0","len":"About two minutes.","what":"How a sports medicine doctor treats a sore shoulder tendon.","why":"It shows the steps when home care isn't enough."}],"n":1},"bt3":{"id":"bt3","title":"Bursitis and tendinitis: when it doesn't clear","open":"Most cases heal at home. If yours doesn't, there are good next steps.","body":"## See a doctor if\n- It isn't better after 2 to 3 weeks of home care.\n- You can't move the joint.\n- The spot is very red, hot and puffy, or you have a fever. That can mean an infected bursa, and it needs care the same day.\n\n## What a doctor may do\n- A physical therapist can teach stretches and strength moves just for your sore spot.\n- A steroid shot into the bursa or near the tendon can calm it quickly.\n- If a bursa has lots of fluid, the doctor may drain it.\n- Surgery is rarely needed.\n\n## Keep it from coming back\n- Warm up before big jobs.\n- Take breaks.\n- Keep the muscles around the joint strong.\n\n## For example\nFrank's hip bursitis didn't get better with rest and ice. His doctor gave him a shot and sent him to a physical therapist. With stretches every day, the hip pain went away.","try":"If your sore spot has lasted more than 3 weeks, add it to your doctor questions today.","watch":[{"label":"Shoulder pain: common causes and tips","src":"Mayo Clinic Health System","yt":"yIBy7SoXEto","len":"About one minute.","what":"Tips for shoulder pain and when to see a doctor.","why":"A short refresher."},{"label":"Calcific tendonitis","src":"Mayo Clinic","yt":"9uMoPYt-rP0","len":"About two minutes.","what":"What a doctor can do when a tendon stays sore.","why":"It shows the next steps."}],"n":1},"ct1":{"id":"ct1","title":"Carpal tunnel: tingling hands at night","open":"If your fingers tingle or go numb, mostly at night, this lesson is for you.","body":"The carpal tunnel is a narrow passage in your wrist. A nerve runs through it to your hand. When the tunnel gets tight, the nerve gets squeezed. That's carpal tunnel syndrome.\n\n## Signs\n- Tingling or numbness in the thumb, pointer, middle finger and half the ring finger.\n- Worse at night. You may wake up and shake your hand.\n- Dropping things, or trouble with buttons.\n- The little finger is usually fine.\n\n## What raises the risk\n- Arthritis in the wrist.\n- Diabetes or thyroid problems.\n- Work that bends the wrist a lot.\n- Being a woman, and getting older.\n\n## Good news\nCarpal tunnel can be cleared up. Many people get better with a simple splint. If not, a short surgery works very well.\n\n## For example\nJoan wakes at 3 a.m. with numb fingers and shakes her hand to wake it up. Her little finger feels fine. That sounds like carpal tunnel.","try":"Notice which fingers tingle. Is your little finger left out? Write it down.","watch":[{"label":"Mayo Clinic Minute: what is carpal tunnel syndrome?","src":"Mayo Clinic","yt":"Nzh081c8v6Y","len":"About one minute.","what":"A quick explanation of the squeezed nerve in the wrist.","why":"The whole idea in one minute."},{"label":"Treating carpal tunnel syndrome","src":"Mayo Clinic","yt":"h6kYhSBMxpI","len":"About 5 minutes.","what":"Mayo Clinic doctors explain the treatments, from splints to surgery.","why":"It shows you how it gets cleared up."}],"n":1},"ct2":{"id":"ct2","title":"Carpal tunnel: how to clear it up at home","open":"Start with these simple steps. Many people feel better within weeks.","body":"## 1. Wear a wrist splint at night\nA splint keeps your wrist straight while you sleep, so the nerve isn't squeezed. Pharmacies sell them. This is one of the most helpful things you can do.\n\n## 2. Keep your wrist straight in the day\n- Type and write with a straight wrist.\n- Don't sleep on your hands.\n- Hold a phone or book with a loose grip.\n\n## 3. Take breaks\nEvery 20 minutes, stop, open your hands wide and shake them out.\n\n## 4. Gentle hand moves\nOpen your hand wide, then make a loose fist. Bend your wrist back gently. Stop if it tingles more.\n\n## 5. Warmth and rest\nWarm water for stiff hands can feel good. Cold can help if your wrist feels puffy.\n\n## For example\nJoan bought a splint for $15 and wore it every night. She took breaks while knitting. After 4 weeks, she was sleeping through the night again.","try":"Look for a wrist splint at your pharmacy, or ask your doctor about one.","watch":[{"label":"Carpal tunnel tune-up","src":"Mayo Clinic","yt":"sa_Ml1d2Nsc","len":"About two minutes.","what":"A Mayo Clinic expert shows simple ways to care for carpal tunnel at home.","why":"It shows the moves in this lesson."},{"label":"Treating carpal tunnel syndrome","src":"Mayo Clinic","yt":"h6kYhSBMxpI","len":"About 5 minutes.","what":"The full set of treatments, from splints to surgery.","why":"The longer look."}],"n":1},"ct3":{"id":"ct3","title":"Carpal tunnel: when to get more help","open":"Don't wait too long. A nerve squeezed for a long time can stay weak.","body":"## See a doctor soon if\n- Your fingers are numb all the time, not just at night.\n- The muscle at the base of your thumb looks thinner.\n- You keep dropping things.\n- Home care hasn't helped after a few weeks.\n\n## What a doctor may do\n- A nerve test checks how squeezed the nerve is.\n- A steroid shot into the wrist can help for a while.\n- Surgery opens the tunnel to give the nerve room. It is one of the most common hand surgeries. It is usually quick, and most people go home the same day. Most people get good relief.\n\n## Check the cause\nAsk your doctor to check for diabetes and thyroid problems. Treating them can help your hands too.\n\n## For example\nWalt's thumb muscle had gotten thin. His doctor did a nerve test and suggested surgery. After he healed, the tingling was gone and his grip came back.","try":"Check the muscle at the base of each thumb. If one looks thinner, tell your doctor.","watch":[{"label":"Treating carpal tunnel syndrome","src":"Mayo Clinic","yt":"h6kYhSBMxpI","len":"About 5 minutes.","what":"Mayo Clinic doctors explain shots and surgery for carpal tunnel.","why":"It helps you know what to expect."},{"label":"Mayo Clinic Minute: what is carpal tunnel syndrome?","src":"Mayo Clinic","yt":"Nzh081c8v6Y","len":"About one minute.","what":"A short refresher.","why":"Good to share with family."}],"n":1},"ib1":{"id":"ib1","title":"Arthritis with Crohn's or colitis: what it is","open":"If you have Crohn's disease or ulcerative colitis, sore joints can be part of it. Doctors call it enteropathic arthritis.","body":"Crohn's disease and ulcerative colitis are bowel diseases, called IBD. Up to about 1 in 4 people with IBD also get joint pain or arthritis.\n\n## Two common kinds\n- Big joints like knees and ankles. These often flare when the bowel flares, and calm down when the bowel calms down.\n- The lower back and hips, like back arthritis. This kind can go its own way, apart from the bowel.\n\n## Other signs\n- Sore heels.\n- Red, sore eyes.\n- Skin bumps on the shins.\n\n## Good news\nTreating the bowel disease often calms the joints too. Some medicines help both at once.\n\n## For example\nNina's knees swell every time her colitis flares. When her gut doctor got the colitis under control, her knees settled too.","try":"Write down whether your joint pain flares at the same time as your tummy. Show it to your doctor.","watch":[{"label":"Managing arthritis in IBD","src":"Crohn's and Colitis Foundation","yt":"9SHv2sXEe6w","len":"About 3 minutes.","what":"The Crohn's and Colitis Foundation explains joint pain that comes with bowel disease, and what helps.","why":"Straight from the main charity for Crohn's and colitis."},{"label":"Enteropathic arthritis","src":"Doctor KP, rheumatologist","yt":"Wc6UALMrvzk","len":"About 8 minutes.","what":"A rheumatologist explains arthritis linked to Crohn's disease and ulcerative colitis.","why":"The longer look from a joint specialist."}],"n":1},"ib2":{"id":"ib2","title":"Arthritis with Crohn's or colitis: your plan","open":"Your gut doctor and your joint doctor can work as a team.","body":"## Work with both doctors\nYour gut doctor is a gastroenterologist. Your joint doctor is a rheumatologist. Ask them to talk to each other.\n\n## Be careful with pain pills\nSome common anti-inflammatory pills can upset the bowel and set off a flare. Ask your doctor which pain relief is safe for you.\n\n## Medicines that help both\nSome newer medicines, called biologics, calm both the bowel and the joints. Only change a prescribed medicine after speaking with your doctor.\n\n## Daily habits\n- Keep moving. Walking, water exercise and the chair routine.\n- Warmth for stiffness, cold for a puffy joint.\n- Rest during a flare, but move each joint gently.\n- Eat the foods your gut team says agree with you.\n\n## For example\nNina keeps a cold pack in the freezer for knee flares and walks on good days. Her doctors chose one medicine that helps her gut and her joints.","try":"Ask your doctor: \"Which pain relief is safe for my gut?\"","watch":[{"label":"Enteropathic arthritis","src":"Doctor KP, rheumatologist","yt":"Wc6UALMrvzk","len":"About 8 minutes.","what":"A rheumatologist explains arthritis linked to Crohn's disease and ulcerative colitis.","why":"The longer look from a joint specialist."},{"label":"Managing arthritis in IBD","src":"Crohn's and Colitis Foundation","yt":"9SHv2sXEe6w","len":"About 3 minutes.","what":"The Crohn's and Colitis Foundation explain
