<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Hinge Care Program (test version)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#140d18;--panel:#1d1424;--card:#241a2c;--line:rgba(183,155,201,.28);--ink:#F4EEF7;--soft:#C9BBD2;--accent:#A56BD6;--accent2:#8E5BB8;--gold:#F5B04A;--ok:#7FC79A}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 19px/1.6 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;line-height:1.2;margin:0 0 .5em;color:#fff}
h1{font-size:2rem;text-wrap:balance}h2{font-size:1.45rem}h3{font-size:1.2rem;margin-top:1.4em}
a{color:#E2C8F7}
button{font:inherit}
.test{background:var(--gold);color:#2a1d10;text-align:center;font:600 .85rem Inter,sans-serif;padding:6px 12px}
header{position:sticky;top:0;z-index:20;background:rgba(20,13,24,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hbar{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left))}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;color:#fff;font:600 1.15rem Fraunces,serif;cursor:pointer;padding:6px 4px}
.brand i{display:inline-flex;width:38px;height:38px;border-radius:10px;background:var(--accent2);align-items:center;justify-content:center;font-style:normal}
.hbar .sp{flex:1}
.hbtn{min-height:48px;padding:0 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:#fff;font-weight:600;cursor:pointer}
main{max-width:760px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-right)) 60px max(16px,env(safe-area-inset-left))}
.crumb{color:var(--soft);font-size:.95rem;margin:0 0 6px}
.lead{font-family:Fraunces,Georgia,serif;font-size:1.3rem;line-height:1.45;color:#EADCF5;margin:0 0 18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 24px;border-radius:14px;border:0;background:linear-gradient(180deg,#B07CDD,#8E5BB8);color:#fff;font-weight:700;font-size:1.05rem;cursor:pointer;text-decoration:none;box-shadow:0 4px 0 #5E3A7E}
.btn.ghost{background:var(--card);border:1.5px solid var(--line);box-shadow:none}
.btn:focus-visible,.hbtn:focus-visible,.kcard:focus-visible,.lrow:focus-visible,.mh:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin:0 0 16px}
.hero{background:linear-gradient(160deg,#3a2550,#1d1424);border:1px solid var(--line);border-radius:20px;padding:26px 22px;margin:0 0 22px}
.hero p{color:#E6D8EF}
.grp{font:700 .8rem Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin:26px 0 10px}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.kcard{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px;color:var(--ink);cursor:pointer;min-height:120px}
.kcard b{font:600 1.15rem Fraunces,serif;color:#fff}
.kcard small{color:var(--soft);font-size:.95rem;line-height:1.4}
.kcard .meta{margin-top:auto;font-size:.85rem;color:#D9C4EA}
.kcard.mine{border-color:var(--accent);box-shadow:0 0 0 2px rgba(165,107,214,.35)}
.bar{height:8px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#B07CDD,var(--gold))}
.search{width:100%;min-height:56px;border-radius:14px;border:1.5px solid var(--line);background:var(--panel);color:#fff;font-size:1.05rem;padding:0 16px}
.sres{margin-top:10px}
.sec{border:1px solid var(--line);border-radius:16px;margin:0 0 12px;background:var(--panel);overflow:hidden}
.mh{display:flex;align-items:center;gap:10px;width:100%;min-height:60px;padding:12px 16px;background:none;border:0;color:#fff;text-align:left;cursor:pointer;font-weight:600;font-size:1.05rem}
.mh .c{margin-left:auto;font-size:.85rem;color:var(--soft);font-weight:500;white-space:nowrap}
.mh .ch{transition:transform .2s;color:var(--soft)}
.sec.open .ch{transform:rotate(90deg)}
.sb{display:none;padding:0 12px 12px}.sec.open .sb{display:block}
.lrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 8px;min-height:56px;color:var(--ink);cursor:pointer;font-size:1rem}
.lrow .tk{flex:0 0 26px;height:26px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.85rem;color:#fff}
.lrow.done .tk{background:var(--ok);border-color:var(--ok);color:#10301c}
.lrow small{display:block;color:var(--soft);font-size:.82rem}
.lrow.cur{border-color:var(--accent)}
.tag{display:inline-block;font:600 .75rem Inter,sans-serif;color:#D9C4EA;background:rgba(165,107,214,.18);border-radius:99px;padding:2px 8px;margin-left:6px;vertical-align:middle}
.prog{display:flex;align-items:center;gap:10px;color:var(--soft);font-size:.9rem;margin:6px 0 16px}.prog .bar{flex:1}
.body p,.body li{color:#EFE6F5}.body ul{padding-left:22px}.body li{margin:0 0 6px}
.try{background:rgba(245,176,74,.12);border:1.5px solid rgba(245,176,74,.5);border-radius:16px;padding:16px 18px;margin:22px 0}
.try b{display:block;color:var(--gold);font:700 .8rem Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.knote{background:rgba(127,199,154,.12);border:1.5px solid rgba(127,199,154,.45);border-radius:16px;padding:14px 18px;margin:18px 0}
.knote b{display:block;color:var(--ok);font:700 .8rem Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.listen{margin:4px 0 18px}
.vcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 16px}
.vcard .vl{color:var(--soft);font-size:.88rem;margin:0}
.vcard .vt{display:block;font:600 1.1rem Fraunces,serif;color:#fff;margin:2px 0 6px}
.vcard p{margin:0 0 8px;font-size:1rem}
.vplay{position:relative;display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:16/9;border:0;border-radius:12px;cursor:pointer;background:#000 center/cover no-repeat;margin-top:6px}
.vplay::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.35);border-radius:12px}
.vplay span{position:relative;z-index:1;width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.94);color:#2a1d33;display:flex;align-items:center;justify-content:center;font-size:30px;padding-left:5px}
.vid{position:relative;width:100%;aspect-ratio:16/9;margin-top:6px}.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:12px}
.vsrc{color:var(--soft);font-size:.85rem;margin:8px 0 0}
.watchlink{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 14px;color:#fff;text-decoration:none}
.upn{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;color:#fff;cursor:pointer;min-height:64px}
.upn small{display:block;color:var(--soft)}
.nav2{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 0}
.pn button{min-height:60px;border-radius:14px;border:1.5px solid var(--line);background:var(--panel);color:#fff;text-align:left;padding:8px 12px;cursor:pointer}
.pn button:disabled{opacity:.4;cursor:default}.pn small{display:block;color:var(--soft);font-size:.8rem}.pn .nx{text-align:right}
.drawer{position:fixed;inset:0;z-index:40;display:none}
.drawer.on{display:block}
.shade{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.panel{position:absolute;top:0;right:0;bottom:0;width:min(420px,92vw);background:var(--bg);border-left:1px solid var(--line);overflow-y:auto;padding:16px 14px max(30px,env(safe-area-inset-bottom))}
.ptop{display:flex;align-items:center;gap:10px;margin-bottom:12px}.ptop h2{margin:0;font-size:1.2rem;flex:1}
.pin{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.pin button{min-height:56px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:#fff;font-weight:600;cursor:pointer}
.pin small{display:block;font-weight:500;color:var(--soft);font-size:.78rem}
.cert{border:8px double #B07CDD;border-radius:10px;padding:28px 18px;text-align:center;background:#fff;color:#2a1d33;margin:18px 0}
.cert h2{color:#4b2a66}.cert .nm{font:600 1.7rem Fraunces,serif;color:#8a3d1f;border-bottom:2px solid #ddd;display:inline-block;min-width:60%;padding:6px 0;margin:8px 0 14px}
.gvid{background:#21162B;border:1px solid var(--line);border-radius:16px;aspect-ratio:16/9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:16px;margin:18px 0}
.circle{background:var(--card);border:2px solid var(--gold);border-radius:16px;padding:20px;margin:22px 0}
.circle .k{color:var(--gold);font:700 .78rem Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase}
.field{margin:10px 0}.field label{display:block;font-weight:600;margin-bottom:6px}.field input{width:100%;min-height:54px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);color:#fff;font-size:1.05rem;padding:0 14px}
footer{max-width:760px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left));color:var(--soft);font-size:.85rem;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:#2f1f3d;border:1px solid var(--line);color:#fff;padding:12px 18px;border-radius:12px;transition:transform .3s;z-index:60;font-weight:600}
.toast.on{transform:translateX(-50%) translateY(0)}
@media (max-width:520px){h1{font-size:1.7rem}body{font-size:18px}.pn{grid-template-columns:1fr}.pn .nx{text-align:left}}
</style>
</head>

"]},{"key":"food","name":"Food that's kind to joints","ids":["w4a","w4b","w4c","f1","f2","f3"]},{"key":"herb","name":"Herbs and spices","ids":["h1","h2","h3"]},{"key":"supp","name":"Supplements: what to take and how much","ids":["s1","s2","s3","s4","s5","s6"]},{"key":"day","name":"Doing more with less strain","ids":["pj1","w6a","w6b","w6c"]},{"key":"sleep","name":"Better nights, calmer days","ids":["w7a","w7b","w7c"]},{"key":"flare","name":"Bad days and doctor visits","ids":["w8a","w8b"]},{"key":"finish","name":"Keep going","ids":["st1","w8c"]}],"juvenile":[{"key":"start","name":"Start here","ids":["r1","my1","r3","hb1"]},{"key":"kind","name":"Your kind: Juvenile arthritis","ids":["ja1","ja2"]},{"key":"morn","name":"Easier mornings","ids":["w1a","w1b","w1c"]},{"key":"move","name":"Moving without fear","ids":["mv1","w2a","w2b","w2c"]},{"key":"strong","name":"Getting stronger, a little at a time","ids":["w5a","w5b","w5c"]},{"key":"comfort","name":"Warmth and comfort","ids":["w3a","w3b","w3c"]},{"key":"food","name":"Food that's kind to joints","ids":["w4a","w4b","w4c","f1","f2","f3"]},{"key":"herb","name":"Herbs and spices","ids":["h1","h2","h3"]},{"key":"supp","name":"Supplements: what to take and how much","ids":["s1","s2","s3","s4","s5","s6"]},{"key":"day","name":"Doing more with less strain","ids":["pj1","w6a","w6b","w6c"]},{"key":"sleep","name":"Better nights, calmer days","ids":["w7a","w7b","w7c"]},{"key":"flare","name":"Bad days and doctor visits","ids":["w8a","w8b"]},{"key":"finish","name":"Keep going","ids":["st1","w8c"]}],"septic":[{"key":"kind","name":"Your kind: Joint infection","ids":["in1"]},{"key":"recover","name":"Getting moving again after","ids":["w2a","mv1","w5b"]},{"key":"flare","name":"Bad days and doctor visits","ids":["w8b"]},{"key":"finish","name":"Keep going","ids":["w8c"]}],"lyme":[{"key":"kind","name":"Your kind: Lyme arthritis","ids":["in2"]},{"key":"recover","name":"Getting moving again after","ids":["w2a","mv1","w5b"]},{"key":"comfort","name":"Warmth and comfort","ids":["w3a"]},{"key":"flare","name":"Bad days and doctor visits","ids":["w8b"]},{"key":"finish","name":"Keep going","ids":["w8c"]}],"reactive":[{"key":"start","name":"Start here","ids":["r1"]},{"key":"kind","name":"Your kind: Reactive arthritis","ids":["in3"]},{"key":"comfort","name":"Warmth and comfort","ids":["w3a"]},{"key":"move","name":"Moving without fear","ids":["w2a","w2b"]},{"key":"sleep","name":"Better nights, calmer days","ids":["w7a"]},{"key":"flare","name":"Bad days and doctor visits","ids":["w8a","w8b"]},{"key":"finish","name":"Keep going","ids":["st1","w8c"]}],"other":[{"key":"start","name":"Start here","ids":["r1","my1","r3","hb1"]},{"key":"kind","name":"Your kind: Not sure yet","ids":["r2","ot1","ot2"]},{"key":"morn","name":"Easier mornings","ids":["w1a","w1b","w1c"]},{"key":"move","name":"Moving without fear","ids":["mv1","w2a","w2b","w2c"]},{"key":"comfort","name":"Warmth and comfort","ids":["w3a","w3b","w3c"]},{"key":"food","name":"Food that's kind to joints","ids":["w4a","f1","f2"]},{"key":"sleep","name":"Better nights, calmer days","ids":["w7a","w7b","w7c"]},{"key":"flare","name":"Bad days and doctor visits","ids":["w8a","w8b"]},{"key":"finish","name":"Keep going","ids":["st1","w8c"]}]},"lessons":{"r1":{"id":"r1","title":"Relief today: what to do when it hurts right now","open":"If something hurts today, you don't have to wait for week 3. Here are the fastest comforts, all in one place.","body":"Pain feels big when you don't know what to do. So let's make a short list. Each one takes less than half an hour.\n\n## Warm what is stiff\nStiff means it feels tight and slow to move. Warmth helps it loosen.\n- A hot shower, a heat pack or a warm wheat bag.\n- Keep it on for 15 to 20 minutes.\n- For hands, rest them in a bowl of warm water.\n\n## Cool what is swollen\nSwollen means puffy, and maybe hot to touch.\n- Wrap a cold pack in a thin cloth.\n- Hold it on the joint for 15 minutes.\n- Never put ice right on bare skin.\n\n## Warm and cool for hands and feet\n- Soak in warm water for 3 minutes.\n- Then cold water for 30 seconds.\n- Do it 3 times. End on cold.\n\n## Rub in cayenne cream\nThe pharmacy sells capsaicin cream. Capsaicin is the hot part of a chili pepper. Rub a thin layer on the sorest joint 3 or 4 times a day. It stings at first. That fades in a week or two. Wash your hands well after.\n\n## Move a little\nOne minute of marching in your chair. Ten ankle circles. Ten slow hand openings. Moving feeds the joint.\n\n## Breathe out slowly\nTen slow breaths. Make each breath out longer than the breath in. This tells your body it is safe, and pain often turns down.\n\n## For example\nYour knee is stiff after sitting. Put a warm pack on it for 15 minutes. Then march in your chair for one minute. That's it.\n\n## Call a doctor today if\n- One joint is suddenly hot, red and very painful, mostly if you have a fever.\n- A joint can't hold your weight after a fall.","try":"Pick one thing from this list and do it today. Write down which one helped most.","watch":[{"label":"Finding relief for osteoarthritis pain","src":"Mayo Clinic (Mayo Clinic Minute)","yt":"tva_EQrmOhw","len":"About one minute.","what":"A Mayo Clinic joint doctor, Dr. Eric Matteson, gives the short version: move, keep a healthy weight, and use heat or cold on sore joints.","why":"It backs up the first-aid list in this lesson in one minute flat."},{"label":"Yoga for arthritis: deep breathing","src":"Johns Hopkins Arthritis Center","yt":"zunYIreTguU","len":"About 3 minutes.","what":"A slow breathing practice made for people with sore joints.","why":"It is a calm way to turn pain down while you wait for a remedy to work."}],"n":15},"my1":{"id":"my1","title":"Eight myths about arthritis, and what's true","open":"Some things people tell you about arthritis keep you stuck. Here is the truth about each.","body":"## \"Arthritis is just wear and tear from getting old.\"\nNot quite. The US National Institutes of Health says osteoarthritis isn't simply wearing out. Children get arthritis too. Age raises the risk, but it doesn't decide your future.\n\n## \"Rest your joints. Exercise makes it worse.\"\nMoving lowers pain. Sitting still is what makes joints stiffer.\n\n## \"Nothing can be done.\"\nEven a booklet from 1948 said 9 in 10 people could be helped. Today there is far more: movement, weight loss, good medicines and daily habits.\n\n## \"Glucosamine rebuilds cartilage.\"\nThe biggest studies found little effect.\n\n## \"Diet doesn't matter.\"\nLosing weight helps. Food matters a lot in gout. Plant-rich eating looks hopeful.\n\n## \"Acid blood eats your cartilage.\"\nYour body keeps your blood's acid level in a very tight range, whatever you eat. Fruit and vegetables are still great, for other reasons.\n\n## \"Natural means safe.\"\nSome supplements harm the liver, clash with medicines, or hide real drugs inside. Tell your pharmacist everything you take.\n\n## \"A natural plan can replace my rheumatoid arthritis medicine.\"\nHealth agencies warn that skipping RA medicine risks lasting damage. Natural care works best beside it.\n\n## For example\nIf a friend says, \"Don't walk on that knee,\" you can smile and say, \"Moving is what helps it.\"","try":"Pick the myth you used to believe. Tell one person the truth about it this week.","watch":[{"label":"Common myths about arthritis","src":"Mayo Clinic Health System","yt":"-fjRO08GREQ","len":"About two minutes.","what":"A Mayo Clinic doctor clears up the most common things people get wrong about arthritis.","why":"It matches the myths in this lesson."},{"label":"Arthritis explained: osteoarthritis, rheumatoid, gout","src":"Mayo Clinic","yt":"Njc6jtvzUDU","len":"About 30 minutes.","what":"Mayo Clinic experts explain the main kinds of arthritis and what helps each one.","why":"The long-form pick for the full picture."}],"n":13},"r3":{"id":"r3","title":"Can arthritis be reversed?","open":"For some kinds, yes. For others, the pain can turn around even when the joint itself doesn't change.","body":"This is the question everyone asks. Here is an honest answer for each kind.\n\n## Kinds that can be cured or cleared\n- A joint infection. Caught early, the right medicine usually clears it fully.\n- Lyme arthritis, from a tick bite. Medicine clears it in most people.\n- Reactive arthritis, which can follow a tummy or bladder infection. It often goes away on its own within months to a year.\n\n## Kinds that can go quiet for years\n- Gout. If the uric acid in your blood stays low enough, the crystals slowly melt away. Over months or years, attacks can stop.\n- Rheumatoid arthritis. Started early, treatment brings most people to remission. Remission means the disease is quiet. Some people later need less medicine, with their doctor's help.\n\n## Osteoarthritis: turning the pain around\nWorn cushion has not been shown to grow back. But how your knee or hip feels can change a lot.\n\nIn one 18-month study, older adults with sore knees lost about a tenth of their weight. They did it with food and exercise. Their knee pain dropped by about half.\n\n## For example\nIf you weigh 200 pounds, a tenth is 20 pounds. Every pound you lose takes about 4 pounds of push off each knee, with every step.\n\n## What the reference book says\nThe nutrition book we used for parts of this Program goes further. It says some arthritis can be reversed, and even cured, with the right food and habits. Easing pain with food, weight and movement is well backed. Growing new cushion is the part studies haven't shown yet. So hold it as a hope.","try":"Think of one thing you would do first if your joints felt better. Picture yourself doing it.","watch":[{"label":"Finding relief for osteoarthritis pain","src":"Mayo Clinic (Mayo Clinic Minute)","yt":"tva_EQrmOhw","len":"About one minute.","what":"A Mayo Clinic joint doctor, Dr. Eric Matteson, gives the short version: move, keep a healthy weight, and use heat or cold on sore joints.","why":"It backs up the first-aid list in this lesson in one minute flat."},{"label":"Chronic gout treatment: the second phase","src":"Johns Hopkins Arthritis Center","yt":"H1XGuaCveWA","len":"About 6 minutes.","what":"How medicine that lowers uric acid stops attacks coming back.","why":"It shows how gout can go quiet for years with steady care."}],"n":12},"hb1":{"id":"hb1","title":"Nine daily habits: SUSTAIN ME","open":"Under every remedy sit nine simple habits. Their first letters spell SUSTAIN ME.","body":"Barbara O'Neill calls these the laws of health. They are a good frame for any day.\n\n- S, Sunshine: get a little daylight every day. It lifts your mood and gives you vitamin D. Don't burn.\n- U, Use of water: about 8 glasses a day. It also helps keep gout away.\n- S, Sleep: same bedtime every night. Good sleep turns pain down.\n- T, Trust: faith, thanks and hope. A calm mind eases pain.\n- A, Abstain: stop smoking. Go easy on alcohol and sugar. Smoking makes rheumatoid arthritis worse. Alcohol sets off gout.\n- I, Inhale: breathe slowly through your nose. Let fresh air in.\n- N, Nutrition: fill most of your plate with plants.\n- M, Moderation: sensible portions. A healthy weight takes load off your knees.\n- E, Exercise: move every day. It is the strongest remedy there is.\n\n## How to find what works for you\n- Look back: when did the pain start? What changed?\n- Notice what your body tells you.\n- Change one habit at a time.\n- Ask: does it bring relief?\n\n## For example\nMonday: 10 minutes of morning sun with your coffee. Tuesday: one more glass of water. One letter at a time is plenty.","try":"Pick one letter of SUSTAIN ME and do it today.","watch":[{"label":"Barbara O'Neill: Exercise That Works","src":"Barbara O'Neill (YouTube)","yt":"AP9IuNavHIg","len":"About 55 minutes. Make a cup of tea and settle in.","what":"One of Barbara's full talks on why the body needs to move every day.","why":"Exercise is the E in SUSTAIN ME, and she explains it best."},{"label":"Yoga for arthritis: deep breathing","src":"Johns Hopkins Arthritis Center","yt":"zunYIreTguU","len":"About 3 minutes.","what":"A slow breathing practice made for people with sore joints.","why":"It is the I (inhale) in SUSTAIN ME."}],"n":12},"oa1":{"id":"oa1","title":"Osteoarthritis: what is happening in your joint","open":"Your joint is not just wearing out. It is trying to repair itself all the time.","body":"Think of the end of a bone like the end of a chicken drumstick. It has a smooth, white, slippery cover. That cover is called cartilage (say it: CAR-till-idge). It lets the bones glide.\n\nIn osteoarthritis, that cover gets thinner and rougher. The bone under it can grow small bumps. The joint may get stiff and sore.\n\n## It is not just old age\nMany people call it wear and tear. That's only part of it. The US National Institutes of Health says osteoarthritis is not simply wearing out. Your joint is breaking down and repairing at the same time. Your daily habits can help the repair side.\n\n## What helps the most\n- Moving every day. Cartilage has no blood of its own. It drinks fluid when the joint moves, like a sponge.\n- Strong muscles. They take weight off the joint.\n- A lighter load. Each pound lost takes about 4 pounds off each knee with every step.\n- Warmth for stiffness.\n\n## How it tends to feel\n- Stiff after sitting, but it loosens up in about half an hour.\n- Sore after a busy day.\n- Better when you keep moving gently.\n\n## For example\nAnn's knee hurt on the stairs. She did the chair stand from week 5 each day and walked a little more. After some weeks, the stairs felt easier. Her knee didn't change on an X-ray. Her muscles did the work.","try":"Stand up from your chair 3 times today, slowly, using your hands if you need to.","watch":[{"label":"Overview of osteoarthritis","src":"Osmosis, shared by the Merck Manuals","yt":"sUOlmI-naFs","len":"About 7 minutes.","what":"Drawings show what happens inside a joint with osteoarthritis: the cushion, the bone, and the small bony bumps that can grow.","why":"Seeing the inside of a joint makes the rest of this lesson click."},{"label":"A short talk on knee pain and why exercise helps","src":"University of Melbourne, Centre for Health, Exercise and Sports Medicine","yt":"o8ZJN56aSic","what":"A University of Melbourne physiotherapy team explains knee osteoarthritis and why exercise is one of the best treatments.","why":"It's the longer look behind this lesson, from a top research team.","len":"About 12 minutes."}],"n":1},"oa2":{"id":"oa2","title":"Osteoarthritis: the best moves and remedies","open":"For osteoarthritis, the best remedies are simple and cheap.","body":"Doctors who write arthritis guidelines agree on a short list. Here it is, in order.\n\n## 1. Move every day\nWalking, chair exercises, tai chi and water exercise all help. Start small. Five minutes counts.\n\n## 2. Make the muscles stronger\nThe big muscle on the front of your thigh is the knee's best friend. The chair stand in week 5 builds it.\n\n## 3. Cayenne cream for knees\nCapsaicin cream is suggested for knee osteoarthritis. Use it 3 or 4 times a day. Give it 2 to 4 weeks.\n\n## 4. Warm wax for hands\nA paraffin wax bath wraps stiff fingers in even heat. It is suggested for hand osteoarthritis.\n\n## 5. Comfrey cream\nIn one trial of 220 people, comfrey root cream eased knee pain far more than a fake cream. The maker ran the study. Use it on unbroken skin only. Never swallow comfrey.\n\n## 6. Helpers from the kitchen\nGinger and turmeric have eased knee pain a little in studies. You'll meet them in the Herbs and spices lessons.\n\n## What doesn't help much\nGlucosamine is the best-selling joint pill. The biggest studies found it did about as well as a fake pill. You'll learn more in the Supplements lessons.\n\n## For example\nA simple day could be: warm shower, cayenne cream on the knee, a 10-minute walk after lunch, and 5 chair stands before supper.","try":"Pick two things from this list to do every day this week.","watch":[{"label":"Finding relief for osteoarthritis pain","src":"Mayo Clinic (Mayo Clinic Minute)","yt":"tva_EQrmOhw","len":"About one minute.","what":"A Mayo Clinic joint doctor, Dr. Eric Matteson, gives the short version: move, keep a healthy weight, and use heat or cold on sore joints.","why":"It backs up the first-aid list in this lesson in one minute flat."},{"label":"Yoga for arthritis: chair yoga for mobility","src":"Johns Hopkins Arthritis Center","yt":"yUnZzpX2KMw","len":"About 8 minutes.","what":"Chair yoga moves made for people with arthritis.","why":"It turns \"move every day\" into something you can follow along with right now."}],"n":1},"oa3":{"id":"oa3","title":"Osteoarthritis: food, weight and your knees","open":"You don't need to reach a perfect weight. Losing a little brings relief.","body":"Your knees carry you all day. Every extra pound adds push with every step.\n\n## The 4-pound rule\nIn a study of 142 adults with sore knees, each pound lost took about 4 pounds of push off the knee with every step. Over one mile, that adds up to thousands of pounds.\n\n## Food plus exercise beats either one\nIn an 18-month study, people who ate lighter and exercised cut their knee pain by about half. Food alone or exercise alone did less.\n\n## Foods that may help joints\n- Garlic, onions and leeks. In a study of over 1,000 women twins, those who ate the most onion-family foods showed fewer signs of hip osteoarthritis.\n- Fiber, like beans, oats and ground flaxseed. People who ate the most fiber were less likely to get painful knees.\n- Tart cherries. A small study found tart cherry juice eased knee pain a little.\n- Oily fish and olive oil.\n\n## No crash diets\nThey don't last. Instead, swap one thing a day.\n\n## For example\nSwap a sweet drink for water with lemon. Swap white bread for whole grain. Add beans to soup. Three swaps a week is a strong start.","try":"Choose one swap and make it today.","watch":[{"label":"Fighting arthritis with food","src":"Mayo Clinic (Mayo Clinic Minute)","yt":"oF32NlxH-R0","len":"About one minute.","what":"Dr. John Davis of Mayo Clinic names the foods to eat less of and the foods to add, like fruit, vegetables, olive oil, nuts, whole grains and fish.","why":"It is the same plate this lesson describes, from a big-name clinic."},{"label":"Barbara O'Neill: Fantastic Fats","src":"Barbara O'Neill (YouTube)","yt":"slWOfJzWAf8","len":"About 60 minutes. Make a cup of tea and settle in.","what":"Barbara's full talk on the fats in our food: which ones she reaches for, which ones she avoids, and why.","why":"The olive oil, nuts and seeds on this plate come from Barbara's way of eating."}],"n":1},"w1a":{"id":"w1a","title":"Why mornings are the hardest part","open":"If the first steps of the day feel like walking on someone else's legs, there's a reason. And it isn't that you're falling apart.","body":"Joints are fed by movement. The soft cushion at the end of your bones is called cartilage. It has no blood of its own. It drinks fluid when the joint moves, like a sponge in a sink.\n\nAll night, you lie still. The fluid settles. The muscles cool down. By morning, everything feels stiff. That's why so many people say it gets better by lunchtime.\n\n## What the stiffness can tell you\n- Stiff for less than about half an hour: common with osteoarthritis.\n- Stiff for more than an hour, in both hands or both feet, with warm or puffy joints: show a doctor soon. It can be a sign of rheumatoid arthritis. Early care protects the joints.\n\nHarvard Health says the same thing. Morning stiffness from osteoarthritis is usually short, and easy movement helps it pass.\n\n## For example\nIf you are stiff for 20 minutes, then fine, that is a common pattern. If you are stiff until lunch, write it down and tell your doctor.\n\nYou can't skip the morning. But you can give your joints a head start before you ask them to carry you.","try":"Today, before you next get up from your bed or a chair, circle each ankle slowly five times one way and five times the other. That's the whole task.","watch":[{"label":"Yoga for arthritis: an introduction","src":"Johns Hopkins Arthritis Center","yt":"6LHsfixgaaA","len":"About 4 minutes. Part of a seven-part series.","what":"Johns Hopkins teachers explain how yoga can be made safe and easy for people with arthritis.","why":"A calm first look at moving slowly, with a seated choice for everything."}],"n":9},"w1b":{"id":"w1b","title":"A routine you can do before you stand up","open":"The best time to move a stiff joint is while you're still lying down and warm.","body":"This is a short routine for the bed and the edge of the bed. Go slowly. Breathe out as you move.\n\n## Lying down\n- Ankle circles: five each way, each foot.\n- Ankle pumps: point your toes, then pull them back toward you. Ten times.\n- Knee slides: slide one heel up toward you, then back down. Five each side.\n\n## Sitting on the edge of the bed\n- Shoulder rolls: five back, five forward.\n- Hand opening: make a soft fist, then spread your fingers wide. Ten times.\n- Slow neck turns: look over one shoulder, then the other. Stop before anything pinches.\n\nThen stand up slowly, with a hand on something steady. Keep a cane or sturdy chair by the bed for this moment.\n\n## A longer warm-up, if you like\nThe Arthritis Society of Canada has a 20-minute warm-up. Every move in it has a seated choice. It starts with breathing and small circles, then works from the neck down to the toes. Our short routine is the same idea, made smaller.\n\n## For example\nWake up. Ankle circles and pumps under the covers. Sit up. Shoulder rolls and hand openings. Stand. All done before the kettle boils.\n\nIf one move hurts, skip it for today.","try":"Do the sitting part today, on the edge of your bed or a sturdy chair. Add the lying-down part next time you're in bed.","watch":[{"label":"Yoga for arthritis: chair yoga for mobility","src":"Johns Hopkins Arthritis Center","yt":"yUnZzpX2KMw","len":"About 8 minutes.","what":"Chair yoga moves made for people with arthritis.","why":"You can follow along without ever leaving your chair."}],"n":9},"w1c":{"id":"w1c","title":"Warmth first, then movement","open":"Most people with stiff hands already know this one. Warm water before anything else.","body":"Warmth relaxes the muscles around a joint. That makes the first moves easier. It's why a warm shower or a warm mug helps so many people in the morning.\n\n## Easy ways to bring warmth in\n- A warm shower before you get dressed.\n- Hands in a bowl of warm water for a minute or two. Then open and close them.\n- A heat pack on a stiff knee while you drink your coffee.\n- A warm wax bath for hands. Hand therapists use them. Pharmacies sell them.\n\n## Keep it safe\n- Warm, never hot. Bath warm is right.\n- 15 to 20 minutes of heat is plenty.\n- If you have diabetes or poor feeling in your feet, ask your doctor before using heat there.\n\n## The rule to remember\nWarm what is stiff. Cool what is swollen. A joint that is hot, red and puffy wants a wrapped cold pack, not heat.\n\n## Seated moves after warmth\nVersus Arthritis, a big UK arthritis charity, shares easy moves you can do sitting down: marching, knee straightening, ankle circles and shoulder rolls. They work best right after warmth.\n\n## For example\nRun warm water in the sink. Rest your hands in it while you count to 60. Dry them. Make 10 soft fists. Now pick up your cup.","try":"Today, warm your hands in water for one minute, then open and close them ten times.","watch":[{"label":"Finding relief for osteoarthritis pain","src":"Mayo Clinic (Mayo Clinic Minute)","yt":"tva_EQrmOhw","len":"About one minute.","what":"A Mayo Clinic joint doctor, Dr. Eric Matteson, gives the short version: move, keep a healthy weight, and use heat or cold on sore joints.","why":"It backs up the first-aid list in this lesson in one minute flat."},{"label":"Yoga for arthritis: chair yoga for mobility","src":"Johns Hopkins Arthritis Center","yt":"yUnZzpX2KMw","len":"About 8 minutes.","what":"Chair yoga moves made for people with arthritis.","why":"It turns \"move every day\" into something you can follow along with right now."}],"n":10},"mv1":{"id":"mv1","title":"Movement, your strongest medicine","open":"If you take one thing from this course, let it be this: moving is the most powerful remedy there is.","body":"Doctors and natural healers agree on this one. The American College of Rheumatology and the Arthritis Foundation strongly suggest exercise for arthritis.\n\nMoving feeds cartilage, builds the muscles that protect your joints, lifts your mood and helps you sleep. It does not wear joints out faster. Sitting still is what makes them stiff and weak.\n\n## Four kinds of moving\n- Walking, biking or swimming. Builds stamina. Work up to 30 minutes most days, in pieces as short as 5 minutes.\n- Strength moves. Strong thighs take load off knees. Twice a week is enough.\n- Tai chi or yoga. Slow moves for balance and calm.\n- Water exercise. Warm water holds you up, so sore joints move freely.\n\n## Three that don't jolt the joints\n- An exercise bike. Great if you're unsteady.\n- Swimming. The first choice when joints are very sore.\n- A mini trampoline with a support bar. Keep your feet on the mat and just lift your heels.\n\n## How to know you're doing it right\n- Mild soreness that's gone within a day is normal.\n- Sore for more than 2 hours after? Do a little less next time. Less, not nothing.\n- Sharp or lasting pain means stop that move.\n\n## For example\nStart with 5 minutes on a bike while you watch the news. Next week, make it 7.","try":"Move for 5 minutes today, any way you like.","watch":[{"label":"How to stay active with osteoarthritis","src":"Mayo Clinic","yt":"E42zVB-OCug","len":"About two minutes.","what":"A Mayo Clinic expert explains why moving helps sore joints and how to start.","why":"A short push to get moving today."},{"label":"Exercise and joint protection","src":"Arthritis Society Canada","yt":"QSBcAXl9VNo","len":"About 36 minutes.","what":"A talk from Arthritis Society Canada on safe exercise and protecting your joints.","why":"The long-form pick, full of practical tips."}],"n":14},"w2a":{"id":"w2a","title":"Sore isn't the same as harmed","open":"If moving has hurt before, being careful makes sense. The trick is knowing what the pain is telling you.","body":"Pain is an alarm. In a joint that has been sore a long time, the alarm can get too jumpy. It can go off before any harm is done.\n\nThat doesn't mean you ignore it. It means you learn to read it.\n\n## The traffic light\n- Green, 0 to 2 out of 10: fine. Keep going.\n- Yellow, 3 to 5: okay, mostly when you're starting to move more.\n- Red, 6 or more: ease off. Do less for the rest of today.\n\n## The two-hour rule\nA little extra soreness after moving is normal. If your pain is worse than usual for more than two hours after, you did a bit too much. Next time, do a little less. You didn't harm anything. You found today's limit.\n\n## What the experts say\nArthritis charities and physical therapists agree. Sensible movement doesn't wear joints out. It feeds the cartilage and builds the muscles that protect it.\n\n## For example\nBefore a walk, your knee is a 3. Right after, it's a 4. Two hours later, it's back to 3. That's a green light to walk again tomorrow.","try":"Before your next walk, write your pain number. Write it again two hours later.","watch":[{"label":"A short talk on knee pain and why exercise helps","src":"University of Melbourne, Centre for Health, Exercise and Sports Medicine","yt":"o8ZJN56aSic","what":"A University of Melbourne physiotherapy team explains knee osteoarthritis and why exercise is one of the best treatments.","why":"It's the longer look behind this lesson, from a top research team.","len":"About 12 minutes."}],"n":15},"w2b":{"id":"w2b","title":"Walking, the cheapest thing that helps","open":"You don't need a gym or new shoes to start. You need the hallway.","body":"Walking is one of the best-studied things you can do for sore knees and hips. The Arthritis Foundation built a whole six-week program around it, called Walk With Ease.\n\n## How to start\n- Walk for five minutes, or less. Up and down the hallway counts.\n- Each week, add a minute or two.\n- Sit down whenever you need to. Resting is part of it.\n- Walk after a meal or a warm shower, when your joints are looser.\n\n## Make it easier\n- Wear your most cushioned shoes.\n- If you use a cane, hold it in the hand on the other side from the sore leg. The cane and the sore leg move together.\n- On rainy days, walk inside a store or around your home.\n\n## Other kind ways to move\n- Water walking or swimming. The water holds you up.\n- A bike that stays still, or a pedal machine under a chair.\n- Tai chi, which has a seated version.\n\n## For example\nWeek 1: 5 minutes a day. Week 2: 6 minutes. Week 4: 8 minutes. Small steps add up to a real walk.","try":"Take one 5-minute walk today. When you finish, tick it on your weekly list.","watch":[{"label":"Walk With Ease: week 1","src":"Arthritis Foundation","yt":"za3zWuq4WA0","len":"About 8 minutes.","what":"The first week of the Arthritis Foundation's Walk With Ease program: how to start walking safely with arthritis.","why":"It's the walking plan this lesson is built on."},{"label":"Barbara O'Neill: Exercise That Works","src":"Barbara O'Neill (YouTube)","yt":"AP9IuNavHIg","len":"About 55 minutes. Make a cup of tea and settle in.","what":"One of Barbara's full talks, all about why the body needs to move every day, and what happens to joints and muscles when it doesn't.","why":"If part of you still worries that moving will make things worse, an hour with someone who loves this subject can change how you feel about your daily walk. Moving every day is the one remedy she and the doctors agree on completely. Keep to your own pace from this week's lessons.","barb":true}],"n":13},"w2c":{"id":"w2c","title":"Pacing: stop while you still feel good","open":"You know the pattern. A good day, you do everything. Then you pay for it for three days.","body":"People call it boom and bust. It's the most common reason a new routine falls apart. It isn't a lack of willpower. Good days just feel too good to waste.\n\n## Try this instead\n- Pick a set amount for the day. A 6-minute walk. One room cleaned. 15 minutes of gardening.\n- Stop there, even if you feel you could do more.\n- Add a little next week, not today.\n\nIt feels odd to hold back on a good day. But small, steady amounts build more than big days followed by rest days.\n\n## How to pick your amount\nDo what you can manage on a so-so day. Not your best day. Not your worst. That is your starting amount.\n\n## Starting safely\nVersus Arthritis has a series called Let's Move with Leon. It says the same thing: start low, go slow, and build up bit by bit. A little every day beats a lot once a week.\n\n## For example\nOn a so-so day you can garden for 15 minutes. So on a great day, you still garden for 15 minutes. Then you sit with a cup of tea and enjoy the view.","try":"Choose your starting amount for walking this week, based on a so-so day. Write it on your planner.","watch":[{"label":"Yoga for arthritis: healthy sitting and standing","src":"Johns Hopkins Arthritis Center","yt":"1sXewxHtAcE","len":"About 8 minutes.","what":"How to sit and stand in a way that puts less strain on your joints.","why":"Small posture changes save energy all day."}],"n":12},"w5a":{"id":"w5a","title":"Your muscles are your joints' helpers","open":"You're never too old to get stronger. People in their nineties do it.","body":"Strong thigh muscles work like shock absorbers for the knee. Strong hip and back muscles take load off the hips and spine. When the muscles do more, the joints carry less.\n\n## How to get stronger safely\n- Move slowly. Count 3 up and 3 down.\n- Stay in the yellow zone. Pain up to 5 out of 10 is okay. More than that, ease off.\n- Start with 5 of each move. Work up to 10.\n- 2 or 3 days a week, with a rest day between. Muscles grow on the rest days.\n\n## Resistance bands\nVersus Arthritis has band workouts, seated and standing, led by Leon and his mum Janet. A stretchy band is cheap and makes any move a bit stronger. Start with the lightest band.\n\nA physical therapist can check how you're doing the moves. That matters most if you've had a joint replaced.\n\n## For example\nMonday: 5 sit-to-stands. Wednesday: 6. Friday: 6. Next Monday: 7. In a month you could be at 10.","try":"Do 5 sit-to-stands from your favorite sturdy chair. Use your hands on the armrests if you need them. That's strength training.","watch":[{"label":"Yoga for arthritis: seated postures","src":"Johns Hopkins Arthritis Center","yt":"L8jJNk3WZTI","len":"About 7 minutes.","what":"Seated stretches and holds that build strength and ease stiffness.","why":"A good partner for the strength moves in this lesson."}],"n":12},"w5b":{"id":"w5b","title":"The chair routine","open":"All you need is a sturdy chair without wheels.","body":"Do one round. When that feels easy, do two.\n\n- Seated march: sit tall. Lift one knee, then the other, for a minute.\n- Sit to stand: stand up and sit back down slowly. 5 to 10 times.\n- Knee straightening: seated, straighten one leg, hold for 5 seconds, lower. 10 each side.\n- Heel raises: hold the chair back, rise onto your toes, lower. 10 times. Seated: lift your heels while sitting.\n- Side leg lift: hold the chair back and lift one leg out to the side. 8 each side. Seated: slide one foot out and back.\n- Wall push-ups: hands on a wall at shoulder height. Bend your elbows, press back. 8 to 10.\n- Hand opening and thumb touches: soft fist, spread your fingers, then touch your thumb to each fingertip.\n\nBreathe out on the hard part. Stop before sharp pain.\n\n## Follow along\nVersus Arthritis has follow-along videos for knees and hips with moves like these. The Hinge App in your Toolkit also talks you through chair moves.\n\n## For example\nPut the chair by the TV. During the first ad break, do one round. That's it for today.","try":"Do one round of the chair routine today, or open the Hinge App and follow one routine.","watch":[{"label":"Yoga for arthritis: chair yoga for mobility","src":"Johns Hopkins Arthritis Center","yt":"yUnZzpX2KMw","len":"About 8 minutes.","what":"Chair yoga moves made for people with arthritis.","why":"You can follow along without ever leaving your chair."}],"n":14},"w5c":{"id":"w5c","title":"Balance, so you can trust your feet","open":"Being afraid of falling makes people move less. Better balance gives that confidence back.","body":"Balance is a skill. It gets better with practice at any age. Tai chi has good research behind it for both balance and arthritis comfort.\n\n## Three balance moves at the kitchen counter\n- Stand with your feet close together, holding the counter, for 20 seconds.\n- Stand with one foot a little in front of the other, holding on, for 20 seconds. Then swap.\n- Stand on one foot, holding on with both hands, for 10 seconds. Then the other foot.\n\nAs each one gets easier, hold on with just your fingertips.\n\n## Around the house\n- Clear loose rugs and cords from the paths you walk.\n- Put a nightlight between the bed and the bathroom.\n- Grab bars by the toilet and in the shower help a lot.\n\nIf you've fallen in the last year, or often feel unsteady, tell your doctor. A physical therapist can make a balance plan just for you.\n\n## For example\nEvery time the kettle boils, do the first move. Three cups of tea a day is three balance practices.","try":"Do the first balance move while the kettle boils, holding the counter.","watch":[{"label":"Tai chi for sore joints, with Dr Paul Lam","src":"Tai Chi for Health Institute (YouTube)","yt":"tAOuEpa01j4","len":"About 50 minutes. Make a cup of tea and settle in.","what":"A calm follow-along class with Dr Paul Lam, a doctor who has taught tai chi to people with arthritis for many years. The moves are slow and flowing, standing or in a chair.","why":"Tai chi gets a strong yes in the American College of Rheumatology guideline for knees and hips. It builds balance, strength and calm at the same time, without jarring your joints. It's the best next step after this lesson's counter moves."}],"n":10},"w3a":{"id":"w3a","title":"Heat, cold and water","open":"There's something good about caring for a sore joint with your own hands. Put the kettle on.","body":"Heat and cold packs are in the American College of Rheumatology's arthritis guidelines. They're cheap, and you probably have them already.\n\n## Heat for stiffness\nA warm water bottle, heat pack or warm towel on the joint for 15 to 20 minutes. Great before a walk.\n\n## Cold for a hot, puffy joint\nA cold pack or a bag of frozen peas, wrapped in a cloth, for about 15 minutes. Never put it right on your skin.\n\n## The warm and cool water swap\nThis works best for hands, wrists, feet and ankles. It's one of Barbara O'Neill's favorite home comforts.\n- Fill one bowl with warm water, about 104°F (bath warm). Fill one with cold.\n- Soak in warm for 3 minutes.\n- Then cold for 30 seconds.\n- Do it 3 times. End on cold.\n- Dry off and move the joint while it's loose.\n\nSome people say their pain drops by half. Big studies are few, so take that as their story, not a promise.\n\n## For hips, knees and shoulders\nUse a handheld shower: warm for 3 minutes, cool for 30 seconds, 3 times. Or swap a warm towel for a cold cloth. Use hot tap water, never boiling.\n\n## Hand stretches after\nVersus Arthritis shares follow-along stretches for fingers, hands and wrists. They are easiest right after warm water.\n\n## For example\nAfter breakfast, do the water swap for your hands. Then touch your thumb to each fingertip. Now the jar lid feels easier.","try":"Try the water swap for your hands once this week.","watch":[{"label":"Finding relief for osteoarthritis pain","src":"Mayo Clinic (Mayo Clinic Minute)","yt":"tva_EQrmOhw","len":"About one minute.","what":"A Mayo Clinic joint doctor, Dr. Eric Matteson, gives the short version: move, keep a healthy weight, and use heat or cold on sore joints.","why":"It backs up the first-aid list in this lesson in one minute flat."},{"label":"Yoga for arthritis: an introduction","src":"Johns Hopkins Arthritis Center","yt":"6LHsfixgaaA","len":"About 4 minutes. Part of a seven-part series.","what":"Johns Hopkins teachers explain how yoga can be made safe and easy for people with arthritis.","why":"Right after warmth is the best time to move. This is a slow, seated place to start."}],"n":16},"w3b":{"id":"w3b","title":"Compresses and poultices","open":"These are the old kitchen comforts. Some have proof. Some just feel good. Both have a place.","body":"## Ginger poultice\nMany people call this the best one. Use it right after the water swap.\n- Grate a heaped teaspoon of fresh ginger onto a thin cotton cloth, about 8 inches square.\n- Fold it into a flat parcel. Put the single layer against your skin.\n- Cover with plastic and wrap it on, snug but not tight.\n- Keep it on for up to an hour, in the early evening. Never right before bed.\n- Take it off as soon as it stings. Burning is just sore skin.\n\n## Castor oil compress\nBarbara O'Neill wore one on a sore thumb every night for six months. She says the soreness went.\n- Fold soft cotton into about six layers.\n- Pour a small pool of castor oil in the middle. Let it soak in for 15 minutes.\n- Wrap it around the joint, cover with plastic and wrap it on overnight.\n- Reuse it for a month. Add half a teaspoon of oil each week.\n\nIt hasn't been tested for arthritis. The warmth and rest may be what helps. Outside the body only.\n\n## Epsom salt bath\nThe warm water soothes. The salt is up to you.\n\n## Comfrey cream\nIn a trial of 220 people, comfrey cream eased knee pain more than a fake cream. Unbroken skin only. Never swallow comfrey.\n\n## Skin safety\n- Test a small patch first.\n- No more than 20 minutes of heat or cold at a time.\n- Ask your doctor before heat or cold on your feet if you have diabetes.\n\n## For example\nSunday evening: water swap, then a ginger poultice on one knuckle for 30 minutes, with music on.","try":"Pick one comfort from this lesson and give yourself 20 quiet minutes with it this week. Music on, phone down.","watch":[{"label":"Barbara O'Neill: castor oil for sore joints","src":"Barbara O'Neill (YouTube)","yt":"BDq0kej3C14","len":"Under a minute. A short demonstration.","what":"Barbara shows how she makes and uses a castor oil compress on a sore knee, step by step. It's the same compress you just read about.","why":"Seeing it done once makes it far easier to try at home. Watch this before your first compress, so you know how much oil to use and how to wrap it without making a mess.","barb":true},{"label":"Barbara O'Neill: the poultice class","src":"Barbara O'Neill (YouTube)","yt":"uVLGsqysQcs","len":"A full class. Watch it in pieces if you like.","what":"Her full class on making poultices at home, from what goes in the cloth to how to wrap it on a joint.","why":"If the ginger poultice caught your interest, this is the long version, with every step shown. Keep our rule in mind while you watch: take a poultice off the moment it stings, and never leave ginger or cayenne on overnight.","barb":true}],"n":12},"w3c":{"id":"w3c","title":"Creams, rubs and what to skip","open":"The pharmacy aisle is full of promises. This lesson is here to save you money.","body":"## Worth trying\n- Cayenne cream (capsaicin). Suggested for knee osteoarthritis. Rub a thin layer on 3 or 4 times a day. It stings for a week or two, then relief builds. Give it 2 to 4 weeks. Wash your hands after.\n- Anti-inflammatory gels, like diclofenac. Suggested for knees and hands. Ask your pharmacist if they're safe with your other medicines.\n- Comfrey cream. Eased knee pain in one study. Unbroken skin only.\n- DMSO. Pure kind only, from a pharmacy. It may ease pain a little.\n- Fresh nettle leaf pressed on a sore finger joint eased pain in one small study.\n\n## Probably skip\n- Glucosamine and chondroitin pills. The biggest studies found little or no help. If you've taken them for years and feel nothing, ask your pharmacist about stopping.\n- Anything that sounds too good to be true.\n\n## One at a time\nTry one new thing. Give it a few weeks. Keep it only if you feel a difference. Try three at once and you'll never know which one helped.\n\n## What the physical therapists say\nNHS physical therapists in Torbay, England, made videos on knee and hip arthritis. Their main points: keep moving, use pain relief to help you move, and don't spend lots on supplements without proof.\n\n## For example\nYou buy cayenne cream for $8. You use it on your knee 3 times a day for 3 weeks. Your knee feels a bit better. Keep it. If not, you only spent $8.","try":"Look at what's in your cupboard. Is there something you've used for months with no difference? Write it on your list for the pharmacist.","watch":[{"label":"Dietary supplements: what you need to know","src":"US National Institutes of Health, Office of Dietary Supplements","yt":"S4bbzyfxstw","len":"About two minutes.","what":"NIH experts explain where to find honest, science-based facts about supplements.","why":"Short and plain. It shows you where to check any bottle before you buy it."}],"n":12},"w4a":{"id":"w4a","title":"Add, don't take away","open":"This isn't a diet. Nobody's taking your morning toast.","body":"The way of eating with the best support for joints is called the Mediterranean way. It's mostly about adding things.\n\n## A plate that's kind to joints\n- Half the plate: vegetables and fruit, lots of colors.\n- A quarter: protein. Fish, chicken, eggs, beans or yogurt. Protein feeds the muscles that protect your joints.\n- A quarter: whole grains or potatoes.\n- A little olive oil, a few nuts, some avocado.\n- Fish once or twice a week. Salmon and sardines carry omega-3 fats.\n\n## Foods you can keep\nYou may have been told to give up tomatoes, potatoes, peppers, bread, milk, tea or coffee. Research hasn't found that these make arthritis worse. If you think one bothers you, leave it out for 2 weeks. Then bring it back and see.\n\nThe one exception is gout. Some foods really matter there. That's in the next lesson.\n\n## For example\nBreakfast: toast with avocado and a few berries. Lunch: soup with beans. Supper: fish, a baked potato with olive oil, and green beans.","try":"Add one color to one meal today. Berries on cereal, spinach in eggs, carrots on the side.","watch":[{"label":"Barbara O'Neill: Fantastic Fats","src":"Barbara O'Neill (YouTube)","yt":"slWOfJzWAf8","len":"About 60 minutes. Make a cup of tea and settle in.","what":"Barbara's full talk on the fats in our food: which ones she reaches for, which ones she avoids, and why.","why":"Good fats are a big part of the plate in this lesson. Olive oil, nuts and oily fish have the best support for joints and the heart, and this talk goes deeper into her view. Listen with this lesson in mind, and bring any big change in how you eat to your doctor first.","barb":true}],"n":12},"w4b":{"id":"w4b","title":"Weight, knees and gout","open":"Two things about food matter more than the rest: what your knees carry, and gout.","body":"## Every pound counts on the knees\nResearch from Wake Forest University found that each pound lost takes about 4 pounds of push off the knee, with every step. Lose 10 pounds, and that's 40 pounds less on each step.\n\nYou don't need a big number. Small changes, kept up, are what count.\n\n## If yours is gout\nFood matters more in gout than in any other kind of arthritis. These can set off an attack:\n- Beer and spirits.\n- Organ meats, red meat and shellfish.\n- Sweet fizzy drinks.\nWater, cherries and low-fat milk help. If attacks keep coming back, medicine that lowers uric acid is what stops them. Talk to your doctor.\n\n## If you take medicine for blood sugar or blood pressure\nAsk your doctor before big changes to what you eat. Small swaps, like water instead of soda, are usually fine.\n\n## For example\nOne can of soda a day is about 15 pounds of sugar in a year. Swap it for water with lemon, and that's a swap your knees will feel.","try":"Swap one sugary drink for water today. Add a slice of lemon if it helps.","watch":[{"label":"Fighting arthritis with food","src":"Mayo Clinic (Mayo Clinic Minute)","yt":"oF32NlxH-R0","len":"About one minute.","what":"Dr. John Davis of Mayo Clinic names the foods to eat less of and the foods to add, like fruit, vegetables, olive oil, nuts, whole grains and fish.","why":"It is the same plate this lesson describes, from a big-name clinic."},{"label":"The gout diet and the right foods","src":"Johns Hopkins Arthritis Center","yt":"Tq1aRuggMFU","len":"About 7 minutes.","what":"Which foods and drinks raise uric acid, and which ones help.","why":"It lines up with the food list in this lesson."}],"n":10},"w4c":{"id":"w4c","title":"Easy meals for sore hands","open":"Cooking is harder when chopping hurts. So we cut the chopping.","body":"## Shortcuts that are still good food\n- Frozen vegetables and berries. Just as good. Nothing to wash or cut.\n- Pre-cut onions, carrots and squash.\n- Canned beans, canned fish and jars of chopped tomatoes.\n- A sheet pan. Everything on one tray. One pan to wash.\n\n## Three meals to start with\n- Warm oats with cinnamon and frozen berries, made in the microwave.\n- Sheet-pan salmon with ready-cut vegetables and olive oil. Bake at 400°F for about 25 minutes.\n- Lentil soup with frozen onion and carrot, a can of tomatoes, stock and a little turmeric. It freezes well for bad days.\n\n## Tools that help\nJar openers, light pans with big handles, a rocking knife, and a stool to sit on while you cook. An occupational therapist can suggest more.\n\n## Turmeric and ginger\nThey're lovely in cooking. As pills, the research is small. If you take blood thinners, ask your pharmacist before taking turmeric or ginger capsules. The Herbs and spices lessons have the details.\n\n## For example\nMake a big pot of lentil soup on a good day. Freeze it in 4 small tubs. On a bad day, you have supper ready in 5 minutes.","try":"Cook one of the three meals this week, or buy one bag of frozen vegetables to keep in the freezer.","watch":[{"label":"Fighting arthritis with food","src":"Mayo Clinic (Mayo Clinic Minute)","yt":"oF32NlxH-R0","len":"About one minute.","what":"Dr. John Davis of Mayo Clinic names the foods to eat less of and the foods to add, like fruit, vegetables, olive oil, nuts, whole grains and fish.","why":"It is the same plate this lesson describes, from a big-name clinic."},{"label":"Barbara O'Neill: Fantastic Fats","src":"Barbara O'Neill (YouTube)","yt":"slWOfJzWAf8","len":"About 60 minutes. Make a cup of tea and settle in.","what":"Barbara's full talk on the fats in our food: which ones she reaches for, which ones she avoids, and why.","why":"The olive oil, nuts and seeds on this plate come from Barbara's way of eating."}],"n":11},"f1":{"id":"f1","title":"The acid question: what's true about food and joints","open":"You may have heard that acid foods eat away your joints. Here is the plain truth, and why the plate still works.","body":"Some books and talks say acid in your blood dissolves your cartilage. The nutrition book we used says this too. Let's look at it.\n\n## What really happens\nYour body keeps your blood's acid level in a very tight range, between 7.35 and 7.45. It does this whatever you eat. If it ever moved enough to harm a joint, you would be very sick in a hospital, not sore at home. No study has shown that food changes the acid inside a joint.\n\n## So should you still eat that way?\nYes. The food on an alkaline list is mostly vegetables and fruit. Those are great for you. They just help for other reasons, like less inflammation and a lighter load.\n\n## The 80/20 plate\nFill about 80 out of 100 parts of your plate with plants. Keep the other 20 for everything else.\n- The 80: greens and other vegetables, fruit, lemon, millet, quinoa, buckwheat, almonds, lentils, beans and seeds.\n- The 20: meat, aged cheese, white bread, with sugar, caffeine and alcohol kept lowest.\n- Walnuts, oats, chickpeas and oily fish often land on acid lists. They are some of the best foods for your joints. Enjoy them.\n- Cooked greens are just as good as raw.\n\n## Drinks\n- Lemon water each morning is fine and fresh. Rinse with plain water after, for your teeth.\n- Carrot, celery and apple juice is a nice way to get vegetables. Keep it to one small glass because of the sugar.\n- Water is the real gift. About 8 glasses a day.\n\n## Celtic salt\nIf you salt your water or food, use Celtic salt. It is the only salt Barbara O'Neill uses. It is gray, a little damp, and comes from the coast of France. It is unrefined, so it keeps small amounts of magnesium, potassium and calcium. One crystal on the tongue before a glass of water is the amount she means. It has about the same sodium as table salt, so ask your doctor first if you have high blood pressure, heart or kidney trouble. Get iodine from fish, eggs, dairy or seaweed.\n\n## For example\nLunch on the 80/20 plate: a big salad with lentils, olive oil and lemon, plus a small piece of chicken on the side.","try":"Make one meal today that is mostly plants. Take a photo of your plate if you like.","watch":[{"label":"Fighting arthritis with food","src":"Mayo Clinic (Mayo Clinic Minute)","yt":"oF32NlxH-R0","len":"About one minute.","what":"Dr. John Davis of Mayo Clinic names the foods to eat less of and the foods to add, like fruit, vegetables, olive oil, nuts, whole grains and fish.","why":"It is the same plate this lesson describes, from a big-name clinic."},{"label":"Barbara O'Neill: Fantastic Fats","src":"Barbara O'Neill (YouTube)","yt":"slWOfJzWAf8","len":"About 60 minutes. Make a cup of tea and settle in.","what":"Barbara's full talk on the fats in our food: which ones she reaches for, which ones she avoids, and why.","why":"The plant oils in this lesson come straight from her way of eating."}],"n":11},"f2":{"id":"f2","title":"Foods worth adding, and myths you can drop","open":"Most foods are welcome. A few are worth adding on purpose.","body":"Let's go food by food, so you know what to keep and what to add.\n\n## Worth adding\n- Oily fish like salmon, sardines and mackerel. Two meals a week. They carry omega-3 fats, called EPA and DHA, that calm inflammation.\n- If you don't eat fish: ground flaxseed, chia seeds or walnuts each day. Barbara O'Neill eats only plants and gets protein from beans, lentils, nuts and seeds. She cooks with olive oil and avoids cheap refined seed oils.\n- Garlic, onions, leeks and asparagus. These have sulfur, which the body uses to build cartilage.\n- Fiber: beans, oats, oat bran and whole grains.\n- Tart cherries. About 20 a day, frozen is fine.\n- Fresh pineapple. It has bromelain. Canned pineapple loses it.\n\n## You can keep these\n- Potatoes, tomatoes, peppers and eggplant. These are called nightshades. Research hasn't linked them to arthritis. The Arthritis Foundation calls it a myth. If you think one bothers you, leave it out 2 weeks and then bring it back.\n- Tea and coffee. No good proof they harm joints. Stop after lunch if they keep you up.\n- Wheat. No good proof it worsens arthritis unless you have celiac disease. Get tested before you cut it out.\n- Milk and yogurt. For gout, low-fat milk helps.\n\n## Eat less of\n- Sugar and processed food. Swap one a day.\n- Red and processed meat. Lentils or beans a few nights a week is an easy start.\n\n## Big breakfast, light supper\nThe old saying: breakfast like a king, lunch like a queen, supper like a pauper. Many people sleep better after a light supper.\n\n## For example\nThis week: salmon on Tuesday, lentil soup on Thursday, onions and garlic in your eggs, and a spoon of ground flaxseed on your oats.","try":"Add one food from the \"worth adding\" list today.","watch":[{"label":"Fighting arthritis with food","src":"Mayo Clinic (Mayo Clinic Minute)","yt":"oF32NlxH-R0","len":"About one minute.","what":"Dr. John Davis of Mayo Clinic names the foods to eat less of and the foods to add, like fruit, vegetables, olive oil, nuts, whole grains and fish.","why":"It is the same plate this lesson describes, from a big-name clinic."},{"label":"Barbara O'Neill: Fantastic Fats","src":"Barbara O'Neill (YouTube)","yt":"slWOfJzWAf8","len":"About 60 minutes. Make a cup of tea and settle in.","what":"Barbara's full talk on the fats in our food: which ones she reaches for, which ones she avoids, and why.","why":"The plant oils in this lesson come straight from her way of eating."}],"n":12},"f3":{"id":"f3","title":"Finding your own trigger foods","open":"Some people find one food sets off their joints. A short, careful test is the only way to know.","body":"Even the NHS, England's health service, says some people find certain foods make them worse.\n\n## The simple 2-week test\n- Pick one food you suspect.\n- Leave it out for 2 weeks.\n- Bring it back in a normal portion.\n- Watch your pain for 2 days. Write it down.\n\n## The 4-week test\nThis comes from Dr. Neal Barnard's book, Foods That Fight Pain. For 4 weeks, eat foods that rarely cause trouble:\n- Oats, rice, quinoa, millet, buckwheat and lentils.\n- Cooked greens like broccoli, kale, spinach and asparagus.\n- Cooked carrots, squash and zucchini.\n- Cooked or dried fruit that isn't citrus, like pears, apricots, blueberries and plums.\n\nLeave out the common triggers: dairy, chocolate, eggs, citrus, meat, wheat, nuts and peanuts, tomatoes, onions, corn, apples and bananas. Skip alcohol and caffeine too.\n\nIf you feel better, bring one food back every 2 days. If a food sets off a flare, take it out again. Wait 2 weeks before you test it again.\n\n## The strict way\nThe nutrition book goes further. It cuts dairy, red meat, caffeine, citrus, paprika, sugar, tobacco, most added fat, salt (a little Celtic salt only) and the nightshades. Try it for 3 weeks, then add back one food group every 3 days. Get calcium from greens, almonds and fortified plant milk.\n\n## Before you start\nAsk your doctor first if you have diabetes, are underweight, take blood thinners, or have struggled with eating in the past. Keep taking your medicines.\n\n## For example\nGrace thought milk made her hands ache. She left it out 2 weeks. Then she had a glass each day for 2 days. No change. Now she knows, and she can enjoy milk again.","try":"Pick one food you wonder about. Write it down. You can start the 2-week test whenever you're ready.","watch":[{"label":"Rheumatoid arthritis: lifestyle options","src":"Johns Hopkins Arthritis Center","yt":"A3N5bJw-soM","len":"About 7 minutes.","what":"What you can do day to day, alongside your medicine, to feel better.","why":"It matches the food, rest and movement ideas in this lesson."},{"label":"Fighting arthritis with food","src":"Mayo Clinic (Mayo Clinic Minute)","yt":"oF32NlxH-R0","len":"About one minute.","what":"Dr. John Davis of Mayo Clinic names the foods to eat less of and the foods to add, like fruit, vegetables, olive oil, nuts, whole grains and fish.","why":"It is the same plate this lesson describes, from a big-name clinic."}],"n":10},"h1":{"id":"h1","title":"Turmeric and ginger: the kitchen helpers","open":"Two spices from your kitchen have the most hope behind them.","body":"Turmeric is the yellow spice in curry. Ginger is the knobbly root with a warm bite.\n\n## Turmeric\nThe US health agency for natural care calls the early proof for knee osteoarthritis positive. A 2025 review of 17 studies agreed. Turmeric does seem to ease knee pain, but the proof is still weak.\n\n- Studies used about 500 to 1,500 mg a day of curcumin. Curcumin is the strong part of turmeric.\n- Some talks say up to 8,000 mg. That's many times what was tested. Go above the label only after speaking with your doctor.\n- Black pepper helps your body take in turmeric. Cayenne does not do the same job.\n- Turmeric in food is a nice habit, but it gives far less than a pill.\n\n## Turmeric safety\n- Standard pills are likely safe for 2 to 3 months.\n- \"High-absorption\" kinds have been linked to liver harm. Stop and see a doctor if you get dark pee, yellow skin, feel sick or very tired.\n- Not in pregnancy as a pill.\n- Ask a pharmacist if you take blood thinners or diabetes medicine.\n\n## Ginger\nA review of 5 studies with nearly 600 people found ginger eased pain a little. Eat it, drink it as tea, or take a pill. Go easy if it gives you heartburn. Mention it to your pharmacist if you take blood thinners.\n\n## Ginger on the skin\nWeek 3 has the ginger poultice. Eating ginger has the better proof.\n\n## For example\nMake a warm drink: a mug of milk, half a teaspoon of turmeric, a pinch of black pepper, and a few slices of fresh ginger. Sip it in the evening.","try":"Add a little turmeric or ginger to one meal or drink today.","watch":[{"label":"What science actually says about turmeric","src":"Jeffrey Peng MD","yt":"B4Wf5-K5PmM","len":"About 9 minutes.","what":"A doctor walks through the turmeric studies, doses and safety.","why":"It matches this lesson closely."},{"label":"Turmeric: does it work for arthritis?","src":"Talking With Docs","yt":"x-eyGRRowJc","len":"About 5 minutes.","what":"Doctors talk about turmeric for joint pain.","why":"A shorter second view."}],"n":10},"h2":{"id":"h2","title":"Boswellia, willow bark, devil's claw and cat's claw","open":"These four herbs have small studies behind them. Here is what each one can do, and who should skip it.","body":"Try one at a time, for a few weeks, and keep it only if you feel a difference.\n\n## Boswellia (frankincense)\nA tree resin used for hundreds of years in India. In small studies, extracts eased knee pain and stiffness within a few months. Look for a label that says how much boswellic acid is inside. Take it with food.\n\n## Willow bark\nIt has salicin, a natural cousin of aspirin. It eased low back pain in studies. Results for osteoarthritis are mixed.\nSkip it if you:\n- Are allergic to aspirin.\n- Take blood thinners or anti-inflammatory pills.\n- Have kidney or stomach problems.\n\n## Devil's claw\nA root from southern Africa. Several studies in hips, knees and backs found it eased pain a little. In one study it did about as well as a prescription arthritis medicine. Avoid it with stomach ulcers or gallstones. Ask first if you take blood thinners or diabetes medicine.\n\n## Cat's claw\nA vine from the Amazon rainforest. In one small study, people with rheumatoid arthritis who added it to their medicine had fewer painful joints. It may act on the immune system, so ask your rheumatologist first. Not in pregnancy or while breastfeeding.\n\n## For example\nIf your knees ache and you take no blood thinners, you might ask your pharmacist about boswellia. Try it with breakfast for 8 weeks and track your pain.","try":"If one of these interests you, write its name in your questions for the doctor.","watch":[{"label":"Dietary supplements: what you need to know","src":"US National Institutes of Health, Office of Dietary Supplements","yt":"S4bbzyfxstw","len":"About two minutes.","what":"NIH experts explain where to find honest, science-based facts about supplements.","why":"Short and plain. It shows you where to check any bottle before you buy it."},{"label":"Dietary supplements: what you need to know (full talk, about an hour)","src":"US National Institutes of Health videocast","url":"https://videocast.nih.gov/watch=41643"}],"n":10},"h3":{"id":"h3","title":"More herbs: what to try, what to skip","open":"There are many more herbs on the shelf. Most have little proof. A few are worth avoiding.","body":"Here they are, from most useful to least.\n\n## Worth a try\n- Stinging nettle. In one small study, people pressed fresh nettle leaves on a sore thumb or finger each day for a week. They had less pain. Ask first if you take blood thinners, water pills, or diabetes or blood pressure medicine.\n- Yucca. A desert plant. A few tiny studies hint at less pain. It can upset the stomach.\n- Celery seed. An old remedy for gout. No good studies. Not in pregnancy.\n- Noni. From a Polynesian fruit. No good studies. Very high in potassium, so avoid it with kidney disease.\n- Olive leaf extract. No good arthritis studies. Olive oil in food has strong proof.\n\n## Very little research\nBrigham tea, buchu leaves, burdock root, corn silk, parsley tea, a Chinese formula called Duhuo Jisheng Wan, and phellodendron bark (sold as Nexrutine). Phellodendron is not for pregnancy or children.\n\n## Not shown to help joints\n- Feverfew. In a rheumatoid arthritis study, it did no better than a fake pill.\n\n## Please avoid\n- Alfalfa, if you have lupus, rheumatoid arthritis or another immune condition. It has set off lupus-like flares.\n- Thunder god vine. It can cause serious side effects.\n\n## One rule for all herbs\nNatural doesn't always mean safe. Some herbs harm the liver or clash with medicine. Tell your pharmacist everything you take.\n\n## For example\nTake a photo of every bottle you use. Show the photos to your pharmacist at your next visit.","try":"Take a photo of every pill bottle and herb you use. Keep the photos together.","watch":[{"label":"Dietary supplements: what you need to know","src":"US National Institutes of Health, Office of Dietary Supplements","yt":"S4bbzyfxstw","len":"About two minutes.","what":"NIH experts explain where to find honest, science-based facts about supplements.","why":"Short and plain. It shows you where to check any bottle before you buy it."}],"n":10},"s1":{"id":"s1","title":"How to try a supplement the safe way","open":"The supplement shelf makes big promises. A few simple rules save you money and worry.","body":"A supplement is a pill, powder or oil you take to add something to your food. Vitamins, fish oil and herbs are all supplements.\n\n## Supplements are not checked like medicine\nIn America, supplements don't have to prove they work before they are sold. Quality can vary from bottle to bottle.\n\n## The safe way, step by step\n- Pick one product at a time. Not five.\n- Show it to your doctor or pharmacist before you start.\n- Write down your pain number before you start.\n- Give it 8 to 12 weeks.\n- Write your pain number again.\n- Keep it only if you can feel a difference.\n- Stop anything that doesn't agree with you.\n\n## Watch out for\n- Blood thinners. Many supplements can add to bleeding. Always ask first.\n- Hidden drugs. Some products have been found to contain prescription drugs.\n- Doses far above the label. More is not better.\n\n## About the amounts in these lessons\nThe amounts come from the nutrition reference book we used. The safety notes come from the US National Institutes of Health. They are a guide to talk over with your doctor, not a plan to start alone.\n\n## If you have rheumatoid arthritis\nSupplements can comfort you. They haven't been shown to protect joints from damage. Your medicine does that part.\n\n## For example\nJane wanted to try fish oil. She asked her pharmacist, who checked her heart pills. She wrote her pain as 6 out of 10. After 10 weeks it was 5. She kept it. Her friend tried glucosamine, felt no change in 10 weeks, and stopped. Both did it right.","try":"Write down every supplement you take now. Next to each one, write if you can feel it helping.","watch":[{"label":"Dietary supplements: what you need to know","src":"US National Institutes of Health, Office of Dietary Supplements","yt":"S4bbzyfxstw","len":"About two minutes.","what":"NIH experts explain where to find honest, science-based facts about supplements.","why":"Short and plain. It shows you where to check any bottle before you buy it."},{"label":"Dietary supplements: what you need to know (full talk, about an hour)","src":"US National Institutes of Health videocast","url":"https://videocast.nih.gov/watch=41643"}],"n":11},"s2":{"id":"s2","title":"Fish oil and plant oils","open":"Good fats are the supplements with the strongest backing for rheumatoid arthritis.","body":"## Fish oil\nFish oil has two omega-3 fats, called EPA and DHA. Your body uses them to calm inflammation.\n- A review of 22 studies found fish oil eased pain a little in rheumatoid arthritis. It may ease morning stiffness.\n- In a 9-month study, 39 out of 100 people taking cod liver oil could cut their pain pills by more than a third. Only 10 out of 100 could on a fake capsule.\n- One small study found fish oil worked better with olive oil.\n- It hasn't been shown to help osteoarthritis.\n- Amount: as the label says, twice a day with meals.\n- Safety: ask first if you take blood thinners.\n\nThe simplest way: eat oily fish twice a week.\n\n## Evening primrose oil and borage oil\nThese seed oils have a fat called GLA, which also calms inflammation. Studies found they eased pain and tender joints a little in rheumatoid arthritis. One study found fish oil plus evening primrose oil together meant fewer tender joints.\n- Choose borage oil that says \"PA-free\" on the label.\n- Ask first if you take blood thinners or have epilepsy.\n\n## If you eat only plants\nBarbara O'Neill eats only plants. Her oils are olive oil, avocado, nuts and seeds. Add a spoon of ground flaxseed, chia seeds or walnuts each day. They have a plant omega-3 called ALA. Your body turns only a little ALA into EPA and DHA, so fish has stronger proof for joints. Both plates are good ones.\n\n## For example\nMonday: sardines on toast. Thursday: baked salmon. Every morning: a spoon of ground flaxseed on oats.","try":"Plan one oily fish meal this week, or add ground flaxseed to breakfast.","watch":[{"label":"Fish oil and omega-3 for rheumatoid arthritis","src":"Dr. Diana Girnita, rheumatologist","yt":"xb_sbT2Fwg0","len":"About 10 minutes.","what":"A rheumatologist explains what fish oil can and can't do for joints, and how
