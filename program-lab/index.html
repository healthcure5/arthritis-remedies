s joint pain that comes with bowel disease, and what helps.","why":"Straight from the main charity for Crohn's and colitis."}],"n":1},"ja1":{"id":"ja1","title":"Juvenile arthritis: when a child has it","open":"Children can get arthritis too. If it's your child or grandchild, this lesson is for you.","body":"Juvenile arthritis is arthritis that starts before age 16. The most common kind is called juvenile idiopathic arthritis, or JIA. Idiopathic means doctors don't know exactly why it starts. It's not caused by anything the child or parents did.\n\n## Signs to look for\n- A child who limps, mostly in the morning.\n- Puffy, warm joints, like a knee or ankle.\n- Stiffness after naps or sitting.\n- Fevers or a rash with some kinds.\n- Not wanting to use a hand or arm.\n\n## Protect the eyes\nSome kinds of JIA can cause eye swelling with no signs at all. Children with JIA need regular eye checks.\n\n## Good news\nWith today's treatment, many children reach remission. Many grow up active and strong.\n\n## For example\nLucas, 6, limped every morning and his knee looked puffy. His grandma noticed and told his parents. A children's joint doctor found JIA and started treatment.","try":"If you notice a child limping in the mornings, write down when and tell their parents or doctor.","watch":[{"label":"Growing up with juvenile arthritis","src":"Arthritis Foundation","yt":"SlVHA5kwo0s","len":"About 4 minutes.","what":"A young woman shares life with juvenile arthritis, with the Arthritis Foundation.","why":"A real story to help a child or grandchild feel less alone."},{"label":"Juvenile idiopathic arthritis: pointers","src":"Johns Hopkins Medicine","yt":"PgMjmTudheQ","len":"About 23 minutes.","what":"A Johns Hopkins children's joint doctor explains juvenile arthritis and its care.","why":"The long-form pick for families."}],"n":1},"ja2":{"id":"ja2","title":"Juvenile arthritis: helping a child live fully","open":"Children with arthritis can play, learn and grow. Here's how family can help.","body":"## The care team\n- A pediatric rheumatologist, a children's joint doctor.\n- An eye doctor for regular checks.\n- A physical therapist for exercises.\n\nMedicines like methotrexate and biologics help many children. Only change a prescribed medicine after speaking with the doctor.\n\n## Everyday help\n- Keep them moving. Swimming, biking and play are great.\n- A warm bath in the morning eases stiffness.\n- Let teachers know, so the child can stretch or move in class.\n- Healthy food helps growth and energy.\n\n## For grown-ups who had it as children\nSome people with JIA still have arthritis as adults. Everything in this course can help you too.\n\n## For example\nLucas takes his medicine, swims on Saturdays and does a warm bath before school. He plays soccer with his friends.","try":"If a child in your life has JIA, ask what activity they love most, and help them do it this week.","watch":[{"label":"Juvenile idiopathic arthritis: pointers","src":"Johns Hopkins Medicine","yt":"PgMjmTudheQ","len":"About 23 minutes.","what":"A Johns Hopkins children's joint doctor explains juvenile arthritis and its care.","why":"The long-form pick for families."},{"label":"Growing up with juvenile arthritis","src":"Arthritis Foundation","yt":"SlVHA5kwo0s","len":"About 4 minutes.","what":"A young woman shares life with juvenile arthritis, with the Arthritis Foundation.","why":"A real story to help a child or grandchild feel less alone."}],"n":1},"in1":{"id":"in1","title":"Joint infection: an emergency that can be cured","open":"A joint infection needs a doctor the same day. Caught fast, it is usually cured.","body":"Germs can get into a joint. This is called septic arthritis. It can happen after a cut, a shot, surgery, or from an infection somewhere else in the body.\n\n## Signs\n- One joint, often the knee, suddenly hot, red, puffy and very painful.\n- Fever or chills.\n- You can hardly move the joint.\n\n## What to do\nGo to a doctor or the emergency room the same day. Don't wait to see if it gets better.\n\n## How it is cured\n- The doctor draws fluid out of the joint with a needle to test it.\n- Antibiotics kill the germs, often through a drip at first.\n- The joint may need to be washed out.\n\n## Who is at higher risk\n- People with a joint replacement.\n- People with rheumatoid arthritis, diabetes or a weak immune system.\n\n## For example\nGeorge's knee turned hot and red overnight, and he had a fever. He went to the ER that morning. After antibiotics, his knee healed.","try":"Read the signs list again. Tell a family member what they are, so they know too.","watch":[{"label":"Arthritis explained: osteoarthritis, rheumatoid, gout","src":"Mayo Clinic","yt":"Njc6jtvzUDU","len":"About 30 minutes.","what":"Mayo Clinic experts explain the main kinds of arthritis and how doctors tell them apart.","why":"The long-form pick: it helps you understand what is and isn't an emergency."}],"n":1},"in2":{"id":"in2","title":"Lyme arthritis: from a tick bite","open":"Lyme disease can cause a swollen knee months after a tick bite. Antibiotics clear it in most people.","body":"Lyme disease comes from a tiny tick bite. It is common in the Northeast, the upper Midwest and parts of the West Coast.\n\n## Signs of Lyme arthritis\n- One or two big joints, often a knee, that swell up a lot.\n- The swelling may come and go.\n- It can show up weeks or months after the bite.\n- Some people never saw the tick or the rash.\n\n## How it is cleared\n- A blood test can show Lyme.\n- Antibiotics, often for about four weeks, clear it in most people.\n- A few people need a second round or more help.\n\n## Prevent tick bites\n- Wear long pants tucked into socks in grass and woods.\n- Use bug spray made for ticks.\n- Check your skin and your pets after being outside.\n- Pull a tick out with fine tweezers, close to the skin.\n\n## For example\nLisa's knee swelled up in the fall. She remembered a hike in June. Her doctor tested for Lyme. After antibiotics, the swelling went away.","try":"If you spend time outside, put tick spray and tweezers by your door.","watch":[{"label":"Mayo Clinic Minute: ticks and the diseases they carry","src":"Mayo Clinic","yt":"FH3T94D_vsM","len":"About one minute.","what":"A quick look at ticks and how to avoid bites.","why":"Prevention in one minute."},{"label":"Lyme disease treatment","src":"Johns Hopkins Arthritis Center","yt":"8lDovnJXoag","len":"About 4 minutes.","what":"Johns Hopkins doctors explain how Lyme disease is treated.","why":"It shows how it gets cleared up."}],"n":1},"in3":{"id":"in3","title":"Reactive arthritis: after an infection","open":"Sometimes joints swell a few weeks after a tummy bug or bladder infection. It often goes away on its own.","body":"Reactive arthritis happens when the body reacts to an infection somewhere else. The germ isn't in the joint. The immune system is just overreacting.\n\n## Signs\n- Swollen knees, ankles or feet, a few weeks after a stomach bug or urine infection.\n- Pain at the heel.\n- Red, sore eyes.\n- Burning when you pee.\n\n## How it gets better\n- It often clears up on its own in a few months to a year.\n- If the infection is still there, antibiotics treat it.\n- Anti-inflammatory medicine eases pain and swelling. Ask your doctor what's safe for you.\n- Cold packs for puffy joints.\n- Gentle movement keeps joints from stiffening.\n\n## See an eye doctor if\nAn eye is red, painful and hates light.\n\n## For example\nRoy had food poisoning on a trip. Three weeks later his ankle and knee swelled. His doctor said reactive arthritis. With rest, ice and medicine, it was gone in four months.","try":"If your joints swelled after an infection, write down when the infection was. Tell your doctor.","watch":[{"label":"Arthritis explained: osteoarthritis, rheumatoid, gout","src":"Mayo Clinic","yt":"Njc6jtvzUDU","len":"About 30 minutes.","what":"Mayo Clinic experts explain how doctors tell the kinds of arthritis apart.","why":"A good long watch while you wait for answers."}],"n":1},"r2":{"id":"r2","title":"Know your kind of arthritis","open":"Arthritis is not just one thing. Knowing your kind is worth more than any remedy.","body":"The word arthritis means a sore joint. But there are many kinds. Each kind needs something a little different.\n\nYou are far from alone. About 53 million American adults have been told they have arthritis. That is about 1 in 5 grown-ups.\n\n## Osteoarthritis (say it: OSS-tee-oh-arth-RITE-iss)\nThis is the most common kind. The soft cushion at the end of your bones gets thin over time. It is most often in knees, hips, hands and the back.\n- Stiff in the morning, but better within about half an hour.\n- Hurts more after you use the joint a lot.\n- Joints may creak or look a bit knobbly.\n\n## Rheumatoid arthritis (say it: ROO-muh-toyd)\nYour body's guard system, called the immune system, gets mixed up. It attacks the lining of your joints by mistake.\n- Stiff for more than an hour in the morning.\n- Warm, puffy joints on both sides, like both hands.\n- Often very tired.\n\n## Gout (say it: GOWT)\nTiny sharp crystals form in a joint. They come from something in your blood called uric acid.\n- One joint, often the big toe.\n- Hot, red and very sore, often overnight.\n- It calms down over a few days.\n\n## Other kinds, each with its own lessons\n- Psoriatic arthritis: joint pain with the skin problem psoriasis.\n- Back arthritis (ankylosing spondylitis): low back pain that eases when you move.\n- Lupus: joint pain with a rash and deep tiredness.\n- Polymyalgia rheumatica: stiff shoulders and hips after 50.\n- Pseudogout: a sudden hot knee or wrist from calcium crystals.\n- Fibromyalgia: aches all over, without joint damage.\n- Bursitis or tendinitis: a sore spot next to a joint.\n- Carpal tunnel: tingling fingers at night.\n- Infection-related: joint infection, Lyme or reactive arthritis.\nPick yours in the box below, and the Program shows you its own lessons, with a plan to calm it or clear it up.\n\n## For example\nMary is stiff for 20 minutes each morning, and her knee aches after a long walk. That sounds like osteoarthritis. Joe woke up with a red, hot big toe that hurt to touch. That sounds like gout. Only a doctor can say for sure.\n\n## Not sure which kind you have?\nThat's okay. Pick \"not sure\" below. A doctor's diagnosis is the best first step, because the right care depends on it.","try":"Pick your kind of arthritis in the box below. The Program will line up the lessons that fit you best.","watch":[{"label":"Arthritis explained: osteoarthritis, rheumatoid, gout","src":"Mayo Clinic","yt":"Njc6jtvzUDU","len":"About 30 minutes.","what":"Mayo Clinic experts explain the main kinds of arthritis and how doctors tell them apart.","why":"The long-form pick: the best overview of the kinds in one place."},{"label":"What is rheumatoid arthritis?","src":"Mayo Clinic (Mayo Clinic Minute)","yt":"fNlu2rW9PkY","len":"About one minute.","what":"Dr. Eric Matteson explains how rheumatoid arthritis is different from wear-and-tear arthritis, and why starting treatment early matters.","why":"A quick picture of the immune system mix-up you just read about."}],"n":1},"ot1":{"id":"ot1","title":"Not sure yet? Compare the kinds","open":"If you don't know your kind yet, this lesson helps you narrow it down so you can ask the right questions.","body":"Read the list. Which one sounds most like you?\n\n## Quick guide\n- Stiff under 30 minutes, worse after use, knees, hips, hands: osteoarthritis.\n- Stiff over an hour, warm puffy joints on both sides, very tired: rheumatoid arthritis.\n- One joint suddenly hot and red, often the big toe: gout.\n- Sudden hot knee or wrist in an older adult: pseudogout.\n- Psoriasis skin patches plus puffy fingers or heel pain: psoriatic arthritis.\n- Low back pain before 45 that gets better with moving: back arthritis (ankylosing spondylitis).\n- Joint pain with a rash, sun sensitivity and deep tiredness: lupus.\n- Stiff, aching shoulders and hips after 50: polymyalgia rheumatica.\n- Aches all over, poor sleep, fibro fog: fibromyalgia.\n- A sore spot next to a joint after overdoing it: bursitis or tendinitis.\n- Tingling thumb and fingers at night: carpal tunnel.\n- Swelling after a tick bite or an infection: Lyme or reactive arthritis.\n- One hot, red joint with fever: possible joint infection. Get help today.\n\n## Then\nPick that kind in the box on \"Know your kind of arthritis\" or in the menu. The Program will show you its lessons. You can change it any time, and a doctor's diagnosis is the best final answer.\n\n## For example\nIf you have psoriasis and a puffy finger, pick psoriatic arthritis for now, and ask your doctor to confirm.","try":"Pick the one that sounds most like you, and choose it as your kind for now.","watch":[{"label":"Arthritis explained: osteoarthritis, rheumatoid, gout","src":"Mayo Clinic","yt":"Njc6jtvzUDU","len":"About 30 minutes.","what":"Mayo Clinic experts explain the main kinds of arthritis and how doctors tell them apart.","why":"The long-form pick for telling the kinds apart."},{"label":"Mayo Clinic Minute: what is rheumatoid arthritis?","src":"Mayo Clinic","yt":"fNlu2rW9PkY","len":"About one minute.","what":"How rheumatoid arthritis differs from wear-and-tear arthritis.","why":"A quick comparison."}],"n":1},"ot2":{"id":"ot2","title":"Not sure yet? How to find out what you have","open":"Not knowing is hard. A good doctor visit is the fastest way to know.","body":"The right care depends on your kind of arthritis. So finding out is step one.\n\n## Before your visit\nWrite down:\n- Which joints hurt.\n- How long you are stiff in the morning, in minutes.\n- Whether joints look puffy, red or warm.\n- If it is one side or both sides.\n- Any skin rash, fever or deep tiredness.\n- Who in your family has arthritis or psoriasis.\n\n## What the doctor may do\n- Look at and press on your joints.\n- Order blood tests. These can show signs of rheumatoid arthritis, gout or lupus.\n- Order an X-ray to look at the bones.\n- Send you to a rheumatologist if it might be an immune kind.\n\n## Questions to ask\n- \"What kind of arthritis do you think this is?\"\n- \"What tests will tell us for sure?\"\n- \"What should I do while I wait?\"\n\n## While you wait\nEverything in weeks 1 to 8 is safe for every kind. Warmth, moving a little, sleep and food help all of them.\n\n## For example\nRay wrote his notes on one page and took it to his visit. His doctor ordered two blood tests. Ten days later he knew: rheumatoid arthritis, caught early.","try":"Fill in the \"Questions for my doctor\" page in the Toolkit before your next visit.","watch":[{"label":"Rheumatoid arthritis: gaining control, diagnosis","src":"Johns Hopkins Arthritis Center","yt":"kJqLzm7S1HU","len":"About 7 minutes.","what":"How doctors work out whether joint pain is rheumatoid arthritis, including the tests they use.","why":"It shows you what to expect at the visit."},{"label":"Finding relief for osteoarthritis pain","src":"Mayo Clinic (Mayo Clinic Minute)","yt":"tva_EQrmOhw","len":"About one minute.","what":"A Mayo Clinic joint doctor, Dr. Eric Matteson, gives the short version: move, keep a healthy weight, and use heat or cold on sore joints.","why":"It backs up the first-aid list in this lesson in one minute flat."}],"n":1}},"tnote":{"w1a":{"ra":"Rheumatoid arthritis: if you're stiff for more than an hour most mornings, tell your doctor. It can mean your medicine needs adjusting.","gout":"Gout: morning stiffness is less common with gout. A sudden hot, red joint is the sign to watch for."},"w2b":{"ra":"Rheumatoid arthritis: walk on days your joints are quiet. On flare days, do half, or just move each joint gently.","gout":"Gout: don't walk on a joint in the middle of an attack. Rest it and raise it, then walk again once it settles."},"w3a":{"ra":"Rheumatoid arthritis: hot, puffy joints during a flare usually like cold better than heat.","gout":"Gout: during an attack, use a wrapped cold pack. Skip heat on the hot joint."},"w4a":{"ra":"Rheumatoid arthritis: the Mediterranean plate is the one the American College of Rheumatology suggests for you.","gout":"Gout: add cherries, low-fat milk and plenty of water. The next lesson has your foods to limit."},"w4b":{"oa":"Osteoarthritis: this is your big one. Every pound lost takes about 4 pounds off each knee with every step.","gout":"Gout: this lesson is your most important food lesson. Read the gout part twice."},"w5a":{"ra":"Rheumatoid arthritis: do strength moves on quiet days. Skip them on a joint that's hot and swollen."},"w8a":{"ra":"Rheumatoid arthritis: if flares keep coming, your medicine may need a change. Tell your doctor.","gout":"Gout: if attacks keep coming back, ask about medicine that lowers uric acid. It's what stops them."},"w8b":{"ra":"Rheumatoid arthritis: ask, \"Are my joints quiet yet? If not, can we adjust the plan?\"","gout":"Gout: ask, \"What is my uric acid number, and what should it be?\" The goal is below 6.","other":"Not sure yet: ask, \"What kind of arthritis is this, and what tests will tell us?\""}},"circle":{"url":"https://myhingecare.com/circle.html","price":"$297","what":"Five live Tuesday evenings at 7 pm Eastern, in a small group of ten, by video.","when":"The founding round starts in early January 2027. Nothing is charged until we both agree it's a good fit."},"grad":{"video":"","title":"Congratulations. You have come so far.","body":"You started with one small step. Now you have a morning routine, a walking habit, home comforts you trust, a plate that's kind to your joints, a breath for hard moments and a plan for bad days. You learned your kind of arthritis, and you know more about herbs and supplements than most people in the store. That's real work, and you did it."},"welcome":{"title":"Before you start","open":"You don't have to be brave today. You only have to open this page, and you've done that.","body":"If you've bought things for your joints before (a cream, a brace, a bottle of pills from the back of a magazine) and they ended up in a drawer, you're not alone. Most people who find this Program have already tried a lot. That's why it doesn't ask you to buy anything else, and it doesn't ask you to change your whole life on Monday.\n\nIt asks for one small step a day.\n\n## How it works\n- First comes Start here: relief for today, and a lesson on your kind of arthritis. Pick your kind, and the Program lines up the right lessons for you.\n- Each week has a name and one aim.\n- Each week has three short lessons. Read one, try the small task, press \"I did it.\" The next lesson opens.\n- After the eight weeks come deep dives on food, herbs and every supplement from The Joint Reset. Then your graduation.\n- Short on time? The Library shows the lessons that matter most for your kind.\n- Each day has one tiny step on your weekly list. Tick it when it's done. If you miss a day, the box just waits.\n- The Toolkit at the bottom has your pain log, your weekly planner, your flare-up plan and your questions for the doctor. Print them or fill them in here.\n\n## Three rules we keep the whole way through\n- Every move has a seated version. You never have to get on the floor.\n- A mild pull is fine. Sharp pain, or pain that keeps getting worse, means stop.\n- Only change a prescribed medicine after speaking with your doctor. This Program sits alongside your care.\n\nIf reading is tiring, press \"Read this to me\" at the top of any lesson and it will be read out loud.","try":"Write down one thing you'd like to do more easily once you've started. Getting out of the car. Holding a grandchild. Opening the jar without asking. Keep it somewhere you'll see it."}};
const KEY='hclab-v1';let S={done:{},kind:'',name:'',open:''};try{S=Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const app=document.getElementById('app');
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function md(t){return String(t).split(/\n\n+/).map(b=>{if(b.startsWith('## ')){const [h,...r]=b.split('\n');return '<h3>'+esc(h.slice(3))+'</h3>'+(r.length?md(r.join('\n')):'');}const ls=b.split('\n');if(ls.every(l=>l.startsWith('- ')))return '<ul>'+ls.map(l=>'<li>'+esc(l.slice(2))+'</li>').join('')+'</ul>';if(!ls[0].startsWith('- ')&&ls.length>1&&ls.slice(1).every(l=>l.startsWith('- ')))return '<p>'+esc(ls[0])+'</p><ul>'+ls.slice(1).map(l=>'<li>'+esc(l.slice(2))+'</li>').join('')+'</ul>';return '<p>'+esc(b).replace(/\n/g,'<br>')+'</p>';}).join('');}
const order=k=>C.tracks[k].flatMap(s=>s.ids.map(id=>({id,sec:s})));
const doneIn=k=>order(k).filter(x=>S.done[x.id]).length;
const nextIn=k=>{const o=order(k);const n=o.find(x=>!S.done[x.id]);return n?n.id:null;};
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2400);}
function go(h){if(location.hash===h)route();else location.hash=h;}
/* one sound at a time */
function hush(except){document.querySelectorAll('iframe.yt').forEach(f=>{if(f!==except){try{f.contentWindow.postMessage(JSON.stringify({event:'command',func:'pauseVideo',args:[]}),'*')}catch(e){}}});if(except!=='speech'&&window.speechSynthesis&&speechSynthesis.speaking){speechSynthesis.cancel();const b=document.getElementById('listen');if(b)b.textContent='▶ Read this to me';}}
addEventListener('message',e=>{if(!/youtube/.test(e.origin||''))return;let d;try{d=typeof e.data==='string'?JSON.parse(e.data):e.data}catch(x){return}const st=d&&d.info&&typeof d.info==='object'?d.info.playerState:undefined;if(st===1){const f=[...document.querySelectorAll('iframe.yt')].find(x=>x.contentWindow===e.source);if(f)hush(f);}});

function kindCard(k){const t=C.types[k],n=order(k).length,d=doneIn(k),pct=Math.round(d/n*100);return `<button class="kcard ${S.kind===k?'mine':''}" type="button" data-kind="${k}"><b>${esc(t.name)}</b><small>${esc(t.short)}</small><span class="meta">${n} lessons${d?` · ${pct}% done`:''}</span>${d?`<span class="bar"><i style="width:${pct}%"></i></span>`:''}</button>`;}
function home(){
  document.title='Hinge Care Program (test version)';
  let h=`<section class="hero"><p class="crumb" style="color:#D9C4EA">The Hinge Care Program</p><h1>Your course starts with your kind of arthritis</h1><p>Pick your kind below. You'll get the lessons that fit you, in the right order, with videos for each one. Every kind shares the best lessons on mornings, moving, comfort, food, sleep and bad days.</p>${S.kind?`<p style="margin-bottom:0"><a class="btn" href="#/k/${S.kind}">Continue: ${esc(C.types[S.kind].name)}</a></p>`:`<p style="margin-bottom:0"><a class="btn ghost" href="#/k/other">Not sure? Start here</a></p>`}</section>`;
  h+=`<div class="card"><h2 style="margin-top:0">Hurting right now?</h2><p style="margin-top:0">Start with the quickest comforts, for every kind.</p><a class="btn ghost" href="#/k/${S.kind||'other'}/l/r1">Relief today</a></div>`;
  C.groups.forEach(([g,ks])=>{h+=`<p class="grp">${esc(g)}</p><div class="kgrid">${ks.map(kindCard).join('')}</div>`;});
  h+=`<p class="grp">Find a lesson</p><input class="search" id="q" type="search" placeholder="Type a word, like knee, sleep or turmeric" aria-label="Search the lessons"><div class="sres" id="sres"></div>`;
  app.innerHTML=h;
  app.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{S.kind=b.dataset.kind;save();go('#/k/'+b.dataset.kind);});
  const q=document.getElementById('q'),r=document.getElementById('sres');
  q.oninput=()=>{const v=q.value.trim().toLowerCase();if(v.length<3){r.innerHTML='';return;}const k=S.kind||'other';const hits=Object.values(C.lessons).filter(l=>(l.title+' '+l.body).toLowerCase().includes(v)).slice(0,12);r.innerHTML=hits.length?hits.map(l=>`<button class="lrow" type="button" data-l="${l.id}"><span class="tk">${S.done[l.id]?'✓':''}</span><span>${esc(l.title)}</span></button>`).join(''):'<p>No lessons match that word yet.</p>';r.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{const kk=Object.keys(C.tracks).find(x=>x===S.kind&&order(x).some(o=>o.id===b.dataset.l))||Object.keys(C.tracks).find(x=>order(x).some(o=>o.id===b.dataset.l));go('#/k/'+kk+'/l/'+b.dataset.l);});};
}
function secList(k,cur){
  const o=order(k);const curSec=cur?o.find(x=>x.id===cur).sec.key:(o.find(x=>!S.done[x.id])||o[0]).sec.key;
  return C.tracks[k].map((s,i)=>{const d=s.ids.filter(i=>S.done[i]).length;const open=s.key===curSec;return `<div class="sec ${open?'open':''}" data-sk="${s.key}"><button class="mh" type="button" aria-expanded="${open}">${i+1}. ${esc(s.name)}<span class="c">${d}/${s.ids.length}</span><span class="ch" aria-hidden="true">›</span></button><div class="sb">${s.ids.map(id=>{const l=C.lessons[id];return `<button class="lrow ${S.done[id]?'done':''} ${id===cur?'cur':''}" type="button" data-go="#/k/${k}/l/${id}"><span class="tk">${S.done[id]?'✓':''}</span><span>${esc(l.title)}${l.n>=8?'<span class="tag">Every kind</span>':''}${(l.watch||[]).length?`<small>▶ ${l.watch.length} video${l.watch.length>1?'s':''}</small>`:''}</span></button>`}).join('')}</div></div>`;}).join('');
}

function track(k){
  S.kind=k;save();const t=C.types[k],o=order(k),d=doneIn(k),n=o.length,nx=nextIn(k);document.title=t.name+' · Hinge Care Program';
  let h=`<p class="crumb"><a href="#/">All kinds</a> › Your course</p><h1>${esc(t.name)}</h1><p class="lead">${esc(t.short)}</p><div class="prog"><span>${d} of ${n} lessons done</span><span class="bar"><i style="width:${Math.round(d/n*100)}%"></i></span></div>`;
  h+=`<div class="nav2" style="margin-top:0">${nx?`<a class="btn" href="#/k/${k}/l/${nx}">${d?'Continue':'Start'}: ${esc(C.lessons[nx].title)}</a>`:`<a class="btn" href="#/k/${k}/grad">🎓 Your graduation</a>`}<a class="btn ghost" href="#/">Change my kind</a></div>`;
  h+=`<h2>Your lessons</h2><p>Tap a heading to see its lessons. Lessons marked "Every kind" are shared by everyone.</p>`+secList(k,null);
  h+=`<button class="lrow" type="button" data-go="#/k/${k}/grad"><span class="tk">🎓</span><span>Graduation<small>${nx?'At the end of your course':'Ready for you'}</small></span></button>`;
  app.innerHTML=h;bindAcc(app);
}
function lesson(k,id){
  const o=order(k),i=o.findIndex(x=>x.id===id);if(i<0){go('#/k/'+k);return;}
  const l=C.lessons[id],sec=o[i].sec,prev=o[i-1],next=o[i+1],t=C.types[k];document.title=l.title+' · Hinge Care Program';
  let h=`<p class="crumb"><a href="#/k/${k}">${esc(t.name)}</a> › ${esc(sec.name)}</p><div class="prog"><span>Lesson ${i+1} of ${o.length}</span><span class="bar"><i style="width:${Math.round((i+1)/o.length*100)}%"></i></span></div><h1>${esc(l.title)}</h1>`;
  h+=`<div class="listen"><button class="btn ghost" id="listen" type="button">▶ Read this to me</button></div><div id="txt"><p class="lead">${esc(l.open)}</p><div class="body">${md(l.body)}</div>`;
  const tn=C.tnote[id]&&C.tnote[id][k];if(tn)h+=`<div class="knote"><b>For ${esc(t.name.toLowerCase())}</b>${esc(tn)}</div>`;
  h+=`<div class="try"><b>Try this today</b>${esc(l.try)}</div></div>`;
  const vs=l.watch||[];if(vs.length){h+=`<h3>${vs.length>1?'Watch':'Watch'}</h3>`;vs.forEach(v=>{if(v.yt)h+=`<div class="vcard"><p class="vl">${esc(v.len||'')}</p><b class="vt">${esc(v.label)}</b>${v.what?`<p><strong>What it is:</strong> ${esc(v.what)}</p>`:''}${v.why?`<p><strong>Why watch:</strong> ${esc(v.why)}</p>`:''}<button class="vplay" type="button" data-yt="${v.yt}" style="background-image:url(https://i.ytimg.com/vi/${v.yt}/hqdefault.jpg)" aria-label="Play ${esc(v.label)}"><span aria-hidden="true">▶</span></button><p class="vsrc">From ${esc(v.src)}</p></div>`;else h+=`<a class="watchlink" href="${v.url}" target="_blank" rel="noopener"><b>${esc(v.label)} ↗</b><br><small style="color:var(--soft)">From ${esc(v.src)}. Opens in a new tab.</small></a>`;});}
  if(next){const nl=C.lessons[next.id];h+=`<h3>Up next</h3><button class="upn" type="button" data-go="#/k/${k}/l/${next.id}"><span>🌿</span><span><small>${esc(next.sec.name)}</small>${esc(nl.title)}</span></button>`;}
  else h+=`<h3>Up next</h3><button class="upn" type="button" data-go="#/k/${k}/grad"><span>🎓</span><span><small>The finish line</small>Your graduation</span></button>`;
  h+=`<div class="nav2"><button class="btn" id="did" type="button">${S.done[id]?'✓ Done. Next lesson':'I did it'}</button><a class="btn ghost" href="#/k/${k}">Back to my lessons</a></div>`;
  h+=`<div class="pn"><button type="button" ${prev?`data-go="#/k/${k}/l/${prev.id}"`:'disabled'}><small>‹ Previous</small>${prev?esc(C.lessons[prev.id].title):''}</button><button type="button" class="nx" ${next?`data-go="#/k/${k}/l/${next.id}"`:'disabled'}><small>Next ›</small>${next?esc(C.lessons[next.id].title):''}</button></div>`;
  app.innerHTML=h;
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  app.querySelectorAll('[data-yt]').forEach(b=>b.onclick=()=>{hush(null);const d=document.createElement('div');d.className='vid';d.innerHTML=`<iframe class="yt" src="https://www.youtube-nocookie.com/embed/${b.dataset.yt}?autoplay=1&rel=0&modestbranding=1&playsinline=1&enablejsapi=1&origin=${encodeURIComponent(location.origin)}" title="Video" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;b.replaceWith(d);const f=d.querySelector('iframe');f.addEventListener('load',()=>{try{f.contentWindow.postMessage(JSON.stringify({event:'listening',id:'hc'}),'*')}catch(e){}});});
  const lb=document.getElementById('listen');if(!('speechSynthesis' in window))lb.hidden=true;else lb.onclick=()=>{if(speechSynthesis.speaking){speechSynthesis.cancel();lb.textContent='▶ Read this to me';return;}hush('speech');const u=new SpeechSynthesisUtterance(document.getElementById('txt').innerText);u.rate=.9;u.onend=()=>lb.textContent='▶ Read this to me';speechSynthesis.speak(u);lb.textContent='■ Stop reading';};
  document.getElementById('did').onclick=()=>{const first=!S.done[id];S.done[id]=true;save();if(first)toast(next?'Lesson done. Nice work.':'You finished every lesson!');go(next?`#/k/${k}/l/${next.id}`:`#/k/${k}/grad`);};
}
function grad(k){
  const o=order(k),d=doneIn(k),n=o.length,all=d>=n,t=C.types[k],G=C.grad,Ci=C.circle;document.title='Graduation · Hinge Care Program';
  let h=`<p class="crumb"><a href="#/k/${k}">${esc(t.name)}</a> › Graduation</p><div style="text-align:center"><div style="font-size:3.2rem">🎓</div><h1>${all?esc(G.title):'Your graduation is waiting'}</h1><p class="lead">${all?esc(G.body):`You've done ${d} of ${n} lessons. Finish them all and your certificate fills in here.`}</p></div>`;
  h+=`<div class="gvid">${G.video?`<video controls playsinline preload="metadata" src="${G.video}" style="width:100%;height:100%;border-radius:12px"></video>`:`<span style="font-size:2rem">▶</span><b>Your graduation video</b><small style="color:var(--soft)">A short thank-you from us is on its way. It will appear right here.</small>`}</div>`;
  h+=`<div class="cert" style="${all?'':'opacity:.5'}"><p>This certifies that</p><div class="nm">${esc(S.name||'Your name')}</div><h2>graduated from The Hinge Care Program</h2><p>${esc(t.name)} course</p><p style="color:#666">${all?new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})+' · Hinge Care':'Unlocks when you finish every lesson'}</p></div>`;
  h+=`<div class="field"><label for="nm">Name on the certificate</label><input id="nm" value="${esc(S.name)}"></div>`;
  if(all)h+=`<div class="circle"><span class="k">For graduates · The Circle</span><h2>Want company for what comes next?</h2><p>${esc(Ci.what)} Bring a question, practice a move together, and hear how the others are doing. ${esc(Ci.price)} for all five evenings.</p><p>${esc(Ci.when)}</p><a class="btn" href="${Ci.url}" target="_blank" rel="noopener">Ask to join the January list</a></div>`;
  h+=`<div class="nav2"><a class="btn ghost" href="#/k/${k}">Back to my lessons</a><a class="btn ghost" href="#/">See other kinds</a></div>`;
  app.innerHTML=h;const nm=document.getElementById('nm');nm.onchange=()=>{S.name=nm.value;save();grad(k);};
}
function menu(){
  const k=S.kind,p=document.getElementById('panel');
  let h=`<div class="ptop"><h2>Menu</h2><button class="hbtn" id="closeM" type="button">✕ Close</button></div><div class="pin"><button type="button" data-go="#/">📚 All kinds<small>Pick or change</small></button><button type="button" ${k?`data-go="#/k/${k}"`:'data-go="#/"'}>🩺 My course<small>${k?esc(C.types[k].name):'Pick yours'}</small></button></div>`;
  if(k){const cur=(location.hash.match(/\/l\/([\w]+)/)||[])[1];h+=`<p class="grp" style="margin-top:6px">${esc(C.types[k].name)}</p>`+secList(k,cur&&order(k).some(x=>x.id===cur)?cur:null);}
  else h+=`<p>Pick your kind of arthritis to see your lessons here.</p>`;
  p.innerHTML=h;bindAcc(p);p.querySelectorAll('.pin [data-go]').forEach(b=>b.onclick=()=>{closeMenu();go(b.dataset.go);});document.getElementById('closeM').onclick=closeMenu;
  document.getElementById('drawer').classList.add('on');document.getElementById('closeM').focus();
}
function closeMenu(){document.getElementById('drawer').classList.remove('on');}
document.getElementById('openMenu').onclick=menu;document.getElementById('shade').onclick=closeMenu;document.getElementById('goHome').onclick=()=>go('#/');
addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu();});
function route(){hush(null);closeMenu();const h=location.hash.replace(/^#/,'');const m=h.match(/^\/k\/(\w+)(?:\/(l)\/(\w+)|\/(grad))?/);
  if(m&&C.tracks[m[1]]){if(m[2])lesson(m[1],m[3]);else if(m[4])grad(m[1]);else track(m[1]);}else home();window.scrollTo(0,0);app.focus({preventScroll:true});}
addEventListener('hashchange',route);route();
</script>
</body>
</html>
